/* ============ PLAYER CODE (no login: your sheet is kept on this computer under your code) ============ */
const CODE_KEY = "hba-player-code";
const charKey = (code) => "hba-char-" + code;
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
function cleanCode(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12); }
function makeCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
}
function currentPlayerCode() {
  let c = cleanCode(lsGet(CODE_KEY));
  if (!c) { c = makeCode(); lsSet(CODE_KEY, c); }
  return c;
}
function readStoredCharacter(code) {
  try { const d = JSON.parse(lsGet(charKey(code)) || "null"); return d && d.format === "homebrew-academy-character" ? d : null; }
  catch (e) { return null; }
}

  {name:"Cloak of Protection",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"You gain a +1 bonus to AC and saving throws while you wear this cloak."},
  {name:"Cloak of the Manta Ray",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"While wearing this cloak with its hood up, you can breathe underwater, and you have a swimming speed of 60 feet. Pulling the hood up or down requires an action."},
  {name:"Decanter of Endless Water",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"This stoppered flask sloshes when shaken, as if it contains water. The decanter weighs 2 pounds. You can use an action to remove the stopper and speak one of three command words, whereupon an amount of fresh water or salt water pours out of the flask."},
  {name:"Eyes of the Eagle",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"These crystal lenses fit over the eyes. While wearing them, you have advantage on Wisdom (Perception) checks that rely on sight. In conditions of clear visibility, you can make out details of even extremely distant creatures and objects as small as 2 feet across."},
  {name:"Gauntlets of Ogre Power",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"Your Strength score is 19 while you wear these gauntlets. They have no effect on you if your Strength is already 19 or higher."},
  {name:"Gloves of Missile Snaring",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"These gloves seem to almost meld into your hands when you don them. When a ranged weapon attack hits you while you're wearing them, you can use your reaction to reduce the damage by 1d10 + your Dexterity modifier, provided that you have a free hand. If you reduce the damage to 0, you can catch the missile if it is small enough for you to hold in that hand."},
  {name:"Gloves of Swimming and Climbing",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"While wearing these gloves, climbing and swimming don't cost you extra movement, and you gain a +5 bonus to Strength (Athletics) checks made to climb or swim."},
  {name:"Goggles of Night",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"While wearing these dark lenses, you have darkvision out to a range of 60 feet. If you already have darkvision, wearing the goggles increases its range by 60 feet."},
  {name:"Hat of Disguise",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"While wearing this hat, you can use an action to cast the Disguise Self spell from it at will. The spell ends if the hat is removed."},
  {name:"Headband of Intellect",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"Your Intelligence score is 19 while you wear this headband. It has no effect on you if your Intelligence is already 19 or higher."},
  {name:"Helm of Comprehending Languages",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"While wearing this helm, you can use an action to cast the Comprehend Languages spell from it at will."},
  {name:"Helm of Telepathy",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"While wearing this helm, you can use an action to cast the Detect Thoughts spell (DC 13) from it. As long as you concentrate on the spell, you can use a bonus action to send a telepathic message to a creature you are focused on."},
  {name:"Immovable Rod",rarity:"Uncommon",type:"Rod",attunement:false,description:"This flat iron rod has a button on one end. You can use an action to press the button, which causes the rod to become magically fixed in place. Until you or another creature uses an action to push the button again, the rod doesn't move, even if it is defying gravity. The rod can hold up to 8,000 pounds of weight."},
  {name:"Javelin of Lightning",rarity:"Uncommon",type:"Weapon (javelin)",attunement:false,description:"This javelin is a magic weapon. When you hurl it and speak its command word, it transforms into a bolt of lightning, forming a line 5 feet wide that extends out from you to a target within 120 feet of you. Each creature in the line excluding you and the target must make a DC 13 Dexterity saving throw, taking 4d6 lightning damage on a failed save, and half as much damage on a successful one. The javelin's property can't be used again until the next dawn."},
  {name:"Lantern of Revealing",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"While lit, this hooded lantern burns for 6 hours on 1 pint of oil, shedding bright light in a 30-foot radius and dim light for an additional 30 feet. Invisible creatures and objects are visible as long as they are in the lantern's bright light."},
  {name:"Mithral Armor",rarity:"Uncommon",type:"Armor (medium or heavy, not hide)",attunement:false,description:"Mithral is a light, flexible metal. If the armor normally imposes disadvantage on Dexterity (Stealth) checks or has a Strength requirement, the mithral version of the armor doesn't."},
  {name:"Necklace of Adaptation",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"While wearing this necklace, you can breathe normally in any environment, and you have advantage on saving throws made against harmful gases and vapors (such as Cloudkill and Stinking Cloud effects, inhaled poisons, and the breath weapon of some dragons)."},
  {name:"Pearl of Power",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"While this pearl is on your person, you can use an action to speak its command word and regain one expended spell slot of up to 3rd level. Once you have used the pearl, it can't be used again until the next dawn."},
  {name:"Periapt of Health",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"You are immune to contracting any disease while you wear this pendant. If you are already infected with a disease, the effects of the disease are suppressed while you wear the pendant."},
  {name:"Philter of Love",rarity:"Uncommon",type:"Potion",attunement:false,description:"The next time you see a creature within 10 minutes after drinking this philter, you become charmed by that creature for 1 hour. If the creature is of a species and gender you are normally attracted to, you regard it as your true love while you are charmed."},
  {name:"Pipes of Haunting",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"You must be proficient with wind instruments to use these pipes. They have 3 charges. You can use an action to play them and expend 1 charge to create an eerie, spellbinding tune. Each creature within 30 feet of you that hears you play must succeed on a DC 13 Wisdom saving throw or become frightened of you for 1 minute. The pipes regain 1d3 expended charges daily at dawn."},
  {name:"Pipes of the Sewers",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"You must be proficient with wind instruments to use these pipes. While you are attuned to the pipes, ordinary rats and giant rats are indifferent toward you. The pipes have 3 charges and regain 1d3 expended charges daily at dawn. If you play the pipes as an action, you can use a bonus action to expend 1 to 3 charges, calling forth one swarm of rats with each expended charge."},
  {name:"Potion of Climbing",rarity:"Uncommon",type:"Potion",attunement:false,description:"When you drink this potion, you gain a climbing speed equal to your walking speed for 1 hour. During this time, you have advantage on Strength (Athletics) checks you make to climb."},
  {name:"Potion of Growth",rarity:"Uncommon",type:"Potion",attunement:false,description:"When you drink this potion, you gain the 'enlarge' effect of the Enlarge/Reduce spell for 1d4 hours (no concentration required)."},
  {name:"Potion of Water Breathing",rarity:"Uncommon",type:"Potion",attunement:false,description:"You can breathe underwater for 1 hour after drinking this potion. Its cloudy green fluid smells of the sea and has a jellyfish-like bubble floating in it."},
  {name:"Ring of Jumping",rarity:"Uncommon",type:"Ring",attunement:true,description:"While wearing this ring, you can cast the Jump spell from it as a bonus action at will, but can target only yourself when you do so."},
  {name:"Ring of Mind Shielding",rarity:"Uncommon",type:"Ring",attunement:true,description:"While wearing this ring, you are immune to magic that allows other creatures to read your thoughts, determine whether you are lying, know your alignment, or know your creature type."},
  {name:"Ring of Swimming",rarity:"Uncommon",type:"Ring",attunement:false,description:"You have a swimming speed of 40 feet while wearing this ring."},
  {name:"Ring of Warmth",rarity:"Uncommon",type:"Ring",attunement:true,description:"While wearing this ring, you have resistance to cold damage. In addition, you and everything you wear and carry are unharmed by temperatures as low as −50 degrees Fahrenheit."},
  {name:"Ring of Water Walking",rarity:"Uncommon",type:"Ring",attunement:false,description:"While wearing this ring, you can stand on and move across any liquid surface as if it were solid ground."},
  {name:"Robe of Useful Items",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"This robe has cloth patches of various shapes and colors covering it. While wearing the robe, you can use an action to detach one of the patches, causing it to become the object or creature it represents. The robe comes with items determined by the DM."},
  {name:"Slippers of Spider Climbing",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"While you wear these light shoes, you can move up, down, and across vertical surfaces and upside down along ceilings, while leaving your hands free. You have a climbing speed equal to your walking speed."},
  {name:"Spell Scroll (2nd Level)",rarity:"Uncommon",type:"Scroll",attunement:false,description:"A spell scroll bearing a 2nd-level spell. A spellcaster with the spell on their list can cast it using the scroll. The spell is cast at 2nd level."},
  {name:"Spell Scroll (3rd Level)",rarity:"Uncommon",type:"Scroll",attunement:false,description:"A spell scroll bearing a 3rd-level spell. A spellcaster with the spell on their list can cast it. Spell is cast at 3rd level."},
  {name:"Staff of the Python",rarity:"Uncommon",type:"Staff",attunement:true,description:"You can use an action to speak this staff's command word and throw the staff on the ground within 10 feet of you. The staff becomes a giant constrictor snake under your control and acts on its own initiative count. The staff can't be used this way again until the next dawn."},
  {name:"Wand of Magic Detection",rarity:"Uncommon",type:"Wand",attunement:false,description:"This wand has 3 charges. While holding it, you can expend 1 charge as an action to cast the Detect Magic spell from it. The wand regains 1d3 expended charges daily at dawn."},
  {name:"Wand of Magic Missiles",rarity:"Uncommon",type:"Wand",attunement:false,description:"This wand has 7 charges. While holding it, you can use an action to expend 1 or more of its charges to cast the Magic Missile spell from it. For 1 charge, you cast the 1st-level version of the spell. You can increase the spell slot level by one for each additional charge you expend. The wand regains 1d6+1 expended charges daily at dawn."},
  {name:"Wand of Secrets",rarity:"Uncommon",type:"Wand",attunement:false,description:"The wand has 3 charges. While holding it, you can use an action to expend 1 of its charges, and if a secret door or trap is within 30 feet of you, the wand pulses and points at the one nearest to you. The wand regains 1d3 expended charges daily at dawn."},
  {name:"Wand of Web",rarity:"Uncommon",type:"Wand",attunement:true,description:"This wand has 7 charges. While holding it, you can use an action to expend 1 of its charges to cast the Web spell (save DC 15) from it. The wand regains 1d6+1 expended charges daily at dawn."},
  {name:"Wand of the War Mage +1",rarity:"Uncommon",type:"Wand",attunement:true,description:"While you are holding this wand, you gain a +1 bonus to spell attack rolls. In addition, you ignore half cover when making a spell attack."},
  {name:"Weapon +1",rarity:"Uncommon",type:"Weapon (any)",attunement:false,description:"You have a +1 bonus to attack and damage rolls made with this magic weapon."},
  {name:"Wind Fan",rarity:"Uncommon",type:"Wondrous Item",attunement:false,description:"While holding this fan, you can use an action to cast the Gust of Wind spell (save DC 13) from it. Once used, the fan shouldn't be used again until the next dawn."},
  {name:"Winged Boots",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"While you wear these boots, you have a flying speed equal to your walking speed. You can use the boots to fly for up to 4 hours, all at once or in several shorter flights. If you are flying when the duration expires, you descend at a rate of 30 feet per round until you land."},
  {name:"Wings of Flying",rarity:"Uncommon",type:"Wondrous Item",attunement:true,description:"While wearing this cloak, you can use an action to speak its command word. This turns the cloak into a pair of bat wings or bird wings on your back for 1 hour or until you repeat the command word as an action. The wings give you a flying speed of 60 feet. When they disappear, you can't use them again for 1d12 hours."},
  {name:"Ammunition +2",rarity:"Rare",type:"Weapon (any ammunition)",attunement:false,description:"You have a +2 bonus to attack and damage rolls made with this piece of magic ammunition."},
  {name:"Amulet of Health",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"Your Constitution score is 19 while you wear this amulet. It has no effect on you if your Constitution is already 19 or higher."},
  {name:"Animated Shield",rarity:"Rare",type:"Armor (shield)",attunement:true,description:"While holding this shield, you can speak its command word as a bonus action to cause it to animate. The shield leaps into the air and hovers in your space to protect you as if you were wielding it, leaving your hands free. The shield remains animated for 1 minute."},
  {name:"Armor +1",rarity:"Rare",type:"Armor (light, medium, or heavy)",attunement:false,description:"You have a +1 bonus to AC while wearing this armor."},
  {name:"Belt of Dwarvenkind",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While wearing this belt, your Constitution score increases by 2, to a maximum of 20. You have advantage on Charisma (Persuasion) checks made to interact with dwarves. You also have a 50% chance of growing a full beard if you're capable of growing one."},
  {name:"Belt of Giant Strength (Hill)",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While wearing this belt, your Strength score changes to 21. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score."},
  {name:"Berserker Axe",rarity:"Rare",type:"Weapon (any axe)",attunement:true,description:"You gain a +1 bonus to attack and damage rolls made with this magic weapon. While attuned, your hit point maximum increases by 1 for each level you have attained. Curse: You are unwilling to part with the axe, becoming aggressive toward those who try to remove it."},
  {name:"Boots of Levitation",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While you wear these boots, you can use an action to cast the Levitate spell on yourself at will."},
  {name:"Boots of Speed",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While you wear these boots, you can use a bonus action and click the boots' heels together to double your walking speed. In addition, difficult terrain doesn't cost you extra movement. You can end the effect using a bonus action. Once used, this property of the boots can't be used again until the next dawn."},
  {name:"Bowl of Commanding Water Elementals",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"While this bowl is filled with water, you can use an action to speak the bowl's command word and summon a water elemental. The bowl can't be used this way again until the next dawn."},
  {name:"Brazier of Commanding Fire Elementals",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"While a fire burns in this brass brazier, you can use an action to speak the brazier's command word and summon a fire elemental. The brazier can't be used this way again until the next dawn."},
  {name:"Cape of the Mountebank",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"This cape smells faintly of brimstone. While wearing it, you can use it to cast the Dimension Door spell as an action. This property of the cape can't be used again until the next dawn. When you disappear, you leave behind a cloud of smoke, and you appear in a similar cloud of smoke at your destination."},
  {name:"Censer of Controlling Air Elementals",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"While incense is burning in this censer, you can use an action to speak the censer's command word and summon an air elemental. The censer can't be used this way again until the next dawn."},
  {name:"Cloak of Displacement",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While you wear this cloak, it projects an illusion that makes you appear to be standing in a place near your actual location, causing any creature to have disadvantage on attack rolls against you. If you take damage, the property ceases to function until the start of your next turn."},
  {name:"Cloak of the Bat",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While wearing this cloak, you have advantage on Dexterity (Stealth) checks. In an area of dim light or darkness, you can grip the edges of the cloak with both hands and use it to fly at a speed of 40 feet."},
  {name:"Cube of Force",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"This cube is about an inch across. Each face has a distinct marking on it that can be pressed. The cube starts with 36 charges, and it regains 1d20 expended charges daily at dawn. You can use an action to press one of the cube's faces, expending a number of charges based on the chosen face."},
  {name:"Instant Fortress",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"You can use an action to place this 1-inch metal cube on the ground and speak its command word. The cube rapidly grows into a square tower, 20 feet on a side and 30 feet high, that remains until you use an action to speak the command word that dismisses it."},
  {name:"Dagger of Venom",rarity:"Rare",type:"Weapon (dagger)",attunement:false,description:"You gain a +1 bonus to attack and damage rolls made with this magic weapon. You can use an action to cause thick, black poison to coat the blade. The poison remains for 1 minute or until an attack using this weapon hits a creature. That creature must succeed on a DC 15 Constitution saving throw or take 2d10 poison damage and become poisoned for 1 minute."},
  {name:"Dimensional Shackles",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"You can use an action to place these shackles on an incapacitated creature. The shackles adjust to fit a creature of Small to Large size. The shackles prevent a creature bound by them from using any method of extradimensional movement, including teleportation or travel to a different plane of existence."},
  {name:"Dragon Slayer",rarity:"Rare",type:"Weapon (any sword)",attunement:false,description:"You gain a +1 bonus to attack and damage rolls made with this magic weapon. When you hit a dragon with this weapon, the dragon takes an extra 3d6 damage of the weapon's type."},
  {name:"Elven Chain",rarity:"Rare",type:"Armor (chain shirt)",attunement:false,description:"You gain a +1 bonus to AC while you wear this armor. You are considered proficient with this armor even if you lack proficiency with medium armor."},
  {name:"Flame Tongue",rarity:"Rare",type:"Weapon (any sword)",attunement:true,description:"You can use a bonus action to speak this magic sword's command word, causing flames to erupt from the blade. These flames shed bright light in a 40-foot radius and dim light for an additional 40 feet. While the sword is ablaze, it deals an extra 2d6 fire damage to any target it hits."},
  {name:"Gem of Seeing",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"This gem has 3 charges. As an action, you can speak the gem's command word and expend 1 charge. For the next 10 minutes, you have truesight out to 120 feet when you peer through the gem. The gem regains 1d3 expended charges daily at dawn."},
  {name:"Giant Slayer",rarity:"Rare",type:"Weapon (any axe or sword)",attunement:false,description:"You gain a +1 bonus to attack and damage rolls made with this magic weapon. When you hit a giant with it, the giant takes an extra 2d6 damage of the weapon's type and must succeed on a DC 15 Strength saving throw or fall prone."},
  {name:"Glamoured Studded Leather",rarity:"Rare",type:"Armor (studded leather)",attunement:false,description:"While wearing this armor, you gain a +1 bonus to AC. You can also use a bonus action to speak the armor's command word and cause the armor to assume the appearance of a normal set of clothing or some other kind of armor."},
  {name:"Helm of Teleportation",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"This helm has 3 charges. While wearing it, you can use an action and expend 1 charge to cast the Teleport spell from it. The helm regains 1d3 expended charges daily at dawn."},
  {name:"Horn of Blasting",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"You can use an action to speak the horn's command word and then blow the horn, which emits a thunderous blast in a 30-foot cone that is audible 600 feet away. Each creature in the cone must make a DC 15 Constitution saving throw. On a failed save, a creature takes 5d6 thunder damage and is deafened for 1 minute."},
  {name:"Horn of Valhalla (Silver)",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"You can use an action to blow this horn. In response, warrior spirits from Valhalla appear within 60 feet of you. They use the statistics of a berserker. They return to Valhalla after 1 hour or when they drop to 0 hit points. Once you use the horn, it can't be used again until 7 days have passed."},
  {name:"Ioun Stone (Awareness)",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While this dark lavender ellipsoid orbits your head, you can't be surprised and have advantage on initiative rolls."},
  {name:"Ioun Stone (Protection)",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While this dusty rose prism orbits your head, you gain a +1 bonus to AC."},
  {name:"Ioun Stone (Reserve)",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"While this vibrant purple prism orbits your head, you can cast spells into it and use its power to restore expended spell slots."},
  {name:"Iron Bands of Binding",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"This rusty iron sphere measures 3 inches in diameter and weighs 1 pound. You can use an action to speak the command word and throw the sphere at a Huge or smaller creature you can see within 60 feet of you. Make a ranged attack roll with an attack bonus of +7. On a hit, the target is restrained until you use a bonus action to speak the command word again to release it."},
  {name:"Mantle of Spell Resistance",rarity:"Rare",type:"Wondrous Item",attunement:true,description:"You have advantage on saving throws against spells while you wear this cloak."},
  {name:"Necklace of Fireballs",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"This necklace has 1d6+3 beads hanging from it. You can use an action to detach a bead and throw it up to 60 feet away. When it reaches the end of its trajectory, the bead detonates as a 3rd-level Fireball spell (save DC 15)."},
  {name:"Periapt of Proof against Poison",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"This delicate silver chain has a brilliant-cut black gem pendant. While you wear it, poisons have no effect on you. You are immune to the poisoned condition and have immunity to poison damage."},
  {name:"Ring of Animal Influence",rarity:"Rare",type:"Ring",attunement:false,description:"This ring has 3 charges, and it regains 1d3 expended charges daily at dawn. While wearing the ring, you can use an action to expend 1 of its charges to cast one of the following spells: Animal Friendship (DC 13), Fear (affecting only beasts with an Intelligence of 3 or lower; DC 13), or Speak with Animals."},
  {name:"Ring of Evasion",rarity:"Rare",type:"Ring",attunement:true,description:"This ring has 3 charges, and it regains 1d3 expended charges daily at dawn. When you fail a Dexterity saving throw, you can use your reaction to expend 1 of the ring's charges to succeed on that saving throw instead."},
  {name:"Ring of Feather Falling",rarity:"Rare",type:"Ring",attunement:true,description:"When you fall while wearing this ring, you descend 60 feet per round and take no damage from falling."},
  {name:"Ring of Free Action",rarity:"Rare",type:"Ring",attunement:true,description:"While you wear this ring, difficult terrain doesn't cost you extra movement. In addition, magic can neither reduce your speed nor cause you to be paralyzed or restrained."},
  {name:"Ring of Protection",rarity:"Rare",type:"Ring",attunement:true,description:"You gain a +1 bonus to AC and saving throws while wearing this ring."},
  {name:"Ring of Spell Storing",rarity:"Rare",type:"Ring",attunement:true,description:"This ring stores spells cast into it, holding them until the attuned wearer uses them. The ring can store up to 5 levels worth of spells at a time."},
  {name:"Ring of the Ram",rarity:"Rare",type:"Ring",attunement:true,description:"This ring has 3 charges, and it regains 1d3 expended charges daily at dawn. While wearing the ring, you can use an action to expend 1 to 3 of its charges to attack one creature you can see within 60 feet of you with a spectral ram's head (+7 attack bonus, 2d10 force damage per charge + pushed 5 feet)."},
  {name:"Rope of Entanglement",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"This rope is 30 feet long and weighs 3 pounds. If you hold one end of the rope and use an action to speak its command word, the other end darts forward to entangle a creature you can see within 20 feet of you. The target must succeed on a DC 15 Dexterity saving throw or become restrained."},
  {name:"Shield +1",rarity:"Rare",type:"Armor (shield)",attunement:false,description:"While holding this shield, you have a +1 bonus to AC in addition to the shield's normal bonus to AC."},
  {name:"Staff of Charming",rarity:"Rare",type:"Staff",attunement:true,description:"While holding this staff, you can use an action to expend 1 of its 10 charges to cast Charm Person, Command, or Comprehend Languages from it using your spell save DC. The staff can also be used as a magic quarterstaff. The staff regains 1d8+2 expended charges daily at dawn."},
  {name:"Staff of Healing",rarity:"Rare",type:"Staff",attunement:true,description:"This staff has 10 charges. While holding it, you can use an action to expend 1 or more of its charges to cast one of the following spells from it, using your spell save DC: Cure Wounds (1 charge/level, up to 4th level), Lesser Restoration (2 charges), or Mass Cure Wounds (5 charges)."},
  {name:"Staff of Swarming Insects",rarity:"Rare",type:"Staff",attunement:true,description:"This staff has 10 charges. While holding the staff, you can use an action to expend some of its charges to cast Giant Insect (4 charges) or Insect Plague (5 charges)."},
  {name:"Staff of the Woodlands",rarity:"Rare",type:"Staff",attunement:true,description:"This staff can be wielded as a magic quarterstaff that grants a +2 bonus to attack and damage rolls made with it. While holding it, you have a +2 bonus to spell attack rolls. The staff has 10 charges for various nature spells."},
  {name:"Staff of Thunder and Lightning",rarity:"Rare",type:"Staff",attunement:true,description:"This staff can be wielded as a magic quarterstaff that grants a +2 bonus to attack and damage rolls. It also has several lightning and thunder abilities, each usable once per dawn."},
  {name:"Stone of Controlling Earth Elementals",rarity:"Rare",type:"Wondrous Item",attunement:false,description:"If the stone is touching the ground, you can use an action to speak its command word to summon an earth elemental. The stone can't be used this way again until the next dawn."},
  {name:"Sun Blade",rarity:"Rare",type:"Weapon (longsword)",attunement:true,description:"This item appears to be a longsword hilt. While grasping the hilt, you can use a bonus action to cause a blade of pure radiance to spring into existence. You gain a +2 bonus to attack and damage rolls made with this weapon, which deals radiant damage instead of slashing damage. When you hit an undead with it, that target takes an extra 1d8 radiant damage."},
  {name:"Sword of Life Stealing",rarity:"Rare",type:"Weapon (any sword)",attunement:true,description:"When you attack a creature with this magic weapon and roll a 20 on the attack roll, that target takes an extra 3d6 necrotic damage, provided that the target isn't a construct or an undead. You also gain 10 temporary hit points."},
  {name:"Sword of Wounding",rarity:"Rare",type:"Weapon (any sword)",attunement:true,description:"Hit points lost to this weapon's damage can be regained only through a short or long rest, rather than by regeneration, magic, or any other means. Once per turn, when you hit a creature with an attack using this magic weapon, you can wound the target. At the start of each of the wounded creature's turns, it takes 1d4 necrotic damage for each time you've wounded it."},
  {name:"Trident of Fish Command",rarity:"Rare",type:"Weapon (trident)",attunement:true,description:"This trident is a magic weapon. It has 3 charges. While you carry it, you can use an action and expend 1 charge to cast Dominate Beast (save DC 15) from it on a beast that has an innate swimming speed. The trident regains 1d3 expended charges daily at dawn."},
  {name:"Wand of Binding",rarity:"Rare",type:"Wand",attunement:true,description:"This wand has 7 charges. While holding it, you can use an action to expend some of its charges to cast Hold Monster (5 charges) or Hold Person (2 charges). The wand regains 1d6+1 expended charges daily at dawn."},
  {name:"Wand of Enemy Detection",rarity:"Rare",type:"Wand",attunement:true,description:"This wand has 7 charges. While holding it, you can use an action and expend 1 charge to speak its command word. For the next minute, you know the direction of the nearest creature hostile to you within 60 feet of you. The wand regains 1d6+1 expended charges daily at dawn."},
  {name:"Wand of Fear",rarity:"Rare",type:"Wand",attunement:true,description:"This wand has 7 charges. Command (1 charge): you can command another creature to flee or grovel. Cone (2 charges): emits a 60-foot cone of amber light causing fear. The wand regains 1d6+1 expended charges daily at dawn."},
  {name:"Wand of Fireballs",rarity:"Rare",type:"Wand",attunement:true,description:"This wand has 7 charges. While holding it, you can use an action to expend 1 or more of its charges to cast the Fireball spell (save DC 15) from it. You can increase the spell slot level by one for each additional charge you expend."},
  {name:"Wand of Lightning Bolts",rarity:"Rare",type:"Wand",attunement:true,description:"This wand has 7 charges. While holding it, you can use an action to expend 1 or more of its charges to cast the Lightning Bolt spell (save DC 15) from it. You can increase the spell slot level by one for each additional charge you expend."},
  {name:"Wand of Paralysis",rarity:"Rare",type:"Wand",attunement:true,description:"This wand has 7 charges. While holding it, you can use an action to expend 1 of its charges to cause a thin blue ray to streak from the tip toward a creature you can see within 60 feet of you. The target must succeed on a DC 15 Constitution saving throw or be paralyzed for 1 minute."},
  {name:"Wand of the War Mage +2",rarity:"Rare",type:"Wand",attunement:true,description:"While you are holding this wand, you gain a +2 bonus to spell attack rolls. In addition, you ignore half cover when making a spell attack."},

  {name:"Amulet of the Planes",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"While wearing this amulet, you can use an action to name a location that you are familiar with on another plane of existence. Then make a DC 15 Intelligence check. On a successful check, you cast the Plane Shift spell. On a failure, you and each creature and object within 15 feet of you travel to a random destination."},
  {name:"Armor +2",rarity:"Very Rare",type:"Armor (light, medium, or heavy)",attunement:false,description:"You have a +2 bonus to AC while wearing this armor."},
  {name:"Belt of Giant Strength (Stone/Frost)",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"While wearing this belt, your Strength score changes to 23. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score."},
  {name:"Carpet of Flying",rarity:"Very Rare",type:"Wondrous Item",attunement:false,description:"You can speak the carpet's command word as an action to make the carpet hover and fly. It moves according to your spoken directions, provided that you are within 30 feet of it. Sizes range from small (3×5ft, 200lb limit, 80ft speed) to large (6×9ft, 800lb limit, 40ft speed)."},
  {name:"Cloak of Arachnida",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"While wearing it, you gain resistance to poison damage, a climbing speed equal to your walking speed, the ability to move across vertical surfaces and ceilings, immunity to webs, and can cast Web (save DC 13) once per dawn."},
  {name:"Crystal Ball",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"The typical crystal ball is about 6 inches in diameter. While touching it, you can cast the Scrying spell (save DC 17) with it. The spell doesn't require any components."},
  {name:"Dragon Scale Mail",rarity:"Very Rare",type:"Armor (scale mail)",attunement:true,description:"You gain a +1 bonus to AC, advantage on saving throws against the Frightful Presence and breath weapons of dragons, and resistance to one damage type determined by the kind of dragon that provided the scales."},
  {name:"Horn of Valhalla (Bronze)",rarity:"Very Rare",type:"Wondrous Item",attunement:false,description:"You can use an action to blow this horn. In response, 3d4+3 warrior spirits from Valhalla appear. They return to Valhalla after 1 hour or when they drop to 0 hit points. Once you use the horn, it can't be used again until 7 days have passed. You must be proficient with medium armor or the summoned berserkers attack you."},
  {name:"Ioun Stone (Absorption)",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"While this pale lavender ellipsoid orbits your head, you can use your reaction to cancel a spell of 4th level or lower cast by a creature you can see and targeting only you. The stone can absorb a combined total of 20 levels of spells before it burns out."},
  {name:"Ioun Stone (Agility)",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"Your Dexterity score increases by 2, to a maximum of 20, while this deep red sphere orbits your head."},
  {name:"Ioun Stone (Fortitude)",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"Your Constitution score increases by 2, to a maximum of 20, while this pink rhomboid orbits your head."},
  {name:"Ioun Stone (Insight)",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"Your Wisdom score increases by 2, to a maximum of 20, while this incandescent blue sphere orbits your head."},
  {name:"Ioun Stone (Intellect)",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"Your Intelligence score increases by 2, to a maximum of 20, while this marbled scarlet and blue sphere orbits your head."},
  {name:"Ioun Stone (Leadership)",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"Your Charisma score increases by 2, to a maximum of 20, while this marbled pink and green sphere orbits your head."},
  {name:"Ioun Stone (Strength)",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"Your Strength score increases by 2, to a maximum of 20, while this pale blue rhomboid orbits your head."},
  {name:"Manual of Bodily Health",rarity:"Very Rare",type:"Wondrous Item",attunement:false,description:"If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Constitution score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century."},
  {name:"Manual of Gainful Exercise",rarity:"Very Rare",type:"Wondrous Item",attunement:false,description:"If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Strength score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century."},
  {name:"Manual of Quickness of Action",rarity:"Very Rare",type:"Wondrous Item",attunement:false,description:"If you spend 48 hours over a period of 6 days or fewer studying the book's contents and practicing its guidelines, your Dexterity score increases by 2, as does your maximum for that score. The manual then loses its magic, but regains it in a century."},
  {name:"Necklace of Prayer Beads",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"This necklace has 1d4+2 magic beads made from aquamarine, black pearl, or topaz. Each bead stores a spell (Bless, Cure Wounds, Greater Restoration, Sending, Smite spells) that can be cast once per dawn. If a magic bead is removed from the necklace, that bead loses its magic."},
  {name:"Nine Lives Stealer",rarity:"Very Rare",type:"Weapon (any sword)",attunement:true,description:"You gain a +2 bonus to attack and damage rolls made with this magic weapon. The sword has 1d8+1 charges. If you score a critical hit against a creature that has fewer than 100 hit points, it must succeed on a DC 15 Constitution saving throw or be slain instantly as the sword tears its life force from its body."},
  {name:"Oathbow",rarity:"Very Rare",type:"Weapon (longbow)",attunement:true,description:"When you nock an arrow on this bow, it whispers in Elvish, 'Swift defeat to my enemies.' When you use this weapon to make a ranged attack, you can, as a command phrase, say, 'Swift death to you who have wronged me.' The target of your attack becomes your sworn enemy until it dies or until dawn seven days later."},
  {name:"Potion of Flying",rarity:"Very Rare",type:"Potion",attunement:false,description:"When you drink this potion, you gain a flying speed equal to your walking speed for 1 hour and can hover. If you're in the air when the potion wears off, you fall unless you have some other means of staying aloft."},
  {name:"Potion of Healing (Supreme)",rarity:"Very Rare",type:"Potion",attunement:false,description:"You regain 10d4+20 hit points when you drink this potion."},
  {name:"Potion of Invisibility",rarity:"Very Rare",type:"Potion",attunement:false,description:"This potion's container looks empty but feels as though it holds liquid. When you drink it, you become invisible for 1 hour. Anything you wear or carry is invisible with you. The effect ends early if you attack or cast a spell."},
  {name:"Ring of Regeneration",rarity:"Very Rare",type:"Ring",attunement:true,description:"While wearing this ring, you regain 1d6 hit points every 10 minutes, provided that you have at least 1 hit point. If you lose a body part, the ring causes the missing part to regrow and return to full functionality after 1d6+1 days."},
  {name:"Ring of Shooting Stars",rarity:"Very Rare",type:"Ring",attunement:true,description:"While wearing this ring in dim light or darkness, you can cast Dancing Lights and Light from the ring at will. The ring has 6 charges for other properties, regaining 1d6 expended charges daily at dawn."},
  {name:"Ring of Telekinesis",rarity:"Very Rare",type:"Ring",attunement:true,description:"While wearing this ring, you can cast the Telekinesis spell at will, but you can target only objects that aren't being worn or carried."},
  {name:"Robe of Stars",rarity:"Very Rare",type:"Wondrous Item",attunement:true,description:"This black or dark blue robe is embroidered with small white or silver stars. You gain a +1 bonus to saving throws while you wear it. You can use an action to pull one star patch off the robe and use it to cast Magic Missile as a 5th-level spell. Daily at dusk, 1d6 removed star patches reappear."},
  {name:"Rod of Absorption",rarity:"Very Rare",type:"Rod",attunement:true,description:"While holding this rod, you can use your reaction to absorb a spell that is targeting only you. The absorbed spell's effect is canceled and its energy is stored in the rod. The rod can absorb and store up to 50 levels of energy over the course of its existence."},
  {name:"Rod of Alertness",rarity:"Very Rare",type:"Rod",attunement:true,description:"While holding the rod, you have advantage on Wisdom (Perception) checks and on rolls for initiative. As an action, you can cast one of the following spells from it: Detect Evil and Good, Detect Magic, Detect Poison and Disease, or See Invisibility."},
  {name:"Rod of Security",rarity:"Very Rare",type:"Rod",attunement:false,description:"While holding this rod, you can use an action to activate it, instantly transporting you and up to 199 other willing creatures you can see to a paradise that exists in an extradimensional space."},
  {name:"Scimitar of Speed",rarity:"Very Rare",type:"Weapon (scimitar)",attunement:true,description:"You gain a +2 bonus to attack and damage rolls made with this magic weapon. In addition, you can make one attack with it as a bonus action on each of your turns."},
  {name:"Shield +2",rarity:"Very Rare",type:"Armor (shield)",attunement:false,description:"While holding this shield, you have a +2 bonus to AC in addition to the shield's normal bonus to AC."},
  {name:"Spell Scroll (8th Level)",rarity:"Very Rare",type:"Scroll",attunement:false,description:"A spell scroll bearing an 8th-level spell. A spellcaster with the spell on their class's spell list can read the scroll and cast its spell without providing any material components."},
  {name:"Staff of Fire",rarity:"Very Rare",type:"Staff",attunement:true,description:"You have resistance to fire damage while you hold this staff. The staff has 10 charges for Burning Hands (1 charge), Fireball (3 charges), or Wall of Fire (4 charges). The staff regains 1d6+4 expended charges daily at dawn."},
  {name:"Staff of Frost",rarity:"Very Rare",type:"Staff",attunement:true,description:"You have resistance to cold damage while you hold this staff. The staff has 10 charges for Cone of Cold (5 charges), Fog Cloud (1 charge), Ice Storm (4 charges), or Wall of Ice (4 charges). The staff regains 1d6+4 expended charges daily at dawn."},
  {name:"Staff of Power",rarity:"Very Rare",type:"Staff",attunement:true,description:"This staff grants a +2 bonus to attack and damage rolls, AC, saving throws, and spell attack rolls. The staff has 20 charges for various powerful spells. It regains 2d8+4 expended charges daily at dawn."},
  {name:"Staff of Striking",rarity:"Very Rare",type:"Staff",attunement:true,description:"This staff grants a +3 bonus to attack and damage rolls. The staff has 10 charges. When you hit with a melee attack using it, you can expend up to 3 of its charges. For each charge you expend, the target takes an extra 1d6 force damage."},
  {name:"Sword of Sharpness",rarity:"Very Rare",type:"Weapon (any sword that deals slashing damage)",attunement:true,description:"When you attack an object with this magic sword and hit, maximize your weapon damage dice against the target. When you attack a creature with this weapon and roll a 20 on the attack roll, that target takes an extra 4d6 slashing damage. Then roll another d20. If you roll a 20, you lop off one of the target's limbs."},
  {name:"Tome of Clear Thought",rarity:"Very Rare",type:"Wondrous Item",attunement:false,description:"If you spend 48 hours over a period of 6 days or fewer studying the book's contents, your Intelligence score increases by 2, as does your maximum for that score. The tome then loses its magic, but regains it in a century."},
  {name:"Tome of Leadership and Influence",rarity:"Very Rare",type:"Wondrous Item",attunement:false,description:"If you spend 48 hours over a period of 6 days or fewer studying the book's contents, your Charisma score increases by 2, as does your maximum for that score. The tome then loses its magic, but regains it in a century."},
  {name:"Tome of Understanding",rarity:"Very Rare",type:"Wondrous Item",attunement:false,description:"If you spend 48 hours over a period of 6 days or fewer studying the book's contents, your Wisdom score increases by 2, as does your maximum for that score. The tome then loses its magic, but regains it in a century."},
  {name:"Wand of the War Mage +3",rarity:"Very Rare",type:"Wand",attunement:true,description:"While you are holding this wand, you gain a +3 bonus to spell attack rolls. In addition, you ignore half cover and three-quarters cover when making a spell attack."},
  {name:"Weapon +3",rarity:"Very Rare",type:"Weapon (any)",attunement:false,description:"You have a +3 bonus to attack and damage rolls made with this magic weapon."},
  {name:"Apparatus of Kwalish",rarity:"Legendary",type:"Wondrous Item",attunement:false,description:"This item first appears to be a Large sealed iron barrel weighing 500 pounds. The barrel has a hidden catch, which can be found with a successful DC 20 Intelligence (Investigation) check. Releasing the catch unlocks a hatch at one end of the barrel, allowing two Medium or smaller creatures to crawl inside. Ten levers are set in a row at the far end."},
  {name:"Armor +3",rarity:"Legendary",type:"Armor (light, medium, or heavy)",attunement:false,description:"You have a +3 bonus to AC while wearing this armor."},
  {name:"Armor of Invulnerability",rarity:"Legendary",type:"Armor (plate)",attunement:true,description:"You have resistance to nonmagical damage while you wear this armor. Additionally, you can use an action to make yourself immune to nonmagical damage for 10 minutes or until you are no longer wearing the armor. Once this special action is used, it can't be used again until the next dawn."},
  {name:"Belt of Giant Strength (Storm/Cloud)",rarity:"Legendary",type:"Wondrous Item",attunement:true,description:"While wearing this belt, your Strength score changes to 29. The item has no effect on you if your Strength without the belt is equal to or greater than the belt's score."},
  {name:"Cloak of Invisibility",rarity:"Legendary",type:"Wondrous Item",attunement:true,description:"While wearing this cloak, you can pull its hood over your head to cause yourself to become invisible. While you are invisible, anything you are carrying or wearing is invisible with you. After accumulating 2 hours of use, the cloak ceases to function. For every uninterrupted 12 hours the cloak goes unused, it regains 1 hour of use."},
  {name:"Cubic Gate",rarity:"Legendary",type:"Wondrous Item",attunement:false,description:"This cube is 3 inches across and radiates palpable magical energy. The six sides of the cube are each keyed to a different plane of existence. The other five are chosen by the DM."},
  {name:"Defender",rarity:"Legendary",type:"Weapon (any sword)",attunement:true,description:"You gain a +3 bonus to attack and damage rolls made with this magic weapon. The first time you attack with the sword on each of your turns, you can transfer some or all of the sword's bonus to your Armor Class instead of using it on any attacks that turn."},
  {name:"Hammer of Thunderbolts",rarity:"Legendary",type:"Weapon (maul)",attunement:false,description:"You gain a +1 bonus to attack and damage rolls made with this magic weapon. When attuned (requires Belt of Giant Strength and Gauntlets of Ogre Power), your Strength score increases by 4 (max 25), and when you score a critical hit with it, the target must succeed on a DC 17 Constitution saving throw or die."},
  {name:"Holy Avenger",rarity:"Legendary",type:"Weapon (any sword)",attunement:true,description:"You gain a +3 bonus to attack and damage rolls. When you hit a fiend or an undead, that creature takes an extra 2d10 radiant damage. While you hold the drawn sword, it creates an aura in a 10-foot radius around you granting advantage on saving throws against spells and magical effects. At 17+ paladin levels, the radius expands to 30 feet."},
  {name:"Iron Flask",rarity:"Legendary",type:"Wondrous Item",attunement:false,description:"This iron bottle has a brass stopper. You can use an action to speak the flask's command word, targeting a creature that you can see within 60 feet of you that is native to a plane other than the one you're on. The target must succeed on a DC 17 Wisdom saving throw or be trapped in the flask. The flask can hold only one creature at a time."},
  {name:"Luck Blade",rarity:"Legendary",type:"Weapon (any sword)",attunement:true,description:"You gain a +1 bonus to attack and damage rolls and a +1 bonus to saving throws. Luck: Once per dawn, reroll one attack roll, ability check, or saving throw you dislike and use the second roll. Wish: The sword has 1d4−1 charges. While holding it, you can use an action to expend 1 charge and cast the Wish spell from it."},
  {name:"Plate Armor of Etherealness",rarity:"Legendary",type:"Armor (plate)",attunement:true,description:"While you're wearing this armor, you can speak its command word as an action to gain the effect of the Etherealness spell, which lasts 10 minutes or until you remove the armor or use an action to speak the command word again."},
  {name:"Ring of Djinni Summoning",rarity:"Legendary",type:"Ring",attunement:true,description:"While wearing this ring, you can speak its command word as an action to summon a particular djinni from the Elemental Plane of Air. The djinni appears in an unoccupied space you choose within 120 feet of you. It remains as long as you concentrate (maximum 1 hour)."},
  {name:"Ring of Elemental Command (Air)",rarity:"Legendary",type:"Ring",attunement:true,description:"While wearing this ring, you have advantage on attack rolls against elementals from the Elemental Plane of Air, and they have disadvantage on attack rolls against you. You also gain access to several elemental air-related properties."},
  {name:"Ring of Spell Turning",rarity:"Legendary",type:"Ring",attunement:true,description:"While wearing this ring, you have advantage on saving throws against any spell that targets only you. In addition, if you roll a 20 for the save and the spell is 7th level or lower, the spell has no effect on you and instead targets the caster."},
  {name:"Ring of Three Wishes",rarity:"Legendary",type:"Ring",attunement:false,description:"While wearing this ring, you can use an action to expend 1 of its 3 charges to cast the Wish spell from it. The ring becomes nonmagical when you use the last charge."},
  {name:"Robe of the Archmagi",rarity:"Legendary",type:"Wondrous Item",attunement:true,description:"While wearing the robe, your base Armor Class is 15 + your Dexterity modifier (if not wearing armor), you have advantage on saving throws against spells and other magical effects, and your spell save DC and spell attack bonus each increase by 2."},
  {name:"Rod of Lordly Might",rarity:"Legendary",type:"Rod",attunement:true,description:"This rod has a flanged head and functions as a magic mace that grants a +3 bonus to attack and damage rolls. The rod has properties associated with six different buttons that are set in a row along the haft."},
  {name:"Rod of Resurrection",rarity:"Legendary",type:"Rod",attunement:true,description:"The rod has 5 charges. While you hold it, you can use an action to cast one of the following spells from it: Heal (1 charge) or Resurrection (5 charges). The rod regains 1 charge daily at dawn."},
  {name:"Scarab of Protection",rarity:"Legendary",type:"Wondrous Item",attunement:true,description:"While it is on your person, you have advantage on saving throws against spells. The scarab has 12 charges. If you fail a saving throw against a necromancy spell or a harmful effect originating from an undead creature, you can use your reaction to expend 1 charge and turn the failed save into a successful one."},
  {name:"Shield +3",rarity:"Legendary",type:"Armor (shield)",attunement:false,description:"While holding this shield, you have a +3 bonus to AC in addition to the shield's normal bonus to AC."},
  {name:"Sphere of Annihilation",rarity:"Legendary",type:"Wondrous Item",attunement:false,description:"This 2-foot-diameter black sphere is a hole in the multiverse, hovering in space and stabilized by a magical field surrounding it. The sphere obliterates all matter it passes through and all matter that passes through it."},
  {name:"Staff of the Magi",rarity:"Legendary",type:"Staff",attunement:true,description:"This staff grants a +2 bonus to attack and damage rolls, and a +2 bonus to spell attack rolls. The staff has 50 charges for various powerful spells and properties, regaining 4d6+2 expended charges daily at dawn."},
  {name:"Talisman of Pure Good",rarity:"Legendary",type:"Wondrous Item",attunement:true,description:"This talisman is a mighty symbol of goodness. A creature that is neither good nor evil in alignment takes 6d6 radiant damage upon touching the talisman. An evil creature takes 8d6 radiant damage upon touching the talisman."},
  {name:"Talisman of Ultimate Evil",rarity:"Legendary",type:"Wondrous Item",attunement:true,description:"This item symbolizes unrepentant evil. A creature that is neither good nor evil in alignment takes 6d6 necrotic damage upon touching the talisman. A good creature takes 8d6 necrotic damage upon touching the talisman."},
  {name:"Vorpal Sword",rarity:"Legendary",type:"Weapon (any sword that deals slashing damage)",attunement:true,description:"You gain a +3 bonus to attack and damage rolls. The weapon ignores resistance to slashing damage. When you attack a creature that has at least one head with this weapon and roll a 20 on the attack roll, you cut off one of the creature's heads. The creature dies if it can't survive without the lost head."},
  {name:"Axe of the Dwarvish Lords",rarity:"Artifact",type:"Weapon (battleaxe)",attunement:true,description:"Forged by the first dwarf king, this +3 battleaxe grants +3 to Strength and Constitution (max 24), darkvision to 60ft if you don't have it, proficiency with mason's tools, and the ability to communicate with dwarves. It has multiple legendary actions and can be used to call upon dwarven allies."},
  {name:"Book of Exalted Deeds",rarity:"Artifact",type:"Wondrous Item",attunement:true,description:"The Book of Exalted Deeds serves as an eternal record of every good act performed in the multiverse. Only a creature of good alignment can attune to this book. Studying it grants +2 to Wisdom (max 24), advantage on saving throws, immunity to fear and the frightened condition, and more."},
  {name:"Book of Vile Darkness",rarity:"Artifact",type:"Wondrous Item",attunement:true,description:"The contents of this book are utterly horrific. Only evil creatures can attune to it. Reading it in its entirety grants +2 to Constitution (max 24), advantage on death saving throws, ability to cast various dark spells, and the ability to corrupt others."},
  {name:"Eye of Vecna",rarity:"Artifact",type:"Wondrous Item",attunement:true,description:"Vecna's eye must be placed in an empty eye socket, replacing your own eye. While attuned, you gain truesight 120ft, can cast Clairvoyance and Etherealness at will, and Eyebite once per dawn. However, you are drawn toward evil."},
  {name:"Hand of Vecna",rarity:"Artifact",type:"Wondrous Item",attunement:true,description:"Vecna's severed hand, preserved with dark magic. You must cut off your own hand to attune to it. While attuned, your Strength score becomes 20 unless higher, and you can cast Finger of Death (once/dawn), Sleep (at will), and Slow (3/dawn). You gain cold resistance and are drawn toward evil."},
  {name:"Orb of Dragonkind",rarity:"Artifact",type:"Wondrous Item",attunement:true,description:"Each orb contains the essence of an evil dragon. When a chromatic dragon is within 120 feet of the orb, it must succeed on DC 18 Wisdom saving throw or come under the orb's sway for 1 hour. Attuning grants the ability to cast Cure Wounds, Death Ward, Scrying, and Dominate Monster (targeting only dragons)."},
  {name:"Sword of Kas",rarity:"Artifact",type:"Weapon (longsword)",attunement:true,description:"This +3 longsword once belonged to Kas the Bloody-Handed, Vecna's most trusted lieutenant. It grants +2 to Strength and Constitution (max 24), deals extra damage to undead and constructs, and allows the wielder to cast Vampiric Touch and True Strike at will. It whispers to the wielder, urging betrayal and violence."},
  {name:"Wand of Orcus",rarity:"Artifact",type:"Wand",attunement:true,description:"The Wand of Orcus is the scepter of the Demon Prince of Undeath. This +3 magic weapon can be wielded as a mace. The wand has several properties, including the ability to summon undead, cast Animate Dead and Circle of Death. The wand is evil and cursed."},
