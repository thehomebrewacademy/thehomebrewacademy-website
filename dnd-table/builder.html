THE HOMEBREW ACADEMY: CONTENT PACK PROMPT (format version 1)

Give this whole file to an AI assistant. It tells the assistant how to turn your homebrew document or source book into a Content Pack file that the Character Builder can load.

=====================================================================
INSTRUCTIONS FOR THE AI ASSISTANT
=====================================================================

You are converting tabletop content written for the 2024 rules of the world's most popular fantasy roleplaying game (often called 5.5e) into a Content Pack for The Homebrew Academy Character Builder and Combat Resolver.

STEP 1. Ask the user to upload or paste their content: a homebrew document, a source book they own, or a list of the options they want. Do not write the pack until you have it. If the content is long, ask which parts they want (classes, subclasses, species, backgrounds, feats, spells, items) and work through them in order.

STEP 2. Read all of it. For every option, work out two things:
  a. The character option itself (what shows on the character sheet).
  b. Every feature, trait, spell or item that DOES something. Each one becomes an entry in "abilities", so the sheet's numbers change and the Combat Resolver can run it. Sort each one into these kinds (one feature can be several at once):
     PASSIVE: it changes a number or a defense all the time (Armor Class, Speed, Hit Points, a save, a Resistance, a sense, a spell that is always prepared). It gets "statics".
     ACTIVATED: the character uses it or it triggers (an attack, a breath weapon, a heal, a buff, a reaction). It gets activation, target, roll and results.
     RESOURCE: it gives a pool of uses that one or more features spend (Rage, Focus Points, Channel Divinity). It gets "resource".
     CHOICE: the player picks one option from a list when they gain it (a fighting style, a land type, a damage type). It gets "options".
     TEXT ONLY: it has no number and no roll the app could apply (a language, a ribbon). It needs no ability; its text on the class or species is enough.

STEP 3. Output ONE JSON file and nothing else, in a single code block, so the user can save it as a .json file. It must be valid JSON: double quotes, no comments, no trailing commas. If the content is too long for one reply, tell the user, then continue the same file in the next reply so the pieces join into one file.

STEP 4. After the file, list anything you could not express in this format, so the user knows what stays a table ruling.

Follow the 2024 rules terms exactly: Bonus Action, Reaction, Short Rest, Long Rest, Advantage, Disadvantage, D20 Test, Temporary Hit Points, Origin Feat, species (not race). Write spell levels as "Level 3 Evocation", never "3rd-level evocation". Copy rules text from the user's content as written; do not paraphrase it.

---------------------------------------------------------------------
FILE SHAPE
---------------------------------------------------------------------

{
  "format": "homebrew-academy-content",
  "version": 1,
  "name": "Short name of this pack",
  "author": "Who wrote the content",
  "classes": { },
  "subclasses": { },
  "species": { },
  "backgrounds": { },
  "feats": { },
  "spells": [ ],
  "items": [ ],
  "abilities": [ ]
}

Leave out any section you have nothing for. Names are the keys. A pack entry with the same name as a built-in option replaces it.

---------------------------------------------------------------------
CLASSES
---------------------------------------------------------------------

"classes": {
  "Warden": {
    "hitDie": 12,
    "primaryAbility": "Constitution & Wisdom",
    "saves": ["Constitution", "Wisdom"],
    "armorProf": "Light, Medium, Shields",
    "weaponProf": "Simple, Martial",
    "skillChoices": 2,
    "skillList": ["Athletics", "Insight", "Medicine", "Nature", "Perception", "Survival"],
    "subclassLevel": 3,
    "subclassName": "Warden Oath",
    "casterType": "half",
    "spellAbility": "Wisdom",
    "features": {
      "1": ["Sentinel's Stand", "Spellcasting"],
      "2": ["Warding Strike"],
      "3": ["Subclass feature"],
      "4": ["Ability Score Improvement"]
    },
    "subclasses": {
      "Oath of the Stone": { "3": ["Stoneskin Ward"], "7": ["Unmoving"] }
    }
  }
}

Rules for classes:
- hitDie is 6, 8, 10 or 12. saves is exactly two full ability names.
- Ability names are always written in full: Strength, Dexterity, Constitution, Intelligence, Wisdom, Charisma.
- casterType is "full", "half" or "pact". Leave casterType and spellAbility out for a class with no spellcasting.
- features has one list per level, levels "1" to "20". A level with nothing new can be left out.
- Write the exact text "Ability Score Improvement" at each level that grants one, and "Epic Boon" at level 19 if the class has it.
- Write the exact text "Subclass feature" at each level where the subclass grants something. The subclass entry then lists what it grants at that same level.
- Use each feature's exact name. Its mechanics go in "abilities" under the same name.
- A spellcasting class can also give: "preparedSpells": a list of 20 numbers (how many spells are prepared at each level), "cantripsKnown": a list of 20 numbers, and "expertise": { "2": 2, "9": 4 } (level reached: total skills with Expertise).

---------------------------------------------------------------------
SUBCLASSES FOR CLASSES THAT ALREADY EXIST
---------------------------------------------------------------------

"subclasses": {
  "Fighter": {
    "Rune Carver": { "3": ["Rune Lore", "Giant's Might"], "7": ["Runic Shield"], "10": ["Great Stature"], "15": ["Master of Runes"], "18": ["Runic Juggernaut"] }
  }
}

The built-in classes are Barbarian, Bard, Cleric, Druid, Fighter, Monk, Paladin, Ranger, Rogue, Sorcerer, Warlock and Wizard. Use the levels at which that class already says "Subclass feature".

---------------------------------------------------------------------
SPECIES, BACKGROUNDS, FEATS
---------------------------------------------------------------------

"species": {
  "Emberkin": { "speed": 30, "traits": ["Darkvision (60 ft.)", "Kindled Blood: Resistance to Fire damage.", "Cinder Breath: Bonus Action, each creature in a 15-foot Cone makes a Dexterity saving throw."] }
}
Write senses exactly as "Darkvision (60 ft.)", "Blindsight (30 ft.)", "Tremorsense (30 ft.)" or "Truesight (30 ft.)" so the sheet picks them up.
If the species lets the player choose a skill proficiency, add "skillChoice": { "count": 1, "from": ["Insight", "Perception", "Survival"] }. Leave "from" empty for any skill.
If the species has a lineage, ancestry or legacy to choose from, add "lineage": { "label": "Ember Lineage", "options": { "Ashborn": { "traits": ["Ash Step: full text."] }, "Flameborn": { "traits": ["Flame Skin: full text."] } } }. What each option does goes in "abilities" with grantedBy type "lineage".

"backgrounds": {
  "Lamplighter": { "abilityScores": ["Dexterity", "Constitution", "Wisdom"], "feat": "Alert", "skills": ["Perception", "Stealth"], "tool": "Tinker's Tools" }
}
abilityScores is exactly three abilities, skills is exactly two skills, feat is an Origin Feat (add it under "feats" if it is new).

"feats": {
  "Stone's Patience": {
    "category": "General",
    "prerequisite": "Level 4+, Constitution 13+",
    "needs": { "level": 4, "score": { "abilities": ["Constitution"], "min": 13 } },
    "repeatable": false,
    "grants": {
      "ability": { "from": ["Constitution", "Wisdom"], "max": 20 },
      "skills": { "count": 1, "from": ["Insight", "Survival"], "tools": false },
      "spellChoices": [
        { "label": "Choose one Druid cantrip", "level": 0, "lists": ["Druid"], "count": 1 },
        { "label": "Choose one Level 1 Abjuration or Divination spell", "level": 1, "schools": ["Abjuration", "Divination"], "count": 1 }
      ]
    },
    "text": "Full text of the feat."
  }
}
Write every feat this way so the builder can place it and ask for its choices with dropdowns. A feat written as plain text ("Name": "Full text.") still loads, but it has no category, so it is offered in every feat slot and asks for nothing.
- category is "Origin", "General", "Fighting Style" or "Epic Boon". It decides where the feat is offered: Origin feats in the background's Origin Feat picker (and any trait that grants an Origin feat), General feats in the level 4, 8, 12, 16 and 19 slots, Fighting Style feats where a class grants a Fighting Style, Epic Boons at level 19. Origin feats are NOT listed in the level slots.
- prerequisite is the line shown to the player. needs is the same thing in a form the builder can check: "level" (the minimum character level), "score" (at least one of the listed abilities must be "min" or higher), "spellcasting": true (the character must be able to cast spells). Leave out what the feat does not require.
- repeatable is true only when the feat says it can be taken more than once.
- grants holds the choices the player makes when taking the feat. Leave out the parts the feat does not have.
  ability: the feat raises one ability score by 1. "from" lists the abilities the player may pick (leave it empty for any ability) and "max" is the highest the score can go (20, or 30 for an Epic Boon).
  skills: the player picks "count" proficiencies. "from" lists the skills allowed (leave it empty for any skill). "tools": true lets a pick be a tool instead.
  spellChoices: one entry for each "choose a spell" sentence in the feat. "level" is the exact spell level allowed, with 0 for a cantrip. "lists" are the class spell lists allowed (leave it out for any list). "schools" are the schools of magic allowed (leave it out for any school). "count" is how many to pick. The dropdown offers ONLY spells that match all of these, so copy the restriction exactly as the feat words it: "one cantrip" is level 0, "one level 1 spell" is level 1, never a range. If the feat lets the player pick from two different levels, write two entries. The spells picked are added to the sheet.
- Everything else the feat does (a bonus to a number, a use per rest, something to activate, a roll) goes in "abilities" with "grantedBy": { "type": "feat", "name": "Stone's Patience" }, exactly like a class feature.

---------------------------------------------------------------------
SPELLS AND ITEMS
---------------------------------------------------------------------

"spells": [
  { "name": "Ashen Grasp", "level": 2, "school": "Necromancy", "classes": ["Warden", "Warlock"], "castingTime": "Action", "range": "60 feet", "duration": "1 minute", "concentration": true, "ritual": false, "text": "Full spell text." }
]
level 0 is a cantrip. A spell a character casts in a fight also needs an entry in "abilities" (see below) with grantedBy type "spell".

"items": [
  { "name": "Lantern of the Deep", "rarity": "Rare", "type": "Wondrous Item", "attunement": true, "description": "Full item text." }
]
rarity is Common, Uncommon, Rare, Very Rare, Legendary or Artifact.

---------------------------------------------------------------------
ABILITIES: EVERYTHING A CHARACTER ACTIVATES
---------------------------------------------------------------------

This is the most important section. Every feature that changes a number, gives uses, offers a choice or can be used needs an entry here. Only pure text (a language, a ribbon) can be left out.

The Combat Resolver does this with each ability:
  1. The player picks it on their turn and picks a target (or it lands on themselves).
  2. The app reads the user's numbers AS THEY ARE AT THAT MOMENT to get the attack bonus, the save DC and the dice.
  3. If there is an attack roll, the user presses a button and the app rolls against the target's current Armor Class, counting every effect and condition on both creatures.
  4. If there is a saving throw, the TARGET's player (or the DM, for a monster) gets a Roll button. Nothing is rolled for them. The roll uses the target's current save bonus and everything affecting it.
  5. The result is applied: damage (after Resistance, Immunity, Vulnerability and Temporary Hit Points), then the conditions and effects for that result. A different result can apply something different (onFail and onSuccess).
  6. Durations start counting. A round of combat is 6 seconds. A Short Rest is 1 hour and a Long Rest is 8 hours. When the time runs out the condition or effect ends.
  7. Anything that recurs (a save repeated each turn) comes up again as a Roll button on the right turn, and a success ends it.

Each ability looks like this. Leave out any field that does not apply.

{
  "name": "Cinder Breath",
  "grantedBy": { "type": "species", "name": "Emberkin" },
  "activation": "bonus",
  "target": "creature",
  "roll": "save",
  "save": { "ability": "Dexterity", "dc": "8+PROF+CON" },
  "damage": [ { "dice": "2d6", "type": "Fire" } ],
  "halfOnSave": true,
  "onFail": {
    "conditions": [ { "name": "Blinded", "duration": { "amount": 1, "unit": "rounds" } } ]
  },
  "uses": { "max": "PROF", "recharge": "long" },
  "atLevel": { "5": { "damage": [ { "dice": "3d6", "type": "Fire" } ] }, "11": { "damage": [ { "dice": "4d6", "type": "Fire" } ] } },
  "text": "Full rules text of the feature."
}

grantedBy: who gets it.
  type is "class", "subclass", "species", "lineage", "background", "feat", "spell" or "item".
  name is the exact name of that class, subclass, species, lineage option, background, feat, spell or item.
  For type "lineage" also give "species": the species the lineage belongs to.
  level is the character level at which it is gained. Leave it out for level 1.
  A character gets the ability when their sheet has that option. A "spell" ability is granted when the spell is on their spell list. An "item" ability is granted when the item is on their sheet.

activation: "action", "bonus", "reaction" or "free".

target: "creature" (the user picks a target) or "self" (it lands on the user).
targets: how many creatures one use can affect. Leave it out for one. Give a number or a formula ("3", "MAX(1,CHA)") for "up to that many", or "any" for an area or "each creature of your choice". The user picks them all, one use is spent, the damage is rolled once and each target rolls its own save.

roll: what decides the result.
  "attack": the user rolls to hit the target's Armor Class. Needs "attack".
  "save": the target rolls a saving throw. Needs "save".
  "none": it just happens.

attack: { "bonus": "PROF+STR", "ranged": false }
  bonus is a formula (see FORMULAS). Use "SPELLATK" for a spell attack.
  ranged is true for a ranged attack, so the rules for a Prone target and for automatic Critical Hits apply correctly.
  weapon is true when the attack is made with a weapon, and twoHanded is true when that weapon is held in two hands, so feats such as Savage Attacker, Archery and Great Weapon Fighting apply to it.

save: { "ability": "Wisdom", "dc": "SPELLDC" }
  ability is the save the TARGET makes. dc is a formula, for example "SPELLDC", "8+PROF+CON" or 15.

damage: a list, one entry per damage type: { "dice": "1d8+STR", "type": "Slashing" }.
  dice is a dice formula (see FORMULAS). With roll "attack" it is dealt on a hit and the dice are doubled on a Critical Hit. With roll "save" it is dealt on a failed save. With roll "none" it is dealt automatically.
halfOnSave: true if a successful save still takes half damage.

heal: a dice formula for Hit Points restored, for example "1d10+LEVEL" or "2d4+SPELLMOD". With target "self" it heals the user.

RESULTS. Each of these holds "conditions" and "effects":
  "onHit": applied to the target when the attack hits.
  "onFail": applied to the target when it fails the save.
  "onSuccess": applied to the target when it succeeds on the save. Use this for the alternative result, such as a weaker effect on a success.
  "onUse": applied when there is no roll (roll "none"), to the target or to the user if target is "self".

A result can also give Temporary Hit Points: "onUse": { "tempHP": "1d8+WIS" }.

conditions: a list of
  { "name": "Frightened", "duration": { "amount": 1, "unit": "minutes" }, "repeatSave": { "when": "end", "turn": "target", "ability": "Wisdom" } }
  name is one of: Blinded, Charmed, Deafened, Frightened, Grappled, Incapacitated, Invisible, Paralyzed, Petrified, Poisoned, Prone, Restrained, Stunned, Unconscious.
  duration: amount and unit ("rounds", "minutes", "hours" or "days"). Leave it out if it lasts until something removes it. "Until the end of its next turn" is 1 round.
  repeatSave: include it when the text says the creature repeats the save.
    when is "start" or "end" (of the turn).
    turn is "target" (the affected creature's own turn) or "source" (the turn of whoever used the ability).
    ability is the save to repeat; leave it out to reuse the ability of the first save. The DC is the same DC.
  On a successful repeat the condition ends. Otherwise it ends when the duration runs out.

effects: a list of timed bonuses, penalties and riders. Give each a name (usually the ability's name), then only the fields it needs:
  "duration": { "amount": 1, "unit": "minutes" }   leave out for "until removed"
  "concentration": true                            ends on a Long Rest and is marked as Concentration
  "ac": 2                                          bonus or penalty to Armor Class
  "speed": 10                                      feet added to Speed (negative to reduce)
  "speedMultiplier": 2                             2 doubles Speed, 0.5 halves it
  "initiative": 2                                  bonus to Initiative
  "d20Tests": -2                                   flat modifier to every D20 Test
  "attackRolls": "1d4"                             dice or number added to attack rolls ("-1d4" to subtract)
  "savingThrows": "1d4"                            dice or number added to saving throws
  "advantageOnSaves": "Dexterity"                  Advantage on saves with that ability
  "saveModifier": { "ability": "Dexterity", "amount": -2 }   flat modifier to one ability's saves
  "checkDisadvantage": "Strength"                  Disadvantage on checks with that ability
  "checkBonus": { "skill": "Stealth", "dice": "1d4" }        dice added to one skill
  "attacksAgainstHaveAdvantage": true              attack rolls against the creature have Advantage
  "cannotBeInvisible": true                        it can't benefit from the Invisible condition
  "extraDamageFromUser": { "dice": "1d6", "type": "Force" }  the user deals this extra damage each time they hit the creature
  "immuneTo": "Frightened"                         immune to that condition while it lasts
  "reduceDamageType": "Fire"                       reduces that damage type by 1d4 once per turn
  "tempHPEachTurn": "CHA"                          formula: Temporary Hit Points at the start of each of its turns
  "resistDamage": ["Bludgeoning", "Piercing"]      Resistance to those damage types while it lasts
  "damageBonus": 2                                 formula: added to the damage of its weapon attacks and Unarmed Strikes
  "damageBonusFor": "Strength"                     only when the attack uses that ability
  "attackAdvantage": true                          Advantage on its attack rolls (or an ability name: only attacks using it)
  "attacksAgainstHaveDisadvantage": true           attack rolls against the creature have Disadvantage
  "spellSaveDC": 1                                 bonus to the save DC of its spells
  "spellAttackAdvantage": true                     Advantage on its spell attack rolls
  "inspirationDie": "d8"                           a die it can add to one failed roll (d4, d6, d8, d10 or d12)
  "sense": "Darkvision 60 ft."                     a sense it gains
  "movement": "Fly 60 ft. (hover)"                 a movement mode it gains
  "note": "Anything the app cannot apply by itself. It is shown to the table as a reminder."

uses: { "max": "PROF", "recharge": "short" }
  max is a formula for how many times it can be used. recharge is "short" (back on a Short or Long Rest) or "long" (back on a Long Rest). Leave uses out if it is unlimited or spends spell slots.
  To spend from a shared pool instead, write uses: { "pool": "Focus Points", "cost": 1 }. The pool itself is defined once with "resource" (see RESOURCES).
  If the use (or the spell slot) is only spent on one result, add "refundOn": "miss", "hit", "saveSuccess" or "saveFail". The app gives the use back when that result happens. For example, a feature that "isn't expended if the attack misses" has "refundOn": "miss".

feature: when one feature gives several things to use (Channel Divinity gives Divine Spark and Turn Undead), make one ability for each and set "feature" to the parent feature's name.

atLevel: changes at higher character levels. The key is the level, the value holds the fields to replace from that level on. The highest level reached wins.
  A value that changes at many levels can instead be written as a list of exactly 20 values, one for each level 1 to 20: "dice": ["1d6","1d6","1d6","1d6","1d8", ...].

---------------------------------------------------------------------
PASSIVE FEATURES: statics
---------------------------------------------------------------------

"statics" holds what a feature changes on the sheet all the time. An ability can have only statics (no activation at all):
{ "name": "Stone Skin", "grantedBy": { "type": "class", "name": "Warden" }, "statics": { "acBase": { "formula": "10+CON+WIS", "shield": true } } }

  "acBase": { "formula": "10+DEX+CON", "shield": true }   Armor Class while wearing no armor. shield false: not while using a Shield.
  "acBonus": { "formula": 1, "when": "armor" }            added to Armor Class. when: "armor", "noArmor", "noHeavy" or leave out for always.
  "speed": { "formula": 10, "when": "noHeavy" }           feet added to Speed. when: "noHeavy", "noArmor", "noArmorNoShield" or leave out.
  "speedBase": 35                                         replaces the species' Speed
  "hp": "LEVEL"                                           added to the Hit Point maximum
  "initiative": "PROF"                                    added to Initiative
  "scores": { "Strength": 4, "Constitution": 4 }          added to ability scores
  "saveProficiency": ["Wisdom", "Charisma"]               saving throw proficiencies, or "all"
  "saveBonus": "MAX(1,CHA)"                               added to every saving throw
  "saveAdvantage": ["Dexterity"]                          Advantage on saves with those abilities
  "conditionAdvantage": ["Charmed"]                       Advantage on saves to avoid or end those conditions
  "conditionImmune": ["Frightened"]                       immune to those conditions
  "resist": ["Poison"]                                    Resistance to those damage types
  "senses": ["Darkvision 120 ft."]                        senses
  "halfProficiency": true                                 half Proficiency Bonus on skills it lacks proficiency in
  "skillPicks": { "class": 1, "any": 3 }                  more skill proficiencies to choose: from the class list, or from any skill
  "skillBonus": { "skills": ["Arcana"], "formula": "MAX(1,WIS)" }   a bonus to those skills
  "spells": { "1": ["Bless"], "5": ["Revivify"] }         spells always prepared from that level (they don't count against the limit)
  "cantripBonus": 1                                       more cantrips known
  "cantripDamage": "WIS"                                  added to the damage of its cantrips
  "schoolDamage": { "school": "Evocation", "formula": "INT" }       added to the damage of spells of that school
  "weaponDamage": { "dice": "1d8", "type": "Radiant", "when": "melee" }   extra damage on every hit. when: "melee", "weapon" or "all".
  "weaponMasteries": 2                                    how many kinds of weapons it can use the mastery property of (a list of 20 for a number that grows)
  "unarmedDie": 6                                         its Unarmed Strike rolls this die (a list of 20 for a die that grows)
  "unarmedDexterity": true                                Unarmed Strikes can use Dexterity
  "passives": { ... }                                     standing combat rules, below

passives the Combat Resolver applies:
  "attacks": 2                 attacks made with the Attack action (shown as a reminder)
  "criticalOn": 19             weapon attacks and Unarmed Strikes score a Critical Hit on this roll or higher
  "sneakAttackDice": 3         d6s added once per turn to a hit with a Finesse or Ranged weapon
  "evasion": true              a Dexterity save for half damage: none on a success, half on a failure
  "initiativeAdvantage": true  Advantage on Initiative (shown as a reminder)
  "discipleOfLife": true       healing spells cast with a slot restore 2 + the slot's level more
  "supremeHealing": true       healing dice count as their highest number
  "potentCantrip": true        a damaging cantrip still deals half damage on a miss or a successful save

---------------------------------------------------------------------
RESOURCES: pools of uses
---------------------------------------------------------------------

When several features spend the same uses, or the number of uses is its own feature, define the pool once:
{ "name": "Warden's Resolve", "grantedBy": { "type": "class", "name": "Warden", "level": 2 },
  "resource": { "name": "Resolve Points", "max": "LEVEL", "recharge": "short" } }

  max is a formula, or a list of 20 numbers taken from the class table.
  recharge is "short" or "long". For "regain one use on a Short Rest and all on a Long Rest" write "recharge": "long", "shortRegain": 1.
Each feature that spends from it uses: { "pool": "Resolve Points", "cost": 1 }. The Combat Resolver shows the pool, takes the cost when the feature is used, blocks it when the pool is too low, and refills it on the right rest.

---------------------------------------------------------------------
CHOICES INSIDE A FEATURE: options
---------------------------------------------------------------------

When the player picks one of several options, list them. Each choice is written like an ability (statics, activation and so on) and takes effect only when picked:
{ "name": "Warden's Path", "grantedBy": { "type": "class", "name": "Warden", "level": 3 },
  "options": { "label": "Warden's Path", "choices": [
    { "name": "Bulwark", "statics": { "acBonus": { "formula": 1 } } },
    { "name": "Avenger", "activation": "reaction", "target": "creature", "roll": "none", "damage": [ { "dice": "1d8", "type": "Force" } ] } ] } }
The builder shows a dropdown for the choice on the Features tab.
If the choice can be changed after a rest, add "changeOn": "short" (a Short or Long Rest) or "changeOn": "long" (a Long Rest only) inside "options". The builder's rest window then lists it as something the player can change.

text: the full rules text, copied as written. It is shown in the combat log.

---------------------------------------------------------------------
FORMULAS
---------------------------------------------------------------------

A formula is a number or a sum using these words, in capitals:
  STR DEX CON INT WIS CHA    the user's ability modifier
  PROF                       the user's Proficiency Bonus
  LEVEL                      the user's character level
  SPELLMOD                   the user's spellcasting ability modifier
  SPELLDC                    the user's spell save DC
  SPELLATK                   the user's spell attack bonus
You can use + - * / and brackets. Division rounds down. MAX(a,b) gives the larger and MIN(a,b) the smaller, for rules such as "minimum of 1". Examples: "8+PROF+WIS", "LEVEL*5", "(LEVEL+1)/2", "MAX(1,CHA)".

A dice formula adds dice, written with a small letter d: "2d6", "1d8+STR", "1d10+LEVEL". The number of dice can itself be a formula in brackets: "(LEVEL+1)/2d6" means that many d6.

Never write the finished number for something that depends on the character. Write the formula, so the app works it out from each character's current numbers.

---------------------------------------------------------------------

function cleanCode(s) { return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12); }
function makeCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
}
function currentPlayerCode() {

  {name:"Adamantine Armor",rarity:"Uncommon",type:"Armor (medium or heavy, not hide)",attunement:false,description:"This suit of armor is reinforced with adamantine, one of the hardest substances in existence. While you're wearing it, any critical hit against you becomes a normal hit."},
