  if (!cls) return [];
  return Object.entries(cls.features)
    .filter(([lvl, feats]) => feats.some(f => f.includes("Ability Score Improvement")))
    .map(([lvl]) => parseInt(lvl));
}

function getFeaturesUpToLevel(className, subclassName, level) {
  const cls = CLASSES[className];
  if (!cls) return [];
  const out = [];
  for (let l = 1; l <= level; l++) {
    (cls.features[l] || []).forEach(f => {
      if (f === "—") return;
      if (f === "Subclass feature" && subclassName) {
        const subFeats = (cls.subclasses[subclassName] || {})[l];
        if (subFeats) subFeats.forEach(sf => out.push({ level: l, text: sf, source: "Subclass" }));
      } else if (f !== "Subclass feature") {
        out.push({ level: l, text: f, source: "Class" });
      }
    });
  }
  return out;
}

function getSpellSlots(className, level) {
  const cls = CLASSES[className];
  if (!cls || !cls.casterType) return null;
  if (cls.casterType === "full") return FULL_CASTER_SLOTS[level] || [];
  if (cls.casterType === "half") return HALF_CASTER_SLOTS[level] || [];
  if (cls.casterType === "pact") return null; // handled separately
  return null;
}

/* ============ MAIN COMPONENT ============ */
function CharacterSheet() {
  const [tab, setTab] = useState("identity");

  // Identity
  const [charName, setCharName] = useState("");
  const [playerName, setPlayerName] = useState("");
  const [className, setClassName] = useState("Fighter");
  const [subclassName, setSubclassName] = useState("");
  const [level, setLevel] = useState(1);
  const [species, setSpecies] = useState("Human");
  const [background, setBackground] = useState("Soldier");
  const [alignment, setAlignment] = useState("");

  // Point buy: base scores before racial/background bonuses
  const [pointBuy, setPointBuy] = useState({Strength:8,Dexterity:8,Constitution:8,Intelligence:8,Wisdom:8,Charisma:8});
  // Manual ability score increase allocation from background (2 picks: +2/+1 or +1/+1/+1)
  const [bgBonusMode, setBgBonusMode] = useState("2-1"); // "2-1" or "1-1-1"
  const [bgBonusChoices, setBgBonusChoices] = useState([]); // array of ability names

  // Skills
  const [skillProfs, setSkillProfs] = useState([]);
  const [skillExpertise, setSkillExpertise] = useState([]);

  // ASI / Feat choices made at ASI levels: { level: {type:"asi", abilities:[a,b]} or {type:"feat", name:""} }
  const [asiChoices, setAsiChoices] = useState({});

  // Combat
  const [currentHp, setCurrentHp] = useState(null);
  const [tempHp, setTempHp] = useState(0);
  const [hitDiceUsed, setHitDiceUsed] = useState(0);

  // Equipment / notes
  const [equipment, setEquipment] = useState("");
  const [notes, setNotes] = useState("");

  // Magic Items tab state
  const [itemSearch, setItemSearch] = useState("");
  const [itemRarityFilter, setItemRarityFilter] = useState("All");
  const [itemTypeFilter, setItemTypeFilter] = useState("All");
  const [itemAttunementFilter, setItemAttunementFilter] = useState("All");
  const [selectedItem, setSelectedItem] = useState(null);
  const [characterItems, setCharacterItems] = useState([]);

  // Mundane Items tab state
  const [mundaneSearch, setMundaneSearch] = useState("");
  const [mundaneTypeFilter, setMundaneTypeFilter] = useState("All");
  const [selectedMundane, setSelectedMundane] = useState(null);

  // Pinned important items shown on identity/front page (both magic + mundane)
  const [pinnedItems, setPinnedItems] = useState([]);

  // Spell list (kept here so it is saved with the character)
  const [spells, setSpells] = useState([""]);

  // Player code + saving on this computer
  const [playerCode, setPlayerCode] = useState(currentPlayerCode);
  const [codeInput, setCodeInput] = useState("");
  const [ready, setReady] = useState(false);

  const cls = CLASSES[className];
  const profBonus = PROF_BONUS[level - 1];
  const pointBuyTotal = Object.values(pointBuy).reduce((sum, v) => sum + (POINT_BUY_COSTS[v] || 0), 0);
  const pointBuyRemaining = 27 - pointBuyTotal;

  // Compute background ability bonuses
  const bgBonuses = useMemo(() => {
    const out = {};
    if (bgBonusMode === "2-1" && bgBonusChoices.length === 2) {
      out[bgBonusChoices[0]] = (out[bgBonusChoices[0]] || 0) + 2;
      out[bgBonusChoices[1]] = (out[bgBonusChoices[1]] || 0) + 1;
    } else if (bgBonusMode === "1-1-1" && bgBonusChoices.length === 3) {
      bgBonusChoices.forEach(a => { out[a] = (out[a] || 0) + 1; });
    }
    return out;
  }, [bgBonusMode, bgBonusChoices]);

  // ASI bonuses from leveling
  const asiBonuses = useMemo(() => {
    const out = {};
    Object.values(asiChoices).forEach(choice => {
      if (choice && choice.type === "asi" && choice.abilities) {
        choice.abilities.forEach(a => { if (a) out[a] = (out[a] || 0) + 1; });
      }
    });
    return out;
  }, [asiChoices]);

  const finalScores = useMemo(() => {
    const out = {};
    ABILITIES.forEach(a => {
      out[a] = pointBuy[a] + (bgBonuses[a] || 0) + (asiBonuses[a] || 0);
    });
    return out;
  }, [pointBuy, bgBonuses, asiBonuses]);

  const finalMods = useMemo(() => {
    const out = {};
    ABILITIES.forEach(a => { out[a] = mod(finalScores[a]); });
    return out;
  }, [finalScores]);

  const maxHp = useMemo(() => {
    if (!cls) return 0;
    const conMod = finalMods.Constitution;
    let hp = cls.hitDie + conMod; // level 1: max die
    for (let l = 2; l <= level; l++) {
      hp += Math.floor(cls.hitDie / 2) + 1 + conMod; // average roll for subsequent levels
    }
    return Math.max(hp, level); // minimum 1 per level
  }, [cls, level, finalMods.Constitution]);

  const availableAsiLevels = useMemo(() => abilityScoreImprovementLevels(className), [className]);
  const reachedAsiLevels = availableAsiLevels.filter(l => l <= level);

  const featureLedger = useMemo(() => {
    const entries = [];
    // Species traits
    if (SPECIES[species]) {
      SPECIES[species].traits.forEach(t => entries.push({ level: 1, text: t, source: "Species" }));
    }
    // Background
    if (BACKGROUNDS[background]) {
      const bg = BACKGROUNDS[background];
      entries.push({ level: 1, text: `Origin Feat: ${bg.feat} — ${ORIGIN_FEATS[bg.feat] || ""}`, source: "Background" });
      entries.push({ level: 1, text: `Tool Proficiency: ${bg.tool}`, source: "Background" });
    }
    // Class + subclass features
    entries.push(...getFeaturesUpToLevel(className, subclassName, level));
    // ASI/Feat choices
    Object.entries(asiChoices).forEach(([lvl, choice]) => {
      if (parseInt(lvl) > level || !choice) return;
      if (choice.type === "asi" && choice.abilities && choice.abilities.filter(Boolean).length) {
        entries.push({ level: parseInt(lvl), text: `Ability Score Improvement: ${choice.abilities.filter(Boolean).map(a => ABBR[a]).join(", ")}`, source: "ASI" });
      } else if (choice.type === "feat" && choice.name) {
        entries.push({ level: parseInt(lvl), text: `Feat: ${choice.name}`, source: "Feat" });
      }
    });
    return entries.sort((a, b) => a.level - b.level);
  }, [species, background, className, subclassName, level, asiChoices]);

  const savingThrows = useMemo(() => {
    const out = {};
    ABILITIES.forEach(a => {
      const isProf = cls && cls.saves.includes(a);
      out[a] = finalMods[a] + (isProf ? profBonus : 0);
    });
    return out;
  }, [cls, finalMods, profBonus]);

  const skillMods = useMemo(() => {
    const out = {};
    ALL_SKILLS.forEach(skill => {
      const ability = SKILL_ABILITY[skill];
      let bonus = finalMods[ability];
      if (skillExpertise.includes(skill)) bonus += profBonus * 2;
      else if (skillProfs.includes(skill)) bonus += profBonus;
      out[skill] = bonus;
    });
    return out;
  }, [finalMods, skillProfs, skillExpertise, profBonus]);

  const initiative = finalMods.Dexterity;
  const armorClass = 10 + finalMods.Dexterity; // base unarmored; user can override mentally
  const passivePerception = 10 + skillMods.Perception;
  const speed = SPECIES[species] ? SPECIES[species].speed : 30;

  const effectiveMaxHp = maxHp;
  const displayHp = currentHp === null ? effectiveMaxHp : currentHp;

  function updatePointBuy(ability, newVal) {
    const cost = POINT_BUY_COSTS[newVal];
    if (cost === undefined) return;
    const otherTotal = pointBuyTotal - POINT_BUY_COSTS[pointBuy[ability]];
    if (otherTotal + cost > 27) return; // prevent overspend
    setPointBuy(prev => ({ ...prev, [ability]: newVal }));
  }

  function toggleSkillProf(skill) {
    setSkillProfs(prev => {
      if (prev.includes(skill)) {
        setSkillExpertise(e => e.filter(s => s !== skill));
        return prev.filter(s => s !== skill);
      }
      if (prev.length >= cls.skillChoices) return prev;
      return [...prev, skill];
    });
  }

  function toggleExpertise(skill) {
    if (!skillProfs.includes(skill)) return;
    setSkillExpertise(prev => prev.includes(skill) ? prev.filter(s => s !== skill) : [...prev, skill]);
  }

  function setAsiAbilities(lvl, idx, ability) {
    setAsiChoices(prev => {
      const existing = prev[lvl] || { type: "asi", abilities: [null, null] };
      const abilities = [...(existing.abilities || [null, null])];
      abilities[idx] = ability;
      return { ...prev, [lvl]: { type: "asi", abilities } };
    });
  }

  function setAsiType(lvl, type) {
    setAsiChoices(prev => ({ ...prev, [lvl]: type === "asi" ? { type: "asi", abilities: [null, null] } : { type: "feat", name: "" } }));
  }

  function setFeatName(lvl, name) {
    setAsiChoices(prev => ({ ...prev, [lvl]: { type: "feat", name } }));
  }

  /* ============ CHARACTER FILE (save / load / send to Combat Resolver) ============ */
  const fileInputRef = useRef(null);
  const inSuite = window.parent !== window;

  function buildCharacterFile() {
    return {
      format: "homebrew-academy-character",
      version: 2,
      name: charName, player: playerName,
      className, subclassName, level, species, background, alignment,
      scores: finalScores, saves: savingThrows, profBonus,
      maxHP: effectiveMaxHp, currentHP: displayHp, tempHP: tempHp,
      ac: armorClass, initiativeBonus: initiative, speed,
      features: featureLedger.map(f => f.text),
      spells: spells.filter(Boolean),
      builder: { pointBuy, bgBonusMode, bgBonusChoices, skillProfs, skillExpertise, asiChoices, currentHp, tempHp, hitDiceUsed, equipment, notes, characterItems, pinnedItems, spells }
    };
  }

  function saveCharacterFile() {
    const blob = new Blob([JSON.stringify(buildCharacterFile(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = ((charName || "character").trim().replace(/[^\w\- ]+/g, "").replace(/\s+/g, "-") || "character") + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function applyCharacterFile(data) {
    if (!data || data.format !== "homebrew-academy-character") { alert("That file is not a Character Builder save."); return; }
    const s = data.builder || {};
    const arr = (v) => Array.isArray(v) ? v : [];
    setCharName(String(data.name || ""));
    setPlayerName(String(data.player || ""));
    setClassName(CLASSES[data.className] ? data.className : "Fighter");
    setSubclassName(String(data.subclassName || ""));
    setLevel(Math.max(1, Math.min(20, parseInt(data.level) || 1)));
    setSpecies(SPECIES[data.species] ? data.species : "Human");
    setBackground(BACKGROUNDS[data.background] ? data.background : "Soldier");
    setAlignment(String(data.alignment || ""));
    const pb = {};
    ABILITIES.forEach(a => { const v = parseInt((s.pointBuy || {})[a]); pb[a] = POINT_BUY_COSTS[v] !== undefined ? v : 8; });
    setPointBuy(pb);
    setBgBonusMode(s.bgBonusMode === "1-1-1" ? "1-1-1" : "2-1");
    setBgBonusChoices(arr(s.bgBonusChoices).filter(a => ABILITIES.includes(a)));
    setSkillProfs(arr(s.skillProfs).filter(k => ALL_SKILLS.includes(k)));
    setSkillExpertise(arr(s.skillExpertise).filter(k => ALL_SKILLS.includes(k)));
    setAsiChoices(s.asiChoices && typeof s.asiChoices === "object" ? s.asiChoices : {});
    setCurrentHp(typeof s.currentHp === "number" ? s.currentHp : null);
    setTempHp(parseInt(s.tempHp) || 0);
    setHitDiceUsed(parseInt(s.hitDiceUsed) || 0);
    setEquipment(String(s.equipment || ""));
    setNotes(String(s.notes || ""));
    setCharacterItems(arr(s.characterItems));
    setPinnedItems(arr(s.pinnedItems).filter(p => p && p.name));
    const sp = arr(s.spells).map(x => String(x));
    setSpells(sp.length ? sp : [""]);
  }

  function onPickFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    file.text().then(t => applyCharacterFile(JSON.parse(t))).catch(() => alert("Could not read that character file."));
  }

  function sendToResolver() {
    window.parent.postMessage({ type: "hba-character", character: buildCharacterFile() }, window.location.origin);
  }

  /* ============ PLAYER CODE: open the sheet saved on this computer under a code ============ */
  function openPlayerCode(codeRaw, remember) {
    const code = cleanCode(codeRaw);
    if (!code) return;
    if (remember !== false) lsSet(CODE_KEY, code);
    applyCharacterFile(readStoredCharacter(code) || { format: "homebrew-academy-character" });
    setPlayerCode(code);
    setCodeInput("");
  }

  // First load: open whatever is saved under this computer's player code.
  useEffect(() => {
    const stored = readStoredCharacter(playerCode);
    if (stored) applyCharacterFile(stored);
    setReady(true);
  }, []);

  // Every change is saved on this computer under the player code.
  useEffect(() => {
    if (!ready) return;
    lsSet(charKey(playerCode), JSON.stringify(buildCharacterFile()));
  });

  // The Combat Resolver on this computer reports HP changes back, and can switch the player code.
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key === CODE_KEY && e.newValue && cleanCode(e.newValue) !== playerCode) openPlayerCode(e.newValue, false);
      if (e.key === charKey(playerCode) && e.newValue) {
        try { const d = JSON.parse(e.newValue); if (d && d.builder && typeof d.builder.currentHp === "number") setCurrentHp(d.builder.currentHp); } catch (err) {}
      }
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, [playerCode]);

  /* ============ STYLES ============ */
  const colors = {
    ink: "#1B2430",
    inkLight: "#2B3648",
    parchment: "#EDE4D3",
    parchmentDark: "#DDD0B5",
    brass: "#B8860B",
    brassLight: "#D4A017",
    blood: "#7A2E2E",
    bloodLight: "#9C4444"
  };

  const fontDisplay = "'Cinzel', 'Times New Roman', serif";
  const fontBody = "'Crimson Text', 'Georgia', serif";

  return (
    <div style={{
      fontFamily: fontBody,
      background: `linear-gradient(180deg, ${colors.ink} 0%, ${colors.inkLight} 100%)`,
      minHeight: "100vh",
      color: colors.parchment,
      padding: "0",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        * { box-sizing: border-box; }
        ::selection { background: ${colors.brass}; color: ${colors.ink}; }
        input, select, textarea {
          font-family: ${fontBody};
        }
        input:focus, select:focus, textarea:focus {
          outline: 2px solid ${colors.brass};
          outline-offset: 1px;
        }
        .tab-btn:focus-visible, button:focus-visible {
          outline: 2px solid ${colors.brassLight};
          outline-offset: 2px;
        }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
        @media (max-width: 640px) {
          .header-stats { flex-wrap: wrap !important; }
          .two-col { grid-template-columns: 1fr !important; }
        }
      `}</style>

      {/* HEADER */}
      <div style={{
        background: `linear-gradient(180deg, ${colors.brass} 0%, #8B6508 100%)`,
        borderBottom: `3px solid ${colors.ink}`,
        padding: "20px 24px 16px",
      }}>
        <div style={{ maxWidth: 980, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8 }}>
            <input
              value={charName}
              onChange={e => setCharName(e.target.value)}
              placeholder="Character Name"
              style={{
                fontFamily: fontDisplay, fontWeight: 700, fontSize: "clamp(22px, 4vw, 32px)",
                background: "transparent", border: "none", borderBottom: `2px solid ${colors.ink}55`,
                color: colors.ink, padding: "4px 2px", flex: "1 1 280px", minWidth: 0,
              }}
            />
            <input
              value={playerName}
              onChange={e => setPlayerName(e.target.value)}
              placeholder="Player name"
              style={{
                fontFamily: fontBody, fontStyle: "italic", fontSize: 14,
                background: "transparent", border: "none", borderBottom: `1px solid ${colors.ink}55`,
                color: colors.ink, padding: "4px 2px", width: 160,
              }}
            />
          </div>
          <div style={{ fontSize: 14, color: colors.ink, marginTop: 6, fontWeight: 600 }}>
            Level {level} {species} {className}{subclassName ? ` (${subclassName})` : ""} · {background}
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10, alignItems: "center" }}>
            {[
              ["Save Character File", saveCharacterFile, true],
              ["Load Character File", () => fileInputRef.current && fileInputRef.current.click(), true],
              ["Send to Combat Resolver", sendToResolver, inSuite],
            ].filter(x => x[2]).map(([label, fn]) => (
              <button key={label} onClick={fn} style={{
                background: colors.ink, color: colors.parchment, border: `1px solid ${colors.ink}`, borderRadius: 6,
                padding: "6px 12px", fontFamily: fontDisplay, fontSize: 12, fontWeight: 600, cursor: "pointer"
              }}>{label}</button>
            ))}
            <input ref={fileInputRef} type="file" accept=".json,application/json" onChange={onPickFile} style={{ display: "none" }} />
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10, alignItems: "center", fontSize: 13, color: colors.ink }}>
            <span>Player code: <strong data-testid="player-code" style={{ fontFamily: fontDisplay, letterSpacing: "0.15em" }}>{playerCode}</strong></span>
            <input value={codeInput} onChange={e => setCodeInput(cleanCode(e.target.value))} placeholder="Enter a code" maxLength={12}
              onKeyDown={e => { if (e.key === "Enter") openPlayerCode(codeInput); }}
              style={{ width: 120, background: "transparent", border: "none", borderBottom: `1px solid ${colors.ink}88`, color: colors.ink, padding: "3px 2px", textTransform: "uppercase" }} />
            {[["Open Sheet", () => openPlayerCode(codeInput), !codeInput], ["New Player Code", () => openPlayerCode(makeCode()), false]].map(([label, fn, off]) => (
              <button key={label} onClick={fn} disabled={off} style={{
                background: "transparent", color: colors.ink, border: `1px solid ${colors.ink}`, borderRadius: 6, opacity: off ? 0.5 : 1,
                padding: "4px 10px", fontFamily: fontDisplay, fontSize: 11, fontWeight: 600, cursor: off ? "default" : "pointer"
              }}>{label}</button>
            ))}
            <span style={{ fontStyle: "italic", opacity: 0.85 }}>This sheet saves itself on this computer under your code.</span>
          </div>
        </div>
      </div>

      {/* CORE STAT BAR */}
      <div className="header-stats" style={{
        display: "flex", gap: 10, padding: "14px 16px", justifyContent: "center", flexWrap: "wrap",
        background: colors.ink, borderBottom: `1px solid ${colors.brass}55`
      }}>
        {[
          ["AC", armorClass],
          ["Initiative", fmt(initiative)],
          ["Speed", `${speed} ft`],
          ["HP", `${displayHp}/${effectiveMaxHp}`],
          ["Prof Bonus", fmt(profBonus)],
          ["Passive Perception", passivePerception],
        ].map(([label, val]) => (
          <div key={label} style={{
            background: colors.inkLight, border: `1px solid ${colors.brass}66`, borderRadius: 6,
            padding: "8px 14px", textAlign: "center", minWidth: 86
          }}>
            <div style={{ fontFamily: fontDisplay, fontSize: 20, fontWeight: 700, color: colors.brassLight }}>{val}</div>
            <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", opacity: 0.8 }}>{label}</div>
          </div>
        ))}
      </div>

      {/* TABS */}
      <div style={{
        display: "flex", justifyContent: "center", gap: 2, background: colors.inkLight,
        padding: "0 8px", borderBottom: `2px solid ${colors.brass}`, overflowX: "auto"
      }}>
        {[
          ["identity", "Identity"],
          ["abilities", "Abilities"],
          ["skills", "Skills & Saves"],
          ["combat", "Combat"],
          ["features", "Features"],
          ["spells", "Spellcasting"],
          ["notes", "Equipment & Notes"],
          ["magic", "✦ Magic Items"],
          ["mundane", "⚔ Mundane Items"],
        ].map(([key, label]) => (
          <button
            key={key}
            className="tab-btn"
            onClick={() => setTab(key)}
            style={{
              background: tab === key ? colors.brass : "transparent",
              color: tab === key ? colors.ink : colors.parchment,
              border: "none", padding: "10px 16px", fontFamily: fontDisplay, fontSize: 13,
              fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", borderRadius: "6px 6px 0 0",
              transition: "background 0.15s"
            }}
          >
            {label}
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{ maxWidth: 980, margin: "0 auto", padding: "24px 16px 60px" }}>
        {tab === "identity" && (
          <IdentityTab {...{ className, setClassName, subclassName, setSubclassName, level, setLevel, species, setSpecies, background, setBackground, alignment, setAlignment, cls, colors, fontDisplay, bgBonusMode, setBgBonusMode, bgBonusChoices, setBgBonusChoices, pinnedItems, setPinnedItems }} />
        )}
        {tab === "abilities" && (
          <AbilitiesTab {...{ pointBuy, updatePointBuy, pointBuyRemaining, finalScores, finalMods, bgBonuses, asiBonuses, colors, fontDisplay }} />
        )}
        {tab === "skills" && (
          <SkillsTab {...{ cls, skillProfs, toggleSkillProf, skillExpertise, toggleExpertise, skillMods, savingThrows, finalMods, profBonus, colors, fontDisplay }} />
        )}
        {tab === "combat" && (
          <CombatTab {...{ cls, level, effectiveMaxHp, currentHp, setCurrentHp, tempHp, setTempHp, hitDiceUsed, setHitDiceUsed, finalMods, armorClass, initiative, speed, colors, fontDisplay }} />
        )}
        {tab === "features" && (
          <FeaturesTab {...{ featureLedger, reachedAsiLevels, asiChoices, setAsiAbilities, setAsiType, setFeatName, colors, fontDisplay }} />
        )}
        {tab === "spells" && (
          <SpellsTab {...{ cls, className, level, finalMods, profBonus, colors, fontDisplay, spells, setSpells }} />
        )}
        {tab === "notes" && (
          <NotesTab {...{ equipment, setEquipment, notes, setNotes, colors, fontDisplay }} />
        )}
        {tab === "magic" && (
          <MagicItemsTab {...{ itemSearch, setItemSearch, itemRarityFilter, setItemRarityFilter, itemTypeFilter, setItemTypeFilter, itemAttunementFilter, setItemAttunementFilter, selectedItem, setSelectedItem, characterItems, setCharacterItems, pinnedItems, setPinnedItems, colors, fontDisplay }} />
        )}
        {tab === "mundane" && (
          <MundaneItemsTab {...{ mundaneSearch, setMundaneSearch, mundaneTypeFilter, setMundaneTypeFilter, selectedMundane, setSelectedMundane, pinnedItems, setPinnedItems, colors, fontDisplay }} />
        )}
      </div>
    </div>
  );
}

/* ============ TAB COMPONENTS ============ */

function Section({ title, colors, fontDisplay, children }) {
  return (
    <div style={{ marginBottom: 24 }}>
      <h3 style={{
        fontFamily: fontDisplay, color: colors.brassLight, fontSize: 16, letterSpacing: "0.04em",
        textTransform: "uppercase", borderBottom: `1px solid ${colors.brass}55`, paddingBottom: 8, marginBottom: 14
      }}>{title}</h3>
      {children}
    </div>
  );
}

function fieldStyle(colors) {
  return {
    width: "100%", background: colors.inkLight, border: `1px solid ${colors.brass}55`,
    borderRadius: 6, color: colors.parchment, padding: "8px 10px", fontSize: 15
  };
}

function IdentityTab({ className, setClassName, subclassName, setSubclassName, level, setLevel, species, setSpecies, background, setBackground, alignment, setAlignment, cls, colors, fontDisplay, bgBonusMode, setBgBonusMode, bgBonusChoices, setBgBonusChoices, pinnedItems, setPinnedItems }) {
  const bg = BACKGROUNDS[background];
  const subclassLevel = cls.subclassLevel;
  const hasSubclassYet = level >= subclassLevel;

  function handleBonusChoice(idx, ability) {
    setBgBonusChoices(prev => {
      const next = [...prev];
      next[idx] = ability;
      return next;
    });
  }

  const numChoices = bgBonusMode === "2-1" ? 2 : 3;

  return (
    <div>
      <Section title="Class & Level" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "2fr 2fr 1fr", gap: 12 }} className="two-col">
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>Class</label>
            <select value={className} onChange={e => { setClassName(e.target.value); setSubclassName(""); }} style={fieldStyle(colors)}>
              {Object.keys(CLASSES).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>{cls.subclassName} {hasSubclassYet ? "" : `(at level ${subclassLevel})`}</label>
            <select value={subclassName} onChange={e => setSubclassName(e.target.value)} disabled={!hasSubclassYet} style={{ ...fieldStyle(colors), opacity: hasSubclassYet ? 1 : 0.5 }}>
              <option value="">— none yet —</option>
              {Object.keys(cls.subclasses).map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>Level</label>
            <input type="number" min={1} max={20} value={level} onChange={e => setLevel(Math.max(1, Math.min(20, parseInt(e.target.value) || 1)))} style={fieldStyle(colors)} />
          </div>
        </div>
        <div style={{ marginTop: 12, fontSize: 13, opacity: 0.85, lineHeight: 1.6 }}>
          <strong>Hit Die:</strong> d{cls.hitDie} &nbsp; <strong>Primary:</strong> {cls.primaryAbility} &nbsp; <strong>Saves:</strong> {cls.saves.map(s => ABBR[s]).join(", ")}<br/>
          <strong>Armor:</strong> {cls.armorProf} &nbsp; <strong>Weapons:</strong> {cls.weaponProf}
        </div>
      </Section>

      <Section title="Species & Background" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }} className="two-col">
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>Species</label>
            <select value={species} onChange={e => setSpecies(e.target.value)} style={fieldStyle(colors)}>
              {Object.keys(SPECIES).map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>Background</label>
            <select value={background} onChange={e => { setBackground(e.target.value); setBgBonusChoices([]); }} style={fieldStyle(colors)}>
              {Object.keys(BACKGROUNDS).map(b => <option key={b} value={b}>{b}</option>)}
            </select>
          </div>
        </div>

        <div style={{ marginTop: 14, background: colors.inkLight, border: `1px solid ${colors.brass}40`, borderRadius: 8, padding: 14 }}>
          <div style={{ fontSize: 13, marginBottom: 10 }}>
            <strong>{background}</strong> grants ability score increases from: {bg.abilityScores.join(", ")}
          </div>
          <div style={{ display: "flex", gap: 16, marginBottom: 10, fontSize: 13 }}>
            <label><input type="radio" checked={bgBonusMode === "2-1"} onChange={() => { setBgBonusMode("2-1"); setBgBonusChoices([]); }} /> +2 / +1</label>
            <label><input type="radio" checked={bgBonusMode === "1-1-1"} onChange={() => { setBgBonusMode("1-1-1"); setBgBonusChoices([]); }} /> +1 / +1 / +1</label>
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {Array.from({ length: numChoices }).map((_, idx) => (
              <select key={idx} value={bgBonusChoices[idx] || ""} onChange={e => handleBonusChoice(idx, e.target.value)} style={{ ...fieldStyle(colors), width: 160 }}>
                <option value="">{bgBonusMode === "2-1" ? `${idx === 0 ? "+2 to..." : "+1 to..."}` : "+1 to..."}</option>
                {bg.abilityScores.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            ))}
          </div>
          <div style={{ marginTop: 10, fontSize: 13, opacity: 0.85 }}>
            <strong>Origin Feat:</strong> {bg.feat}<br/>
            <strong>Skill Proficiencies:</strong> {bg.skills.join(", ")}<br/>
            <strong>Tool Proficiency:</strong> {bg.tool}
          </div>
        </div>
      </Section>

      <Section title="Alignment" colors={colors} fontDisplay={fontDisplay}>
        <input value={alignment} onChange={e => setAlignment(e.target.value)} placeholder="e.g. Neutral Good" style={{ ...fieldStyle(colors), maxWidth: 260 }} />
      </Section>

      <Section title="Important Items" colors={colors} fontDisplay={fontDisplay}>
        {pinnedItems.length === 0 ? (
          <div style={{ color: colors.parchment + "55", fontSize: 14, fontFamily: "'Crimson Text','Georgia',serif", fontStyle: "italic" }}>
            No important items yet — add them from the Magic Items or Mundane Items tabs.
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {pinnedItems.map(item => {
              const isMagic = item.rarity !== undefined;
              const dotColor = isMagic ? RARITY_COLORS[item.rarity] : colors.parchment + "99";
              return (
                <PinnedItemRow key={item.name} item={item} isMagic={isMagic} dotColor={dotColor} onRemove={() => setPinnedItems(prev => prev.filter(p => p.name !== item.name))} colors={colors} fontDisplay={fontDisplay} />
              );
            })}
          </div>
        )}
      </Section>
    </div>
  );
}

function PinnedItemRow({ item, isMagic, dotColor, onRemove, colors }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        display: "flex", alignItems: "center", gap: 10, padding: "7px 12px",
        borderRadius: 6, background: hovered ? colors.blood + "22" : colors.inkLight,
        border: `1px solid ${hovered ? colors.blood + "66" : colors.brass + "22"}`,
        transition: "background 0.15s, border-color 0.15s", cursor: "default"
      }}
    >
      <span style={{ width: 9, height: 9, borderRadius: "50%", background: dotColor, flexShrink: 0 }} />
      <span style={{ flex: 1, color: colors.parchment, fontSize: 14, fontFamily: "'Crimson Text','Georgia',serif", fontWeight: hovered ? 600 : 400 }}>
        {item.name}
      </span>
      {isMagic && item.attunement && (
        <span style={{ fontSize: 11, color: colors.brassLight, opacity: 0.75 }}>attunement</span>
      )}
      {item.rarity && (
        <span style={{ fontSize: 11, color: dotColor, opacity: 0.85 }}>{item.rarity}</span>
      )}
      {item.category && (
        <span style={{ fontSize: 11, color: colors.parchment + "55" }}>{item.category}</span>
      )}
      {hovered && (
        <button
          onClick={onRemove}
          style={{
            background: colors.blood, border: "none", color: colors.parchment,
            borderRadius: 4, width: 22, height: 22, display: "flex", alignItems: "center",
            justifyContent: "center", cursor: "pointer", fontSize: 14, fontWeight: 700,
            flexShrink: 0, lineHeight: 1
          }}
        >×</button>
      )}
    </div>
  );
}

function AbilitiesTab({ pointBuy, updatePointBuy, pointBuyRemaining, finalScores, finalMods, bgBonuses, asiBonuses, colors, fontDisplay }) {
  return (
    <div>
      <Section title="Point Buy" colors={colors} fontDisplay={fontDisplay}>
        <div style={{
          display: "inline-block", marginBottom: 16, padding: "8px 16px", borderRadius: 6,
          background: pointBuyRemaining < 0 ? colors.blood : colors.inkLight,
          border: `1px solid ${colors.brass}66`, fontFamily: fontDisplay, fontWeight: 700
        }}>
          Points Remaining: {pointBuyRemaining} / 27
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 12 }}>
          {ABILITIES.map(a => (
            <div key={a} style={{ background: colors.inkLight, border: `1px solid ${colors.brass}40`, borderRadius: 8, padding: 12, textAlign: "center" }}>
              <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", opacity: 0.8 }}>{a}</div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, margin: "8px 0" }}>
                <button onClick={() => updatePointBuy(a, pointBuy[a] - 1)} disabled={pointBuy[a] <= 8}
                  style={{ width: 28, height: 28, borderRadius: 14, border: `1px solid ${colors.brass}`, background: "transparent", color: colors.parchment, cursor: "pointer", opacity: pointBuy[a] <= 8 ? 0.3 : 1 }}>−</button>
                <span style={{ fontFamily: fontDisplay, fontSize: 24, fontWeight: 700, minWidth: 28 }}>{pointBuy[a]}</span>
                <button onClick={() => updatePointBuy(a, pointBuy[a] + 1)} disabled={pointBuy[a] >= 15}
                  style={{ width: 28, height: 28, borderRadius: 14, border: `1px solid ${colors.brass}`, background: "transparent", color: colors.parchment, cursor: "pointer", opacity: pointBuy[a] >= 15 ? 0.3 : 1 }}>+</button>
              </div>
              {(bgBonuses[a] || asiBonuses[a]) ? (
                <div style={{ fontSize: 11, color: colors.brassLight }}>
                  {bgBonuses[a] ? `+${bgBonuses[a]} bg` : ""} {asiBonuses[a] ? `+${asiBonuses[a]} ASI` : ""}
                </div>
              ) : null}
              <div style={{ fontFamily: fontDisplay, fontSize: 18, color: colors.brassLight, marginTop: 4 }}>
                {finalScores[a]} ({fmt(finalMods[a])})
              </div>
            </div>
          ))}
        </div>
        <div style={{ fontSize: 12, opacity: 0.7, marginTop: 12, lineHeight: 1.5 }}>
          Standard point buy: scores range 8–15 before bonuses. Cost: 9=1pt, 10=2, 11=3, 12=4, 13=5, 14=7, 15=9. Background increases and Ability Score Improvements are added automatically above.
        </div>
      </Section>
    </div>
  );
}

function SkillsTab({ cls, skillProfs, toggleSkillProf, skillExpertise, toggleExpertise, skillMods, savingThrows, finalMods, profBonus, colors, fontDisplay }) {
  return (
    <div>
      <Section title="Saving Throws" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 10 }}>
          {ABILITIES.map(a => (
            <div key={a} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              background: colors.inkLight, border: `1px solid ${cls.saves.includes(a) ? colors.brass : colors.brass + "30"}`,
              borderRadius: 6, padding: "8px 12px"
            }}>
              <span style={{ fontSize: 13 }}>{a} {cls.saves.includes(a) && <span style={{ color: colors.brassLight, fontSize: 11 }}>●prof</span>}</span>
              <span style={{ fontFamily: fontDisplay, fontWeight: 700 }}>{fmt(savingThrows[a])}</span>
            </div>
          ))}
        </div>
      </Section>

      <Section title={`Skills (choose ${cls.skillChoices} proficiencies)`} colors={colors} fontDisplay={fontDisplay}>
        <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 10 }}>
          Selected: {skillProfs.length}/{cls.skillChoices}. Click a skill to toggle proficiency; click the star to toggle Expertise (double proficiency, if your class grants it).
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 6 }}>
          {ALL_SKILLS.map(skill => {
            const isProf = skillProfs.includes(skill);
            const isExpertise = skillExpertise.includes(skill);
            return (
              <div key={skill} style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                background: isProf ? colors.brass + "22" : colors.inkLight,
                border: `1px solid ${isProf ? colors.brass : colors.brass + "30"}`,
                borderRadius: 6, padding: "6px 10px", cursor: "pointer"
              }}>
                <span onClick={() => toggleSkillProf(skill)} style={{ fontSize: 13, flex: 1 }}>
                  {skill} <span style={{ opacity: 0.6, fontSize: 11 }}>({ABBR[SKILL_ABILITY[skill]]})</span>
                </span>
                <span onClick={() => toggleExpertise(skill)} style={{ marginRight: 8, color: isExpertise ? colors.brassLight : colors.parchment + "40", fontSize: 14 }}>★</span>
                <span style={{ fontFamily: fontDisplay, fontWeight: 700, minWidth: 30, textAlign: "right" }}>{fmt(skillMods[skill])}</span>
              </div>
            );
          })}
        </div>
      </Section>
    </div>
  );
}

function CombatTab({ cls, level, effectiveMaxHp, currentHp, setCurrentHp, tempHp, setTempHp, hitDiceUsed, setHitDiceUsed, finalMods, armorClass, initiative, speed, colors, fontDisplay }) {
  const displayHp = currentHp === null ? effectiveMaxHp : currentHp;
  return (
    <div>
      <Section title="Hit Points" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Max HP</div>
            <div style={{ fontFamily: fontDisplay, fontSize: 26, fontWeight: 700, color: colors.brassLight }}>{effectiveMaxHp}</div>
          </div>
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Current HP</div>
            <input type="number" value={displayHp} onChange={e => setCurrentHp(parseInt(e.target.value) || 0)}
              style={{ width: "100%", textAlign: "center", fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, background: "transparent", border: "none", color: colors.parchment }} />
          </div>
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Temp HP</div>
            <input type="number" value={tempHp} onChange={e => setTempHp(parseInt(e.target.value) || 0)}
              style={{ width: "100%", textAlign: "center", fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, background: "transparent", border: "none", color: colors.parchment }} />
          </div>
        </div>
        <div style={{ marginTop: 14, fontSize: 13 }}>
          <strong>Hit Dice:</strong> {level}d{cls.hitDie} total &nbsp;|&nbsp; Used:
          <input type="number" min={0} max={level} value={hitDiceUsed} onChange={e => setHitDiceUsed(Math.max(0, Math.min(level, parseInt(e.target.value) || 0)))}
            style={{ ...fieldStyle(colors), display: "inline-block", width: 60, marginLeft: 8 }} />
          <span style={{ marginLeft: 8, opacity: 0.7 }}>(remaining: {level - hitDiceUsed})</span>
        </div>
      </Section>

      <Section title="Defenses & Movement" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
          {[["Armor Class", armorClass, "(unarmored base; adjust for worn armor)"], ["Initiative", fmt(initiative), ""], ["Speed", `${speed} ft`, ""]].map(([label, val, note]) => (
            <div key={label} style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
              <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>{label}</div>
              <div style={{ fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, color: colors.brassLight }}>{val}</div>
              {note && <div style={{ fontSize: 10, opacity: 0.6, marginTop: 4 }}>{note}</div>}
            </div>
          ))}
        </div>
      </Section>

      <Section title="Weapon Mastery & Attacks" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ fontSize: 13, opacity: 0.85, lineHeight: 1.6 }}>
          Use the Equipment tab to log your weapons. Attack bonus = ability mod + proficiency bonus (if proficient). Track Weapon Mastery properties (Cleave, Graze, Nick, Push, Sap, Slow, Topple, Vex) per your class's weapon mastery feature in the Features tab.
        </div>
      </Section>
    </div>
  );
}

function FeaturesTab({ featureLedger, reachedAsiLevels, asiChoices, setAsiAbilities, setAsiType, setFeatName, colors, fontDisplay }) {
  return (
    <div>
      <Section title="Ability Score Improvements & Feats" colors={colors} fontDisplay={fontDisplay}>
        {reachedAsiLevels.length === 0 && <div style={{ fontSize: 13, opacity: 0.7 }}>No ASI levels reached yet.</div>}
        {reachedAsiLevels.map(lvl => {
          const choice = asiChoices[lvl] || { type: "asi", abilities: [null, null] };
          return (
            <div key={lvl} style={{ background: colors.inkLight, border: `1px solid ${colors.brass}40`, borderRadius: 8, padding: 12, marginBottom: 10 }}>
              <div style={{ fontFamily: fontDisplay, fontWeight: 700, marginBottom: 8, color: colors.brassLight }}>Level {lvl}</div>
              <div style={{ display: "flex", gap: 14, marginBottom: 8, fontSize: 13 }}>
                <label><input type="radio" checked={choice.type === "asi"} onChange={() => setAsiType(lvl, "asi")} /> Ability Score Improvement</label>
                <label><input type="radio" checked={choice.type === "feat"} onChange={() => setAsiType(lvl, "feat")} /> Feat</label>
              </div>
              {choice.type === "asi" ? (
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {[0, 1].map(idx => (
                    <select key={idx} value={(choice.abilities && choice.abilities[idx]) || ""} onChange={e => setAsiAbilities(lvl, idx, e.target.value)} style={{ ...fieldStyle(colors), width: 160 }}>
                      <option value="">+1 to...</option>
                      {ABILITIES.map(a => <option key={a} value={a}>{a}</option>)}
                    </select>
                  ))}
                </div>
              ) : (
                <input value={choice.name || ""} onChange={e => setFeatName(lvl, e.target.value)} placeholder="Feat name" style={fieldStyle(colors)} />
              )}
            </div>
          );
        })}
      </Section>

      <Section title="Feature Ledger" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ fontSize: 12, opacity: 0.7, marginBottom: 12 }}>
          Every feature granted by your species, background, class, and subclass, in the order you gain them.
        </div>
        {featureLedger.map((f, i) => (
          <div key={i} style={{
            display: "flex", gap: 12, padding: "8px 0", borderBottom: `1px solid ${colors.brass}22`
          }}>
            <div style={{ minWidth: 64, fontFamily: fontDisplay, fontSize: 12, color: colors.brassLight }}>Lvl {f.level}</div>
            <div style={{ minWidth: 80, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em", opacity: 0.65, paddingTop: 1 }}>{f.source}</div>
            <div style={{ fontSize: 14, flex: 1 }}>{f.text}</div>
          </div>
        ))}
      </Section>
    </div>
  );
}

function SpellsTab({ cls, className, level, finalMods, profBonus, colors, fontDisplay, spells, setSpells }) {
  if (!cls.casterType) {
    return (
      <Section title="Spellcasting" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ fontSize: 14, opacity: 0.75 }}>{className} has no spellcasting class features at base level (unless granted by subclass — check your Features tab for subclasses like Eldritch Knight or Arcane Trickster).</div>
      </Section>
    );
  }

  const spellAbilityMod = finalMods[cls.spellAbility];
  const spellSaveDC = 8 + profBonus + spellAbilityMod;
  const spellAttackBonus = profBonus + spellAbilityMod;

  let slotsDisplay = null;
  if (cls.casterType === "pact") {
    const pact = PACT_SLOTS[level];
    slotsDisplay = <div style={{ fontSize: 14 }}>{pact.slots} Pact Magic slots, all of level {pact.level}. (Slots recharge on a Short or Long Rest.)</div>;
  } else {
    const slots = getSpellSlots(className, level) || [];
    slotsDisplay = (
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        {slots.map((count, i) => (
          <div key={i} style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 6, padding: "8px 12px", textAlign: "center", minWidth: 70 }}>
            <div style={{ fontFamily: fontDisplay, fontSize: 18, fontWeight: 700, color: colors.brassLight }}>{count}</div>
            <div style={{ fontSize: 10, opacity: 0.75 }}>Level {i + 1}</div>
          </div>
        ))}
        {slots.length === 0 && <div style={{ fontSize: 13, opacity: 0.7 }}>No spell slots yet at this level.</div>}
      </div>
    );
  }

  const cantripsTable = CANTRIPS_KNOWN[className];
  let cantripsKnown = null;
  if (cantripsTable) {
    const thresholds = Object.keys(cantripsTable).map(Number).sort((a, b) => a - b);
    let count = cantripsTable[thresholds[0]];
    thresholds.forEach(t => { if (level >= t) count = cantripsTable[t]; });
    cantripsKnown = count;
  }

  return (
    <div>
      <Section title="Spellcasting Overview" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12, marginBottom: 16 }}>
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Spellcasting Ability</div>
            <div style={{ fontFamily: fontDisplay, fontSize: 18, fontWeight: 700, color: colors.brassLight }}>{cls.spellAbility}</div>
          </div>
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Spell Save DC</div>
            <div style={{ fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, color: colors.brassLight }}>{spellSaveDC}</div>
          </div>
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Spell Attack Bonus</div>
            <div style={{ fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, color: colors.brassLight }}>{fmt(spellAttackBonus)}</div>
          </div>
          {cantripsKnown !== null && (
            <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
              <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Cantrips Known</div>
              <div style={{ fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, color: colors.brassLight }}>{cantripsKnown}</div>
            </div>
          )}
        </div>
      </Section>
      <Section title={cls.casterType === "pact" ? "Pact Magic Slots" : "Spell Slots"} colors={colors} fontDisplay={fontDisplay}>
        {slotsDisplay}
      </Section>
      <Section title="Spells Known / Prepared" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ fontSize: 13, opacity: 0.7, marginBottom: 8 }}>
          Log your chosen spells here — this app tracks slots and DCs, but spell selection from the full PHB list is up to you.
        </div>
        <SpellList colors={colors} fontDisplay={fontDisplay} spells={spells} setSpells={setSpells} />
      </Section>
    </div>
  );
}

function SpellList({ colors, fontDisplay, spells, setSpells }) {
  return (
    <div>
      {spells.map((s, i) => (
        <input key={i} value={s} onChange={e => {
          const next = [...spells]; next[i] = e.target.value; setSpells(next);
        }} placeholder={`Spell ${i + 1}`} style={{ ...fieldStyle(colors), marginBottom: 6 }} />
      ))}
      <button onClick={() => setSpells([...spells, ""])} style={{
        background: "transparent", border: `1px solid ${colors.brass}`, color: colors.brassLight,
        borderRadius: 6, padding: "6px 14px", cursor: "pointer", fontSize: 13, marginTop: 4
      }}>+ Add spell</button>
    </div>
  );
}

function NotesTab({ equipment, setEquipment, notes, setNotes, colors, fontDisplay }) {
  return (
    <div>
      <Section title="Equipment" colors={colors} fontDisplay={fontDisplay}>
        <textarea value={equipment} onChange={e => setEquipment(e.target.value)} rows={8}
          placeholder="Weapons, armor, adventuring gear, tools, coin..."
          style={{ ...fieldStyle(colors), resize: "vertical", lineHeight: 1.6 }} />
      </Section>
      <Section title="Notes & Backstory" colors={colors} fontDisplay={fontDisplay}>
        <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={10}
          placeholder="Personality traits, ideals, bonds, flaws, backstory..."
          style={{ ...fieldStyle(colors), resize: "vertical", lineHeight: 1.6 }} />
      </Section>
    </div>
  );
}

function ItemRowHover({ item, isPinned, onPin, onUnpin, onSelect, isSelected, accentColor, colors, extraBadge }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      onClick={() => onSelect()}
      style={{
        display: "flex", alignItems: "center", gap: 8, padding: "7px 12px", borderRadius: 6,
        cursor: "pointer", position: "relative",
        background: isSelected ? `${accentColor}22` : (isPinned ? `${accentColor}11` : "transparent"),
        border: `1px solid ${isSelected ? accentColor + "66" : (isPinned ? accentColor + "33" : "transparent")}`,
        transition: "background 0.12s"
      }}
    >
      <span style={{ width: 10, height: 10, borderRadius: "50%", flexShrink: 0, background: accentColor }} />
      <span style={{
        color: isPinned ? colors.parchment : colors.parchment + "cc",
        fontSize: 14, flex: 1,
        fontFamily: "'Crimson Text','Georgia',serif",
        fontWeight: isPinned ? 600 : 400
      }}>
        {item.name}
      </span>
      {extraBadge}
      {/* Hover action: show ✓ to add or × to remove */}
      {hovered && (
        <button
          onClick={e => { e.stopPropagation(); isPinned ? onUnpin() : onPin(); }}
          title={isPinned ? "Remove from Important Items" : "Add to Important Items"}
          style={{
            width: 22, height: 22, borderRadius: 4, border: "none", cursor: "pointer",
            background: isPinned ? colors.blood : "#4caf50",
            color: "#fff", fontSize: 14, fontWeight: 700,
            display: "flex", alignItems: "center", justifyContent: "center",
            flexShrink: 0, lineHeight: 1
          }}
        >
          {isPinned ? "×" : "✓"}
        </button>
      )}
      {!hovered && isPinned && (
        <span style={{ fontSize: 12, color: "#4caf50", flexShrink: 0 }}>✓</span>
      )}
    </div>
  );
}

function MagicItemsTab({ itemSearch, setItemSearch, itemRarityFilter, setItemRarityFilter, itemTypeFilter, setItemTypeFilter, itemAttunementFilter, setItemAttunementFilter, selectedItem, setSelectedItem, characterItems, setCharacterItems, pinnedItems, setPinnedItems, colors, fontDisplay }) {
  const allTypes = React.useMemo(() => {
    const types = new Set(MAGIC_ITEMS.map(i => i.type));
    return ["All", ...Array.from(types).sort()];
  }, []);

  const filtered = React.useMemo(() => {
    return MAGIC_ITEMS.filter(item => {
      const matchSearch = item.name.toLowerCase().includes(itemSearch.toLowerCase()) ||
        item.description.toLowerCase().includes(itemSearch.toLowerCase());
      const matchRarity = itemRarityFilter === "All" || item.rarity === itemRarityFilter;
      const matchType = itemTypeFilter === "All" || item.type === itemTypeFilter;
      const matchAtt = itemAttunementFilter === "All" ||
        (itemAttunementFilter === "Yes" && item.attunement) ||
        (itemAttunementFilter === "No" && !item.attunement);
      return matchSearch && matchRarity && matchType && matchAtt;
    });
  }, [itemSearch, itemRarityFilter, itemTypeFilter, itemAttunementFilter]);

  const grouped = React.useMemo(() => {
    const g = {};
    RARITY_ORDER.forEach(r => { g[r] = []; });
    filtered.forEach(item => { if (g[item.rarity]) g[item.rarity].push(item); });
    return g;
  }, [filtered]);

  const isPinned = (item) => pinnedItems.some(p => p.name === item.name);
  const pinItem = (item) => { if (!isPinned(item)) setPinnedItems(prev => [...prev, item]); };
  const unpinItem = (item) => setPinnedItems(prev => prev.filter(p => p.name !== item.name));

  const inputStyle = {
    background: colors.inkLight, border: `1px solid ${colors.brass}44`, color: colors.parchment,
    borderRadius: 6, padding: "8px 12px", fontSize: 14, fontFamily: "'Crimson Text','Georgia',serif",
    outline: "none", width: "100%", boxSizing: "border-box"
  };
  const selectStyle = { ...inputStyle, width: "auto", minWidth: 120, cursor: "pointer" };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 360px", gap: 20, alignItems: "start" }}>
      <div>
        <div style={{ background: colors.inkLight, borderRadius: 10, padding: 16, marginBottom: 16, border: `1px solid ${colors.brass}33` }}>
          <input value={itemSearch} onChange={e => setItemSearch(e.target.value)}
            placeholder="Search by name or description..." style={{ ...inputStyle, marginBottom: 10 }} />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <select value={itemRarityFilter} onChange={e => setItemRarityFilter(e.target.value)} style={selectStyle}>
              <option value="All">All Rarities</option>
              {RARITY_ORDER.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
            <select value={itemTypeFilter} onChange={e => setItemTypeFilter(e.target.value)} style={selectStyle}>
              {allTypes.map(t => <option key={t} value={t}>{t === "All" ? "All Types" : t}</option>)}
            </select>
            <select value={itemAttunementFilter} onChange={e => setItemAttunementFilter(e.target.value)} style={selectStyle}>
              <option value="All">Any Attunement</option>
              <option value="Yes">Requires Attunement</option>
              <option value="No">No Attunement</option>
            </select>
            <span style={{ color: colors.parchment + "88", fontSize: 13, alignSelf: "center", marginLeft: "auto" }}>
              {filtered.length} item{filtered.length !== 1 ? "s" : ""}
            </span>
          </div>
        </div>

        <div style={{ maxHeight: "62vh", overflowY: "auto", paddingRight: 4 }}>
          {RARITY_ORDER.map(rarity => {
            const items = grouped[rarity];
            if (!items || items.length === 0) return null;
            return (
              <div key={rarity} style={{ marginBottom: 16 }}>
                <div style={{
                  fontFamily: fontDisplay, fontSize: 12, fontWeight: 700, letterSpacing: 1,
                  color: RARITY_COLORS[rarity], textTransform: "uppercase", marginBottom: 6,
                  paddingBottom: 4, borderBottom: `1px solid ${RARITY_COLORS[rarity]}44`
                }}>
                  {rarity} ({items.length})
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                  {items.map(item => (
                    <ItemRowHover
                      key={item.name}
                      item={item}
                      isPinned={isPinned(item)}
                      onPin={() => pinItem(item)}
                      onUnpin={() => unpinItem(item)}
                      onSelect={() => setSelectedItem(selectedItem && selectedItem.name === item.name ? null : item)}
                      isSelected={selectedItem && selectedItem.name === item.name}
                      accentColor={RARITY_COLORS[rarity]}
                      colors={colors}
                      extraBadge={<>
                        {item.attunement && <span style={{ fontSize: 11, color: colors.brassLight, opacity: 0.8 }}>⟳</span>}
                        <span style={{ fontSize: 11, color: colors.parchment + "55", flexShrink: 0 }}>{item.type}</span>
                      </>}
                    />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ position: "sticky", top: 16 }}>
        <div style={{
          background: colors.inkLight,
          border: `1px solid ${selectedItem ? RARITY_COLORS[selectedItem.rarity] + "66" : colors.brass + "22"}`,
          borderRadius: 10, padding: 20, marginBottom: 16, minHeight: 200
        }}>
          {selectedItem ? (
            <>
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontFamily: fontDisplay, fontSize: 18, color: colors.parchment, lineHeight: 1.2, marginBottom: 6 }}>
                  {selectedItem.name}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12, fontWeight: 700, color: RARITY_COLORS[selectedItem.rarity], background: RARITY_COLORS[selectedItem.rarity] + "22", padding: "2px 8px", borderRadius: 4 }}>{selectedItem.rarity}</span>
                  <span style={{ fontSize: 12, color: colors.parchment + "88", background: colors.ink, padding: "2px 8px", borderRadius: 4 }}>{selectedItem.type}</span>
                  {selectedItem.attunement && <span style={{ fontSize: 12, color: colors.brassLight, background: colors.brass + "22", padding: "2px 8px", borderRadius: 4 }}>Requires Attunement</span>}
                </div>
              </div>
              <p style={{ color: colors.parchment + "cc", fontSize: 14, lineHeight: 1.7, fontFamily: "'Crimson Text','Georgia',serif", margin: "0 0 16px" }}>{selectedItem.description}</p>
              <button
                onClick={() => isPinned(selectedItem) ? unpinItem(selectedItem) : pinItem(selectedItem)}
                style={{
                  width: "100%", padding: "10px 0", borderRadius: 6, cursor: "pointer",
                  fontFamily: fontDisplay, fontSize: 13, fontWeight: 600, border: "none",
                  background: isPinned(selectedItem) ? colors.blood : colors.brass,
                  color: isPinned(selectedItem) ? colors.parchment : colors.ink
                }}
              >
                {isPinned(selectedItem) ? "− Remove from Important Items" : "✓ Add to Important Items"}
              </button>
            </>
          ) : (
            <div style={{ color: colors.parchment + "44", fontFamily: "'Crimson Text','Georgia',serif", fontSize: 15, textAlign: "center", paddingTop: 60 }}>
              Select an item to view details
            </div>
          )}
        </div>

        {pinnedItems.filter(p => p.rarity).length > 0 && (
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}33`, borderRadius: 10, padding: 16 }}>
            <div style={{ fontFamily: fontDisplay, fontSize: 12, color: colors.brassLight, letterSpacing: 0.5, marginBottom: 10, textTransform: "uppercase" }}>
              Pinned Magic Items ({pinnedItems.filter(p => p.rarity).length})
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, maxHeight: 200, overflowY: "auto" }}>
              {pinnedItems.filter(p => p.rarity).map(item => (
                <div key={item.name} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: RARITY_COLORS[item.rarity], flexShrink: 0 }} />
                  <span style={{ color: colors.parchment, fontSize: 13, flex: 1, fontFamily: "'Crimson Text','Georgia',serif" }}>{item.name}</span>
                  <button onClick={() => unpinItem(item)} style={{ background: "none", border: "none", color: colors.blood, cursor: "pointer", fontSize: 16, lineHeight: 1, padding: "0 2px" }}>×</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function MundaneItemsTab({ mundaneSearch, setMundaneSearch, mundaneTypeFilter, setMundaneTypeFilter, selectedMundane, setSelectedMundane, pinnedItems, setPinnedItems, colors, fontDisplay }) {
  const allCategories = React.useMemo(() => {
    const cats = new Set(MUNDANE_ITEMS.map(i => i.category));
    return ["All", ...Array.from(cats).sort()];
  }, []);

  const filtered = React.useMemo(() => {
    return MUNDANE_ITEMS.filter(item => {
      const matchSearch = item.name.toLowerCase().includes(mundaneSearch.toLowerCase()) ||
        item.description.toLowerCase().includes(mundaneSearch.toLowerCase());
      const matchCat = mundaneTypeFilter === "All" || item.category === mundaneTypeFilter;
      return matchSearch && matchCat;
    });
  }, [mundaneSearch, mundaneTypeFilter]);

  const grouped = React.useMemo(() => {
    const g = {};
    allCategories.filter(c => c !== "All").forEach(c => { g[c] = []; });
    filtered.forEach(item => { if (g[item.category]) g[item.category].push(item); });
    return g;
  }, [filtered, allCategories]);

  const isPinned = (item) => pinnedItems.some(p => p.name === item.name);
  const pinItem = (item) => { if (!isPinned(item)) setPinnedItems(prev => [...prev, item]); };
  const unpinItem = (item) => setPinnedItems(prev => prev.filter(p => p.name !== item.name));

  const inputStyle = {
    background: colors.inkLight, border: `1px solid ${colors.brass}44`, color: colors.parchment,
    borderRadius: 6, padding: "8px 12px", fontSize: 14, fontFamily: "'Crimson Text','Georgia',serif",
    outline: "none", width: "100%", boxSizing: "border-box"
  };
  const selectStyle = { ...inputStyle, width: "auto", minWidth: 150, cursor: "pointer" };

  const accentColor = colors.brassLight;

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 340px", gap: 20, alignItems: "start" }}>
      <div>
        <div style={{ background: colors.inkLight, borderRadius: 10, padding: 16, marginBottom: 16, border: `1px solid ${colors.brass}33` }}>
          <input value={mundaneSearch} onChange={e => setMundaneSearch(e.target.value)}
            placeholder="Search items..." style={{ ...inputStyle, marginBottom: 10 }} />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <select value={mundaneTypeFilter} onChange={e => setMundaneTypeFilter(e.target.value)} style={selectStyle}>
              {allCategories.map(c => <option key={c} value={c}>{c === "All" ? "All Categories" : c}</option>)}
            </select>
            <span style={{ color: colors.parchment + "88", fontSize: 13, marginLeft: "auto" }}>
              {filtered.length} item{filtered.length !== 1 ? "s" : ""}
            </span>
          </div>
        </div>

        <div style={{ maxHeight: "62vh", overflowY: "auto", paddingRight: 4 }}>
          {allCategories.filter(c => c !== "All").map(cat => {
            const items = grouped[cat];
            if (!items || items.length === 0) return null;
            return (
              <div key={cat} style={{ marginBottom: 16 }}>
                <div style={{
                  fontFamily: fontDisplay, fontSize: 12, fontWeight: 700, letterSpacing: 1,
                  color: accentColor, textTransform: "uppercase", marginBottom: 6,
                  paddingBottom: 4, borderBottom: `1px solid ${accentColor}44`
                }}>
                  {cat} ({items.length})
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                  {items.map(item => (
                    <ItemRowHover
                      key={item.name}
                      item={item}
                      isPinned={isPinned(item)}
                      onPin={() => pinItem(item)}
                      onUnpin={() => unpinItem(item)}
                      onSelect={() => setSelectedMundane(selectedMundane && selectedMundane.name === item.name ? null : item)}
                      isSelected={selectedMundane && selectedMundane.name === item.name}
                      accentColor={accentColor}
                      colors={colors}
                      extraBadge={
                        <span style={{ fontSize: 11, color: colors.parchment + "55", flexShrink: 0 }}>{item.cost}</span>
                      }
                    />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ position: "sticky", top: 16 }}>
        <div style={{
          background: colors.inkLight,
          border: `1px solid ${selectedMundane ? accentColor + "66" : colors.brass + "22"}`,
          borderRadius: 10, padding: 20, marginBottom: 16, minHeight: 200
        }}>
          {selectedMundane ? (
            <>
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontFamily: fontDisplay, fontSize: 18, color: colors.parchment, lineHeight: 1.2, marginBottom: 6 }}>
                  {selectedMundane.name}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12, color: accentColor, background: accentColor + "22", padding: "2px 8px", borderRadius: 4, fontWeight: 700 }}>{selectedMundane.category}</span>
                  <span style={{ fontSize: 12, color: colors.parchment + "88", background: colors.ink, padding: "2px 8px", borderRadius: 4 }}>{selectedMundane.cost}</span>
                  {selectedMundane.weight && selectedMundane.weight !== "—" && (
                    <span style={{ fontSize: 12, color: colors.parchment + "66", background: colors.ink, padding: "2px 8px", borderRadius: 4 }}>{selectedMundane.weight}</span>
                  )}
                </div>
              </div>
              <p style={{ color: colors.parchment + "cc", fontSize: 14, lineHeight: 1.7, fontFamily: "'Crimson Text','Georgia',serif", margin: "0 0 16px" }}>
                {selectedMundane.description}
              </p>
              <button
                onClick={() => isPinned(selectedMundane) ? unpinItem(selectedMundane) : pinItem(selectedMundane)}
                style={{
                  width: "100%", padding: "10px 0", borderRadius: 6, cursor: "pointer",
                  fontFamily: fontDisplay, fontSize: 13, fontWeight: 600, border: "none",
                  background: isPinned(selectedMundane) ? colors.blood : colors.brass,
                  color: isPinned(selectedMundane) ? colors.parchment : colors.ink
                }}
              >
                {isPinned(selectedMundane) ? "− Remove from Important Items" : "✓ Add to Important Items"}
              </button>
            </>
          ) : (
            <div style={{ color: colors.parchment + "44", fontFamily: "'Crimson Text','Georgia',serif", fontSize: 15, textAlign: "center", paddingTop: 60 }}>
              Select an item to view details
            </div>
          )}
        </div>

        {pinnedItems.filter(p => !p.rarity).length > 0 && (
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}33`, borderRadius: 10, padding: 16 }}>
            <div style={{ fontFamily: fontDisplay, fontSize: 12, color: colors.brassLight, letterSpacing: 0.5, marginBottom: 10, textTransform: "uppercase" }}>
              Pinned Mundane Items ({pinnedItems.filter(p => !p.rarity).length})
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, maxHeight: 200, overflowY: "auto" }}>
              {pinnedItems.filter(p => !p.rarity).map(item => (
                <div key={item.name} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: accentColor, flexShrink: 0 }} />
                  <span style={{ color: colors.parchment, fontSize: 13, flex: 1, fontFamily: "'Crimson Text','Georgia',serif" }}>{item.name}</span>
                  <span style={{ fontSize: 11, color: colors.parchment + "55" }}>{item.cost}</span>
                  <button onClick={() => unpinItem(item)} style={{ background: "none", border: "none", color: colors.blood, cursor: "pointer", fontSize: 16, lineHeight: 1, padding: "0 2px" }}>×</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<CharacterSheet />);
  </script>
</body>
