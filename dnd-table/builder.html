  "acBase": { "formula": "10+DEX+CON", "shield": true }   Armor Class while wearing no armor. shield false: not while using a Shield.
  "acBonus": { "formula": 1, "when": "armor" }            added to Armor Class. when: "armor", "noArmor", "noHeavy" or leave out for always.
  "speed": { "formula": 10, "when": "noHeavy" }           feet added to Speed. when: "noHeavy", "noArmor", "noArmorNoShield" or leave out.
  "speedBase": 35                                         replaces the species' Speed
  "hp": "LEVEL"                                           added to the Hit Point maximum
  "initiative": "PROF"                                    added to Initiative
  "scores": { "Strength": 4, "Constitution": 4 }          added to ability scores
  "saveProficiency": ["Wisdom", "Charisma"]               saving throw proficiencies, or "all"
  "saveBonus": "MAX(1,CHA)"                               added to every saving throw
  "saveAdvantage": ["Dexterity"]                          Advantage on saves with those abilities
  "conditionAdvantage": ["Charmed"]                       Advantage on saves to avoid or end those conditions
  "conditionImmune": ["Frightened"]                       immune to those conditions
  "resist": ["Poison"]                                    Resistance to those damage types
  "senses": ["Darkvision 120 ft."]                        senses
  "halfProficiency": true                                 half Proficiency Bonus on skills it lacks proficiency in
  "skillPicks": { "class": 1, "any": 3 }                  more skill proficiencies to choose: from the class list, or from any skill
  "skillBonus": { "skills": ["Arcana"], "formula": "MAX(1,WIS)" }   a bonus to those skills
  "spells": { "1": ["Bless"], "5": ["Revivify"] }         spells always prepared from that level (they don't count against the limit)
  "cantripBonus": 1                                       more cantrips known
  "cantripDamage": "WIS"                                  added to the damage of its cantrips
  "schoolDamage": { "school": "Evocation", "formula": "INT" }       added to the damage of spells of that school
  "weaponDamage": { "dice": "1d8", "type": "Radiant", "when": "melee" }   extra damage on every hit. when: "melee", "weapon", "all", or "this" for hits with the magic weapon that grants it only (Frost Brand). Leave "type" out when it is the weapon's own type. Add "vsTypes": ["Dragon"] when the extra damage is only against those creature types (Dragon Slayer, Sun Blade against Undead), and "weapons": ["Longbow", "Shortbow"] when it is only with those weapons (Bracers of Archery: "dice": "2").
  "weaponMasteries": 2                                    how many kinds of weapons it can use the mastery property of (a list of 20 for a number that grows)
  "proficiencies": { "armor": ["Heavy"], "weapons": ["Martial"] }   armor or weapon proficiencies a feature adds. armor: "Light", "Medium", "Heavy", "Shield". weapons: "Simple", "Martial", or a weapon name such as "Longsword"
  "unarmedDie": 6                                         its Unarmed Strike rolls this die (a list of 20 for a die that grows)
  "unarmedDexterity": true                                Unarmed Strikes can use Dexterity
  "skillAdvantage": ["Stealth"]                           Advantage on ability checks with those skills
  "immune": ["Poison"]                                    Immunity to those damage types
  "moves": ["Climb Speed equal to your Speed"]            another way of moving, shown next to Speed
  "speedMin": 30                                          Speed is at least this (no effect if it is already higher)
  "scoresMin": { "Strength": 21 }                         that score becomes this, unless it is already higher
  "spellAttackBonus": 2                                   added to spell attack rolls
  "spellDcBonus": 2                                       added to spell save DCs
  "saveAdvantageVsSpells": true                           Advantage on saving throws against spells
  "critImmune": true                                      a Critical Hit against the wearer becomes a normal hit (Adamantine Armor)
  "acVsRanged": 2                                         added to Armor Class against ranged attacks only (Arrow-Catching Shield)
  "critExtraDice": "1d8"                                  dice added to the damage of a Critical Hit with a weapon or Unarmed Strike
  "itemSlots": { "Attunement": 1 }                        more item slots of that kind (Attunement, or a kind from "slotTypes"): the character can be attuned to one more item
  "spellPicks": [ { "label": "Mystic Arcanum (level 6)", "count": 1, "level": 6, "lists": ["Warlock"], "cast": "once" } ]
                                                          spells the player chooses on the Spells tab. level: a number, "slot" (any level the character has slots for) or 0 for cantrips. lists: class spell lists to choose from. count can be a list of 20. Add "school": "Evocation" or "ritual": true to narrow the choice, "castingTime": "Action" for only spells cast with an action, and "fromBook": true for only spells in the spellbook. "cast": "book" writes the picks in the spellbook for free instead (Evocation Savant). cast: how the picks are cast (below); leave out for normal casting

---------------------------------------------------------------------
RESOURCES: pools of uses
---------------------------------------------------------------------

When several features spend the same uses, or the number of uses is its own feature, define the pool once:
{ "name": "Warden's Resolve", "grantedBy": { "type": "class", "name": "Warden", "level": 2 },
  "resource": { "name": "Resolve Points", "max": "LEVEL", "recharge": "short" } }

  max is a formula, or a list of 20 numbers taken from the class table.
  recharge is "short" or "long". For "regain one use on a Short Rest and all on a Long Rest" write "recharge": "long", "shortRegain": 1.
Each feature that spends from it uses: { "pool": "Resolve Points", "cost": 1 }. The Combat Resolver shows the pool, takes the cost when the feature is used, blocks it when the pool is too low, and refills it on the right rest.

---------------------------------------------------------------------
CHOICES INSIDE A FEATURE: options
---------------------------------------------------------------------

When the player picks one of several options, list them. Each choice is written like an ability (statics, activation and so on) and takes effect only when picked:
{ "name": "Warden's Path", "grantedBy": { "type": "class", "name": "Warden", "level": 3 },
  "options": { "label": "Warden's Path", "choices": [
    { "name": "Bulwark", "statics": { "acBonus": { "formula": 1 } } },
    { "name": "Avenger", "activation": "reaction", "target": "creature", "roll": "none", "damage": [ { "dice": "1d8", "type": "Force" } ] } ] } }
The builder shows a dropdown for the choice on the Features tab.
Several picks: add "count": 3 (or a list of 20 for a number that grows) inside "options"; the builder shows that many dropdowns.
A choice that needs something first takes "prereq": { "level": 5, "has": ["Pact of the Blade"] } (class level, and other choices already picked). Add "repeatable": true to a choice that can be picked more than once.
A choice that gives a feat takes "grantsFeat": "Origin" (the feat category); the builder then asks for that feat.
If the choice can be changed after a rest, add "changeOn": "short" (a Short or Long Rest) or "changeOn": "long" (a Long Rest only) inside "options". The builder's rest window then lists it as something the player can change.

text: the full rules text, copied as written. It is shown in the combat log.

---------------------------------------------------------------------
FORMULAS
---------------------------------------------------------------------

A formula is a number or a sum using these words, in capitals:
  STR DEX CON INT WIS CHA    the user's ability modifier
  PROF                       the user's Proficiency Bonus
  LEVEL                      the user's character level
  SPELLMOD                   the user's spellcasting ability modifier
  SPELLDC                    the user's spell save DC
  SPELLATK                   the user's spell attack bonus
  PACTLEVEL                  the level of the user's Pact Magic slots (0 without Pact Magic)
You can use + - * / and brackets. Division rounds down. MAX(a,b) gives the larger and MIN(a,b) the smaller, for rules such as "minimum of 1". Examples: "8+PROF+WIS", "LEVEL*5", "(LEVEL+1)/2", "MAX(1,CHA)".

A dice formula adds dice, written with a small letter d: "2d6", "1d8+STR", "1d10+LEVEL". The number of dice can itself be a formula in brackets: "(LEVEL+1)/2d6" means that many d6.

Never write the finished number for something that depends on the character. Write the formula, so the app works it out from each character's current numbers.

WORKED EXAMPLES
---------------------------------------------------------------------

A weapon-like attack that also slows the target:
{
  "name": "Warding Strike", "grantedBy": { "type": "class", "name": "Warden", "level": 2 },
  "activation": "action", "target": "creature", "roll": "attack",
  "attack": { "bonus": "PROF+STR" },
  "damage": [ { "dice": "1d8+STR", "type": "Bludgeoning" }, { "dice": "1d6", "type": "Radiant" } ],
  "onHit": { "effects": [ { "name": "Warding Strike", "duration": { "amount": 1, "unit": "rounds" }, "speed": -10 } ] },
  "text": "..."
}

A spell with a save, a condition, a repeat save and an alternative on a success:
{
  "name": "Ashen Grasp", "grantedBy": { "type": "spell", "name": "Ashen Grasp" },
  "activation": "action", "target": "creature", "roll": "save",
  "save": { "ability": "Constitution", "dc": "SPELLDC" },
  "damage": [ { "dice": "3d8", "type": "Necrotic" } ], "halfOnSave": true,
  "onFail": { "conditions": [ { "name": "Restrained", "duration": { "amount": 1, "unit": "minutes" }, "repeatSave": { "when": "end", "turn": "target" } } ] },
  "onSuccess": { "effects": [ { "name": "Ashen Grasp", "duration": { "amount": 1, "unit": "rounds" }, "speedMultiplier": 0.5 } ] },
  "text": "..."
}

A buff on yourself with limited uses:
{
  "name": "Sentinel's Stand", "grantedBy": { "type": "class", "name": "Warden" },
  "activation": "bonus", "target": "self", "roll": "none",
  "onUse": { "effects": [ { "name": "Sentinel's Stand", "duration": { "amount": 1, "unit": "minutes" }, "ac": 2, "advantageOnSaves": "Strength", "note": "Your Speed is 0 while this lasts." } ] },
  "uses": { "max": "PROF", "recharge": "long" },
  "text": "..."
}

A self heal:
{
  "name": "Second Breath", "grantedBy": { "type": "feat", "name": "Stone's Patience" },
  "activation": "bonus", "target": "self", "roll": "none", "heal": "1d10+LEVEL",
  "uses": { "max": 1, "recharge": "short" }, "text": "..."
}

---------------------------------------------------------------------
WHEN THE CONTENT DOES NOT FIT
---------------------------------------------------------------------
New classes often work in ways the built-in ones do not. Do not drop a mechanic because it has no exact field. Build it from the pieces above, in this order of preference:
1. A pool: anything counted and spent (points, charges, dice, stacks) is a "resource", and whatever spends it has uses with "pool" and "cost". Different features can cost different amounts from the same pool. A feature that gives points back is an ability whose text says so, with a "note" telling the table to add them with the + button on the pool.
2. Options: a feature with modes, stances or forms is "options", one choice per mode, each with its own statics and effects.
3. Effects with a duration: a state the character enters (a trance, a form, a mark on a target) is an effect with the bonuses it gives and its duration.
4. Scaling: anything that grows with level is a list of 20 values or a formula with LEVEL.
5. Text: what is left goes in "text" and in an effect's "note". It is never lost: every feature appears on the character sheet's Features & Traits tab with its name, level and text, every spell appears on the Spells tab and can be cast (it spends its slot or points and posts its text for the table to resolve), and any feature can be shown to the table from the sheet.
Say in "warnings" (a list of plain sentences at the top level of the file) what you could not automate and how you approximated it, so the person knows what to rule by hand.

WHEN THE APP ITSELF WOULD HAVE TO CHANGE. Some rules change how the app works rather than a character's numbers: a new kind of rest, a new thing every character counts, a new step in an attack. Do it the same way every time:
1. Look for a key in this prompt that does it, even partly. If one exists, use it. Never invent a key: the app ignores keys it does not know.
2. If none does, build what you can with steps 1 to 5 above.
3. Then add one entry to "requests", a list at the top level of the file, for each rule the app would have to change to do it fully:
"requests": [ { "rule": "Grave Ink", "need": "a third kind of item slot whose number equals the Constitution modifier", "where": "builder", "source": "The Ink Codex, page 12" } ]
  rule: the feature or rule's name. need: what the app would have to do, in one sentence, in plain words. where: "builder" (the character sheet), "resolver" (combat, rests, time) or "both". source: where the rule is.
The builder lists these requests when the pack is installed, so the person can pass them on to whoever maintains the app. Do not put the same thing in both "warnings" and "requests": a rule you approximated is a warning, a rule the app needs to learn is a request.

---------------------------------------------------------------------
CHECK YOUR WORK BEFORE YOU ANSWER
---------------------------------------------------------------------

- The file is valid JSON with "format": "homebrew-academy-content" and "version": 1.
- Every ability's grantedBy name matches a name in this file or a built-in option, spelled the same way.
- Go through every class level, every subclass level, every species trait and every lineage option one at a time. Each one is PASSIVE, ACTIVATED, RESOURCE, CHOICE or TEXT ONLY, and everything except TEXT ONLY has an ability.
- Every "your X increases", "you have Resistance", "you gain proficiency", "you always have the spell prepared" is in statics.
- Every "a number of times equal to", "you can use this feature twice" or table column of uses is a uses or a resource.
- Every "choose one of the following" is options.
- Every area, "each creature" or "up to N creatures" has targets.
- Every roll "attack" has "attack". Every roll "save" has "save" with an ability and a dc.
- Every number that depends on the character is a formula, not a fixed number.
- Every condition or effect that the text gives a time limit has a duration. Every "repeats the save" has a repeatSave with the right turn.
- Limited-use features have uses with the right recharge.
- Every class has armorProf and weaponProf written in the standard words ("Light, Medium, Heavy, Shields" and "Simple, Martial", or "Martial weapons with Finesse or Light property"), because the builder reads them to know what the character is proficient with. A weapon the character is not proficient with gets no Proficiency Bonus on its attack roll.
- A class that casts with points has spellPoints, and a resource whose name matches its pool exactly.
- Every spell has its components, and its material written out when it has one.
- Every spell has a "record", and every statistic the spell changes is in it. Every "you choose" is in "choices" or "modes", every spell that ends a condition or effect has "remove", every costly component has "cost", every summoned or assumed creature has "summonCtl" or "form", and every lasting area has "zone".
- Every "Hit Point maximum increases" is an effect with hitPointMaximum, not healing.
- Every magic armor, shield and weapon has a type in the exact "Armor (...)" or "Weapon (...)" form, and a "bonus" when it has one.
- Every feat is an object with a category, and every "choose a cantrip" or "choose a spell" in a feat is a spellChoices entry with the exact level, lists and schools the text allows.
- Rules text is copied as written, and spell levels read "Level X School".
