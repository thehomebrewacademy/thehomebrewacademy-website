        )}
        {tab === "combat" && (
          <CombatTab {...{ statAdj, setStatAdj, inventory: Object.assign([...pinnedItems, ...characterItems].map(i => i && i.name).filter(Boolean), { typed: equipment }), masteries, setMasteries, custom, masteryGlow: glowOf("mastery"), armor, setArmor, shield, setShield, weapons, setWeapons, ac: { value: armorClass, how: ac.how }, sheetActions, pools, derived, cls, level, effectiveMaxHp, currentHp, setCurrentHp, tempHp, setTempHp, hitDiceUsed, setHitDiceUsed, finalMods, armorClass, initiative, speed, colors, fontDisplay }} />
        )}
        {tab === "features" && (
          <FeaturesTab {...{ glowOf, optionSlots: mech.optionSlots, featureChoices, setFeatureChoices, featureLedger, reachedAsiLevels, asiChoices, setAsiAbilities, setAsiType, setFeatName, setAsiFeatChoices, colors, fontDisplay, slots, featPicks, setFeatPick, extraFeats, setExtraFeats, takenFeats, custom }} />
        )}
        {tab === "spells" && (
          <SpellsTab {...{ glow: glowOf("spells"), grantedSpells: derived.spells, cls, className, level, finalMods, profBonus, colors, fontDisplay, spells, setSpells, spellInfo, custom, spellSummary }} />
        )}
        {tab === "notes" && (
          <NotesTab {...{ equipment, setEquipment, notes, setNotes, colors, fontDisplay }} />
        )}
        {tab === "magic" && (
          <MagicItemsTab {...{ itemSearch, setItemSearch, itemRarityFilter, setItemRarityFilter, itemTypeFilter, setItemTypeFilter, itemAttunementFilter, setItemAttunementFilter, selectedItem, setSelectedItem, characterItems, setCharacterItems, pinnedItems, setPinnedItems, colors, fontDisplay }} />
        )}
        {tab === "packs" && (
          <ContentPacksTab {...{ colors, fontDisplay, sheetActions }} />
        )}
        <datalist id="hba-spell-list">{ALL_SPELLS.map(sp => <option key={sp.n} value={sp.n} />)}</datalist>
        <datalist id="hba-feat-list">{Array.from(new Set([...Object.keys(FEATS).filter(f => FEATS[f].category === "Origin" || FEATS[f].category === "Any"), ...Object.keys(ORIGIN_FEATS)])).map(f => <option key={f} value={f} />)}</datalist>
        {tab === "mundane" && (
          <MundaneItemsTab {...{ mundaneSearch, setMundaneSearch, mundaneTypeFilter, setMundaneTypeFilter, selectedMundane, setSelectedMundane, pinnedItems, setPinnedItems, colors, fontDisplay }} />
        )}
      </div>
    </div>
  );
}

/* ============ TAB COMPONENTS ============ */

function Section({ title, colors, fontDisplay, children }) {
  return (
    <div style={{ marginBottom: 24 }}>
      <h3 style={{
        fontFamily: fontDisplay, color: colors.brassLight, fontSize: 16, letterSpacing: "0.04em",
        textTransform: "uppercase", borderBottom: `1px solid ${colors.brass}55`, paddingBottom: 8, marginBottom: 14
      }}>{title}</h3>
      {children}
    </div>
  );
}

function fieldStyle(colors) {
  return {
    width: "100%", background: colors.inkLight, border: `1px solid ${colors.brass}55`,
    borderRadius: 6, color: colors.parchment, padding: "8px 10px", fontSize: 15
  };
}

function IdentityTab({ className, setClassName, subclassName, setSubclassName, level, setLevel, species, setSpecies, background, setBackground, alignment, setAlignment, cls, colors, fontDisplay, bgBonusMode, setBgBonusMode, bgBonusChoices, setBgBonusChoices, pinnedItems, setPinnedItems, bgEff, originCustom, setOriginCustom, lineage, setLineage }) {
  const bg = bgEff;
  const [originOpen, setOriginOpen] = useState(false);
  const baseBg = BACKGROUNDS[background] || bgEff;
  const startOrigin = () => {
    if (!originCustom) setOriginCustom({ abilityScores: [...baseBg.abilityScores], skills: [...baseBg.skills].slice(0, 2), feat: baseBg.feat || "", tool: baseBg.tool || "" });
    setOriginOpen(true);
  };
  const setOrigin = (patch) => setOriginCustom(prev => ({ ...prev, ...patch }));
  const setOriginAbility = (i, a) => {
    const next = [...originCustom.abilityScores]; const j = next.indexOf(a);
    if (j >= 0) next[j] = next[i]; // picking one already chosen swaps the two
    next[i] = a;
    setOrigin({ abilityScores: next });
    setBgBonusChoices(prev => prev.filter(x => next.includes(x)));
  };
  const setOriginSkill = (i, k) => {
    const next = [...originCustom.skills]; const j = next.indexOf(k);
    if (j >= 0) next[j] = next[i];
    next[i] = k;
    setOrigin({ skills: next });
  };
  const resetOrigin = () => { setOriginCustom(null); setOriginOpen(false); setBgBonusChoices(prev => prev.filter(x => baseBg.abilityScores.includes(x))); };
  const subclassLevel = cls.subclassLevel;
  const hasSubclassYet = level >= subclassLevel;

  function handleBonusChoice(idx, ability) {
    setBgBonusChoices(prev => {
      const next = [...prev];
      next[idx] = ability;
      return next;
    });
  }

  const numChoices = bgBonusMode === "2-1" ? 2 : 3;

  return (
    <div>
      <Section title="Class & Level" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "2fr 2fr 1fr", gap: 12 }} className="two-col">
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>Class</label>
            <select value={className} onChange={e => { setClassName(e.target.value); setSubclassName(""); }} style={fieldStyle(colors)}>
              {Object.keys(CLASSES).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>{cls.subclassName} {hasSubclassYet ? "" : `(at level ${subclassLevel})`}</label>
            <select value={subclassName} onChange={e => setSubclassName(e.target.value)} disabled={!hasSubclassYet} style={{ ...fieldStyle(colors), opacity: hasSubclassYet ? 1 : 0.5 }}>
              <option value="">— none yet —</option>
              {Object.keys(cls.subclasses).map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>Level</label>
            <input type="number" min={1} max={20} value={level} onChange={e => setLevel(Math.max(1, Math.min(20, parseInt(e.target.value) || 1)))} style={fieldStyle(colors)} />
          </div>
        </div>
        <div style={{ marginTop: 12, fontSize: 13, opacity: 0.85, lineHeight: 1.6 }}>
          <strong>Hit Die:</strong> d{cls.hitDie} &nbsp; <strong>Primary:</strong> {cls.primaryAbility} &nbsp; <strong>Saves:</strong> {cls.saves.map(s => ABBR[s]).join(", ")}<br/>
          <strong>Armor:</strong> {cls.armorProf} &nbsp; <strong>Weapons:</strong> {cls.weaponProf}
        </div>
      </Section>

      <Section title="Species & Background" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }} className="two-col">
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>Species</label>
            <select value={species} onChange={e => { setSpecies(e.target.value); setLineage(""); }} style={fieldStyle(colors)}>
              {Object.keys(SPECIES).map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            {SPECIES[species] && SPECIES[species].lineage && (
              <select aria-label={SPECIES[species].lineage.label} value={lineage} onChange={e => setLineage(e.target.value)} style={{ ...fieldStyle(colors), marginTop: 8 }}>
                <option value="">{SPECIES[species].lineage.label}: choose...</option>
                {Object.keys(SPECIES[species].lineage.options).map(o => <option key={o} value={o}>{o}{SPECIES[species].lineage.options[o].damageType ? ` (${SPECIES[species].lineage.options[o].damageType})` : ""}</option>)}
              </select>
            )}
          </div>
          <div>
            <label style={{ fontSize: 12, opacity: 0.8 }}>Background</label>
            <div style={{ display: "flex", gap: 8 }}>
              <select value={background} onChange={e => { setBackground(e.target.value); setBgBonusChoices([]); setOriginCustom(null); setOriginOpen(false); }} style={fieldStyle(colors)}>
                {Object.keys(BACKGROUNDS).map(b => <option key={b} value={b}>{b}</option>)}
              </select>
              <button onClick={() => (originOpen ? setOriginOpen(false) : startOrigin())} data-testid="customize-origin" style={{ whiteSpace: "nowrap", background: originCustom ? colors.brass : "transparent", color: originCustom ? colors.ink : colors.brassLight, border: `1px solid ${colors.brass}`, borderRadius: 6, padding: "0 12px", fontFamily: fontDisplay, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                {originOpen ? "Done" : "Customize Origin"}
              </button>
            </div>
          </div>
        </div>

        <div style={{ marginTop: 14, background: colors.inkLight, border: `1px solid ${colors.brass}40`, borderRadius: 8, padding: 14 }}>
          {originOpen && originCustom && (
            <div data-testid="origin-panel" style={{ marginBottom: 14, paddingBottom: 14, borderBottom: `1px solid ${colors.brass}40` }}>
              <div style={{ fontFamily: fontDisplay, fontWeight: 700, color: colors.brassLight, marginBottom: 8 }}>Customize Origin</div>
              <div style={{ fontSize: 12, opacity: 0.8, marginBottom: 6 }}>Ability scores your increases can go to (three)</div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
                {[0, 1, 2].map(i => (
                  <select key={i} aria-label={`Origin ability ${i + 1}`} value={originCustom.abilityScores[i]} onChange={e => setOriginAbility(i, e.target.value)} style={{ ...fieldStyle(colors), width: 160 }}>
                    {ABILITIES.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                ))}
              </div>
              <div style={{ fontSize: 12, opacity: 0.8, marginBottom: 6 }}>Skill proficiencies (two)</div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
                {[0, 1].map(i => (
                  <select key={i} aria-label={`Origin skill ${i + 1}`} value={originCustom.skills[i] || ""} onChange={e => setOriginSkill(i, e.target.value)} style={{ ...fieldStyle(colors), width: 200 }}>
                    {ALL_SKILLS.map(k => <option key={k} value={k}>{k}</option>)}
                  </select>
                ))}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }} className="two-col">
                <div>
                  <div style={{ fontSize: 12, opacity: 0.8, marginBottom: 6 }}>Origin Feat</div>
                  <input aria-label="Origin Feat" list="hba-feat-list" value={originCustom.feat} onChange={e => setOrigin({ feat: e.target.value.slice(0, 60) })} placeholder="Origin Feat" style={fieldStyle(colors)} />
                </div>
                <div>
                  <div style={{ fontSize: 12, opacity: 0.8, marginBottom: 6 }}>Tool proficiency</div>
                  <input aria-label="Origin tool" value={originCustom.tool} onChange={e => setOrigin({ tool: e.target.value.slice(0, 60) })} placeholder="Tool" style={fieldStyle(colors)} />
                </div>
              </div>
              <button onClick={resetOrigin} data-testid="origin-reset" style={{ background: "transparent", border: `1px solid ${colors.brass}`, color: colors.brassLight, borderRadius: 6, padding: "5px 12px", fontSize: 12, cursor: "pointer" }}>Reset to {background}</button>
            </div>
          )}
          <div style={{ fontSize: 13, marginBottom: 10 }}>
            <strong>{background}</strong>{originCustom && <SourceTag text="Customized origin" colors={colors} />} grants ability score increases from: {bg.abilityScores.join(", ")}
          </div>
          <div style={{ display: "flex", gap: 16, marginBottom: 10, fontSize: 13 }}>
            <label><input type="radio" checked={bgBonusMode === "2-1"} onChange={() => { setBgBonusMode("2-1"); setBgBonusChoices([]); }} /> +2 / +1</label>
            <label><input type="radio" checked={bgBonusMode === "1-1-1"} onChange={() => { setBgBonusMode("1-1-1"); setBgBonusChoices([]); }} /> +1 / +1 / +1</label>
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {Array.from({ length: numChoices }).map((_, idx) => (
              <select key={idx} value={bgBonusChoices[idx] || ""} onChange={e => handleBonusChoice(idx, e.target.value)} style={{ ...fieldStyle(colors), width: 160 }}>
                <option value="">{bgBonusMode === "2-1" ? `${idx === 0 ? "+2 to..." : "+1 to..."}` : "+1 to..."}</option>
                {bg.abilityScores.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            ))}
          </div>
          <div style={{ marginTop: 10, fontSize: 13, opacity: 0.85 }}>
            <strong>Origin Feat:</strong> {bg.feat}<br/>
            <strong>Skill Proficiencies:</strong> {bg.skills.join(", ")}<br/>
            <strong>Tool Proficiency:</strong> {bg.tool}
          </div>
        </div>
      </Section>

      <Section title="Alignment" colors={colors} fontDisplay={fontDisplay}>
        <input value={alignment} onChange={e => setAlignment(e.target.value)} placeholder="e.g. Neutral Good" style={{ ...fieldStyle(colors), maxWidth: 260 }} />
      </Section>

      <Section title="Important Items" colors={colors} fontDisplay={fontDisplay}>
        {pinnedItems.length === 0 ? (
          <div style={{ color: colors.parchment + "55", fontSize: 14, fontFamily: "'Crimson Text','Georgia',serif", fontStyle: "italic" }}>
            No important items yet — add them from the Magic Items or Mundane Items tabs.
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {pinnedItems.map(item => {
              const isMagic = item.rarity !== undefined;
              const dotColor = isMagic ? RARITY_COLORS[item.rarity] : colors.parchment + "99";
              return (
                <PinnedItemRow key={item.name} item={item} isMagic={isMagic} dotColor={dotColor} onRemove={() => setPinnedItems(prev => prev.filter(p => p.name !== item.name))} colors={colors} fontDisplay={fontDisplay} />
              );
            })}
          </div>
        )}
      </Section>
    </div>
  );
}

function PinnedItemRow({ item, isMagic, dotColor, onRemove, colors }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        display: "flex", alignItems: "center", gap: 10, padding: "7px 12px",
        borderRadius: 6, background: hovered ? colors.blood + "22" : colors.inkLight,
        border: `1px solid ${hovered ? colors.blood + "66" : colors.brass + "22"}`,
        transition: "background 0.15s, border-color 0.15s", cursor: "default"
      }}
    >
      <span style={{ width: 9, height: 9, borderRadius: "50%", background: dotColor, flexShrink: 0 }} />
      <span style={{ flex: 1, color: colors.parchment, fontSize: 14, fontFamily: "'Crimson Text','Georgia',serif", fontWeight: hovered ? 600 : 400 }}>
        {item.name}
      </span>
      {isMagic && item.attunement && (
        <span style={{ fontSize: 11, color: colors.brassLight, opacity: 0.75 }}>attunement</span>
      )}
      {item.rarity && (
        <span style={{ fontSize: 11, color: dotColor, opacity: 0.85 }}>{item.rarity}</span>
      )}
      {item.category && (
        <span style={{ fontSize: 11, color: colors.parchment + "55" }}>{item.category}</span>
      )}
      {hovered && (
        <button
          onClick={onRemove}
          style={{
            background: colors.blood, border: "none", color: colors.parchment,
            borderRadius: 4, width: 22, height: 22, display: "flex", alignItems: "center",
            justifyContent: "center", cursor: "pointer", fontSize: 14, fontWeight: 700,
            flexShrink: 0, lineHeight: 1
          }}
        >×</button>
      )}
    </div>
  );
}

const REST_PURPLE = "#B388FF"; // something a rest lets you change, until you change it
const CUSTOM_RED = "#E5484D"; // anything changed beyond the rules: red outline when added, red letters when removed

function SourceTag({ text, custom, colors }) {
  return <span style={{ fontSize: 10, letterSpacing: "0.04em", textTransform: "uppercase", padding: "1px 5px", borderRadius: 8, marginLeft: 6,
    border: `1px solid ${custom ? CUSTOM_RED : colors.brass + "88"}`, color: custom ? CUSTOM_RED : colors.brassLight }}>{text}</span>;
}

function AbilitiesTab({ featBonuses, pointBuy, updatePointBuy, pointBuyRemaining, finalScores, finalMods, bgBonuses, asiBonuses, colors, fontDisplay,
  custom, abilityMode, setAbilityMode, customScores, setCustomScores, abilityAdj, setAbilityAdj }) {
  const [editing, setEditing] = useState(false);     // custom scores are being set
  const [adjOpen, setAdjOpen] = useState(null);      // which ability's additional modifier is open
  const isCustom = abilityMode === "custom";
  const base = (a) => (isCustom ? customScores[a] : pointBuy[a]);
  const round = { width: 28, height: 28, borderRadius: 14, border: `1px solid ${colors.brass}`, background: "transparent", color: colors.parchment, cursor: "pointer" };
  const modeBtn = (on) => ({ background: on ? colors.brass : "transparent", color: on ? colors.ink : colors.brassLight, border: `1px solid ${colors.brass}`, padding: "6px 14px", fontFamily: fontDisplay, fontSize: 12, fontWeight: 700, cursor: "pointer" });
  const setCustom = (a, v) => setCustomScores((prev) => ({ ...prev, [a]: Math.max(1, Math.min(30, parseInt(v, 10) || 1)) }));
  const setAdj = (a, d) => setAbilityAdj((prev) => { const n = Math.max(-20, Math.min(20, (prev[a] || 0) + d)); const next = { ...prev }; if (n) next[a] = n; else delete next[a]; return next; });
  const startCustom = () => { if (!isCustom) { setCustomScores({ ...pointBuy }); setAbilityMode("custom"); } setEditing(true); };
  return (
    <div>
      <Section title="Ability Scores" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <div style={{ display: "inline-flex", borderRadius: 6, overflow: "hidden" }}>
            <button style={modeBtn(!isCustom)} onClick={() => { setAbilityMode("pointbuy"); setEditing(false); }}>Point Buy</button>
            {(custom || isCustom) && <button style={modeBtn(isCustom)} onClick={startCustom} data-testid="mode-custom">Custom</button>}
          </div>
          <div data-testid="points-badge" style={{ padding: "8px 16px", borderRadius: 6, background: !isCustom && pointBuyRemaining < 0 ? colors.blood : colors.inkLight,
            border: `1px solid ${isCustom ? CUSTOM_RED : colors.brass + "66"}`, fontFamily: fontDisplay, fontWeight: 700, color: isCustom ? CUSTOM_RED : colors.parchment }}>
            {isCustom ? `Custom Points: ${ABILITIES.reduce((t, a) => t + customScores[a], 0)} / ∞` : `Points Remaining: ${pointBuyRemaining} / 27`}
          </div>
          {isCustom && (editing
            ? <button style={modeBtn(true)} onClick={() => setEditing(false)} data-testid="accept-custom">Accept</button>
            : custom && <button style={modeBtn(false)} onClick={() => setEditing(true)}>Edit Scores</button>)}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 12 }}>
          {ABILITIES.map(a => (
            <div key={a} data-testid={`ability-${a}`} style={{ background: colors.inkLight, border: `1px solid ${isCustom ? CUSTOM_RED : colors.brass + "40"}`, borderRadius: 8, padding: 12, textAlign: "center" }}>
              <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", opacity: 0.8 }}>{a}</div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, margin: "8px 0" }}>
                {isCustom ? (editing ? <>
                  <button onClick={() => setCustom(a, customScores[a] - 1)} style={round}>−</button>
                  <input type="number" min="1" max="30" aria-label={`${a} score`} value={customScores[a]} onChange={e => setCustom(a, e.target.value)}
                    style={{ width: 58, textAlign: "center", fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, background: colors.ink, color: CUSTOM_RED, border: `1px solid ${CUSTOM_RED}`, borderRadius: 6, padding: "2px 0" }} />
                  <button onClick={() => setCustom(a, customScores[a] + 1)} style={round}>+</button>
                </> : <span style={{ fontFamily: fontDisplay, fontSize: 24, fontWeight: 700, minWidth: 44, border: `2px solid ${CUSTOM_RED}`, borderRadius: 20, padding: "0 10px" }}>{customScores[a]}</span>) : <>
                  <button onClick={() => updatePointBuy(a, pointBuy[a] - 1)} disabled={pointBuy[a] <= 8} style={{ ...round, opacity: pointBuy[a] <= 8 ? 0.3 : 1 }}>−</button>
                  <span style={{ fontFamily: fontDisplay, fontSize: 24, fontWeight: 700, minWidth: 28 }}>{pointBuy[a]}</span>
                  <button onClick={() => updatePointBuy(a, pointBuy[a] + 1)} disabled={pointBuy[a] >= 15} style={{ ...round, opacity: pointBuy[a] >= 15 ? 0.3 : 1 }}>+</button>
                </>}
              </div>
              <div style={{ fontSize: 11, color: colors.brassLight, minHeight: 16 }}>
                {bgBonuses[a] ? `+${bgBonuses[a]} BG ` : ""}{asiBonuses[a] ? `+${asiBonuses[a]} ASI ` : ""}{featBonuses[a] ? `+${featBonuses[a]} Feat ` : ""}
                {abilityAdj[a] ? <span style={{ color: CUSTOM_RED }}>{fmt(abilityAdj[a])} Custom</span> : null}
              </div>
              <div style={{ fontFamily: fontDisplay, fontSize: 18, color: colors.brassLight, marginTop: 4 }}>
                {finalScores[a]} ({fmt(finalMods[a])})
              </div>
              {(custom || abilityAdj[a]) && (adjOpen === a ? (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginTop: 8 }}>
                  <button onClick={() => setAdj(a, -1)} style={round} aria-label={`Lower ${a} additional modifier`}>−</button>
                  <span style={{ fontFamily: fontDisplay, fontWeight: 700, color: abilityAdj[a] ? CUSTOM_RED : colors.parchment, minWidth: 28 }}>{fmt(abilityAdj[a] || 0)}</span>
                  <button onClick={() => setAdj(a, 1)} style={round} aria-label={`Raise ${a} additional modifier`}>+</button>
                  <button onClick={() => setAdjOpen(null)} style={{ ...round, width: "auto", padding: "0 10px", fontSize: 11 }}>Done</button>
                </div>
              ) : custom && (
                <button onClick={() => setAdjOpen(a)} style={{ marginTop: 8, background: "transparent", border: `1px dashed ${colors.brass}88`, color: colors.brassLight, borderRadius: 6, padding: "3px 8px", fontSize: 11, cursor: "pointer" }}>Additional modifier</button>
              ))}
            </div>
          ))}
        </div>
        <div style={{ fontSize: 12, opacity: 0.7, marginTop: 12, lineHeight: 1.5 }}>
          {isCustom
            ? "Custom scores have no point limit: set each score from 1 to 30, then press Accept. Background increases, Ability Score Improvements and additional modifiers are added on top."
            : "Standard point buy: scores range 8 to 15 before bonuses. Cost: 9=1pt, 10=2, 11=3, 12=4, 13=5, 14=7, 15=9. Background increases and Ability Score Improvements are added automatically above."}
          {!custom && " Turn on Further Customization to set scores freely or add modifiers."}
        </div>
      </Section>
    </div>
  );
}

function SkillsTab({ expertiseMax, expertiseList, expertiseCustom, cls, skillInfo, toggleSkill, addSkill, removeSkill, skillExpertise, toggleExpertise, skillMods, savingThrows, saveInfo, toggleSave, custom, colors, fontDisplay }) {
  const pick = { ...fieldStyle(colors), width: "auto", cursor: "pointer" };
  const notProf = ALL_SKILLS.filter(k => !skillInfo.source[k]);
  const prof = ALL_SKILLS.filter(k => skillInfo.source[k]);
  return (
    <div>
      <Section title="Saving Throws" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 10 }}>
          {custom ? "Click a saving throw to add or remove proficiency." : "Your class grants these. Turn on Further Customization to change them."}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 10 }}>
          {ABILITIES.map(a => {
            const st = saveInfo[a]; // "class" | "added" | "removed" | ""
            return (
              <div key={a} data-testid={`save-${a}`} data-state={st} onClick={() => toggleSave(a)} style={{
                display: "flex", justifyContent: "space-between", alignItems: "center", background: colors.inkLight,
                border: `${st === "added" ? 2 : 1}px solid ${st === "added" ? CUSTOM_RED : st === "class" ? colors.brass : colors.brass + "30"}`,
                borderRadius: 6, padding: "8px 12px", cursor: custom ? "pointer" : "default"
              }}>
                <span style={{ fontSize: 13, color: st === "removed" ? CUSTOM_RED : colors.parchment }}>
                  {a}
                  {st === "class" && <SourceTag text="Class" colors={colors} />}
                  {st === "added" && <SourceTag text="Custom" custom colors={colors} />}
                  {st === "removed" && <span style={{ fontSize: 10, marginLeft: 6 }}>removed</span>}
                </span>
                <span style={{ fontFamily: fontDisplay, fontWeight: 700, color: st === "removed" ? CUSTOM_RED : colors.parchment }}>{fmt(savingThrows[a])}</span>
              </div>
            );
          })}
        </div>
      </Section>

      <Section title="Skills" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ fontSize: 13, marginBottom: 10, lineHeight: 1.6 }} data-testid="skill-choices">
          {Object.entries(skillInfo.grantedBy).map(([src, list]) => <div key={src}><strong>{src}</strong> grants {list.join(" and ")}.</div>)}
          <div><strong>Class</strong>: choose {skillInfo.classCount} from {skillInfo.classAny ? "any skill" : skillInfo.classPool.join(", ")} ({skillInfo.classLeft} left).</div>
          {skillInfo.speciesCount > 0 && <div><strong>Species</strong>: choose {skillInfo.speciesCount} from {skillInfo.speciesAny ? "any skill" : skillInfo.speciesPool.join(", ")} ({skillInfo.speciesLeft} left).</div>}
          {skillInfo.anyCount > 0 && <div><strong>Features</strong>: choose {skillInfo.anyCount} from any skill ({skillInfo.anyLeft} left).</div>}
          {(expertiseMax > 0 || expertiseList.length > 0) && <div><strong>Expertise</strong>: your class grants {expertiseMax} ({Math.max(0, expertiseMax - expertiseList.length)} left). Click a star on a skill you are proficient in.</div>}
        </div>
        <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 10 }}>
          Click a skill with a dashed outline to choose it. Click the star for Expertise.
          {custom ? " Further Customization is on: you can also add any skill or remove one you were granted." : ""}
        </div>
        {custom && (
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
            <select aria-label="Add a skill" value="" onChange={e => { if (e.target.value) addSkill(e.target.value); }} style={pick}>
              <option value="">+ Add a skill</option>
              {notProf.map(k => <option key={k} value={k}>{k}</option>)}
            </select>
            <select aria-label="Remove a skill" value="" onChange={e => { if (e.target.value) removeSkill(e.target.value); }} style={pick}>
              <option value="">− Remove a skill</option>
              {prof.map(k => <option key={k} value={k}>{k}</option>)}
            </select>
          </div>
        )}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 6 }}>
          {ALL_SKILLS.map(skill => {
            const src = skillInfo.source[skill] || "";
            const removed = skillInfo.removed.includes(skill);
            const isCustom = src === "Custom";
            const open = !src && !removed && skillInfo.canChoose.includes(skill);
            const isExpertise = expertiseList.includes(skill);
            const redStar = expertiseCustom.includes(skill);
            return (
              <div key={skill} data-testid={`skill-${skill}`} data-expertise={redStar ? "custom" : isExpertise ? "yes" : ""} data-state={removed ? "removed" : src} data-source={src} style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                background: src && !isCustom ? colors.brass + "22" : colors.inkLight,
                border: isCustom ? `2px solid ${CUSTOM_RED}` : src ? `1px solid ${colors.brass}` : open ? `1px dashed ${colors.brass}` : `1px solid ${colors.brass}30`,
                borderRadius: 6, padding: "6px 10px", cursor: "pointer"
              }}>
                <span onClick={() => toggleSkill(skill)} style={{ fontSize: 13, flex: 1, color: removed ? CUSTOM_RED : colors.parchment }}>
                  {skill} <span style={{ opacity: 0.6, fontSize: 11 }}>({ABBR[SKILL_ABILITY[skill]]})</span>
                  {src && <SourceTag text={src === "Background" ? "BG" : src} custom={isCustom} colors={colors} />}
                  {removed && <span style={{ fontSize: 10, marginLeft: 6 }}>removed</span>}
                </span>
                <span onClick={() => toggleExpertise(skill)} title="Expertise" style={{ marginRight: 8, color: redStar ? CUSTOM_RED : isExpertise ? colors.brassLight : colors.parchment + "40", fontSize: 14 }}>★</span>
                <span style={{ fontFamily: fontDisplay, fontWeight: 700, minWidth: 30, textAlign: "right", color: removed ? CUSTOM_RED : colors.parchment }}>{fmt(skillMods[skill])}</span>
              </div>
            );
          })}
        </div>
      </Section>
    </div>
  );
}

function CombatTab({ statAdj, setStatAdj, inventory, masteries, setMasteries, custom, masteryGlow, armor, setArmor, shield, setShield, weapons, setWeapons, ac, sheetActions, pools, derived, cls, level, effectiveMaxHp, currentHp, setCurrentHp, tempHp, setTempHp, hitDiceUsed, setHitDiceUsed, finalMods, armorClass, initiative, speed, colors, fontDisplay }) {
  const displayHp = currentHp === null ? effectiveMaxHp : currentHp;
  // Further Customization: an additional modifier on a stat, shown in red
  const adjust = (k, step) => (custom || statAdj[k]) ? (
    <div data-testid={`adj-${k}`} style={{ marginTop: 6, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 12 }}>
      {custom && <button aria-label={`Lower ${k}`} onClick={() => setStatAdj(prev => { const n = (prev[k] || 0) - step; const o = { ...prev }; if (n) o[k] = n; else delete o[k]; return o; })} style={{ width: 22, height: 22, borderRadius: 11, border: `1px solid ${colors.brass}`, background: "transparent", color: colors.parchment, cursor: "pointer" }}>−</button>}
      <span style={{ color: statAdj[k] ? CUSTOM_RED : colors.parchment, minWidth: 60 }}>{statAdj[k] ? `${fmt(statAdj[k])} Custom` : "modifier"}</span>
      {custom && <button aria-label={`Raise ${k}`} onClick={() => setStatAdj(prev => { const n = (prev[k] || 0) + step; const o = { ...prev }; if (n) o[k] = n; else delete o[k]; return o; })} style={{ width: 22, height: 22, borderRadius: 11, border: `1px solid ${colors.brass}`, background: "transparent", color: colors.parchment, cursor: "pointer" }}>+</button>}
    </div>
  ) : null;
  const redIf = (k) => (statAdj[k] ? `2px solid ${CUSTOM_RED}` : `1px solid ${colors.brass}55`);
  return (
    <div>
      <Section title="Hit Points" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
          <div style={{ background: colors.inkLight, border: redIf("hp"), borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Max HP</div>
            <div style={{ fontFamily: fontDisplay, fontSize: 26, fontWeight: 700, color: colors.brassLight }}>{effectiveMaxHp}</div>
            <div style={{ fontSize: 10, opacity: 0.6 }}>Level 1: the whole die. After that: half the die plus 1. Constitution modifier each level.</div>
            {adjust("hp", 1)}
          </div>
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Current HP</div>
            <input type="number" value={displayHp} onChange={e => setCurrentHp(parseInt(e.target.value) || 0)}
              style={{ width: "100%", textAlign: "center", fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, background: "transparent", border: "none", color: colors.parchment }} />
          </div>
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 8, padding: 12, textAlign: "center" }}>
            <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>Temp HP</div>
            <input type="number" value={tempHp} onChange={e => setTempHp(parseInt(e.target.value) || 0)}
              style={{ width: "100%", textAlign: "center", fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, background: "transparent", border: "none", color: colors.parchment }} />
          </div>
        </div>
        <div style={{ marginTop: 14, fontSize: 13 }}>
          <strong>Hit Dice:</strong> {level}d{cls.hitDie} total &nbsp;|&nbsp; Used:
          <input type="number" min={0} max={level} value={hitDiceUsed} onChange={e => setHitDiceUsed(Math.max(0, Math.min(level, parseInt(e.target.value) || 0)))}
            style={{ ...fieldStyle(colors), display: "inline-block", width: 60, marginLeft: 8 }} />
          <span style={{ marginLeft: 8, opacity: 0.7 }}>(remaining: {level - hitDiceUsed})</span>
        </div>
      </Section>

      <Section title="Defenses & Movement" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
          {[["Armor Class", armorClass, ac.how, "ac", 1], ["Initiative", fmt(initiative), "", "initiative", 1], ["Speed", `${speed} ft`, "", "speed", 5]].map(([label, val, note, k, step]) => (
            <div key={label} style={{ background: colors.inkLight, border: redIf(k), borderRadius: 8, padding: 12, textAlign: "center" }}>
              <div style={{ fontSize: 11, textTransform: "uppercase", opacity: 0.8 }}>{label}</div>
              <div style={{ fontFamily: fontDisplay, fontSize: 22, fontWeight: 700, color: colors.brassLight }}>{val}</div>
              {note && <div style={{ fontSize: 10, opacity: 0.6, marginTop: 4 }}>{note}</div>}
              {adjust(k, step)}
            </div>
          ))}
        </div>
      </Section>

      <GearSection {...{ inventory, armor, setArmor, shield, setShield, weapons, setWeapons, ac, colors, fontDisplay, masteries, setMasteries, masteryCount: derived.masteryCount, custom, glow: masteryGlow }} />
      {(derived.resist.length > 0 || derived.condImmune.length > 0 || derived.saveAdv.length > 0 || derived.condAdv.length > 0 || derived.senses.length > 0) && (
        <Section title="Defenses From Features" colors={colors} fontDisplay={fontDisplay}>
          <div style={{ fontSize: 14, lineHeight: 1.7 }} data-testid="defenses">
            {derived.resist.length > 0 && <div><strong>Resistance:</strong> {Array.from(new Set(derived.resist)).join(", ")}</div>}
            {derived.condImmune.length > 0 && <div><strong>Immune to:</strong> {Array.from(new Set(derived.condImmune)).join(", ")}</div>}
            {derived.saveAdv.length > 0 && <div><strong>Advantage on saves:</strong> {Array.from(new Set(derived.saveAdv)).join(", ")}</div>}
            {derived.condAdv.length > 0 && <div><strong>Advantage on saves against:</strong> {Array.from(new Set(derived.condAdv)).join(", ")}</div>}
            {derived.senses.length > 0 && <div><strong>Senses:</strong> {derived.senses.join(", ")}</div>}
          </div>
        </Section>
      )}
      <Section title="Attacks & Activated Features" colors={colors} fontDisplay={fontDisplay}>
        <div style={{ fontSize: 12, opacity: 0.7, marginBottom: 10 }}>Worked out from this character's current numbers. These go to the Combat Resolver with the character.</div>
        {Object.keys(pools).length > 0 && <div style={{ fontSize: 14, marginBottom: 10 }} data-testid="pools"><strong>Resources:</strong> {Object.entries(pools).map(([n, p]) => `${n} ${p.max} (${p.recharge === "short" ? "Short Rest" : p.shortRegain ? "Long Rest, 1 back on a Short Rest" : "Long Rest"})`).join(" · ")}</div>}
        {sheetActions.map((a, i) => (
          <div key={i} style={{ padding: "6px 0", borderBottom: `1px solid ${colors.brass}22` }} data-testid="sheet-action">
            <span style={{ fontFamily: fontDisplay, fontSize: 14, color: colors.brassLight }}>{a.name}</span>
            <span style={{ fontSize: 13, marginLeft: 10 }}>{actionSummary(a)}</span>
          </div>
        ))}
      </Section>
    </div>
  );
}

/* ============ FEATS ============ */
// Every feat in the System Reference Document 5.2.1 (CC-BY-4.0, Wizards of the Coast), with its rules text as written.
// grants: what the builder asks for and applies when the feat is taken.
//   skills {count, tools}   proficiencies chosen when the feat is taken
//   ability {from, max}     +1 to one ability score (from [] = any)
//   magic                   spell list, spellcasting ability, two cantrips and a level 1 spell
// needs: what the rules require before it can be taken.
const FEATS = {
  "Alert": { category: "Origin", initiativeProf: true,
    text: "Initiative Proficiency. When you roll Initiative, you can add your Proficiency Bonus to the roll. Initiative Swap. Immediately after you roll Initiative, you can swap your Initiative with the Initiative of one willing ally in the same combat. You can't make this swap if you or the ally has the Incapacitated condition." },
  "Magic Initiate": { category: "Origin", repeatable: true, grants: { magic: true },
    text: "Two Cantrips. You learn two cantrips of your choice from the Cleric, Druid, or Wizard spell list. Intelligence, Wisdom, or Charisma is your spellcasting ability for this feat's spells (choose when you select this feat). Level 1 Spell. Choose a level 1 spell from the same list you selected for this feat's cantrips. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have. Spell Change. Whenever you gain a new level, you can replace one of the spells you chose for this feat with a different spell of the same level from the chosen spell list. Repeatable. You can take this feat more than once, but you must choose a different spell list each time." },
  "Savage Attacker": { category: "Origin",
    text: "You've trained to deal particularly damaging strikes. Once per turn when you hit a target with a weapon, you can roll the weapon's damage dice twice and use either roll against the target." },
  "Skilled": { category: "Origin", repeatable: true, grants: { skills: { count: 3, tools: true } },
    text: "You gain proficiency in any combination of three skills or tools of your choice. Repeatable. You can take this feat more than once." },
  "Grappler": { category: "General", prereq: "Level 4+, Strength or Dexterity 13+", needs: { level: 4, score: { abilities: ["Strength", "Dexterity"], min: 13 } },
    grants: { ability: { from: ["Strength", "Dexterity"], max: 20 } },
    text: "Ability Score Increase. Increase your Strength or Dexterity score by 1, to a maximum of 20. Punch and Grab. When you hit a creature with an Unarmed Strike as part of the Attack action on your turn, you can use both the Damage and the Grapple option. You can use this benefit only once per turn. Attack Advantage. You have Advantage on attack rolls against a creature Grappled by you. Fast Wrestler. You don't have to spend extra movement to move a creature Grappled by you if the creature is your size or smaller." },
  "Archery": { category: "Fighting Style", prereq: "Fighting Style Feature",
    text: "You gain a +2 bonus to attack rolls you make with Ranged weapons." },
  "Defense": { category: "Fighting Style", prereq: "Fighting Style Feature",
    text: "While you're wearing Light, Medium, or Heavy armor, you gain a +1 bonus to Armor Class." },
  "Great Weapon Fighting": { category: "Fighting Style", prereq: "Fighting Style Feature",
    text: "When you roll damage for an attack you make with a Melee weapon that you are holding with two hands, you can treat any 1 or 2 on a damage die as a 3. The weapon must have the Two-Handed or Versatile property to gain this benefit." },
  "Two-Weapon Fighting": { category: "Fighting Style", prereq: "Fighting Style Feature",
    text: "When you make an extra attack as a result of using a weapon that has the Light property, you can add your ability modifier to the damage of that attack if you aren't already adding it to the damage." },
  "Boon of Combat Prowess": { category: "Epic Boon", prereq: "Level 19+", needs: { level: 19 }, grants: { ability: { from: [], max: 30 } },
    text: "Ability Score Increase. Increase one ability score of your choice by 1, to a maximum of 30. Peerless Aim. When you miss with an attack roll, you can hit instead. Once you use this benefit, you can't use it again until the start of your next turn." },
  "Boon of Dimensional Travel": { category: "Epic Boon", prereq: "Level 19+", needs: { level: 19 }, grants: { ability: { from: [], max: 30 } },
    text: "Ability Score Increase. Increase one ability score of your choice by 1, to a maximum of 30. Blink Steps. Immediately after you take the Attack action or the Magic action, you can teleport up to 30 feet to an unoccupied space you can see." },
  "Boon of Fate": { category: "Epic Boon", prereq: "Level 19+", needs: { level: 19 }, grants: { ability: { from: [], max: 30 } },
    text: "Ability Score Increase. Increase one ability score of your choice by 1, to a maximum of 30. Improve Fate. When you or another creature within 60 feet of you succeeds on or fails a D20 Test, you can roll 2d4 and apply the total rolled as a bonus or penalty to the d20 roll. Once you use this benefit, you can't use it again until you roll Initiative or finish a Short or Long Rest." },
  "Boon of Irresistible Offense": { category: "Epic Boon", prereq: "Level 19+", needs: { level: 19 }, grants: { ability: { from: ["Strength", "Dexterity"], max: 30 } },
    text: "Ability Score Increase. Increase your Strength or Dexterity score by 1, to a maximum of 30. Overcome Defenses. The Bludgeoning, Piercing, and Slashing damage you deal always ignores Resistance. Overwhelming Strike. When you roll a 20 on the d20 for an attack roll, you can deal extra damage to the target equal to the ability score increased by this feat. The extra damage's type is the same as the attack's type." },
  "Boon of Spell Recall": { category: "Epic Boon", prereq: "Level 19+, Spellcasting Feature", needs: { level: 19, spellcasting: true }, grants: { ability: { from: ["Intelligence", "Wisdom", "Charisma"], max: 30 } },
    text: "Ability Score Increase. Increase your Intelligence, Wisdom, or Charisma score by 1, to a maximum of 30. Free Casting. Whenever you cast a spell with a level 1–4 spell slot, roll 1d4. If the number you roll is the same as the slot's level, the slot isn't expended." },
  "Boon of the Night Spirit": { category: "Epic Boon", prereq: "Level 19+", needs: { level: 19 }, grants: { ability: { from: [], max: 30 } },
    actions: [{ name: "Merge with Shadows", type: "apply", activation: "bonus", self: true, onUse: { conds: [{ name: "Invisible" }] },
      desc: "While within Dim Light or Darkness, you can give yourself the Invisible condition as a Bonus Action. The condition ends on you immediately after you take an action, a Bonus Action, or a Reaction." }],
    text: "Ability Score Increase. Increase one ability score of your choice by 1, to a maximum of 30. Merge with Shadows. While within Dim Light or Darkness, you can give yourself the Invisible condition as a Bonus Action. The condition ends on you immediately after you take an action, a Bonus Action, or a Reaction. Shadowy Form. While within Dim Light or Darkness, you have Resistance to all damage except Psychic and Radiant." },
  "Boon of Truesight": { category: "Epic Boon", prereq: "Level 19+", needs: { level: 19 }, grants: { ability: { from: [], max: 30 } }, sense: "Truesight 60 ft.",
    text: "Ability Score Increase. Increase one ability score of your choice by 1, to a maximum of 30. Truesight. You have Truesight with a range of 60 feet." },
};
const FEAT_CATEGORIES = ["Origin", "General", "Fighting Style", "Epic Boon"];
// "Magic Initiate (Cleric)" is the Magic Initiate feat with its spell list already chosen.
const featBase = (name) => String(name || "").replace(/\s*\([^)]*\)\s*$/, "").trim();
const featDef = (name) => FEATS[name] || FEATS[featBase(name)] || null;
const featPreset = (name) => { const m = /\(([^)]+)\)\s*$/.exec(String(name || "")); return m ? m[1] : ""; };
// Classes that grant Expertise: level reached -> total skills with Expertise.
const EXPERTISE_SLOTS = { Rogue: { 1: 2, 6: 4 }, Bard: { 2: 2, 9: 4 }, Ranger: { 2: 1, 9: 3 }, Wizard: { 2: 1 } };
function expertiseSlots(className, level) {
  let n = 0;
  Object.entries(EXPERTISE_SLOTS[className] || {}).forEach(([l, total]) => { if (level >= +l) n = Math.max(n, total); });
  return n;
}
// Every place this character gets a feat from. cats: the feat categories the rules allow there.
function featSlots(className, subclassName, level, species, originFeat) {
  const slots = [{ id: "origin", label: "Origin Feat (background)", cats: ["Origin"], fixed: originFeat || "" }];
  if (species === "Human") slots.push({ id: "species", label: "Human: Versatile", cats: ["Origin"] });
  getFeaturesUpToLevel(className, subclassName, level).forEach(f => {
    const sub = f.source === "Subclass" ? "s" : "";
    if (/^(Additional )?Fighting Style/.test(f.text)) slots.push({ id: `fs${f.level}${sub}`, label: `Level ${f.level}: ${f.text}`, cats: ["Fighting Style"] });
    if (/^Epic Boon/.test(f.text)) slots.push({ id: `boon${f.level}`, label: `Level ${f.level}: Epic Boon`, cats: ["Epic Boon", "General", "Origin"] });
  });
  return slots;
}
// Why the rules don't allow this feat here, or "" if they do.
function featProblem(name, cats, ch) {
  const def = featDef(name);
  if (!def) return "";
  if (def.category !== "Any" && !cats.includes(def.category)) return `${def.category} feat in a slot for ${cats.join(" or ")} feats`;
  const n = def.needs || {};
  if (n.level && ch.level < n.level) return `needs Level ${n.level}+`;
  if (n.score && !n.score.abilities.some(a => ch.scores[a] >= n.score.min)) return `needs ${n.score.abilities.join(" or ")} ${n.score.min}+`;
  if (n.spellcasting && !ch.caster) return "needs the Spellcasting feature";
  return "";
}

// The choices a feat asks for, shown right where the feat is picked.
function FeatChoices({ name, choices, onChange, colors }) {
  const def = featDef(name);
  if (!def) return null;
  const g = def.grants || {};
  const c = choices || {};
  const set = (patch) => onChange({ ...c, ...patch });
  const sel = { ...fieldStyle(colors), width: 190 };
  const label = { fontSize: 12, opacity: 0.8, margin: "8px 0 4px" };
  return (
    <div data-testid="feat-choices">
      {def.prereq && <div style={{ fontSize: 12, opacity: 0.75, marginTop: 6 }}><strong>Prerequisite:</strong> {def.prereq}</div>}
      <div style={{ fontSize: 13, opacity: 0.9, marginTop: 6, lineHeight: 1.5 }}>{def.text}</div>
      {g.skills && (<>
        <div style={label}>Choose {g.skills.count} {g.skills.tools ? "skills or tools" : "skills"}</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {Array.from({ length: g.skills.count }).map((_, i) => {
            const v = (c.skills || [])[i] || "";
            const isTool = v.startsWith("tool:");
            const put = (val) => { const next = [...(c.skills || [])]; while (next.length < g.skills.count) next.push(""); next[i] = val; set({ skills: next }); };
            return (
              <span key={i} style={{ display: "inline-flex", gap: 6 }}>
                <select aria-label={`${featBase(name)} proficiency ${i + 1}`} value={isTool ? "tool:" : v} onChange={e => put(e.target.value)} style={sel}>
                  <option value="">Choose...</option>
                  {(g.skills.from && g.skills.from.length ? g.skills.from : ALL_SKILLS).map(k => <option key={k} value={k}>{k}</option>)}
                  {g.skills.tools && <option value="tool:">A tool...</option>}
                </select>
                {isTool && <input aria-label={`${featBase(name)} tool ${i + 1}`} value={v.slice(5)} onChange={e => put("tool:" + e.target.value.slice(0, 40))} placeholder="Tool name" style={{ ...fieldStyle(colors), width: 160 }} />}
              </span>
            );
          })}
        </div>
      </>)}
      {g.ability && (<>
        <div style={label}>Increase one ability score by 1 (maximum {g.ability.max})</div>
        <select aria-label={`${featBase(name)} ability`} value={c.ability || ""} onChange={e => set({ ability: e.target.value })} style={sel}>
          <option value="">+1 to...</option>
          {(g.ability.from && g.ability.from.length ? g.ability.from : ABILITIES).map(a => <option key={a} value={a}>{a}</option>)}
        </select>
      </>)}
      {g.magic && (<>
        <div style={label}>Spell list and spellcasting ability</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <select aria-label="Magic Initiate spell list" value={c.list || featPreset(name) || ""} disabled={!!featPreset(name)} onChange={e => set({ list: e.target.value })} style={sel}>
            <option value="">Spell list...</option>
            {["Cleric", "Druid", "Wizard"].map(x => <option key={x} value={x}>{x}</option>)}
          </select>
          <select aria-label="Magic Initiate ability" value={c.castAbility || ""} onChange={e => set({ castAbility: e.target.value })} style={sel}>
            <option value="">Spellcasting ability...</option>
            {["Intelligence", "Wisdom", "Charisma"].map(x => <option key={x} value={x}>{x}</option>)}

const ALL_SPELLS = [];

const spellOf = (str) => { const t = String(str || "").trim().toLowerCase(); return SPELL_BY_NAME[t] || SPELL_BY_NAME[t.replace(/\s*\([^)]*\)\s*$/, "")] || null; };
const spellLine = (sp) => (sp.l ? `Level ${sp.l} ${sp.s}` : `${sp.s} cantrip`);
// Prepared Spells by class level, from the class tables.
const PREPARED_SPELLS = {
  Bard:     [4,5,6,7,9,10,11,12,14,15,16,16,17,17,18,18,19,20,21,22],
  Cleric:   [4,5,6,7,9,10,11,12,14,15,16,16,17,17,18,18,19,20,21,22],
  Druid:    [4,5,6,7,9,10,11,12,14,15,16,16,17,17,18,18,19,20,21,22],
  Sorcerer: [2,4,6,7,9,10,11,12,14,15,16,16,17,17,18,18,19,20,21,22],
  Warlock:  [2,3,4,5,6,7,8,9,10,10,11,11,12,12,13,13,14,14,15,15],
  Wizard:   [4,5,6,7,9,10,11,12,14,15,16,16,17,18,19,21,22,23,24,25],
  Paladin:  [2,3,4,5,6,6,7,7,9,9,10,10,11,11,12,12,14,14,15,15],
  Ranger:   [2,3,4,5,6,6,7,7,9,9,10,10,11,11,12,12,14,14,15,15],
};
function cantripsKnown(className, level) {
  const table = CANTRIPS_KNOWN[className];
  if (!table) return 0;
  let n = 0;
  Object.keys(table).map(Number).sort((a, b) => a - b).forEach(t => { if (level >= t) n = table[t]; });
  return n;
}
function maxSpellLevel(cls, className, level) {
  if (!cls || !cls.casterType) return 0;

  return (getSpellSlots(className, level) || []).length;
}
// Sorts a character's spells into what the rules allow and what goes past them.
function sortSpells(cls, className, level, names, cantripBonus) {
  const caster = !!(cls && cls.casterType);
  const maxLevel = maxSpellLevel(cls, className, level);
  const cantripMax = caster ? cantripsKnown(className, level) + (cantripBonus || 0) : 0;
  const prepTable = PREPARED_SPELLS[className];

    else if (!sp.c.includes(className)) problem = `not on the ${className} spell list`;
    else if (sp.l > maxLevel) problem = `Level ${sp.l} is higher than a level ${level} ${className} can cast`;
    else if (sp.l === 0 && cantrips > cantripMax) problem = `more cantrips than a level ${level} ${className} knows`;
    else if (sp.l > 0 && prepMax != null && prepared > prepMax) problem = `more prepared spells than a level ${level} ${className} has`;
    return { raw, index, sp, problem };

// How a spell resolves in the Combat Resolver, worked out from this character's numbers. Returns null for a spell with no roll.
function spellAction(sp, ctx, opts) {
  const m = sp.m;
  if (!m) return null;
  const out = { name: sp.n, spell: true, slot: sp.l, desc: sp.x.slice(0, 1200) };
  if (m.act) out.activation = m.act;
  let dice = m.dmg ? m.dmg[0] : null;
  if (dice && m.cu) { // cantrip damage grows at levels 5, 11 and 17
    const mult = ctx.LEVEL >= 17 ? 4 : ctx.LEVEL >= 11 ? 3 : ctx.LEVEL >= 5 ? 2 : 1;

  else if (m.k === "save") {
    out.type = "save"; out.saveAbility = m.ab; out.dc = ctx.SPELLDC;
    if (dice) out.dmgList = [[dice, m.dmg[1]]];
    if (m.half) out.halfOnSave = true;
    if (m.cond) { const c = { name: m.cond }; if (m.dur) c.left = m.dur; if (m.rep) c.when = m.rep; out.onFail = { conds: [c] }; }
  }
  else if (m.k === "heal") { out.type = "heal"; out.healDice = evalDice(m.mod ? `${m.heal}+SPELLMOD` : m.heal, ctx); }
  else if (m.k === "auto") { out.type = "auto"; out.dmgList = [[dice, m.dmg[1]]]; }

  if (m.up) out.up = m.up;
  if (m.tg) out.targets = m.tg === "slot" ? 1 : m.tg; // "slot": one more target per slot level, set in the Resolver when cast
  if (m.tg === "slot") out.targetsPerSlot = true;

  const extra = (sp.l === 0 ? (o.cantripDamage || 0) : 0) + ((o.schoolDamage || {})[sp.s] || 0); // Potent Spellcasting, Empowered Evocation
  if (extra && out.dmgList) out.dmgList = [[evalDice(`${out.dmgList[0][0]}+${extra}`, ctx), out.dmgList[0][1]]];
  if (o.potentCantrip && sp.l === 0 && out.dmgList) { if (out.type === "save") out.halfOnSave = true; if (out.type === "attack") out.missHalf = true; }
  if (opts && opts.once) { out.slot = 0; out.usesMax = 1; out.recharge = "long"; } // a feat's free casting
  return out;
}

          <div key={i} style={{ background: colors.inkLight, border: `1px solid ${colors.brass}55`, borderRadius: 6, padding: "8px 12px", textAlign: "center", minWidth: 70 }}>
            <div style={{ fontFamily: fontDisplay, fontSize: 18, fontWeight: 700, color: colors.brassLight }}>{count}</div>
            <div style={{ fontSize: 10, opacity: 0.75 }}>Level {i + 1}</div>
          </div>
        ))}
        {slots.length === 0 && <div style={{ fontSize: 13, opacity: 0.7 }}>No spell slots yet at this level.</div>}
      </div>
    );
  }
  return (
    <div>
      {caster ? (<>
        <Section title="Spellcasting Overview" colors={colors} fontDisplay={fontDisplay}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
            {stat("Spellcasting Ability", cls.spellAbility)}
            {stat("Spell Save DC", 8 + profBonus + finalMods[cls.spellAbility])}
            {stat("Spell Attack Bonus", fmt(profBonus + finalMods[cls.spellAbility]))}
            {stat("Cantrips", `${spellInfo.cantrips} / ${cantripMax}`)}
            {stat("Prepared Spells", `${spellInfo.prepared} / ${prepMax == null ? "no limit" : prepMax}`)}
            {stat("Highest Spell Level", maxLevel || "none yet")}
          </div>
        </Section>
        <Section title={cls.casterType === "pact" ? "Pact Magic Slots" : "Spell Slots"} colors={colors} fontDisplay={fontDisplay}>{slotsDisplay}</Section>
      </>) : (
        <Section title="Spellcasting" colors={colors} fontDisplay={fontDisplay}>
          <div style={{ fontSize: 14, opacity: 0.8 }}>{className} has no Spellcasting feature. {custom ? "Further Customization is on, so you can still add spells below. They will show in red." : "Turn on Further Customization to add spells anyway."}</div>
        </Section>
      )}

      <Section title="Your Spells" colors={colors} fontDisplay={fontDisplay}>
        {glow && <div data-testid="spell-glow" data-glow={glow} style={{ border: `2px solid ${glow === "open" ? REST_PURPLE : colors.brassLight}`, color: glow === "open" ? REST_PURPLE : colors.brassLight, borderRadius: 6, padding: "6px 10px", marginBottom: 10, fontSize: 13 }}>{glow === "open" ? "Your rest lets you change spells here." : "Spells changed after your rest."}</div>}
        {rows.length === 0 && grantedSpells.length === 0 && <div style={{ fontSize: 13, opacity: 0.7 }}>No spells yet. Add them from the list below.</div>}
        {cantripRows.length > 0 && <div style={{ fontFamily: fontDisplay, fontSize: 12, color: colors.brassLight, margin: "4px 0 6px" }}>CANTRIPS</div>}
        {cantripRows.map(e => <SpellRow key={e.index} entry={e} onRemove={() => remove(e.index)} colors={colors} fontDisplay={fontDisplay} summary={spellSummary(e.sp)} />)}
        {spellRows.length > 0 && <div style={{ fontFamily: fontDisplay, fontSize: 12, color: colors.brassLight, margin: "10px 0 6px" }}>PREPARED SPELLS</div>}
        {spellRows.map(e => <SpellRow key={e.index} entry={e} onRemove={() => remove(e.index)} colors={colors} fontDisplay={fontDisplay} summary={spellSummary(e.sp)} />)}
        {handRows.map(e => <SpellRow key={e.index} entry={e} onRemove={() => remove(e.index)} colors={colors} fontDisplay={fontDisplay} />)}
        {grantedSpells.length > 0 && <div style={{ fontFamily: fontDisplay, fontSize: 12, color: colors.brassLight, margin: "10px 0 6px" }}>ALWAYS PREPARED (these do not count against your limits)</div>}
        {grantedSpells.map((g, i) => {
          const sp = spellOf(g.name);
          return <div key={i} data-testid={`granted-${g.name}`} style={{ border: `1px solid ${colors.brass}40`, background: colors.inkLight, borderRadius: 6, padding: "6px 10px", marginBottom: 6, fontSize: 14 }}>
            <strong style={{ fontFamily: fontDisplay }}>{g.name}</strong>{sp && <span style={{ fontSize: 12, opacity: 0.75, marginLeft: 8 }}>{spellLine(sp)}</span>}<SourceTag text={g.source} colors={colors} />
            {sp && spellSummary(sp) && <div style={{ fontSize: 12, color: colors.brassLight }}>In combat: {spellSummary(sp)}</div>}
          </div>;
        })}
      </Section>

      {(caster || custom) && (
        <Section title="Add Spells" colors={colors} fontDisplay={fontDisplay}>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
            <select aria-label="Spell level filter" value={filterLevel} onChange={e => setFilterLevel(e.target.value)} style={{ ...fieldStyle(colors), width: 150 }}>
              <option value="all">All levels</option>
              <option value="0">Cantrips</option>
              {Array.from({ length: topLevel }).map((_, i) => <option key={i + 1} value={i + 1}>Level {i + 1}</option>)}
            </select>
            <input aria-label="Search spells" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search by name or school" style={{ ...fieldStyle(colors), width: 240 }} />
            {custom && <label style={check}><input type="checkbox" checked={anyList} onChange={e => setAnyList(e.target.checked)} data-testid="any-list" /> Any spell list</label>}
            {custom && <label style={check}><input type="checkbox" checked={allLevels} onChange={e => setAllLevels(e.target.checked)} data-testid="all-levels" /> All spell levels</label>}
          </div>
          <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 8 }} data-testid="spell-pool-note">
            Showing {pool.length} {wideList ? "spells from every list" : `${className} spells`}{wideLevel ? ", all levels" : maxLevel ? `, up to Level ${maxLevel}` : ", cantrips only"}.
            {custom ? " Spells past your limits can still be added and will show in red." : ""}
          </div>
          <div style={{ maxHeight: 420, overflowY: "auto", border: `1px solid ${colors.brass}30`, borderRadius: 6 }}>
            {pool.map(sp => {
              const ok = legal(sp);
              return (
                <div key={sp.n} data-testid={`pool-${sp.n}`} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 10px", borderBottom: `1px solid ${colors.brass}18` }}>
                  <div style={{ flex: 1 }}>
                    <strong style={{ fontSize: 14 }}>{sp.n}</strong>
                    <span style={{ fontSize: 12, opacity: 0.7, marginLeft: 8 }}>{spellLine(sp)}{sp.conc ? " · Concentration" : ""}{sp.rit ? " · Ritual" : ""} · {sp.c.join(", ")}</span>
                  </div>
                  <button disabled={!ok && !custom} onClick={() => add(sp.n)} title={ok ? "" : custom ? "Past your limits: it will show in red" : "Past your limits"}
                    style={{ background: "transparent", border: `1px solid ${ok ? colors.brass : CUSTOM_RED}`, color: ok ? colors.brassLight : CUSTOM_RED, borderRadius: 6, padding: "3px 12px", fontSize: 12, cursor: ok || custom ? "pointer" : "default", opacity: ok || custom ? 1 : 0.35 }}>Add</button>
                </div>
              );
            })}
            {pool.length === 0 && <div style={{ padding: 12, fontSize: 13, opacity: 0.7 }}>No spells match.</div>}
          </div>
          {custom && (
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <input aria-label="Spell typed by hand" value={typed} onChange={e => setTyped(e.target.value)} placeholder="Or type a spell that is not in the list" style={{ ...fieldStyle(colors), maxWidth: 320 }} />
              <button onClick={() => { if (typed.trim()) { add(typed.trim().slice(0, 60)); setTyped(""); } }} style={{ background: "transparent", border: `1px solid ${colors.brass}`, color: colors.brassLight, borderRadius: 6, padding: "0 14px", cursor: "pointer" }}>Add</button>
            </div>
          )}
        </Section>
      )}
    </div>
  );
}

function NotesTab({ equipment, setEquipment, notes, setNotes, colors, fontDisplay }) {

function ItemRowHover({ item, isPinned, onPin, onUnpin, onSelect, isSelected, accentColor, colors, extraBadge }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      onClick={() => onSelect()}
      style={{
        display: "flex", alignItems: "center", gap: 8, padding: "7px 12px", borderRadius: 6,
        cursor: "pointer", position: "relative",
        background: isSelected ? `${accentColor}22` : (isPinned ? `${accentColor}11` : "transparent"),
        border: `1px solid ${isSelected ? accentColor + "66" : (isPinned ? accentColor + "33" : "transparent")}`,
        transition: "background 0.12s"
      }}
    >
      <span style={{ width: 10, height: 10, borderRadius: "50%", flexShrink: 0, background: accentColor }} />
      <span style={{
        color: isPinned ? colors.parchment : colors.parchment + "cc",
        fontSize: 14, flex: 1,
        fontFamily: "'Crimson Text','Georgia',serif",
        fontWeight: isPinned ? 600 : 400
      }}>
        {item.name}
      </span>
      {extraBadge}
      {/* Hover action: show ✓ to add or × to remove */}
      {hovered && (
        <button
          onClick={e => { e.stopPropagation(); isPinned ? onUnpin() : onPin(); }}
          title={isPinned ? "Remove from Important Items" : "Add to Important Items"}
          style={{
            width: 22, height: 22, borderRadius: 4, border: "none", cursor: "pointer",
            background: isPinned ? colors.blood : "#4caf50",
            color: "#fff", fontSize: 14, fontWeight: 700,
            display: "flex", alignItems: "center", justifyContent: "center",
            flexShrink: 0, lineHeight: 1
          }}
        >
          {isPinned ? "×" : "✓"}
        </button>
      )}
      {!hovered && isPinned && (
        <span style={{ fontSize: 12, color: "#4caf50", flexShrink: 0 }}>✓</span>
      )}
    </div>
  );
}

function MagicItemsTab({ itemSearch, setItemSearch, itemRarityFilter, setItemRarityFilter, itemTypeFilter, setItemTypeFilter, itemAttunementFilter, setItemAttunementFilter, selectedItem, setSelectedItem, characterItems, setCharacterItems, pinnedItems, setPinnedItems, colors, fontDisplay }) {
  const allTypes = React.useMemo(() => {
    const types = new Set(MAGIC_ITEMS.map(i => i.type));
    return ["All", ...Array.from(types).sort()];
  }, []);

  const filtered = React.useMemo(() => {
    return MAGIC_ITEMS.filter(item => {
      const matchSearch = item.name.toLowerCase().includes(itemSearch.toLowerCase()) ||
        item.description.toLowerCase().includes(itemSearch.toLowerCase());
      const matchRarity = itemRarityFilter === "All" || item.rarity === itemRarityFilter;
      const matchType = itemTypeFilter === "All" || item.type === itemTypeFilter;
      const matchAtt = itemAttunementFilter === "All" ||
        (itemAttunementFilter === "Yes" && item.attunement) ||
        (itemAttunementFilter === "No" && !item.attunement);
      return matchSearch && matchRarity && matchType && matchAtt;
    });
  }, [itemSearch, itemRarityFilter, itemTypeFilter, itemAttunementFilter]);

  const grouped = React.useMemo(() => {
    const g = {};
    RARITY_ORDER.forEach(r => { g[r] = []; });
    filtered.forEach(item => { if (g[item.rarity]) g[item.rarity].push(item); });
    return g;
  }, [filtered]);

  const isPinned = (item) => pinnedItems.some(p => p.name === item.name);
  const pinItem = (item) => { if (!isPinned(item)) setPinnedItems(prev => [...prev, item]); };
  const unpinItem = (item) => setPinnedItems(prev => prev.filter(p => p.name !== item.name));

  const inputStyle = {
    background: colors.inkLight, border: `1px solid ${colors.brass}44`, color: colors.parchment,
    borderRadius: 6, padding: "8px 12px", fontSize: 14, fontFamily: "'Crimson Text','Georgia',serif",
    outline: "none", width: "100%", boxSizing: "border-box"
  };
  const selectStyle = { ...inputStyle, width: "auto", minWidth: 120, cursor: "pointer" };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 360px", gap: 20, alignItems: "start" }}>
      <div>
        <div style={{ background: colors.inkLight, borderRadius: 10, padding: 16, marginBottom: 16, border: `1px solid ${colors.brass}33` }}>
          <input value={itemSearch} onChange={e => setItemSearch(e.target.value)}
            placeholder="Search by name or description..." style={{ ...inputStyle, marginBottom: 10 }} />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <select value={itemRarityFilter} onChange={e => setItemRarityFilter(e.target.value)} style={selectStyle}>
              <option value="All">All Rarities</option>
              {RARITY_ORDER.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
            <select value={itemTypeFilter} onChange={e => setItemTypeFilter(e.target.value)} style={selectStyle}>
              {allTypes.map(t => <option key={t} value={t}>{t === "All" ? "All Types" : t}</option>)}
            </select>
            <select value={itemAttunementFilter} onChange={e => setItemAttunementFilter(e.target.value)} style={selectStyle}>
              <option value="All">Any Attunement</option>
              <option value="Yes">Requires Attunement</option>
              <option value="No">No Attunement</option>
            </select>
            <span style={{ color: colors.parchment + "88", fontSize: 13, alignSelf: "center", marginLeft: "auto" }}>
              {filtered.length} item{filtered.length !== 1 ? "s" : ""}
            </span>
          </div>
        </div>

        <div style={{ maxHeight: "62vh", overflowY: "auto", paddingRight: 4 }}>
          {RARITY_ORDER.map(rarity => {
            const items = grouped[rarity];
            if (!items || items.length === 0) return null;
            return (
              <div key={rarity} style={{ marginBottom: 16 }}>
                <div style={{
                  fontFamily: fontDisplay, fontSize: 12, fontWeight: 700, letterSpacing: 1,
                  color: RARITY_COLORS[rarity], textTransform: "uppercase", marginBottom: 6,
                  paddingBottom: 4, borderBottom: `1px solid ${RARITY_COLORS[rarity]}44`
                }}>
                  {rarity} ({items.length})
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                  {items.map(item => (
                    <ItemRowHover
                      key={item.name}
                      item={item}
                      isPinned={isPinned(item)}
                      onPin={() => pinItem(item)}
                      onUnpin={() => unpinItem(item)}
                      onSelect={() => setSelectedItem(selectedItem && selectedItem.name === item.name ? null : item)}
                      isSelected={selectedItem && selectedItem.name === item.name}
                      accentColor={RARITY_COLORS[rarity]}
                      colors={colors}
                      extraBadge={<>
                        {item.attunement && <span style={{ fontSize: 11, color: colors.brassLight, opacity: 0.8 }}>⟳</span>}
                        <span style={{ fontSize: 11, color: colors.parchment + "55", flexShrink: 0 }}>{item.type}</span>
                      </>}
                    />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ position: "sticky", top: 16 }}>
        <div style={{
          background: colors.inkLight,
          border: `1px solid ${selectedItem ? RARITY_COLORS[selectedItem.rarity] + "66" : colors.brass + "22"}`,
          borderRadius: 10, padding: 20, marginBottom: 16, minHeight: 200
        }}>
          {selectedItem ? (
            <>
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontFamily: fontDisplay, fontSize: 18, color: colors.parchment, lineHeight: 1.2, marginBottom: 6 }}>
                  {selectedItem.name}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12, fontWeight: 700, color: RARITY_COLORS[selectedItem.rarity], background: RARITY_COLORS[selectedItem.rarity] + "22", padding: "2px 8px", borderRadius: 4 }}>{selectedItem.rarity}</span>
                  <span style={{ fontSize: 12, color: colors.parchment + "88", background: colors.ink, padding: "2px 8px", borderRadius: 4 }}>{selectedItem.type}</span>
                  {selectedItem.attunement && <span style={{ fontSize: 12, color: colors.brassLight, background: colors.brass + "22", padding: "2px 8px", borderRadius: 4 }}>Requires Attunement</span>}
                </div>
              </div>
              <p style={{ color: colors.parchment + "cc", fontSize: 14, lineHeight: 1.7, fontFamily: "'Crimson Text','Georgia',serif", margin: "0 0 16px" }}>{selectedItem.description}</p>
              <button
                onClick={() => isPinned(selectedItem) ? unpinItem(selectedItem) : pinItem(selectedItem)}
                style={{
                  width: "100%", padding: "10px 0", borderRadius: 6, cursor: "pointer",
                  fontFamily: fontDisplay, fontSize: 13, fontWeight: 600, border: "none",
                  background: isPinned(selectedItem) ? colors.blood : colors.brass,
                  color: isPinned(selectedItem) ? colors.parchment : colors.ink
                }}
              >
                {isPinned(selectedItem) ? "− Remove from Important Items" : "✓ Add to Important Items"}
              </button>
            </>
          ) : (
            <div style={{ color: colors.parchment + "44", fontFamily: "'Crimson Text','Georgia',serif", fontSize: 15, textAlign: "center", paddingTop: 60 }}>
              Select an item to view details
            </div>
          )}
        </div>

        {pinnedItems.filter(p => p.rarity).length > 0 && (
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}33`, borderRadius: 10, padding: 16 }}>
            <div style={{ fontFamily: fontDisplay, fontSize: 12, color: colors.brassLight, letterSpacing: 0.5, marginBottom: 10, textTransform: "uppercase" }}>
              Pinned Magic Items ({pinnedItems.filter(p => p.rarity).length})
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, maxHeight: 200, overflowY: "auto" }}>
              {pinnedItems.filter(p => p.rarity).map(item => (
                <div key={item.name} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: RARITY_COLORS[item.rarity], flexShrink: 0 }} />
                  <span style={{ color: colors.parchment, fontSize: 13, flex: 1, fontFamily: "'Crimson Text','Georgia',serif" }}>{item.name}</span>
                  <button onClick={() => unpinItem(item)} style={{ background: "none", border: "none", color: colors.blood, cursor: "pointer", fontSize: 16, lineHeight: 1, padding: "0 2px" }}>×</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function MundaneItemsTab({ mundaneSearch, setMundaneSearch, mundaneTypeFilter, setMundaneTypeFilter, selectedMundane, setSelectedMundane, pinnedItems, setPinnedItems, colors, fontDisplay }) {

              <button
                onClick={() => isPinned(selectedMundane) ? unpinItem(selectedMundane) : pinItem(selectedMundane)}
                style={{
                  width: "100%", padding: "10px 0", borderRadius: 6, cursor: "pointer",
                  fontFamily: fontDisplay, fontSize: 13, fontWeight: 600, border: "none",
                  background: isPinned(selectedMundane) ? colors.blood : colors.brass,
                  color: isPinned(selectedMundane) ? colors.parchment : colors.ink
                }}
              >
                {isPinned(selectedMundane) ? "− Remove from Important Items" : "✓ Add to Important Items"}
              </button>
            </>
          ) : (
            <div style={{ color: colors.parchment + "44", fontFamily: "'Crimson Text','Georgia',serif", fontSize: 15, textAlign: "center", paddingTop: 60 }}>
              Select an item to view details
            </div>
          )}
        </div>

        {pinnedItems.filter(p => !p.rarity).length > 0 && (
          <div style={{ background: colors.inkLight, border: `1px solid ${colors.brass}33`, borderRadius: 10, padding: 16 }}>
            <div style={{ fontFamily: fontDisplay, fontSize: 12, color: colors.brassLight, letterSpacing: 0.5, marginBottom: 10, textTransform: "uppercase" }}>
              Pinned Mundane Items ({pinnedItems.filter(p => !p.rarity).length})
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, maxHeight: 200, overflowY: "auto" }}>
              {pinnedItems.filter(p => !p.rarity).map(item => (
                <div key={item.name} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: accentColor, flexShrink: 0 }} />
                  <span style={{ color: colors.parchment, fontSize: 13, flex: 1, fontFamily: "'Crimson Text','Georgia',serif" }}>{item.name}</span>
                  <span style={{ fontSize: 11, color: colors.parchment + "55" }}>{item.cost}</span>
                  <button onClick={() => unpinItem(item)} style={{ background: "none", border: "none", color: colors.blood, cursor: "pointer", fontSize: 16, lineHeight: 1, padding: "0 2px" }}>×</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


// Merge installed Content Packs into the lists before the first render.
storedPacks().forEach((raw) => { const r = checkPack(raw); if (r.pack) { mergePack(r.pack); INSTALLED_PACKS.push({ name: r.pack.name, author: r.pack.author, counts: r.counts }); } });

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<CharacterSheet />);
  </script>
</body>
</html>
