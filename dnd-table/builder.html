THE HOMEBREW ACADEMY: CONTENT PACK PROMPT (format version 1)

Give this whole file to an AI assistant. It tells the assistant how to turn your homebrew document or source book into a Content Pack file that the Character Builder can load.

=====================================================================
INSTRUCTIONS FOR THE AI ASSISTANT
=====================================================================

You are converting tabletop content written for the 2024 rules of the world's most popular fantasy roleplaying game (often called 5.5e) into a Content Pack for The Homebrew Academy Character Builder and Combat Resolver.

STEP 1. Ask the user to upload or paste their content: a homebrew document, a source book they own, or a list of the options they want. Do not write the pack until you have it. If the content is long, ask which parts they want (classes, subclasses, species, backgrounds, feats, spells, items) and work through them in order.

STEP 2. Read all of it. For every option, work out two things:
  a. The character option itself (what shows on the character sheet).
  b. Every feature, trait, spell or item that DOES something. Each one becomes an entry in "abilities" (a spell gets a "record" instead), so the sheet's numbers change and the Combat Resolver can run it.

HOW TO IDENTIFY A FEATURE. Do not go by a feature's name or by what class it belongs to. Go by what its text says, and put it through these tests IN THIS ORDER. A feature can pass several tests; apply every one it passes. The same text must always land in the same place.
  T1 POOL. Does the text give a number of uses, dice or points that MORE THAN ONE thing spends, or that grows with level ("you have four ... dice", "you have a number of ... points equal to")? -> one ability with "resource" only. Everything that spends it names it in "uses": { "pool": ... }. The sheet shows the pool's count large, with every ability that spends it listed under it.
  T2 LIST OF SEPARATE ENTRIES. Does the feature point to a list where each item has its own heading and its own rules text, and the character learns or picks some of them? -> one ability PER LIST ITEM, each named exactly as its heading, each with its first sentence in "text" saying what it does, each spending the pool from T1 if the text says so. The picking itself is "options" on the parent feature (see T6).
  T3 SEVERAL WAYS TO USE ONE ENTRY. Does ONE heading's text say "choose one of the following" or give alternative shapes, effects or modes each time it is used? -> one ability with "versions".
  T4 A WORD CHOSEN ON USE. Does the user name a damage type, ability, skill or condition each time it is used, with everything else the same? -> "choices" with "$1" / "$2".
  T5 ALWAYS ON. Does it change a number or a defense with no action and no limit (Armor Class, Speed, Hit Points, a save, a Resistance, a sense, a proficiency, a spell always prepared)? -> "statics". It is never an activated ability.
  T6 CHOSEN WHEN GAINED. Does the player pick one option once, when the feature is gained or on a rest (a style, a land, a type)? -> "options" with "choices", and "changeOn" if the text lets it be swapped.
  T7 USED. Does the character take an action, Bonus Action or Reaction, or does it trigger on an event? -> an activated ability: activation, target, roll, results, uses. A Reaction always gets "trigger".
  T8 CREATURE. Does using it turn the character into a creature or bring one out? -> "statBlock".
  T9 MAKES A THING. Does it leave an object, light, ward, illusion or consumable behind? -> "creates" (with "item": true for something carried).
  T10 TEXT ONLY. None of the above: it has no number and no roll the app could apply. It needs no ability; its text on the class or species is enough.
Then, for every activated ability, answer each of these from the text and fill the matching field. Leave a field out only when the text is silent:
  who or what it targets and how many ("target", "targets", "targetLimit"); how far and what shape ("range", "area"); what is rolled ("roll", "attack", "save"); what it deals or restores ("damage", "heal", "tempHP"); every statistic it changes and for how long ("effects" with "duration"); every condition ("conditions"); what ends it early; what it costs ("uses", "cost"); whether it keeps working on later turns ("again"); whether the target can get out ("escape"); whether the DM must answer something ("askDM").

CONSISTENCY: THE SAME BOOK MUST ALWAYS GIVE THE SAME PACK
Different people will each convert the same book and then play together, so two conversions of the same content must match. Follow these rules exactly, every time, and never use your own judgment where a rule decides:
  1. Names are copied exactly as printed: same words, same capital letters, same punctuation. Never shorten, translate, merge or "improve" a name. The pack's "name" is the book's title exactly as printed on its cover.
  2. One printed feature, trait, spell, feat or item is one entry. Never split one into several entries and never join several into one. A feature that offers several ways to use it stays one entry with "versions" (see below).
  3. Entries go in the order the book prints them. Keys inside an entry go in the order this prompt lists them.
  4. Rules text is copied word for word. Never paraphrase, summarize or correct it.
  5. Record only what the text states. Never add a mechanic the text does not give, and never leave out one it does. If the text does not say, leave the field out.
  6. When something could be written in more than one way, use the FIRST of these that fits: a condition from the condition list; an effect key from the effect list; a "note" inside an effect. Use a "note" only when no key fits.
  7. Numbers are written the way the text gives them: a fixed number as a number, a number that depends on the character as a formula with the words this prompt lists (STR, PROF, LEVEL and so on). Never work a formula out to a number yourself.
  8. Durations use the unit in the text (rounds, minutes, hours, days). "Until the end of your next turn" is 1 round.
  9. Do not include anything the user did not ask for, and do not skip anything they did.
  10. If you are not sure how to write something, write it as text only and list it in your reply after the file, so the user can check it. Never guess.
The Character Builder shows a short check code for every pack it loads. Two people whose packs show the same code have the same content.

STEP 3. Output ONE JSON file and nothing else, in a single code block, so the user can save it as a .json file. It must be valid JSON: double quotes, no comments, no trailing commas. If the content is too long for one reply, tell the user, then continue the same file in the next reply so the pieces join into one file. Never split a large book into several packs yourself: the builder cuts a large pack into parts by type when it is uploaded.

STEP 4. After the file, list anything you could not express in this format, so the user knows what stays a table ruling.

Follow the 2024 rules terms exactly: Bonus Action, Reaction, Short Rest, Long Rest, Advantage, Disadvantage, D20 Test, Temporary Hit Points, Origin Feat, species (not race). Write spell levels as "Level 3 Evocation", never "3rd-level evocation". Copy rules text from the user's content as written; do not paraphrase it.

---------------------------------------------------------------------
FILE SHAPE
---------------------------------------------------------------------

{
  "format": "homebrew-academy-content",
  "version": 1,
  "name": "Short name of this pack",
  "author": "Who wrote the content",
  "classes": { },
  "subclasses": { },
  "species": { },
  "backgrounds": { },
  "feats": { },
  "spells": [ ],
  "items": [ ],
  "abilities": [ ]
}

Leave out any section you have nothing for. Names are the keys. A pack entry with the same name as a built-in option replaces it.

---------------------------------------------------------------------
CLASSES
---------------------------------------------------------------------

"classes": {
  "Warden": {
    "hitDie": 12,
    "primaryAbility": "Constitution & Wisdom",
    "saves": ["Constitution", "Wisdom"],
    "armorProf": "Light, Medium, Shields",
    "weaponProf": "Simple, Martial",
    "skillChoices": 2,
    "skillList": ["Athletics", "Insight", "Medicine", "Nature", "Perception", "Survival"],
    "subclassLevel": 3,
    "subclassName": "Warden Oath",
    "casterType": "half",
    "spellAbility": "Wisdom",
    "features": {
      "1": ["Sentinel's Stand", "Spellcasting"],
      "2": ["Warding Strike"],
      "3": ["Subclass feature"],
      "4": ["Ability Score Improvement"]
    },
    "subclasses": {
      "Oath of the Stone": { "3": ["Stoneskin Ward"], "7": ["Unmoving"] }
    }
  }
}

Rules for classes:
- hitDie is 6, 8, 10 or 12. saves is exactly two full ability names.
- Ability names are always written in full: Strength, Dexterity, Constitution, Intelligence, Wisdom, Charisma.
- casterType is "full", "half" or "pact". Leave casterType and spellAbility out for a class with no spellcasting.
- A class that casts with points instead of spell slots (spell points, mana, a pool with its own name) adds "spellPoints": { "pool": "Acuity", "costs": [2, 3, 5, 6, 7, 9, 10, 11, 13] }. costs is what a spell of Level 1 to Level 9 costs. Keep casterType, because it sets the highest spell level the class can cast at each level. Define the pool itself in "abilities" as a resource with exactly the same name (see RESOURCES), with a max for each level and its recharge. The builder then shows the costs instead of slots, and the Combat Resolver asks which level to cast at, prices each level in points and takes them from the pool.
- features has one list per level, levels "1" to "20". A level with nothing new can be left out.
- Write the exact text "Ability Score Improvement" at each level that grants one, and "Epic Boon" at level 19 if the class has it.
- Write the exact text "Subclass feature" at each level where the subclass grants something. The subclass entry then lists what it grants at that same level.
- Use each feature's exact name. Its mechanics go in "abilities" under the same name.
- A spellcasting class can also give: "preparedSpells": a list of 20 numbers (how many spells are prepared at each level), "cantripsKnown": a list of 20 numbers, and "expertise": { "2": 2, "9": 4 } (level reached: total skills with Expertise).

---------------------------------------------------------------------
SUBCLASSES FOR CLASSES THAT ALREADY EXIST
---------------------------------------------------------------------

"subclasses": {
  "Fighter": {
    "Rune Carver": { "3": ["Rune Lore", "Giant's Might"], "7": ["Runic Shield"], "10": ["Great Stature"], "15": ["Master of Runes"], "18": ["Runic Juggernaut"] }
  }
}

The built-in classes are Barbarian, Bard, Cleric, Druid, Fighter, Monk, Paladin, Ranger, Rogue, Sorcerer, Warlock and Wizard. Use the levels at which that class already says "Subclass feature".

---------------------------------------------------------------------
SPECIES, BACKGROUNDS, FEATS
---------------------------------------------------------------------

"species": {
  "Emberkin": { "speed": 30, "traits": ["Darkvision (60 ft.)", "Kindled Blood: Resistance to Fire damage.", "Cinder Breath: Bonus Action, each creature in a 15-foot Cone makes a Dexterity saving throw."] }
}
Write senses exactly as "Darkvision (60 ft.)", "Blindsight (30 ft.)", "Tremorsense (30 ft.)" or "Truesight (30 ft.)" so the sheet picks them up.
If the species lets the player choose a skill proficiency, add "skillChoice": { "count": 1, "from": ["Insight", "Perception", "Survival"] }. Leave "from" empty for any skill.
If the species has a lineage, ancestry or legacy to choose from, add "lineage": { "label": "Ember Lineage", "options": { "Ashborn": { "traits": ["Ash Step: full text."] }, "Flameborn": { "traits": ["Flame Skin: full text."] } } }. What each option does goes in "abilities" with grantedBy type "lineage".

"backgrounds": {
  "Lamplighter": { "abilityScores": ["Dexterity", "Constitution", "Wisdom"], "feat": "Alert", "skills": ["Perception", "Stealth"], "tool": "Tinker's Tools" }
}
abilityScores is exactly three abilities, skills is exactly two skills, feat is an Origin Feat (add it under "feats" if it is new).

"feats": {
  "Stone's Patience": {
    "category": "General",
    "prerequisite": "Level 4+, Constitution 13+",
    "needs": { "level": 4, "score": { "abilities": ["Constitution"], "min": 13 } },
    "repeatable": false,
    "grants": {
      "ability": { "from": ["Constitution", "Wisdom"], "max": 20 },
      "skills": { "count": 1, "from": ["Insight", "Survival"], "tools": false },
      "spellChoices": [
        { "label": "Choose one Druid cantrip", "level": 0, "lists": ["Druid"], "count": 1 },
        { "label": "Choose one Level 1 Abjuration or Divination spell", "level": 1, "schools": ["Abjuration", "Divination"], "count": 1 }
      ]
    },
    "text": "Full text of the feat."
  }
}
Write every feat this way so the builder can place it and ask for its choices with dropdowns. A feat written as plain text ("Name": "Full text.") still loads, but it has no category, so it is offered in every feat slot and asks for nothing.
- category is "Origin", "General", "Fighting Style" or "Epic Boon". It decides where the feat is offered: Origin feats in the background's Origin Feat picker (and any trait that grants an Origin feat), General feats in the level 4, 8, 12, 16 and 19 slots, Fighting Style feats where a class grants a Fighting Style, Epic Boons at level 19. Origin feats are NOT listed in the level slots.
- prerequisite is the line shown to the player. needs is the same thing in a form the builder can check: "level" (the minimum character level), "score" (at least one of the listed abilities must be "min" or higher), "spellcasting": true (the character must be able to cast spells). Leave out what the feat does not require.
- repeatable is true only when the feat says it can be taken more than once.
- grants holds the choices the player makes when taking the feat. Leave out the parts the feat does not have.
  ability: the feat raises one ability score by 1. "from" lists the abilities the player may pick (leave it empty for any ability) and "max" is the highest the score can go (20, or 30 for an Epic Boon).
  skills: the player picks "count" proficiencies. "from" lists the skills allowed (leave it empty for any skill). "tools": true lets a pick be a tool instead.
  spellChoices: one entry for each "choose a spell" sentence in the feat. "level" is the exact spell level allowed, with 0 for a cantrip. "lists" are the class spell lists allowed (leave it out for any list). "schools" are the schools of magic allowed (leave it out for any school). "count" is how many to pick. The dropdown offers ONLY spells that match all of these, so copy the restriction exactly as the feat words it: "one cantrip" is level 0, "one level 1 spell" is level 1, never a range. If the feat lets the player pick from two different levels, write two entries. The spells picked are added to the sheet.
- Everything else the feat does (a bonus to a number, a use per rest, something to activate, a roll) goes in "abilities" with "grantedBy": { "type": "feat", "name": "Stone's Patience" }, exactly like a class feature.

---------------------------------------------------------------------
SPELLS AND ITEMS
---------------------------------------------------------------------

"spells": [
  { "name": "Ashen Grasp", "level": 2, "school": "Necromancy", "classes": ["Warden", "Warlock"], "castingTime": "Action", "range": "60 feet", "duration": "1 minute", "concentration": true, "ritual": false, "components": "VSM", "material": "a pinch of ash worth 10+ GP, which the spell consumes", "text": "Full spell text, without the higher-level paragraph.", "higherLevels": "The Using a Higher-Level Spell Slot (or Cantrip Upgrade) paragraph, word for word, without its heading; empty if none." }
]
components is the letters V (Verbal), S (Somatic) and M (Material) the spell needs, such as "V", "VS" or "VSM". material is the Material component exactly as the spell words it, including "worth 50+ GP" and "which the spell consumes" when it says so. The Combat Resolver reads these when the DM turns on spell components: a Verbal spell cannot be cast while Silenced, a Somatic or Material component needs a free hand, a Component Pouch or Spellcasting Focus stands in for any Material component that has no cost, and a component with a cost has to be owned (and is used up if the spell consumes it).
level 0 is a cantrip. A spell a character casts in a fight needs a "record" (see SPELL RECORDS below) so the Combat Resolver can run it.

SPELL RECORDS: HOW A SPELL RUNS IN THE COMBAT RESOLVER
Every spell follows the same steps when it is cast: how it is cast (a spell slot, or as a Ritual), what it costs (a consumed component, gold), who or what it targets, any choice or version the caster picks, how it resolves (attack roll, saving throw, automatic, healing, or simply applied, and anything that depends on the target's Hit Points), every statistic it changes, and how long it lasts. For the app to run those steps, give every spell a "record", and "extras" when the spell needs them, next to its text:
  { "name": "Ashen Grasp", ..., "text": "Full spell text.", "record": { ... }, "extras": { ... } }
A spell with no record is still cast: it spends its slot and shows its text, and the table does the rest by hand. Ask yourself for every spell: does it change any statistic of its target or its caster? If yes, that change must be in the record. Use only what the spell's text says.

The "record" object (include every field; use null, [] or "" when a field does not apply):
- "act": "action" | "bonus" | "reaction" | "long". Use "long" when the casting time is 1 minute or more.
- "castMinutes": number of minutes when act is "long", else 0.
- "trig": for a Reaction spell, which of these events lets it be cast, comma separated: "targeted" (you are targeted by an attack, before the roll), "hit" (an attack roll hits you), "miss", "damage" (you take damage), "cast" (a creature you see casts a spell). Then add any other EVENT the trigger names that these words do not cover, in the text's own words, comma separated (Shield: "hit, you are targeted by the Magic Missile spell"). Conditions on an event (a distance, the components of the spell being cast) are not added: Counterspell is just "cast". If none of the events fit, write the whole trigger in the text's own words. Else "".
- "range": {"kind": "self" | "touch" | "feet" | "sight" | "unlimited" | "special", "feet": number} (feet is 0 unless kind is "feet"; 1 mile = 5280).
- "area": null, or {"shape": "sphere" | "cone" | "line" | "cube" | "cylinder" | "emanation" | "wall" | "square" | "hemisphere", "size": feet (radius for sphere/cylinder/emanation, length for cone/line/wall, side for cube/square), "width": feet or 0, "height": feet or 0}.
- "targets": {"n": number or "any" (use "any" for everything in an area or "any number"), "perSlot": extra targets per slot level above the spell's level (0 if none), "self": "only" (always and only the caster) | "may" (the spell helps its target, such as healing or a benefit, or it fills an area the caster could stand in) | "no" (the spell harms, controls, curses, marks or speaks to its target, the text says "another creature" or "other than you", or the target must be something the caster cannot be, such as a dead creature or an attacker), "kind": "creature" | "object" | "creature or object" (only when the text says objects are affected too, as Shatter's unattended objects) | "point" | "none", "size": null or the LARGEST size allowed ("Tiny","Small","Medium","Large","Huge","Gargantuan"), "types": [] or the only creature types allowed (e.g. ["Humanoid"]), "notTypes": [] or creature types the spell has no effect on (e.g. ["Undead","Construct"]), "willing": true if the text says a willing creature}.
- "k": the main thing the app resolves:
  - "attack": the caster makes a spell attack roll.
  - "save": each target makes a saving throw.
  - "auto": damage with no attack roll and no save.
  - "heal": restores Hit Points.
  - "apply": no roll; puts effects, conditions or Temporary Hit Points on the target(s) or the caster.
  - "info": the spell does nothing the app can put on a creature (pure utility, illusion, travel, information, creation). Use this only when none of the others fit.
- "atk": "melee" | "ranged" | null (for k = attack).
- "save": the ability name ("Dexterity"...) or null. If targets choose or the ability varies, pick the one in the text and explain in "other".
- "dmg": list of [dice, type], e.g. [["8d6","Fire"]]. Several entries when the spell deals more than one type. [] if none. If the caster chooses the type, write "$1" as the type and list the types in "choices" (see the extras).
- "half": true if a successful save takes half damage, else false.
- "cantrip": true if this is a cantrip whose damage dice increase at character levels 5, 11 and 17.
- "heal": dice string for Hit Points restored ("2d8", "70"), or "". "healMod": true if the spellcasting ability modifier is added.
- "temp": dice string for Temporary Hit Points given ("2d4+4"), or "".
- "addMod": true if the spellcasting ability modifier is added to the damage (e.g. Spiritual Weapon), else false.
- "onHit", "onFail", "onSuccess", "onUse": each is null or {"conds": [...], "effs": [...]}.
  - onHit: applied to the target when the attack hits. onFail / onSuccess: applied on a failed / successful save. onUse: applied when cast (k = apply or heal), with no roll.
  - a cond is {"name": one of Blinded, Charmed, Deafened, Frightened, Grappled, Incapacitated, Invisible, Paralyzed, Petrified, Poisoned, Prone, Restrained, Stunned, Unconscious, "repeat": "end" | "start" | null (the target repeats the save at the end / start of each of its turns to end it), "note": ""}.
  - an eff is an object with any of the EFFECT KEYS below. Put every separate thing the spell does to the creature.
- "selfEffs": effects placed on the caster in addition to what happens to targets ([] if none). When the caster is the only target, use targets.self = "only" and "onUse" instead.
- "dur": duration in seconds (round = 6, minute = 60, hour = 3600, day = 86400). 0 for Instantaneous. For "until dispelled" use 0 and set "untilDispelled": true (else false).
- "up": what a higher slot does, per slot level above the base, as an object with any of: {"dmg": "1d6", "heal": "1d8", "temp": "5", "targets": 1, "hpMax": 5, "dur": "text", "note": "text"}; null if nothing. "upEvery": 1 normally, 2 if the increase is per two slot levels.
- "again": null, or "action" | "bonus" | "free": while the spell lasts, the caster can use its effect again on later turns (attack again, move it and deal damage again, repeat the damage) at that cost. Use "free" when damage recurs with no action (a creature starts its turn in the area, enters the area).
- "movable": true if the text lets the caster move the effect to a new creature later without casting again (Hunter's Mark, Hex).
- "summon": null | "summon" (brings a creature or spirit with a stat block into play) | "form" (the target or caster takes a creature's stat block).
- "timing": list of {"when": "cast" | "hit" | "failed save" | "start of target's turn" | "end of target's turn" | "start of caster's turn" | "enters area" | "ends turn in area" | "moves" | "attacks" | "takes damage" | "other", "what": short plain-English statement} covering EVERY effect of the spell and when it happens. This list must be complete even where the structured fields cannot express it.
- "notAutomated": "" in almost every spell. A part that is the DM's call goes in "dmNote" and a part about positions, areas, objects or the map goes in "mapNote" (both in "extras"). Write a sentence here only for a rule that changes a creature's numbers and that no key in this prompt can express.
- "other": anything in the spell's rules that none of the fields above cover at all (special conditions, choices, exceptions, costs, things a map would need). "" if nothing.

Effect keys (for "effs" and "selfEffs"). Use only these keys; anything else goes in "note":
- "name": short label; default is the spell's name.
- "ac": number added to AC (Shield of Faith: 2). "acMin": AC cannot be lower than this number. "acBase": base AC number to which the Dexterity modifier is added when not wearing armor (Mage Armor: 13).
- "speed": feet added to Speed (negative to reduce). "speedMult": 2 doubled, 0.5 halved. "speedZero": true if Speed becomes 0.
- "init": number added to Initiative.
- "d20": number added to every D20 Test.
- "atk": dice added to the creature's attack rolls ("1d4", or "-1d4" as a penalty). "save": dice added to its saving throws ("1d4" / "-1d4"). "check": dice added to ability checks, with "checkSkill": a skill name if only one skill.
- "saveAdv": ability name it has Advantage on saves with. "saveDis": ability name it has Disadvantage on saves with. "checkDis": ability name it has Disadvantage on checks with. "checkAdv": ability name it has Advantage on checks with.
- "atkAdv": true if its attack rolls have Advantage. "atkDis": true if its attack rolls have Disadvantage.
- "advAgainst": true if attack rolls against it have Advantage. "disAgainst": true if attack rolls against it have Disadvantage.
- "noInvisible": true if it cannot benefit from the Invisible condition.
- "bonusDmg": dice of extra damage dealt to it, with "bonusType", and "fromCaster": true if only the caster's hits deal it (Hunter's Mark, Hex).
- "dmgBonus": number or dice added to the damage of the creature's own weapon attacks (Divine Favor: "1d4" with "bonusType": "Radiant" goes here as "weaponDmg": "1d4", "weaponDmgType": "Radiant").
- "resist": comma list of damage types it gains Resistance to. "immuneDmg": comma list of damage types it becomes Immune to. "vuln": comma list it becomes Vulnerable to.
- "immune": one condition name it cannot have / is protected from. "condImmune": comma list when more than one.
- "tempEachTurn": number of Temporary Hit Points gained at the start of each of its turns.
- "hpMax": number added to its Hit Point maximum (Aid: 5).
- "sizeStep": +1 (one size larger) or -1 (one size smaller).
- "noReact": true if it cannot take Reactions. "noHeal": true if it cannot regain Hit Points.
- "sense": short text of a sense gained ("Darkvision 150 ft."). "move": short text of a movement mode gained ("Fly Speed 60 ft.").
- "note": short plain-English reminder for anything about this effect the keys cannot express.
- "ward0": true. The first time the creature would drop to 0 Hit Points it drops to 1 instead, and this effect ends (Death Ward).
- "sanctuary": true. A creature that targets it with an attack or harmful spell must first succeed on a Wisdom save against the caster's spell save DC or lose that attack (Sanctuary).
- "images": 3. Illusory duplicates. Each time an attack hits, roll d6 per duplicate; on any 3+ a duplicate is hit and destroyed instead (Mirror Image). Add "unlessSight": true when attackers that are Blinded or have Blindsight or Truesight ignore them.
- "endsOnAct": true. The effect ends when the creature makes an attack roll, deals damage or casts a spell (Invisibility).
- "endsOnDamage": true. The effect ends when the creature takes any damage.
- "saveEnds": "end" or "start". The creature repeats the spell's saving throw at the end / start of each of its turns; a success ends this effect (Slow, Bane-like effects without a named condition).
- "weaponAtk": number added to the creature's weapon attack rolls (Magic Weapon: 1), used with "dmgBonus".
- "stable": true. A creature at 0 Hit Points becomes Stable (Spare the Dying).
- "dashBonus": true. The creature can take the Dash action as a Bonus Action (Expeditious Retreat).
- "protect": true. Aberrations, Celestials, Elementals, Fey, Fiends and Undead have Disadvantage on attack rolls against it (Protection from Evil and Good).
- "extraAction": short text of an additional action it gains each turn (Haste).
- "turnRoll": {"when": "end" or "start", "dice": "1d6", "text": "what the result means"}: a die rolled every turn of the creature (Blink).
- A condition given with no save (Invisibility: Invisible) goes in "onUse" under "conds".
- In any text value inside an effect, a damage type or a condition name you may write "$1" or "$2" to stand for the caster's first or second choice (see "choices" below).

The "extras" object (include only the keys that apply):
- "choices": up to two choices the caster makes when casting, each {"label": "Skill" (a short name under 25 characters, such as "Damage type" or "Creature type"; never an explanation in brackets: the rule behind the choice goes in a "note"), "options": ["Acrobatics", "Animal Handling", ...]}. Give the full explicit list of options from the text (all 18 skills, the six abilities, the listed damage types, the listed commands...). Refer to the chosen option as "$1" (first choice) or "$2" in effect values and damage types. Examples: Guidance: effs [{"check": "1d4", "checkSkill": "$1"}]. Resistance: effs [{"resistType": "$1"}] ("resistType" = reduces that damage type by 1d4 once per turn). Chromatic Orb: dmg [["3d8", "$1"]]. Hex: effs [{"bonusDmg": "1d6", "bonusType": "Necrotic", "fromCaster": true, "checkDis": "$1"}].
- "modes": when the spell has separate versions the caster picks between (Enlarge / Reduce; Blindness / Deafness; the options of Bestow Curse, Command, Contagion, Symbol, Control Water...): [{"name": "Enlarge", "set": { any record fields that differ for this mode: "k", "save", "dmg", "half", "onFail", "onUse", "onHit", "onSuccess", "selfEffs", "heal", "temp", "dur", "targets", "area" }}]. When only an unwilling creature makes the save (a willing creature or an object is simply affected), give each version twice: "Enlarge (unwilling creature)" with the save, and "Enlarge (willing creature or object)" with "k": "apply", "save": null and the effect in "onUse". Every mode in the text gets an entry. The record itself should hold what is common to all modes.
- "remove": the spell ends things on the target: {"conds": ["Blinded", "Deafened", "Paralyzed", "Poisoned"] (conditions it can end), "count": 1 or "all", "exhaustion": levels removed or 0, "effects": null | "curse" | "spells" | "any" (which lasting effects it can end), "maxLevel": for Dispel Magic the spell level ended automatically (3), else 0, "hpMaxRestore": true if it restores a reduced Hit Point maximum}.
- "byHP": the effect depends on the target's current Hit Points: {"max": 100, "atOrBelow": { record fields that apply when its Hit Points are that or lower }, "above": { record fields that apply otherwise }} (Power Word Kill, Power Word Stun). If there are several bands (Divine Word), use "bands": [{"max": 20, "set": {...}}, {"max": 30, "set": {...}}, ...] instead.
- "attacks": the spell makes several separate attack rolls or sends several darts that may go to the same or different targets: {"n": 3, "perSlot": 1 (more per slot level), "byLevel": true if a cantrip that gains one more at character levels 5, 11 and 17 (Eldritch Blast: n 1, byLevel true)}. Then the record's "dmg" is the damage of ONE attack or dart and the record's targets "n" is 1.
- "askDM": the spell's result is information the DM provides: a short sentence saying what the DM must tell the caster (Augury, Divination, Identify, Legend Lore, Commune, Locate spells, Detect spells' later questions).
- "cost": the Material component has a price: {"gp": number, "consumed": true or false}.
- "summonCtl": for spells whose "summon" is "summon": {"commandAct": "bonus" | "action" | null (what it costs the caster to command it, null if it acts on its own or obeys verbal commands for free), "controlSecs": seconds the caster keeps control (0 if as long as the spell lasts), "actsAfterCaster": true if it shares the caster's Initiative / acts right after, false if it rolls its own, "count": number of creatures (1 if one), "statBlock": name of the stat block in the text if it names one ("Skeleton", "Zombie", "Otherworldly Steed"), else ""}.
- "form": the target (or caster) takes on a stat block: {"on": "target" | "self", "limit": short text of what forms are allowed ("a Beast with Challenge Rating up to the target's level"), "tempHP": true if it gains Temporary Hit Points equal to the form's Hit Points, false if its Hit Points are replaced}.
- "move": the spell itself moves creatures when it is cast or used (Misty Step, Thunderwave's push, Levitate's 20 feet up, Wind Walk's travel). A Speed the target gains (Fly's Fly Speed) is NOT this: that is the effect key "move" ("Fly Speed 60 ft."). {"kind": "teleport" | "push" | "pull" | "fly" | "fall", "feet": number, "who": "self" | "target" | "self and others", "others": number of willing creatures that can come along (0 if none)}.
- "zone": for a spell that leaves an area in play that keeps affecting creatures: {"enter": true if it acts when a creature enters, "startTurn": true if at the start of a creature's turn there, "endTurn": true if at the end, "difficult": true if it is Difficult Terrain, "obscured": "lightly" | "heavily" | "", "oncePerTurn": true when the text says "for the first time on a turn" or "only once per turn" (or per round); otherwise false}. Also set the record's "again" to "free" for these.
- "creates": the spell makes things that stay around (food, berries, a light, an illusion, a ward, a duplicate): [{"name": "Food (45 pounds)", "secs": 86400 (how long it lasts in seconds, 0 if it does not expire), "note": "what it does, in the text's own terms"}]. Do not use "creates" for what the record already tracks: a repeatable attack ("again", as for Spiritual Weapon or Call Lightning), a lasting area ("zone"), or an effect placed on creatures (Faerie Fire's outline). Each one is listed for the caster with its clock. A lasting spell that affects no creature and targets an object, a point or nothing is listed this way without you writing "creates".
- In "creates", a physical thing the caster ends up carrying also takes "kind": "item", and may take "count", "spoil": "Spoiled Food" (what it becomes when its time ends) and "use": {"heal": "1", "act": "bonus" | "action", "effName": "Nourished", "effLeft": 86400, "effNote": "what it does"} for something used up one at a time. Anything else created is listed as an active effect the caster controls.
- More that a higher slot can change: "upTurn": "1d6" (dice added to a "turnDmg" for each slot level above), "areaPerSlot": 20 (feet added to the area's size for each slot level above), "effBySlot": [[3, {"weaponAtk": 2, "dmgBonus": 2}], [6, {"weaponAtk": 3, "dmgBonus": 3}]] (effect values that replace the first effect's from that slot level up). For a summoned creature whose numbers grow with the slot, add to "summonCtl" "ac": [base, added per spell level] and "hp": [base, added per level, the level the adding starts from] (Summon Dragon: "ac": [14, 1], "hp": [50, 10, 5]).
- "missHalf": true when an attack spell still deals half its damage on a miss.
- "auto": {"failTypes": ["Plant"], "passTypes": [], "passCR": true}: creatures that fail or succeed the save without rolling (passCR: any creature whose Challenge Rating is not 0 succeeds).
- "castNote": one short sentence shown when it is cast, for something that is part of casting and needs no roll.
- "fixedDc": a number, when the save has its own DC instead of the spell save DC.
- "targetsBySlot": [[8, 3], [9, 6]] when a higher slot sets the number of targets outright.
- New effect keys for spells, with the same meanings as the ability effects listed further below: "noBonus", "atkDisVs", "maxHeal", "noHpMaxDown", "healAt0" (with "healEachTurn"), "breakConc", "turnOfCaster" (with "turnDmg"), "endsOnDamageBy": "caster", "noAgain": "Spell Name" (in an onSuccess effect with "left": a creature that succeeds can't be targeted by it again for that long), "restShrink": 1, "onEnd": {"cond": "Incapacitated", "left": 6, "speedZero": true}, "retaliate": {"dice", "type"} or {"save", "cond", "types", "left"}, "atkDmg": {"dice", "type"}, "failDmg" (on an effect with "saveEnds"). A cond may add "endsOnDamageBy": "caster", "failDmg": {"dice", "type"}, "failCond": "Unconscious", "tally": 3, and "secs" when it lasts a different time from the spell. An effect may also take "secs" for the same reason. Anything that lasts "until the start of your next turn" or "until the end of your (or its) next turn" gets "secs": 6, even when the spell itself is Instantaneous. Any numeric effect value may be "SPELLMOD".
- "secondary": a second effect with its own save that comes with an attack, hit or miss (Ice Knife's explosion): {"save": "Dexterity", "label": "explosion", "dmg": [["2d6", "Cold"]], "half": false}. The caster picks every creature caught in it; the first one picked takes the attack. "upSecondary": "1d6" when only that second damage grows with the slot.
- A summoned creature whose stat block is printed in the spell and depends on the spell's level gets the whole stat block in "summonCtl" as "block": {"name": "Otherworldly Steed", "size": "Large", "type": "$1" (or a fixed type), "ac": [base, per spell level], "hp": [base, per spell level, the level the adding starts from], "speed": 60, "speedMore": [{"text": "Fly 60 ft.", "minLvl": 4}], "s": [Str, Dex, Con, Int, Wis, Cha], "res": "", "ci": "", "senses": "", "traits": [["Name", "text"]], "acts": [{"n": "Otherworldly Slam", "kind": "attack" | "save" | "heal" | "info", "act": "action" | "bonus", "only": "Fiend" (only for that chosen type), "dmg": "1d8+L" (L is the spell's level), "dtype": "Piercing" or {"Celestial": "Radiant", "Fey": "Psychic"} or "$2", "save": "Wisdom", "cond": "Frightened", "left": 6, "half": true, "heal": "2d8+L", "uses": 1 (per Long Rest), "d": "its text word for word"}]}. Attacks use the caster's spell attack modifier and saves the caster's spell save DC.
- A spell that lets the caster store another spell inside it has, in the record (or inside the version that does it), "storeSpell": {"max": the highest spell level it holds, "bySlot": true if a higher slot raises that}. The caster picks the stored spell when casting; it is kept on the caster's sheet and used once, when the trigger happens, with no spell slot and no Concentration.
- "durBySlot": [[slot level, seconds, 1 if it no longer needs Concentration else 0], ...] when a higher slot makes the spell last longer (0 seconds = until dispelled). "durPerSlot": seconds added for each slot level above the spell's level. A flat amount more healing or Temporary Hit Points per slot level goes in the record's "up" as a plain number ("heal": "10", "temp": "5").
- A spell or message that the DM has to act on over time ("askDM" or "message" with a duration of 10 minutes or more) is kept in the DM's panel with its clock until it ends or the DM cancels it. Nothing extra is written for this.
- "message": true when the caster sends free words of their own to the target (Message, Sending, Animal Messenger). A one-word command picked from a list (Command) is "modes", not a message. The caster types them and only the sender, the recipient and the DM see them.
- "escape": {"ability": "Strength", "skill": "Athletics" or "", "dc": a number, or 0 to use the caster's spell save DC}: an affected creature can take an action to make that check and end the condition or effect on itself.
- "viaWeapon": the spell is an attack made with a weapon the caster holds, using the spellcasting ability (True Strike): {"byLevel": true if it adds 1d6, 2d6 and 3d6 extra damage at character levels 5, 11 and 17, "type": the extra damage type}. The player then picks the weapon when casting.
- "weaponBuff": the spell changes how a held weapon attacks while it lasts (Shillelagh): {"weapons": "Club|Quarterstaff" (weapon names, separated by |), "die": "1d8" (its new damage die), "byLevel": true if the die grows at levels 5, 11 and 17, "type": a damage type it may deal instead}.
- "castRoll": a die rolled once when the spell is cast, shown to the table: {"dice": "1d4+1", "text": "what the number means"}.
- "saveAdvIf": "you or your allies are fighting it": the condition under which the target has Advantage on its save, copied from the text (Charm Person). The DM is asked whether it applies.
- "dmNote": "..." and "mapNote": "...": one or two sentences for a part that is truly the DM's call (what a commanded creature chooses, story, a creature's knowledge) or a matter of positions on a map (areas, walls, distances, line of sight). They are shown with the spell. Never put a rule that changes a creature's numbers in a note if a key can express it.
- "castRoll" may add "extraTurns": true: the caster takes that many turns in a row while no time passes for anyone else (Time Stop).
- "drain": "half" or "full": the caster regains Hit Points equal to that share of the damage dealt (Vampiric Touch).
- "hpMaxDrain": true: the target's Hit Point maximum drops by the damage it takes, until it finishes a Long Rest (Harm).
- "onKill": {"dust": true} when a creature dropped to 0 Hit Points by it is disintegrated, or {"summon": "Zombie", "types": ["Humanoid"]} when it rises under the caster's control.
- "afterMeleeHit": true: it can only be cast right after the caster hits with a melee weapon or an Unarmed Strike (Divine Smite).
- "deferred": true: casting it sets it, and nothing happens until the caster uses it from Active (Delayed Blast Fireball). "grow": "1d6": its first damage grows by this at the end of each of the caster's turns until then.
- "healPool": 700: the healing is one pool the caster divides among the targets (Mass Heal).
- "grant": the target (or the caster) gains an action it can use from Active while the spell lasts: {"name": "Dragon's Breath", "act": "action" or "bonus", "self": true if the caster gains it, "save": "Dexterity", "dmg": [["3d6", "$1"]], "half": true, "area": {...}, "attack": true for an attack roll with the spell attack bonus, "ranged": true, "heal": "1d8", "desc": "its text"}. Alter Self's natural weapons are {"attack": true, "dmg": [["1d6+SPELLMOD", "$1"]]}.
- "leap": true: when two damage dice show the same number, it can be used again on a new target (Chromatic Orb).
- "explode": {"die": 8}: each die that rolls its top number adds another die, up to the spellcasting modifier (Sorcerous Burst).
- "choicePerTarget": true: the first choice is made separately for each target (Enhance Ability).
- "randomMode": {"die": 8, "twice": 8}: each target rolls the die and gets the version with that number, versions listed in die order; on the "twice" number it gets two other versions (Prismatic Spray).
- "countCasts": true: casts are counted until a Long Rest and the count is shown (Divination).
- "weaponBuff" may instead be {"weapons": "" for any weapon, "bonus": 1, "keepMod": true}: a flat bonus to attack and damage rolls with the one weapon the caster picks (Magic Weapon). A bonus that grows with the slot goes in "effBySlot": [[3, {"wpnBonus": 2}], [6, {"wpnBonus": 3}]].
- "auto" may add "disTypes": ["Construct"]: creatures of those types have Disadvantage on the save (Shatter).
- "summonCtl" may add: "lifeBond": true (the caster drops when it does), "endsOnDamage": true (it vanishes when it takes damage), "noAttack": true, "speed": 100, "count": 4 or "SPELLMOD", "countBy": {"Large": 2, "Huge": 3} (how many of the count one creature of that choice uses up, Animate Objects), "statByChoice": {"Corpse (Zombie)": "Zombie"} (the stat block follows the first choice), "statBySlot": [[8, "Ghast"], [9, "Wight"]], and "block": a stat block printed in the spell itself. In "block", "hp" may be an object keyed by the choice ({"Large": [20, 0, 0]}), each action may have "only": the choice it belongs to, and "dmgUp": "1d4" with "upFrom": 5 when its damage grows per slot above that level. Monster names for "statBlock" are the SRD 5.2.1 names.
- A choice may add "multi": true when the caster picks several options at once (Magic Circle's creature types).
More effect keys (inside "effs" / "selfEffs"):
- "noOA": can't make Opportunity Attacks. "noStand": can't end the Prone condition on itself. "noAttack": can't make attacks. "endsAt0": the effect ends if the creature drops to 0 Hit Points.
- "seeInvisible": it sees Invisible creatures. "noSlow": its Speed can't be reduced by magic. "actOrBonus": on its turn it takes an action or a Bonus Action, not both.
- "noInvisibleVs": it gains nothing from being Invisible against the caster. "unlessSight": with "disAgainst", attackers with Blindsight or Truesight, or who are Blinded, ignore it (Blur).
- "shakeOff": another creature can take an action to end it. "endsOnSpell": it ends if the creature is targeted by another spell. "untilLongRest": it lasts until the creature finishes a Long Rest. "oneAtATime": only one creature can have it from the caster at once; casting again moves it.
- "deathAdv": Advantage on Death Saving Throws. "atkDisAbil": "Strength": Disadvantage only on attack rolls that use that ability. "checkAdvSkill": "Intimidation": Advantage on checks with that one skill. "saveAdvVs": "Poisoned": Advantage on saves against that condition.
- "saveAbil": "Dexterity" with "saveAbilMod": -2: a bonus or penalty to saving throws of that one ability (Slow).
- "minRoll": {"abil": "Charisma", "kind": "check" or "save", "value": 15}: a d20 roll lower than that counts as that number.
- "immuneSpell": "Magic Missile": takes no damage from that spell. "bondTo": true: the caster takes the same damage this creature takes (Warding Bond).
- "castFail": {"comp": "S", "dc": 6}: when it casts a spell with that component, a d20 below that number means the spell fails. Use "dc": 21 when such a spell always fails (Silence and "V").
- "ppMod": -10: added to its Passive Perception. "punish": {"dice": "5d10", "type": "Psychic"}: the DM gets a button to deal this when the creature acts against the spell's command.
- "turnSave": {"abil": "Wisdom", "when": "start", "text": "what a failure means"}: a save each turn that does not end the effect; a failure is logged with that text.
- "condImmuneFrom": {"conds": ["Charmed", "Frightened"], "types": ["Fiend", "Undead"]}: creatures of those types can't give it those conditions. "disAgainstTypes": ["Aberration"]: attackers of those types have Disadvantage against it.
- "away": true: the creature is somewhere else (another plane, a demiplane, a maze) while the effect lasts; it can't be targeted and takes no part in the fight (Banishment, Etherealness, Maze).
- "noCast": true: it can't cast spells. "noAct": true: it can't take actions (Command's "Halt", Stinking Cloud's lost turn).
- "endsOnAttack": true: the effect ends after the creature's next attack roll (Vicious Mockery, Ray of Enfeeblement). "endsWhenAttacked": true: it ends when the next attack roll is made against the creature (Guiding Bolt).
- "turnRoll" may add "apply": {"min": 4, "eff": {...an effect...}}: on that roll or higher the creature gets that effect (Blink's "eff": {"name": "Blink (Ethereal Plane)", "away": true, "left": 6}).
- "saveEnds": "action": instead of a save each turn, it can take an action to repeat the save. "atkDmg" may add "types": ["Acid", "Cold"]: the damage type is picked for each attack.
More result keys (inside onHit / onFail / onSuccess / onUse, next to "conds" and "effs"):
- "useReaction": true: its Reaction is used up. "endForm": true: it returns to its true form.
- "hpUp": "2d10": its Hit Point maximum rises by the roll and it gains that many Hit Points for the spell's duration.
- "setScores": {"Intelligence": 10}: those ability scores become that value.
- "clone": {"hpFactor": 0.5, "type": "Construct"}: a copy of the target joins under the caster with that share of its Hit Point maximum.
- A condition may add "resistRemoval": "Constitution": when something would end it, the creature must succeed on that save or it stays (Contagion).
- "cannot": if, after all of this, part of the spell still cannot be expressed, one short sentence saying exactly what and why. Leave it out if nothing.
MAP FEATURES. Everything with a range, an area, a created thing, an object or a spot as its target, or forced movement is something the map will place later, and the app tags it from "range", "area", "targets" and "zone" with no extra key. So always fill those four exactly, even though the app does not measure distance yet: that is what lets it be clicked and placed on the map later with no rewrite. Until then everything is entered by hand: the caster picks the creatures in the area, anything that needs a save is rolled at once, a spell that works on an object or a spot asks the caster to type what it is cast on, a created effect can be placed and re-placed by typing where it is, and an area that stays in play ("zone") can be applied to more creatures later (the affected player can reject it). If the text says the target must be one "that you can see", the app works that out from the text: write nothing for it.
WHEN SOMETHING CANNOT BE DONE. Never write a rule that forbids a use (a missing component, a condition that stops casting, a wrong target). The app greys the option out, says why, and lets the table go ahead with a flag in the log. Your job is only to record the requirement (components, "targetLimit", "cost") exactly.
A spell that ends things ("remove") needs no choice written for it: the caster is shown what the target really has and picks from that. A Ritual needs nothing here either: "ritual": true on the spell is enough, and the player is asked whether to cast it as a Ritual (10 minutes longer, no spell slot) or with a spell slot. A component with a price ("cost") is paid in gold when the spell is cast: once if it is kept, every time if the spell consumes it, and the spell cannot be cast without the gold.


"items": [
  { "name": "Lantern of the Deep", "rarity": "Rare", "type": "Wondrous Item", "attunement": true, "description": "Full item text." }
]
rarity is Common, Uncommon, Rare, Very Rare, Legendary or Artifact.
type decides where the item shows up, so write it exactly in one of these forms:
- Magic armor: "Armor (plate)", "Armor (chain shirt)", "Armor (studded leather)" for one kind of armor; "Armor (light)", "Armor (medium)", "Armor (heavy)", "Armor (medium or heavy)", "Armor (medium or heavy, not hide)" or "Armor (light, medium, or heavy)" when the player picks the kind; "Armor (shield)" for a shield.
- Magic weapons: "Weapon (longsword)" for one kind of weapon; "Weapon (any sword)", "Weapon (any axe)", "Weapon (any axe or sword)", "Weapon (any sword that deals slashing damage)", "Weapon (any melee)", "Weapon (any ranged)" or "Weapon (any)" when the player picks the kind.
- When the text names several kinds, list them the same way, in lower case: "Weapon (greatsword, longsword, rapier, scimitar, or shortsword)", "Armor (half plate or plate)", "Armor (chain mail or chain shirt)". "Any Simple or Martial" is "Weapon (any)"; "Any Melee Weapon" is "Weapon (any melee)"; "Any Ammunition" is "Weapon (any ammunition)".
- Anything else: "Wondrous Item", "Ring", "Rod", "Staff", "Wand", "Potion", "Scroll".
An armor or weapon item written this way is offered in the builder's Armor and Weapon pickers when the character carries it, as the ordinary armor or weapon it is (same Armor Class formula, damage die, properties and mastery property). An item that fits several kinds is offered once for each kind, for example "Adamantine Armor (Plate Armor)".
If the item gives a flat bonus, add "bonus": 1 (or 2, 3). For armor and shields it is added to Armor Class. For weapons it is added to attack rolls and damage rolls. Example: { "name": "Wardstone Plate", "rarity": "Rare", "type": "Armor (plate)", "attunement": false, "bonus": 1, "description": "Full item text." }
Anything else the item does (extra damage, a use per day, a save it forces) goes in "abilities" with "grantedBy": { "type": "item", "name": "Wardstone Plate" }. Work through every magic item in this order, and always the same way:
  1. The item entry itself: name, rarity, type, "attunement", "description" (the full text word for word), and "bonus" for a flat +1, +2 or +3 on armor, a shield or a weapon. An item sold as +1, +2 or +3 is three items: "Weapon, +1", "Weapon, +2", "Weapon, +3" (the same for Armor, Shield, Ammunition and Wand of the War Mage), each with its own rarity.
  2. What it does all the time while worn, held or attuned: one ability with only "statics" (Ring of Protection: "acBonus": 1 and "saveBonus": 1; Cloak of Elvenkind: "skillBonus"; Boots of Speed: an activated effect instead). A score the item sets ("your Strength is 21") is "scoresMin": { "Strength": 21 } (no effect if the score is already higher).
  Numbers and timing that do not fit a field are written the same way every time: charges or uses set by a roll ("1d6 + 4 pinches") take the highest number as "max" and the roll in the ability's "message"; a wait before it can be used again ("after 7 days", "1 hour", "24 hours") is "recharge": "after" with "after": { "amount": 7, "unit": "days" } (units: minutes, hours, days, years), and the DM's clock gives it back when that time has passed; a wait that is itself a roll ("1d8 hours") takes the highest number; damage that depends on charges left goes in a note.
  3. Its charges, if it has any: one ability with only "resource", named exactly as the item: { "name": "Wand of Magic Missiles", "max": 7, "recharge": "dawn", "regain": "1d6+1" }. recharge is "dawn" for "regains ... daily at dawn" (write the dice in "regain"; leave "regain" out if all come back), "long" or "short" when it follows a rest, "after" with "after": { "amount": 7, "unit": "days" } when they all come back after a wait, or "none" when used charges never come back. "uses" takes the same recharge words ("dawn" for "once per dawn"). When the DM keeps track of the time of day, dawn comes at 06:00; otherwise a Long Rest counts as dawn. Anything the item does on its last charge ("roll a d20; on a 1 it crumbles") goes in that ability's "message".
  4. Each spell it casts: one ability with "castSpell": { "spell": "Magic Missile" (the spell's exact name), "level": 1 (the level it is cast at), "maxLevel": 3 (the highest level extra charges can raise it to, else the same as level), "perLevel": 1 (charges for each level above), "dc": 15 and "attack": 7 when the item fixes them (leave them out to use the user's own spellcasting) } and "uses": { "pool": "Wand of Magic Missiles", "cost": 1 } for charges, or "uses": { "max": 1, "recharge": "long" } for "once per dawn" without charges. The app runs the spell exactly as the spell itself, from its own record.
  5. Everything else it lets the user activate (a breath, an attack, an effect it switches on): one ability each, like any other ability, with "uses" for charges or limits.
An item that needs Attunement only works while the user is attuned to it: the builder has an Attune button on each such item (at most 3). Write nothing for this beyond "attunement": true.
ITEM SLOTS. Attunement is one kind of item slot. When the source has another kind (tattoo slots, rune slots: an item works only while it is in one, and a character has a limited number), define the kind once in "slotTypes" at the top level of the file and give each such item "slot" with that name instead of "attunement":
"slotTypes": [ { "name": "Tattoo", "max": 2, "verb": "Ink", "on": "Inked" } ]
  name: the slot kind, as the source names it, singular. max: how many every character has (0 when only some features give them). verb: the word on the button that puts an item in the slot. on: the word shown while it is in one.
  { "name": "Ember Ward Tattoo", "rarity": "Uncommon", "type": "Wondrous Item", "slot": "Tattoo", "description": "Full item text." }
The builder shows each kind of slot next to Attunement, with its own count, and the Combat Resolver shows them on the sheet. A feature that gives more slots of any kind (Attunement included) uses the statics key "itemSlots". To change how many Attunement slots everyone has, define { "name": "Attunement", "max": 4 } in "slotTypes".

---------------------------------------------------------------------
ABILITIES: EVERYTHING A CHARACTER ACTIVATES
---------------------------------------------------------------------

This is the most important section. Every feature that changes a number, gives uses, offers a choice or can be used needs an entry here. Only pure text (a language, a ribbon) can be left out.

The Combat Resolver does this with each ability:
  1. The player picks it on their turn and picks a target (or it lands on themselves).
  2. The app reads the user's numbers AS THEY ARE AT THAT MOMENT to get the attack bonus, the save DC and the dice.
  3. If there is an attack roll, the user presses a button and the app rolls against the target's current Armor Class, counting every effect and condition on both creatures.
  4. If there is a saving throw, the TARGET's player (or the DM, for a monster) gets a Roll button. Nothing is rolled for them. The roll uses the target's current save bonus and everything affecting it.
  5. The result is applied: damage (after Resistance, Immunity, Vulnerability and Temporary Hit Points), then the conditions and effects for that result. A different result can apply something different (onFail and onSuccess).
  6. Durations start counting. A round of combat is 6 seconds. A Short Rest is 1 hour and a Long Rest is 8 hours. When the time runs out the condition or effect ends.
  7. Anything that recurs (a save repeated each turn) comes up again as a Roll button on the right turn, and a success ends it.

Each ability looks like this. Leave out any field that does not apply.

{
  "name": "Cinder Breath",
  "grantedBy": { "type": "species", "name": "Emberkin" },
  "activation": "bonus",
  "target": "creature",
  "roll": "save",
  "save": { "ability": "Dexterity", "dc": "8+PROF+CON" },
  "damage": [ { "dice": "2d6", "type": "Fire" } ],
  "halfOnSave": true,
  "onFail": {
    "conditions": [ { "name": "Blinded", "duration": { "amount": 1, "unit": "rounds" } } ]
  },
  "uses": { "max": "PROF", "recharge": "long" },
  "atLevel": { "5": { "damage": [ { "dice": "3d6", "type": "Fire" } ] }, "11": { "damage": [ { "dice": "4d6", "type": "Fire" } ] } },
  "text": "Full rules text of the feature."
}

grantedBy: who gets it.
  type is "class", "subclass", "species", "lineage", "background", "feat", "spell" or "item".
  name is the exact name of that class, subclass, species, lineage option, background, feat, spell or item.
  For type "lineage" also give "species": the species the lineage belongs to.
  level is the character level at which it is gained. Leave it out for level 1.
  A character gets the ability when their sheet has that option. A "spell" ability is granted when the spell is on their spell list. An "item" ability is granted when the item is on their sheet.

activation: "action", "bonus", "reaction" or "free".

target: "creature" (the user picks a target) or "self" (it lands on the user).
targets: how many creatures one use can affect. Leave it out for one. Give a number or a formula ("3", "MAX(1,CHA)") for "up to that many", or "any" for an area or "each creature of your choice". The user picks them all, one use is spent, the damage is rolled once and each target rolls its own save.

roll: what decides the result.
  "attack": the user rolls to hit the target's Armor Class. Needs "attack".
  "save": the target rolls a saving throw. Needs "save".
  "none": it just happens.

attack: { "bonus": "PROF+STR", "ranged": false }
  bonus is a formula (see FORMULAS). Use "SPELLATK" for a spell attack.
  ranged is true for a ranged attack, so the rules for a Prone target and for automatic Critical Hits apply correctly.
  weapon is true when the attack is made with a weapon, and twoHanded is true when that weapon is held in two hands, so feats such as Savage Attacker, Archery and Great Weapon Fighting apply to it.

save: { "ability": "Wisdom", "dc": "SPELLDC" }
  ability is the save the TARGET makes. dc is a formula, for example "SPELLDC", "8+PROF+CON" or 15.

damage: a list, one entry per damage type: { "dice": "1d8+STR", "type": "Slashing" }.
  dice is a dice formula (see FORMULAS). With roll "attack" it is dealt on a hit and the dice are doubled on a Critical Hit. With roll "save" it is dealt on a failed save. With roll "none" it is dealt automatically.
halfOnSave: true if a successful save still takes half damage. damageOnSuccessToo: true when the damage comes with a hit no matter what, and the save only decides something else (Giant Slayer, Sword of Wounding).

heal: a dice formula for Hit Points restored, for example "1d10+LEVEL" or "2d4+SPELLMOD". With target "self" it heals the user.

RESULTS. Each of these holds "conditions" and "effects":
  "onHit": applied to the target when the attack hits.
  "onFail": applied to the target when it fails the save.
  "onSuccess": applied to the target when it succeeds on the save. Use this for the alternative result, such as a weaker effect on a success.
  "onUse": applied when there is no roll (roll "none"), to the target or to the user if target is "self".

A result can also give Temporary Hit Points: "onUse": { "tempHP": "1d8+WIS" }.

conditions: a list of
  { "name": "Frightened", "duration": { "amount": 1, "unit": "minutes" }, "repeatSave": { "when": "end", "turn": "target", "ability": "Wisdom" } }
  name is one of: Blinded, Charmed, Deafened, Frightened, Grappled, Incapacitated, Invisible, Paralyzed, Petrified, Poisoned, Prone, Restrained, Stunned, Unconscious.
  duration: amount and unit ("rounds", "minutes", "hours" or "days"). Leave it out if it lasts until something removes it. "Until the end of its next turn" is 1 round.
  repeatSave: include it when the text says the creature repeats the save.
    when is "start" or "end" (of the turn).
    turn is "target" (the affected creature's own turn) or "source" (the turn of whoever used the ability).
    ability is the save to repeat; leave it out to reuse the ability of the first save. The DC is the same DC.
  On a successful repeat the condition ends. Otherwise it ends when the duration runs out.

effects: a list of timed bonuses, penalties and riders. Give each a name (usually the ability's name), then only the fields it needs:
  "duration": { "amount": 1, "unit": "minutes" }   leave out for "until removed"
  "concentration": true                            ends on a Long Rest and is marked as Concentration
  "ac": 2                                          bonus or penalty to Armor Class
  "speed": 10                                      feet added to Speed (negative to reduce)
  "speedMultiplier": 2                             2 doubles Speed, 0.5 halves it
  "initiative": 2                                  bonus to Initiative
  "d20Tests": -2                                   flat modifier to every D20 Test
  "attackRolls": "1d4"                             dice or number added to attack rolls ("-1d4" to subtract)
  "savingThrows": "1d4"                            dice or number added to saving throws
  "advantageOnSaves": "Dexterity"                  Advantage on saves with that ability
  "saveModifier": { "ability": "Dexterity", "amount": -2 }   flat modifier to one ability's saves
  "checkDisadvantage": "Strength"                  Disadvantage on checks with that ability
  "checkBonus": { "skill": "Stealth", "dice": "1d4" }        dice added to one skill
  "attacksAgainstHaveAdvantage": true              attack rolls against the creature have Advantage
  "cannotBeInvisible": true                        it can't benefit from the Invisible condition
  "extraDamageFromUser": { "dice": "1d6", "type": "Force" }  the user deals this extra damage each time they hit the creature
  "movable": true                                  the user can move this effect to another creature later without using the feature again (a mark that moves when its target drops to 0 Hit Points)
  "immuneTo": "Frightened"                         immune to that condition while it lasts
  "reduceDamageType": "Fire"                       reduces that damage type by 1d4 once per turn
  "tempHPEachTurn": "CHA"                          formula: Temporary Hit Points at the start of each of its turns
  "hitPointMaximum": 5                             raises the Hit Point maximum by this much while the effect lasts (the Aid spell). Current Hit Points go up by the same amount when it is applied, and come back down to the maximum when it ends. The app shows a character's Hit Point maximum as its Hit Point total
  "resistDamage": ["Bludgeoning", "Piercing"]      Resistance to those damage types while it lasts
  "damageBonus": 2                                 formula: added to the damage of its weapon attacks and Unarmed Strikes
  "damageBonusFor": "Strength"                     only when the attack uses that ability
  "critImmune": true                               a Critical Hit against it becomes a normal hit while the effect lasts
  "acVsRanged": 2                                  added to its Armor Class against ranged attacks only
  "scoresMin": { "Strength": 25 }                  that score counts as this while the effect lasts, unless it is already higher (Potion of Giant Strength)
  "attackAdvantage": true                          Advantage on its attack rolls (or an ability name: only attacks using it)
  "attacksAgainstHaveDisadvantage": true           attack rolls against the creature have Disadvantage
  "spellSaveDC": 1                                 bonus to the save DC of its spells
  "spellAttackAdvantage": true                     Advantage on its spell attack rolls
  "inspirationDie": "d8"                           a die it can add to one failed roll (d4, d6, d8, d10 or d12)
  "sense": "Darkvision 60 ft."                     a sense it gains
  "movement": "Fly 60 ft. (hover)"                 a movement mode it gains
  "note": "Anything the app cannot apply by itself. It is shown to the table as a reminder."

uses: { "max": "PROF", "recharge": "short" }
  max is a formula for how many times it can be used. recharge is "short" (back on a Short or Long Rest) or "long" (back on a Long Rest). Leave uses out if it is unlimited or spends spell slots.
  To spend from a shared pool instead, write uses: { "pool": "Focus Points", "cost": 1 }. The pool itself is defined once with "resource" (see RESOURCES).
  If the use (or the spell slot) is only spent on one result, add "refundOn": "miss", "hit", "saveSuccess" or "saveFail". The app gives the use back when that result happens. For example, a feature that "isn't expended if the attack misses" has "refundOn": "miss".
again: when something keeps working on later turns while it lasts (a summoned weapon that attacks each turn, a beam you can fire again), add "again": "bonus", "action" or "free" for what it takes to use it again. The Combat Resolver lists it under Active with a "Use again" button, asks for a target each time, and spends no slot or use. A spell written in a pack can carry "again" in the same way.
targets not in the fight: nothing needs to be written for this. Anything that needs a target can also be used on "something else", which the player names.
targetLimit: when the feature only works on some creatures, add "targetLimit" with any of: "maxSize": "Large" (the largest size it works on), "largerBy": 1 (the target can be at most that many sizes larger than the user; 0 means the user's own size or smaller), "types": ["Humanoid"] (only these creature types), "notTypes": ["Undead", "Construct"] (no effect on these). The Combat Resolver refuses a target that does not fit and says why.
range and area: always record how far it reaches and the space it fills, even though the app does not measure distance yet: "range": { "kind": "self" | "touch" | "feet" | "sight" | "unlimited" | "special", "feet": 60 } and, when it fills a space, "area": { "shape": "sphere" | "cone" | "line" | "cube" | "cylinder" | "emanation" | "wall", "size": 20, "width": 0, "height": 0 } (size is the radius of a sphere, cylinder or emanation, the length of a cone, line or wall, the side of a cube). A map will use these later.
choices: when the user picks something each time the feature is used (a damage type, a skill, an ability), add "choices": [ { "label": "Damage type", "options": ["Fire", "Cold"] } ] (up to two). Write "$1" (first choice) or "$2" wherever the chosen word belongs: a damage "type", a condition "name", or the value of an effect key that takes a word (advantageOnSaves, checkDisadvantage, reduceDamageType, immuneTo, a checkBonus "skill", an entry of resistDamage). The Combat Resolver asks for the choice before the feature is used. This is different from "options" below, which is picked once when the feature is gained.
versions: when one feature can be used in several different ways and the user picks one each time (a maneuver list, a breath that is a cone or a line, a stance), add "versions": [ { "name": "Guard", ...the ability fields that differ for this version... }, { "name": "Strike", ... } ]. Each version may give its own roll, attack, save, damage, heal, onHit, onFail, onSuccess, onUse, target and targets. Everything not given is taken from the feature itself, and all versions share the feature's uses. The Combat Resolver asks which version before it is used.
hitPointBands: when what happens depends on the target's current Hit Points, add "hitPointBands": [ { "max": 100, ...fields for a target with that many Hit Points or fewer... }, { "max": 0, ...fields for any other target... } ]. An outcome may contain "dies": true.
attacks: when one use makes several separate attack rolls that can go at the same or different creatures, add "attacks": 3 (a number or formula). "damage" is then the damage of one attack.
removes: when the feature ends things on its target, add "removes": { "conditions": ["Poisoned", "Charmed"], "count": 1 or "all", "exhaustion": 1, "effects": "curse" | "spells" | "any", "hitPointMaximum": true }. Leave out what does not apply. The user is shown what the target really has and picks from that.
extraCost: a second pool it spends at the same time, or alone with no "uses": "extraCost": { "pool": "Wild Shape", "cost": 1 }.
spendSlot: when using it expends a spell slot, add "spendSlot": "any" (the user picks the level), "pact" (a Pact Magic slot) or a number (a slot of that level or higher). It is blocked when no slot is left.
sneakCost: a Cunning Strike effect: "sneakCost": 2 is the number of Sneak Attack dice given up for it. The attacker picks it when adding Sneak Attack, and it happens right after the damage.
regain: what using it gives back: "regain": { "pool": "Bardic Inspiration", "amount": 1 } (uses of a pool), { "slot": 2 } (a spell slot of that level), or { "pactSlots": "half" or "all" } (Pact Magic slots).
cost: when using it costs gold, add "cost": { "gp": 50, "consumed": true }. The gold must be on hand and is taken when it is used (once only if not consumed).
items: an activated ability granted by an item ("grantedBy": { "type": "item", "name": ... }) can also be used from the Inventory tab of the character sheet, next to that item.
creates: when using it makes things that stay around, add "creates": [ { "name": "Spirit Lantern", "duration": { "amount": 1, "unit": "hours" }, "note": "what it does" } ]. Leave "duration" out if it does not expire. A thing with a place but no weight (a light, a ward, an illusion, an eye) is listed as an active effect the user controls. A physical thing the character carries gets "item": true, and may add "count": 10 (how many), "spoilsInto": "Spoiled Food" (what it becomes when its duration ends, instead of vanishing), and "whenUsed": { "activation": "bonus" or "action", "heal": "1", "effect": { "name": "Nourished", "duration": { "amount": 1, "unit": "days" }, "note": "what it does" } } for something eaten, drunk or used up one at a time.
castOn: true when it is used on an object or a spot, not a creature. The user types what it is used on.
message: true when the user sends words to the target. The user types them.
escape: when an affected creature can take an action to make a check and free itself, add "escape": { "ability": "Strength", "skill": "Athletics", "dc": "8+PROF+WIS" }.
resources: every ability that spends a shared pool ("uses": { "pool": "the pool's exact name", "cost": 1 }) is shown under that pool on the sheet, with the pool's count large above them (tests T1 and T2 above decide this; never decide it from the feature's name).
askDM: when the result is information the DM gives, add "askDM": "what the DM must tell the user". The DM is asked and the answer goes in the log.
saveAdvantageIf: when the target has Advantage on the save in some circumstance, add "saveAdvantageIf": "the circumstance". The roller gets a Roll with Advantage button.
rollWhenUsed: when a die is rolled once on use and only needs showing, add "rollWhenUsed": { "dice": "1d4+1", "text": "what the number means" }.
More effect keys (inside an "effects" entry), each exactly as written here:
  "attackDisadvantage": true          Disadvantage on its attack rolls
  "advantageOnChecks": "Strength"     Advantage on checks with that ability
  "disadvantageOnSaves": "Dexterity"  Disadvantage on saves with that ability
  "sizeChange": 1 or -1               one size larger or smaller
  "speedZero": true                   Speed becomes 0
  "noReactions": true, "noHealing": true, "cannotCastSpells": true, "cannotTakeActions": true
  "acMinimum": 16, "acBase": 13       AC can't be lower than / base AC before Dexterity
  "immuneDamage": ["Fire"], "vulnerableTo": ["Cold"], "conditionImmunities": ["Charmed", "Frightened"]
  "weaponAttackBonus": 1              added to its weapon attack rolls
  "weaponDamage": { "dice": "1d4", "type": "Radiant" }   extra damage on its weapon hits
  "duplicates": 3                     illusory duplicates that can be hit in its place
  "cannotTakeBonusActions": true, "disadvantageAttackingUser": true (Disadvantage on attack rolls against whoever gave the effect), "maximumHealing": true (regains the most possible from any healing), "hitPointMaximumProtected": true, "breaksConcentration": true
  "endsOnDamageFromUserSide": true    ends only if the user or the user's allies damage it (also allowed on a condition)
  "penaltyShrinksEachLongRest": 1     with a negative "d20Tests", the penalty shrinks by that much each Long Rest
  "whenItEnds": { "condition": "Incapacitated", "duration": { "amount": 1, "unit": "rounds" }, "speedZero": true }   what the creature is left with when the effect ends
  "hitBack": { "dice": "2d8", "type": "Fire" } or { "save": "Constitution", "condition": "Blinded", "creatureTypes": ["Fiend", "Undead"] }   what happens to a creature that hits it with a melee attack
  "extraDamageOnAttacks": { "dice": "2d8", "type": "Fire" }   extra damage on every attack it makes
  "damageOnUsersTurn": true           with "damageEachTurn": the damage comes on the user's turn instead of the creature's
  "onlyAtZeroHitPoints": true         with "healEachTurn": only when it starts its turn at 0 Hit Points
  "dropTo1Instead": true              the first time it would drop to 0 Hit Points it drops to 1 and the effect ends
  "healEachTurn": "1"                 Hit Points regained at the start of each of its turns
  "damageEachTurn": { "dice": "2d4", "type": "Acid", "when": "start" or "end", "once": true if only on its next turn }
  "repeatSaveEachTurn": "end" or "start"   it saves again each turn and a success ends the effect
  "repeatSaveOnDamage": true          it saves again each time it takes damage
  "endsWhenItActs": true              ends when it attacks, deals damage or casts a spell
  "endsAfterAnyAction": true          ends right after it takes an action, a Bonus Action or a Reaction (Merge with Shadows)
  "endsOnDamage": true                ends when it takes damage
  "endsAfterNextAttack": true         ends after its next attack roll
  "endsWhenNextAttacked": true        ends after the next attack roll against it
  "outOfPlay": true                   it is elsewhere while this lasts: skipped in the turn order, cannot be targeted
  "stable": true, "dashAsBonusAction": true
  "sharedWard": true                  with "dropTo1Instead": the ward is shared by everyone the user gave it to; once it works for one, it stops for all until the user finishes a Long Rest (Gift of the Protectors)
  "halveNextDamage": true             the damage of the next hit it takes is halved, then the effect ends (Uncanny Dodge)
  "reduceNextDamage": { "dice": "1d10+DEX+LEVEL", "types": ["Bludgeoning", "Piercing", "Slashing"] }   the damage of the next hit (of those types; leave "types" out for any) is reduced by that roll, then the effect ends (Deflect Attacks)
  "nextSpellFree": { "maxLevel": 5 }  its next spell of that level or lower is cast without a slot (Divine Intervention)
In a condition's "repeatSave", "onDamage": true means the save is also made each time the creature takes damage. "onFailBecomes": "Unconscious" means a failed repeat save turns it into that condition. "countTo": 3 means the repeat saves are counted: that many successes end it, that many failures give "onFailBecomes". "damageOnFail": { "dice": "4d10", "type": "Psychic" } is dealt on each failed repeat save.
trigger: for a feature used as a Reaction ("activation": "reaction"), add "trigger" so the Combat Resolver offers it at the right moment. Use one or more of these words, separated by commas: "targeted" (a creature targets you with an attack, before the roll), "hit" (an attack roll hits you), "miss" (an attack roll misses you), "damage" (you take damage), "cast" (a creature you can see casts a spell). Example: "trigger": "hit". If none of these fits, write the trigger in the source's own words, for example "trigger": "when a creature you can see within 30 feet fails a saving throw". The player can still use the Reaction from the sheet at any time.
statBlock: when using the feature turns the character into a creature or brings one out (a beast form, a summoned spirit, a companion called for a time), add "statBlock": "form" (the character becomes it) or "statBlock": "summon" (it appears beside the character). Using the feature then asks which creature, and its stat block sits on the sheet's Stat Blocks tab until it is dismissed or its time runs out. Give the effect its duration so the app knows when that is. If the creature is new, describe its stat block in the feature's "text".

feature: when one feature gives several things to use (Channel Divinity gives Divine Spark and Turn Undead), make one ability for each and set "feature" to the parent feature's name.

atLevel: changes at higher character levels. The key is the level, the value holds the fields to replace from that level on. The highest level reached wins.
  A value that changes at many levels can instead be written as a list of exactly 20 values, one for each level 1 to 20: "dice": ["1d6","1d6","1d6","1d6","1d8", ...].

---------------------------------------------------------------------
PASSIVE FEATURES: statics
---------------------------------------------------------------------

"statics" holds what a feature changes on the sheet all the time. An ability can have only statics (no activation at all):
{ "name": "Stone Skin", "grantedBy": { "type": "class", "name": "Warden" }, "statics": { "acBase": { "formula": "10+CON+WIS", "shield": true } } }
