<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D Combat Resolver</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IM+Fell+English&family=MedievalSharp&family=Kalam:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1B2430;
      --parchment: #EDE4D3;
      --parchment-dark: #D5C9B4;
      --brass: #B8860B;
      --brass-light: #D4A017;
      --blood: #7A2E2E;
      --blood-light: #9B3D3D;
      --gold: #C9A84C;
      --panel: #22303F;
      --panel-light: #2C3E50;
      --text-light: #EDE4D3;
      --text-muted: #9BAAB8;
      --success: #4CAF50;
      --danger: #E53935;
      --warning: #FF9800;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ink); font-family: 'Crimson Text', serif; color: var(--text-light); min-height: 100vh; }

    h1, h2, h3, .label { font-family: 'Cinzel', serif; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #0F1923 0%, #1B2430 100%);
      border-bottom: 2px solid var(--brass);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .header h1 { font-size: 1.4rem; color: var(--gold); letter-spacing: 2px; }
    .header .round-badge {
      margin-left: auto; background: var(--blood); border: 1px solid var(--blood-light);
      padding: 4px 14px; border-radius: 20px; font-family: 'Cinzel', serif;
      font-size: 0.85rem; color: var(--parchment);
    }

    /* ── LAYOUT ── */
    .app { display: grid; grid-template-columns: 320px 1fr 300px; gap: 0; height: calc(100vh - 56px); }

    /* ── PANELS ── */
    .panel { background: var(--panel); border-right: 1px solid #2C3E50; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header {
      background: linear-gradient(135deg, #1a2535 0%, #243040 100%);
      border-bottom: 1px solid var(--brass);
      padding: 10px 14px;
      font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold);
      letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 12px; }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-track { background: var(--panel); }
    .panel-body::-webkit-scrollbar-thumb { background: var(--brass); border-radius: 2px; }

    /* ── COMBATANT CARDS ── */
    .combatant-card {
      background: #1a2535; border: 1px solid #2C3E50; border-radius: 6px;
      padding: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
      position: relative;
    }
    .combatant-card:hover { border-color: var(--brass); }
    .combatant-card.active { border-color: var(--gold); background: #1f2f42; box-shadow: 0 0 8px rgba(201,168,76,0.3); }
    .combatant-card.targeted { border-color: var(--blood-light); background: #2a1f1f; box-shadow: 0 0 8px rgba(122,46,46,0.4); }
    .combatant-card.dead { opacity: 0.4; }

    .combatant-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .init-badge {
      background: var(--brass); color: var(--ink); font-family: 'Cinzel', serif;
      font-weight: 700; font-size: 0.9rem; width: 30px; height: 30px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .combatant-card.active .init-badge { background: var(--gold); }
    .combatant-card.targeted .init-badge { background: var(--blood-light); color: white; }

    .board-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .mon-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; align-items: start; }
    .mon-card { border: 1px solid var(--brass); border-radius: 8px; background: #1a2535; padding: 8px 10px; font-size: 14px; }
    .mon-card.active { border-color: var(--gold); box-shadow: 0 0 8px rgba(201,168,76,0.35); }
    .mon-card.down { opacity: .55; }
    .mon-head { display: flex; gap: 8px; align-items: center; cursor: grab; font-family: 'Cinzel', serif; }
    .mon-head .pp-muted { font-size: 12px; font-family: 'Crimson Text', serif; }
    .mon-stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0; color: var(--parchment); }
    .mon-abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; margin: 6px 0; }
    .mon-abil em { display: block; font-style: normal; font-size: 11px; color: var(--text-muted); }
    .mon-sec { margin: 6px 0; } .mon-sec > div { margin: 2px 0; line-height: 1.35; }
    .mon-h { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1px; color: var(--gold); border-bottom: 1px solid #2c3e50; margin-bottom: 3px; }
    .roll-dock { position: fixed; z-index: 57; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: #1a2633; border: 2px solid var(--gold); border-radius: 10px; padding: 8px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.6); max-width: 94vw; }
    .roll-dock-what { font-size: 14px; color: var(--parchment); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .roll-dock .btn { min-width: 110px; font-size: 1rem; }
    .dmg-roll .log-detail { display: none; }
    .funds { display: block; width: 100%; }
    .fund-tabs { display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--pp-border, var(--brass)); flex-wrap: wrap; }
    .fund-tab { background: transparent; border: 1px solid var(--pp-line, #3d5166); border-bottom: none; border-radius: 8px 8px 0 0; color: var(--pp-text, var(--parchment)); padding: 4px 12px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 13px; }
    .fund-tab.on { background: var(--pp-border, var(--brass)); color: var(--pp-main, #1a2535); font-weight: 700; }
    .money-fold { min-width: 34px; font-size: 15px; padding: 2px 8px; border: 1px solid var(--pp-line, #3d5166); border-radius: 6px; margin-right: 4px; }
    .fund-sum { font-family: 'Crimson Text', serif; font-weight: 400; font-size: 12px; opacity: .85; }
    .fund-x { background: none; border: none; color: inherit; cursor: pointer; font-size: 11px; padding: 0 0 0 4px; opacity: .7; }
    .fund-plus { font-weight: 700; padding: 4px 10px; }
    .fund-new { display: inline-flex; gap: 4px; align-items: center; margin-left: 4px; }
    .money-grid { display: flex; flex-direction: column; gap: 3px; padding: 6px 2px; }
    .fund-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .fund-name { min-width: 150px; } .fund-name em { font-size: 12px; opacity: .75; }
    .log-short .log-detail, .log-short .log-dice { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .log-entry { position: relative; overflow: hidden; }
    .log-flagdot { float: left; width: 18px; height: 18px; border-radius: 50%; background: #c62828; color: #fff; border: none; font-weight: 800; font-size: 12px; line-height: 18px; padding: 0; margin: 2px 6px 0 0; cursor: pointer; }
    .log-flag-why { color: #ff8a80; font-size: 0.8rem; margin-top: 2px; }
    .tool-chip { white-space: nowrap; opacity: 1; margin: 2px; }
    .pal-group { padding: 8px 12px; margin: 8px 0; }
    .pal-block { font-size: 13.5px; margin: 2px 0 6px; }
    .pal-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .pal-table td { padding: 3px 6px; border-bottom: 1px solid var(--pp-line); white-space: nowrap; }
    .pal-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
    .pal-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; cursor: pointer; }
    .pal-arrow { display: inline-block; min-width: 26px; text-align: center; border: 1px solid var(--pp-line); border-radius: 6px; font-size: 14px; }
    .pal-group .pal-block { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .pal-group .pal-block b { font-family: 'Cinzel', serif; font-size: 11.5px; opacity: .8; margin-right: 3px; }
    .pal-sheet { border-top: 1px solid var(--pp-line); margin-top: 6px; padding-top: 6px; }
    .pal-abils { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 8px 0; }
    .pal-abil { border: 1px solid var(--pp-border); border-radius: 8px; text-align: center; padding: 4px 2px; }
    .pal-abil .lbl { font-family: 'Cinzel', serif; font-size: 11px; } .pal-abil .val { font-size: 18px; font-weight: 700; } .pal-abil .sub { font-size: 11px; opacity: .8; }
    .pal-abil .abil-btns { display: flex; gap: 2px; justify-content: center; margin-top: 2px; } .pal-abil .abil-btns button { font-size: 10.5px; padding: 1px 4px; }
    .pal-sec { margin-top: 8px; font-size: 13.5px; } .pal-sec > div { margin: 3px 0; }
    .pal-h { font-family: 'Cinzel', serif; font-weight: 700; border-bottom: 1px solid var(--pp-border); margin-bottom: 4px; text-transform: uppercase; font-size: 12.5px; }
    .pal-act-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--pp-line); }
    .pal-act-row button { flex: none; }
    .pal-acted { font-size: 11px; border: 1px solid var(--pp-line); border-radius: 8px; padding: 0 6px; margin-left: 6px; opacity: .75; }
    .pal-table tr.acted td { opacity: .6; }
    .pal-mass-atk { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 4px 0 6px; }
    .sheet-only { position: fixed; inset: 0; overflow: auto; background: var(--ink); padding: 12px; z-index: 100; }
    .pp-quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0 10px; font-size: 13.5px; } .pp-quick input { flex: 1; min-width: 180px; }
    .pp-spsum { font-size: 12.5px; color: var(--pp-muted); padding: 0 0 4px 34px; line-height: 1.3; }
    .tracker-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 6px; font-size: 13px; }
    .card-more { position: absolute; right: 52px; top: 6px; background: transparent; border: 1px solid var(--panel-light); color: var(--text-muted); border-radius: 6px; padding: 0 6px; cursor: pointer; font-size: 13px; line-height: 18px; }
    .turn-pop { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 90; background: var(--gold); color: #1a2535; border-radius: 12px; padding: 10px 14px 10px 18px; font-size: 18px; font-family: 'Cinzel', serif; box-shadow: 0 6px 22px rgba(0,0,0,.5); display: flex; gap: 12px; align-items: center; animation: turnpop .35s ease-out; pointer-events: none; }
    .dm-pops { position: fixed; top: 64px; right: 14px; z-index: 91; display: flex; flex-direction: column; gap: 6px; max-width: 320px; } .dm-pop { background: var(--panel-light); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; box-shadow: 0 4px 14px rgba(0,0,0,.45); font-size: 14px; } .dm-pop button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
    .turn-pop.time-up { top: 120px; background: #c92a2a; color: #fff; } .turn-pop.time-up button { color: #fff; border-color: #fff; }
    .turn-pop button { pointer-events: auto; background: transparent; border: 1px solid #1a2535; border-radius: 6px; color: #1a2535; cursor: pointer; font-size: 16px; padding: 0 8px; }
    @keyframes turnpop { from { transform: translate(-50%, -16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .pal-group.acting { border-color: #c9a84c !important; box-shadow: 0 0 0 2px #c9a84c, 0 0 18px rgba(212,160,23,.6) !important; }
    .pal-group.mass-cur { opacity: 1; box-shadow: 0 0 0 3px var(--gold), 0 0 20px rgba(212,160,23,.6); }
    .pal-now { background: var(--gold); color: #1a2535; border-radius: 10px; padding: 0 8px; font-size: 12px; font-weight: 700; }
    .pal-mass-who .now { font-weight: 700; }
    .pal-mode { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 8px; font-size: 13.5px; }
    .inbox-group { border: 1px solid var(--panel-light); border-radius: 8px; margin: 6px 0; }
    .inbox-head { display: flex; gap: 8px; align-items: center; width: 100%; background: transparent; border: none; color: var(--text-light); padding: 8px 10px; cursor: pointer; font-family: inherit; font-size: 15px; }
    .inbox-new { background: var(--gold); color: #1a2535; border-radius: 10px; padding: 0 8px; font-size: 12px; font-weight: 700; }
    .inbox-items { padding: 0 10px 8px 30px; font-size: 13.5px; } .inbox-item { padding: 3px 0; border-top: 1px dashed var(--panel-light); }
    .mass-float { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(640px, 94vw); max-height: 46vh; overflow: auto; z-index: 70; margin: 0 !important; }
    .pal-group.mass-dim { opacity: .4; }
    .mass-run { position: sticky; top: 0; z-index: 6; background: var(--panel); border: 2px solid var(--gold); border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; font-size: 13.5px; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
    .mass-adv, .mass-atks { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .mass-run .do-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .combatant-card.mass-now { outline: 3px solid var(--gold); outline-offset: 2px; box-shadow: 0 0 14px rgba(212,160,23,.6); }
    .combatant-card.mass-pickable { cursor: crosshair; }
    .pal-back { background: rgba(92,124,250,.14); border: 1px solid #5c7cfa; border-radius: 8px; padding: 6px 10px; margin: 0 0 8px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pal-mass-who { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 6px; }
    .pal-mass-who .acted { opacity: .6; }
    @media (max-width: 700px) { .pal-abils { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .group-run { position: fixed; z-index: 62; left: 50%; transform: translateX(-50%); bottom: 150px; max-width: min(720px, 94vw); box-shadow: 0 6px 24px rgba(0,0,0,.6); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #2a2210; border: 1px solid var(--gold); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
    .group-run span { padding: 1px 8px; border-radius: 10px; border: 1px solid #3d5166; } .group-run span.on { border-color: var(--gold); color: var(--gold); } .group-run span.done { opacity: .6; }
    .app-ver { font-size: 0.55em; opacity: .6; letter-spacing: 1px; vertical-align: middle; }
    .card-pic.hidden-pic { opacity: .45; outline: 1px dashed var(--brass); }
    .banner-pic { float: right; width: 72px; height: 72px; border-radius: 8px; object-fit: cover; border: 2px solid var(--brass); cursor: zoom-in; margin-left: 10px; }
    .pic-tools { clear: right; float: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; margin-left: 10px; }
    .pic-full { max-width: 92vw; max-height: 88vh; border-radius: 10px; border: 2px solid var(--brass); box-shadow: 0 8px 40px rgba(0,0,0,.7); }
    .card-pic { cursor: zoom-in; width: 34px; height: 34px; border-radius: 6px; object-fit: cover; border: 1px solid var(--brass); flex-shrink: 0; }
    .combatant-name { font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--parchment); font-weight: 600; }
    .combatant-type { font-size: 0.75rem; color: var(--text-muted); }

    .hp-bar-wrap { position: relative; height: 8px; background: #0F1923; border-radius: 4px; overflow: hidden; }
    .hp-bar { height: 100%; border-radius: 4px; transition: width 0.4s; }
    .hp-text { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; display: flex; justify-content: space-between; }
    .hp-text span { color: var(--parchment); font-weight: 600; }

    .conditions { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
    .condition-tag {
      background: #2C3E50; border: 1px solid #3d5166; border-radius: 3px;
      padding: 1px 5px; font-size: 0.65rem; color: var(--text-muted);
    }
    .condition-tag.bad { background: #3d1f1f; border-color: var(--blood); color: #ff8a80; }

    .turn-marker {
      position: absolute; top: 6px; right: 6px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
    }

    /* ── ADD COMBATANT ── */
    .add-form { background: #1a2535; border: 1px dashed #3d5166; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .add-form .label { font-size: 0.72rem; color: var(--brass); margin-bottom: 4px; display: block; }
    .add-form input, .add-form select {
      width: 100%; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment);
      padding: 5px 8px; border-radius: 4px; font-family: 'Crimson Text', serif; font-size: 0.9rem;
      margin-bottom: 5px;
    }
    .add-form input:focus, .add-form select:focus { outline: none; border-color: var(--brass); }
    .inline-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

    /* ── BUTTONS ── */
    .btn {
      font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.5px;
      border: none; border-radius: 4px; cursor: pointer; padding: 6px 12px;
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-primary { background: var(--brass); color: var(--ink); }
    .btn-primary:hover { background: var(--brass-light); }
    .btn-danger { background: var(--blood); color: white; }
    .btn-danger:hover { background: var(--blood-light); }
    .btn-ghost { background: transparent; border: 1px solid #3d5166; color: var(--text-muted); }
    .btn-ghost:hover { border-color: var(--brass); color: var(--parchment); }
    .btn-success { background: #2e7d32; color: white; }
    .btn-success:hover { background: #388e3c; }
    .btn-full { width: 100%; justify-content: center; }
    .btn-sm { padding: 4px 8px; font-size: 0.7rem; }

    /* ── CENTER — ACTION PANEL ── */
    .center-panel { background: #161f2b; border-right: 1px solid #2C3E50; display: flex; flex-direction: column; overflow: hidden; }
    .action-area { flex: 1; overflow-y: auto; padding: 16px; }
    .action-area::-webkit-scrollbar { width: 4px; }
    .action-area::-webkit-scrollbar-thumb { background: var(--brass); border-radius: 2px; }

    .turn-banner {
      background: linear-gradient(135deg, #1f2f42 0%, #243040 100%);
      border: 1px solid var(--gold); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px;
    }
    .turn-banner .who { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold); }
    .turn-banner .stats-row { display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
    .stat-chip { text-align: center; }
    .stat-chip .val { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--parchment); font-weight: 700; }
    .stat-chip .lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .section-title { font-family: 'Cinzel', serif; font-size: 0.78rem; color: var(--brass); letter-spacing: 1px; text-transform: uppercase; margin: 12px 0 6px; border-bottom: 1px solid #2C3E50; padding-bottom: 4px; }

    /* ── TARGET SELECTOR ── */
    .target-row { display: flex; align-items: center; gap: 8px; background: #1a2535; border: 1px solid #2C3E50; border-radius: 5px; padding: 7px 10px; margin-bottom: 5px; cursor: pointer; transition: all 0.15s; }
    .target-row:hover { border-color: var(--blood-light); }
    .target-row.selected { border-color: var(--blood-light); background: #2a1f1f; }
    .target-row .t-name { font-family: 'Cinzel', serif; font-size: 0.82rem; color: var(--parchment); flex: 1; }
    .target-row .t-ac { background: #0F1923; border: 1px solid #3d5166; border-radius: 3px; padding: 2px 7px; font-size: 0.78rem; color: var(--text-muted); }
    .target-row .t-hp { font-size: 0.75rem; color: var(--text-muted); }

    /* ── ACTION BUTTONS ── */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .action-btn {
      background: #1a2535; border: 1px solid #2C3E50; border-radius: 5px; padding: 8px;
      cursor: pointer; transition: all 0.15s; text-align: left;
    }
    .action-btn:hover { border-color: var(--brass); background: #1f2f42; }
    .action-btn.selected { border-color: var(--gold); background: #1f2f42; }
    .action-btn .a-name { font-family: 'Cinzel', serif; font-size: 0.78rem; color: var(--parchment); }
    .action-btn .a-detail { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .action-btn .a-tag { display: inline-block; font-size: 0.6rem; padding: 1px 5px; border-radius: 3px; margin-top: 3px; }
    .tag-attack { background: #3d1f1f; color: #ff8a80; border: 1px solid var(--blood); }
    .tag-save { background: #1f3a1f; color: #a5d6a7; border: 1px solid #2e7d32; }
    .tag-heal { background: #1a2f3a; color: #80d8ff; border: 1px solid #0288d1; }

    .note textarea { width: 100%; box-sizing: border-box; background: var(--ink); color: var(--text-light); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 4px 6px; margin-top: 4px; font: inherit; font-size: 14px; }
    .world-badge { font-size: 13px; color: var(--parchment); border: 1px solid var(--brass); border-radius: 12px; padding: 2px 10px; margin-left: 8px; }
    .world-panel input, .world-panel select { min-width: 0; }
    .world-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13px; }
    .world-row.done { opacity: 0.55; }
    .item-ch-btn.dark { background: rgba(255,255,255,0.12); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      background: var(--panel); border: 1px solid var(--brass); border-radius: 8px;

    }
    .modal-header {
      background: linear-gradient(135deg, #1a2535 0%, #243040 100%);

    }
    .modal-body { padding: 16px; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid #2C3E50; display: flex; gap: 8px; justify-content: flex-end; }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.72rem; color: var(--brass); font-family: 'Cinzel', serif; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group select {
      width: 100%; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment);

    }

    .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* ── DICE ROLL ANIMATION ── */
    @keyframes rollIn { from { transform: scale(0.5) rotate(-15deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
    .dice-result { animation: rollIn 0.25s ease-out; }

    .empty-state { text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.85rem; }

    /* ── NEXT TURN BTN ── */

      font-family: 'Cinzel', serif; font-size: 0.8rem; color: #a5d6a7; cursor: pointer; transition: all 0.15s;
    }
    .next-turn-btn:hover { background: linear-gradient(135deg, #244d38 0%, #2e7d32 100%); }

    .initiative-controls { display: flex; gap: 6px; margin-bottom: 10px; }

    /* ── MANUAL ROLL ── */
    .manual-roll { background: #1a2535; border: 1px solid #2C3E50; border-radius: 6px; padding: 10px; margin-top: 10px; }
    .manual-roll .label { font-size: 0.72rem; color: var(--brass); font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
    .advantage-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .adv-btn { flex: 1; background: #0F1923; border: 1px solid #3d5166; border-radius: 4px; padding: 5px; font-size: 0.7rem; color: var(--text-muted); cursor: pointer; text-align: center; transition: all 0.15s; }
    .adv-btn.active-adv { background: #1f3a1f; border-color: #2e7d32; color: #a5d6a7; }
    .adv-btn.active-dis { background: #3d1f1f; border-color: var(--blood); color: #ff8a80; }

    /* ── SESSION / LIVE SYNC ── */
    .room-bar { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; }
    .round-badge + .room-bar { margin-left: 0; }
    .room-bar input { width: 120px; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment); padding: 5px 8px; border-radius: 4px; font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }
    .room-bar input:focus { outline: none; border-color: var(--brass); }
    .room-code { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; font-weight: 700; }
    .room-dot { width: 9px; height: 9px; border-radius: 50%; background: #546e7a; display: inline-block; }
    .room-dot.live { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .room-dot.connecting { background: var(--warning); }
    .room-dot.error { background: var(--danger); }
    .drop-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(15,25,35,0.85); border: 3px dashed var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 1.3rem; color: var(--gold); pointer-events: none; }
    .hp-edit { flex-wrap: wrap; }
    body { display: flex; flex-direction: column; height: 100vh; }
    #root { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .app { flex: 1; min-height: 0; height: auto; }

    /* ── SESSION BAR ── */
    .header { flex-wrap: wrap; row-gap: 8px; }
    .role-badge { font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 1px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--brass); color: var(--gold); text-transform: uppercase; }
    .room-bar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .link-btn { background: none; border: none; color: var(--brass-light); cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
    .btn:disabled { opacity: 0.45; cursor: default; }

    /* ── CARDS: effects, pending, remove ── */
    .condition-tag.good { background: #1f3a1f; border-color: #2e7d32; color: #a5d6a7; cursor: default; }
    .condition-tag.act { background: #1f2a44; border-color: #5c7cfa; color: #bac8ff; cursor: default; } /* Dash, Disengage, Dodge: for this turn only */
    .condition-tag.act.removable { cursor: pointer; }
    .condition-tag.good.removable, .condition-tag.bad.removable { cursor: pointer; }
    .combatant-card.pending { border-style: dashed; border-color: var(--warning); }
    .combatant-card.mine { border-left: 3px solid var(--brass-light); }
    .combatant-card.rel-own { border: 2px solid #4da3ff; }
    .combatant-card.rel-ally { border: 2px solid #4caf50; }
    .combatant-card.rel-hostile { border: 2px solid #e05252; }
    .combatant-card.rel-neutral { border: 2px solid #e6c84a; }
    .combatant-card.rel-dead { border: 2px solid #000; }
    .combatant-card.active { box-shadow: 0 0 10px rgba(201,168,76,0.75); }
    .combatant-card.targeted { box-shadow: 0 0 10px rgba(224,82,82,0.8); }
    .combatant-card.folded { padding-top: 6px; padding-bottom: 6px; }
    .combatant-card.folded > *:not(.combatant-header):not(.turn-marker) { display: none; }
    .combatant-card.folded .combatant-type { display: none; }
    .rel-key { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.72rem; color: var(--text-muted); margin: 2px 0 6px; }
    .rel-key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; vertical-align: middle; }
    .who-am-i { font-size: 0.82rem; margin: 2px 0 4px; color: var(--parchment); }
    .rel-select { background: #0F1923; border: 1px solid #3d5166; color: var(--parchment); border-radius: 4px; font-size: 0.72rem; padding: 1px 3px; margin-top: 3px; }
    .app.targeting > .center-panel, .app.targeting > .log-panel { opacity: 0.18; pointer-events: none; }
    .app.targeting .combatant-card { cursor: crosshair; }
    .target-banner { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 60; background: #1a2633; border: 2px solid var(--gold); border-radius: 8px; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 4px 18px rgba(0,0,0,0.6); max-width: 92vw; }
    .card-menu { position: fixed; z-index: 70; background: #1a2633; border: 1px solid var(--brass); border-radius: 6px; padding: 4px; min-width: 170px; box-shadow: 0 4px 14px rgba(0,0,0,0.6); }
    .card-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--parchment); padding: 6px 10px; cursor: pointer; font-family: 'Crimson Text', serif; font-size: 0.95rem; border-radius: 4px; }
    .card-menu button:hover { background: #2C3E50; }
    .card-view { background: none; border: 1px solid #3d5166; color: var(--text-muted); border-radius: 4px; font-size: 0.7rem; padding: 1px 6px; margin-left: 6px; cursor: pointer; }
    .card-view.on { border-color: var(--gold); color: var(--gold); cursor: default; }
    .conc-badge { background: #33264d !important; color: #d9c8ff !important; border: 1px solid #9b7fd1; }
    .pp-arow.hot { border: 1px solid var(--pp-border); border-radius: 8px; padding: 6px 8px; margin: 4px 0; background: color-mix(in srgb, var(--pp-border) 12%, transparent); }
    .pp-arow.hot .pp-chip { font-size: 14px; padding: 3px 12px; }
    .turn-bar { background: #1a2633; border-bottom: 2px solid #9b7fd1; padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    /* the sheet's text sizes: skills are the smallest reading text; everything else steps up from there */
    .paper { font-size: 17px; }
    .pp-skill { font-size: 13.5px; }
    .pp-carry, .pp-center, .pp-cond, .pp-line, .pp-sum, .pp-note, .pp-hit { font-size: 16.5px; }
    .pp-etext { font-size: 17px; }
    .paper .action-btn .a-name, .pp-spell.pp-text .a-name { font-size: 18.5px; }
    .paper .action-btn .a-detail { font-size: 15.5px; }
    .pp-attack span:not(:first-child), .pp-spellrow span:not(:first-child) { font-size: 16.5px; }
    .pp-ename { font-size: 18.5px; }
    .pp-spellhead { font-size: 18px; }
    .pp-lvl { font-size: 19px; }
    .pp-lvl .pp-muted { font-size: 15.5px; }
    .pp-h2 { font-size: 20px; }
    .pp-h3 { font-size: 16px; }
    .pp-head, .pp-type { font-size: 13.5px; }
    .pp-chip { font-size: 14.5px; }
    .pp-arow { font-size: 16.5px; }
    .pp-arow .pp-chip, .pp-use .pp-chip { font-size: 13.5px; }
    .pp-filter, .pp-tag, .pp-key { font-size: 14.5px; }
    .pp-save { font-size: 13.5px; }
    .pp-mod { font-size: 17px; }
    .pp-abname { font-size: 14.5px; }
    .pp-passive span, .pp-hprow span, .pp-stat span, .pp-shape span, .pp-heartval span { font-size: 12.5px; }
    .pp-mast { font-size: 13px; }
    .hand-box { font-size: 16.5px; }
    .prompt-bar.pop, .init-bar.pop { position: fixed; z-index: 55; top: 22%; left: 50%; transform: translateX(-50%); width: min(620px, 94vw); max-height: 60vh; overflow: auto; background: #1a2633; border: 2px solid var(--gold); border-radius: 10px; padding: 14px 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.75), 0 0 0 100vmax rgba(0,0,0,0.28); display: block; }
    .prompt-bar.pop .prompt-item, .init-bar.pop > * { margin: 6px 0; }
    .prompt-bar.pop .prompt-item { display: block; }
    .prompt-bar.pop .p-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .pop-title { font-family: 'Cinzel', serif; font-size: 1.05rem; color: var(--gold); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .turn-timer { display: inline-flex; align-items: center; gap: 6px; font-family: 'Cinzel', serif; font-size: 0.95rem; padding: 4px 10px; border: 1px solid var(--brass); border-radius: 6px; color: var(--parchment); }
    .turn-timer.out { border-color: var(--danger); color: #ff8a80; }
    .init-bar { background: #1a2633; border-bottom: 2px solid var(--gold); padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pending-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 0.78rem; color: var(--warning); }
    .card-remove { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px; }
    .card-remove:hover { color: #ff8a80; }
    .owner-tag { font-size: 0.68rem; color: var(--brass-light); }

    /* ── CENTER: tabs, stat block ── */
    .view-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .view-tab { font-family: 'Cinzel', serif; font-size: 0.75rem; background: #1a2535; border: 1px solid #2C3E50; color: var(--text-muted); border-radius: 5px 5px 0 0; padding: 6px 12px; cursor: pointer; }
    .view-tab.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }
    .turn-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .turn-note.yours { color: #a5d6a7; }
    details.block { background: #1a2535; border: 1px solid #2C3E50; border-radius: 5px; padding: 8px 10px; margin-top: 8px; font-size: 0.85rem; line-height: 1.45; }
    details.block summary { font-family: 'Cinzel', serif; font-size: 0.75rem; color: var(--brass); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    details.block p { margin-top: 6px; color: var(--parchment); }
    details.block p strong { color: var(--gold); }
    .buff-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    .buff-row select, .buff-row input, .dice-box input, .roster input.search {
      width: 100%; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment);
      padding: 6px 8px; border-radius: 4px; font-family: 'Crimson Text', serif; font-size: 0.9rem; }
    .slot-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 2px; }
    .slot-chip { border: 1px solid var(--brass); border-radius: 10px; padding: 1px 8px; font-size: 0.75rem; color: var(--parchment); }
    .slot-chip.spent { opacity: 0.55; }
    .chip-btn { background: transparent; border: none; color: var(--brass-light); cursor: pointer; font-size: 0.85rem; padding: 0 3px; }
    .prompt-bar { background: #2a2210; border-bottom: 2px solid var(--gold); padding: 8px 14px; display: grid; gap: 6px; }
    .prompt-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.95rem; color: var(--parchment); }
    .prompt-item.yours strong { color: var(--gold); }
    .prompt-wait { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }
    .cond-box { padding: 8px 10px; border-bottom: 1px solid var(--brass); flex-shrink: 0; max-height: 30vh; overflow-y: auto; }
    .cond-empty { color: var(--text-muted); font-size: 0.82rem; font-style: italic; text-align: center; }
    .cond-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #2C3E50; font-size: 0.85rem; }
    .cond-item:last-child { border-bottom: none; }
    .cond-icon { font-size: 1.3rem; width: 26px; text-align: center; flex-shrink: 0; }
    .cond-main { flex: 1; min-width: 0; color: var(--parchment); }
    .cond-main strong { color: #ff8a80; font-family: 'Cinzel', serif; font-size: 0.78rem; }
    .cond-sub { color: var(--text-muted); font-size: 0.74rem; }
    .cond-time { color: var(--gold); font-size: 0.78rem; white-space: nowrap; }
    .time-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .time-row input[type=number], .time-row select { flex: 1 1 70px; min-width: 0; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment); padding: 5px 8px; border-radius: 4px; font-family: 'Crimson Text', serif; font-size: 0.9rem; }
    .conc-label { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }
    .conc-label input { width: auto; }
    .buff-note { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; font-style: italic; }

    /* ── DICE ROLLER ── */
    .dice-box { padding: 10px; border-bottom: 1px solid var(--brass); flex-shrink: 0; }
    .dice-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
    .die-btn { background: #1a2535; border: 1px solid #3d5166; color: var(--parchment); border-radius: 4px; padding: 6px 0; font-family: 'Cinzel', serif; font-size: 0.7rem; cursor: pointer; }
    .die-btn:hover { border-color: var(--brass); }
    .die-btn.has { background: var(--brass); color: #10161f; border-color: var(--brass); font-weight: 700; }
    .rule-label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; cursor: pointer; }
    .rule-label input { width: auto; }
    .dice-opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 0.78rem; }
    .dice-opts label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .dice-opts input { width: auto; }
    .dice-opts select { flex: 1; min-width: 120px; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment); padding: 4px 6px; border-radius: 4px; font-size: 0.78rem; }
    .dice-expr { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .log-entry.roll { border-left-color: var(--brass); }

    /* ── MONSTER ROSTER ── */
    .modal.roster { max-width: 720px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
    .roster-list { overflow-y: auto; padding: 0 16px 12px; flex: 1; }

    .roster-row .r-name { font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--parchment); flex: 1; cursor: pointer; }
    .roster-row .r-name:hover { color: var(--gold); }
    .roster-row .r-meta { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
    .roster-detail { background: #161f2b; border: 1px solid #2C3E50; border-radius: 5px; padding: 8px 10px; margin: 4px 0 8px; font-size: 0.85rem; line-height: 1.45; }
    .roster-detail p { margin-top: 5px; }
    .roster-detail strong { color: var(--gold); }
    .srd-note { font-size: 0.7rem; color: var(--text-muted); padding: 8px 16px; border-top: 1px solid #2C3E50; }
    .srd-note a { color: var(--brass-light); }

    /* ── SHEET VIEW ── */
    .stat-chip.changed .val { color: #a5d6a7; }
    .stat-chip.changed .lbl { color: #a5d6a7; }
    .stats-row { row-gap: 8px; }
    .abil-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
    .abil { background: #161f2b; border: 1px solid #2C3E50; border-radius: 5px; padding: 5px 4px; text-align: center; }
    .abil .lbl { font-size: 0.62rem; color: var(--brass); letter-spacing: 1px; font-family: 'Cinzel', serif; }
    .abil .val { font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700; color: var(--parchment); }
    .abil .sub { font-size: 0.68rem; color: var(--text-muted); }
    .senses-line { font-size: 0.82rem; color: var(--parchment); margin-top: 8px; }
    .senses-line strong { font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--brass); letter-spacing: 1px; text-transform: uppercase; margin-right: 6px; }
    .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 3px 14px; margin-top: 6px; color: var(--text-muted); }
    .skill-grid .prof { color: var(--parchment); }
    .sheet-card { background: #1a2535; border: 1px solid var(--gold); border-radius: 8px; padding: 12px 14px; }
    .sheet-card .who { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold); }
    .sheet-card .stats-row { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
    .custom-effect { display: grid; gap: 6px; margin-bottom: 6px; }
    .custom-effect input { width: 100%; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment); padding: 6px 8px; border-radius: 4px; font-family: 'Crimson Text', serif; font-size: 0.9rem; }
    .custom-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .custom-grid label { font-size: 0.65rem; color: var(--brass); font-family: 'Cinzel', serif; letter-spacing: 0.5px; text-transform: uppercase; display: grid; gap: 2px; }

    /* ── ROLLS FROM THE SHEET ── */
    .abil-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 4px; }
    .abil-btns button, .skill-roll { background: #0F1923; border: 1px solid #3d5166; color: var(--text-muted); border-radius: 3px; font-family: 'Cinzel', serif; font-size: 0.58rem; padding: 2px 0; cursor: pointer; }
    .abil-btns button:hover, .skill-roll:hover { border-color: var(--brass); color: var(--parchment); }

// Notes for everyone: categories of notes, each collapsible and renamable, kept on this computer. Combat Log entries can be saved into them.
const notesKey = who => 'hba-notes-' + (who || 'me');
function loadNotes(who) { try { const v = JSON.parse(window.localStorage.getItem(notesKey(who)) || 'null'); if (v && Array.isArray(v.cats)) return v; } catch (e) {} return {cats: [{id: 'general', name: 'General', open: true, notes: []}]}; }
function saveNotes(who, v) { try { window.localStorage.setItem(notesKey(who), JSON.stringify(v)); } catch (e) {} }
function addNoteTo(who, catName, title, text) { // used by the Combat Log: the category is made if it does not exist yet
  const v = loadNotes(who); let cat = v.cats.find(c => c.name === catName);
  if (!cat) { cat = {id: newId().slice(0, 18), name: catName, open: true, notes: []}; v.cats = [cat, ...v.cats]; }
  cat.notes = [...cat.notes, {id: newId().slice(0, 18), title, text, at: Date.now()}]; saveNotes(who, v); return v;
}
// Notes: one tab per category; each note folds to its title, and stays open or closed as you left it
function NotesBody({who, version}) {
  const [v, setV] = useState(() => loadNotes(who));
  useEffect(() => { setV(loadNotes(who)); }, [who, version]);
  const put = nv => { setV(nv); saveNotes(who, nv); };
  const [tab, setTab] = useState(''); const [newCat, setNewCat] = useState(''); const [adding, setAdding] = useState(false);
  const cur = v.cats.find(c => c.id === tab) || v.cats[0] || null, ci = cur ? v.cats.indexOf(cur) : -1;
  const cat = (id, patch) => put({...v, cats: v.cats.map(c => c.id === id ? {...c, ...patch} : c)});
  const note = (cid, nid, patch) => put({...v, cats: v.cats.map(c => c.id !== cid ? c : {...c, notes: c.notes.map(n => n.id === nid ? {...n, ...patch} : n)})});
  const addCat = () => { const nm = newCat.trim().slice(0, 60); if (!nm) return; const c = {id: newId().slice(0, 18), name: nm, notes: []}; put({...v, cats: [...v.cats, c]}); setTab(c.id); setNewCat(''); setAdding(false); };
  return (<div className="notes-body">
    <div className="note-tabs" role="tablist">
      {v.cats.map(c => <button key={c.id} role="tab" aria-selected={cur && cur.id === c.id} data-testid="notes-cat" className={`note-tab ${cur && cur.id === c.id ? 'on' : ''}`} onClick={() => setTab(c.id)}>{c.name || 'Untitled'} <span className="pp-muted">{c.notes.length}</span></button>)}
      {adding ? <span className="note-tab"><input autoFocus aria-label="New category" data-testid="notes-newcat" placeholder="NPCs, Loot, Quests..." value={newCat} onChange={e => setNewCat(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addCat(); if (e.key === 'Escape') setAdding(false); }}/><button className="item-star" data-testid="notes-addcat" disabled={!newCat.trim()} onClick={addCat}>✓</button></span>
        : <button className="note-tab" data-testid="notes-newtab" title="Add a category" onClick={() => setAdding(true)}>+</button>}
    </div>
    {cur && <div className="note-panel">
      <div className="note-cat-head">
        <input className="note-cat-name" aria-label="Category name" data-testid="notes-catname" value={cur.name} onChange={e => cat(cur.id, {name: e.target.value.slice(0, 60)})}/>
        <button className="item-star" title="Move this tab left" disabled={ci <= 0} onClick={() => { const a = v.cats.slice(); [a[ci - 1], a[ci]] = [a[ci], a[ci - 1]]; put({...v, cats: a}); }}>←</button>
        <button className="item-star" title="Delete this category and its notes" onClick={() => { if (window.confirm(`Delete "${cur.name}" and its ${cur.notes.length} notes?`)) { put({...v, cats: v.cats.filter(x => x.id !== cur.id)}); setTab(''); } }}>✕</button>
      </div>
      {cur.notes.map(n => <div key={n.id} className="note" data-testid="note">
        <div className="note-head"><button className="note-toggle" data-testid="note-toggle" aria-expanded={!!n.open} aria-label={n.open ? 'Close this note' : 'Open this note'} onClick={() => note(cur.id, n.id, {open: !n.open})}>{n.open ? '▾' : '▸'}</button>
          <input aria-label="Note title" data-testid="note-title" value={n.title} onChange={e => note(cur.id, n.id, {title: e.target.value.slice(0, 100)})}/>
          <button className="item-star" title="Delete this note" onClick={() => put({...v, cats: v.cats.map(x => x.id !== cur.id ? x : {...x, notes: x.notes.filter(y => y.id !== n.id)})})}>✕</button></div>
        {n.open && <textarea aria-label="Note text" data-testid="note-text" rows={Math.min(12, Math.max(3, String(n.text || '').split('\n').length + 1))} value={n.text} onChange={e => note(cur.id, n.id, {text: e.target.value.slice(0, 20000)})}/>}
      </div>)}
      <button className="btn btn-ghost btn-sm" data-testid="notes-add" onClick={() => put({...v, cats: v.cats.map(x => x.id !== cur.id ? x : {...x, notes: [...x.notes, {id: newId().slice(0, 18), title: 'New note', text: '', open: true, at: Date.now()}]})})}>+ New note</button>
    </div>}
  </div>);
}
function NotesPanel({who, onClose, version}) {
  return (
    <div className="modal-overlay" onClick={onClose} data-testid="notes">
      <div className="modal gloss-modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header"><span>Notes</span><button className="btn btn-ghost btn-sm" data-testid="notes-close" onClick={onClose}>Close</button></div>
        <div className="gloss-body"><NotesBody who={who} version={version}/>
          <div className="gloss-credit">Notes stay on this computer. Save a Combat Log entry here with its 📝 button.</div>
        </div>
      </div>
    </div>);
}

                    </>}

                    <label>Initiative roll (d20{signed(sheetPreview.initBonus)})</label>
                    <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8}}>
                      <input type="number" aria-label="Initiative roll" value={form.initiative} placeholder="Type your total, or roll" onChange={e=>setForm({...form,initiative:e.target.value})} />
                      <button className="btn btn-ghost" onClick={()=>setForm({...form,initiative:rollD(20)+sheetPreview.initBonus})}>Roll for me</button>
                    </div>
                  </div>
                </>
              ) : (<>
              <div className="two-col">
                <div className="form-group">
                  <label>Name</label>
                  <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Aldric Stoneheart" />
                </div>
                <div className="form-group">
                  <label>Type</label>
                  <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
                    <option value="player">{isDM ? 'Player Character' : 'My Character'}</option>
                    {isDM && <option value="monster">Monster (hostile)</option>}
                    {isDM && <option value="npc">NPC (neutral)</option>}
                    <option value="companion">Companion (pet, familiar, summon)</option>
                  </select>
                </div>
                {form.type !== 'player' && <div className="form-group">
                  <label>Size</label>
                  <select aria-label="Size" value={form.size || 'Medium'} onChange={e=>setForm({...form,size:e.target.value})}>{SIZES.map(z => <option key={z} value={z}>{z}</option>)}</select>
                </div>}
              </div>
              {form.type==='player' && (
                <div className="two-col">
                  <div className="form-group">
                    <label>Class</label>
                    <select value={form.charClass} onChange={e=>setForm({...form,charClass:e.target.value})}>
                      {CLASS_LIST.map(c=>(
                        <option key={c}>{c}</option>
                      ))}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Level</label>
                    <input type="number" min="1" max="20" value={form.level} onChange={e=>setForm({...form,level:e.target.value})} />
                  </div>
                </div>
              )}
              <div className="three-col">
                <div className="form-group">
                  <label>Total HP</label>
                  <input type="number" value={form.maxHP} onChange={e=>setForm({...form,maxHP:e.target.value,currentHP:e.target.value})} />
                </div>
                <div className="form-group">
                  <label>AC</label>
                  <input type="number" value={form.ac} onChange={e=>setForm({...form,ac:e.target.value})} />
                </div>
                <div className="form-group">
                  <label>Initiative</label>
                  <input type="number" value={form.initiative} onChange={e=>setForm({...form,initiative:e.target.value})} />
                </div>
              </div>
              <div className="form-group">
                <label>Speed (ft.)</label>
                <input type="number" min="0" step="5" value={form.speed} onChange={e=>setForm({...form,speed:e.target.value})} />
              </div>
              {form.type!=='player' && (
                <>
                  <div className="section-title" style={{margin:'8px 0 8px'}}>Attack (optional)</div>
                  <div className="two-col">
                    <div className="form-group">
                      <label>Attack name</label>
                      <input value={form.atkName} placeholder="Bite" onChange={e=>setForm({...form,atkName:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>To hit bonus</label>
                      <input type="number" value={form.atkBonus} onChange={e=>setForm({...form,atkBonus:e.target.value})} />
                    </div>
                  </div>
                  <div className="two-col">
                    <div className="form-group">
                      <label>Damage dice</label>
                      <input value={form.atkDmg} placeholder="1d6+2" onChange={e=>setForm({...form,atkDmg:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>Damage type</label>
                      <input value={form.atkType} placeholder="Piercing" onChange={e=>setForm({...form,atkType:e.target.value})} />
                    </div>
                  </div>
                </>
              )}
              <div className="section-title" style={{margin:'8px 0 8px'}}>Ability Scores</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:6}}>
                {ABILITY_KEYS.map(([k])=>(
                  <div className="form-group" key={k}>
                    <label>{k.toUpperCase()}</label>
                    <input type="number" min="1" max="30" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} />
                  </div>
                ))}
              </div>
              </>)}
              {!isDM && room && <div className="form-group" style={{marginTop: 8}}><label>Your name (the player)</label><input data-testid="add-player-name" aria-label="Your name" maxLength={40} value={playerName || String((form.sheetData && form.sheetData.player) || '')} placeholder={nameHint} onChange={e => { setPlayerName(e.target.value); lsSet('hba-player-name', e.target.value); }}/>{!(playerName.trim() || String((form.sheetData && form.sheetData.player) || '').trim()) && <div className="buff-note" data-testid="add-name-needed">Type your name to join.</div>}</div>}
              {!isDM && approval && <div className="buff-note">The DM has to accept this before it joins the fight.</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setShowAddModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={addCombatant}>Add to Combat</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
