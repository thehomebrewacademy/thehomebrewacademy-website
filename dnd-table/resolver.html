<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D Combat Resolver</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1B2430;
      --parchment: #EDE4D3;
      --parchment-dark: #D5C9B4;
      --brass: #B8860B;
      --brass-light: #D4A017;
      --blood: #7A2E2E;
      --blood-light: #9B3D3D;
      --gold: #C9A84C;
      --panel: #22303F;
      --panel-light: #2C3E50;
      --text-light: #EDE4D3;
      --text-muted: #9BAAB8;
      --success: #4CAF50;
      --danger: #E53935;
      --warning: #FF9800;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ink); font-family: 'Crimson Text', serif; color: var(--text-light); min-height: 100vh; }

    h1, h2, h3, .label { font-family: 'Cinzel', serif; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #0F1923 0%, #1B2430 100%);
      border-bottom: 2px solid var(--brass);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .header h1 { font-size: 1.4rem; color: var(--gold); letter-spacing: 2px; }
    .header .round-badge {
      margin-left: auto; background: var(--blood); border: 1px solid var(--blood-light);
      padding: 4px 14px; border-radius: 20px; font-family: 'Cinzel', serif;
      font-size: 0.85rem; color: var(--parchment);
    }

    /* ── LAYOUT ── */
    .app { display: grid; grid-template-columns: 320px 1fr 300px; gap: 0; height: calc(100vh - 56px); }

    /* ── PANELS ── */
    .panel { background: var(--panel); border-right: 1px solid #2C3E50; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header {
      background: linear-gradient(135deg, #1a2535 0%, #243040 100%);
      border-bottom: 1px solid var(--brass);
      padding: 10px 14px;
      font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold);
      letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 12px; }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-track { background: var(--panel); }
    .panel-body::-webkit-scrollbar-thumb { background: var(--brass); border-radius: 2px; }

    /* ── COMBATANT CARDS ── */
    .combatant-card {
      background: #1a2535; border: 1px solid #2C3E50; border-radius: 6px;
      padding: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
      position: relative;
    }
    .combatant-card:hover { border-color: var(--brass); }
    .combatant-card.active { border-color: var(--gold); background: #1f2f42; box-shadow: 0 0 8px rgba(201,168,76,0.3); }
    .combatant-card.targeted { border-color: var(--blood-light); background: #2a1f1f; box-shadow: 0 0 8px rgba(122,46,46,0.4); }
    .combatant-card.dead { opacity: 0.4; }

    .combatant-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .init-badge {
      background: var(--brass); color: var(--ink); font-family: 'Cinzel', serif;
      font-weight: 700; font-size: 0.9rem; width: 30px; height: 30px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .combatant-card.active .init-badge { background: var(--gold); }
    .combatant-card.targeted .init-badge { background: var(--blood-light); color: white; }

    .combatant-name { font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--parchment); font-weight: 600; }
    .combatant-type { font-size: 0.75rem; color: var(--text-muted); }

    .hp-bar-wrap { position: relative; height: 8px; background: #0F1923; border-radius: 4px; overflow: hidden; }
    .hp-bar { height: 100%; border-radius: 4px; transition: width 0.4s; }
    .hp-text { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; display: flex; justify-content: space-between; }
    .hp-text span { color: var(--parchment); font-weight: 600; }

    .conditions { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
    .condition-tag {
      background: #2C3E50; border: 1px solid #3d5166; border-radius: 3px;
      padding: 1px 5px; font-size: 0.65rem; color: var(--text-muted);
    }
    .condition-tag.bad { background: #3d1f1f; border-color: var(--blood); color: #ff8a80; }

    .turn-marker {
      position: absolute; top: 6px; right: 6px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
    }

    /* ── ADD COMBATANT ── */
    .add-form { background: #1a2535; border: 1px dashed #3d5166; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
    .add-form .label { font-size: 0.72rem; color: var(--brass); margin-bottom: 4px; display: block; }
    .add-form input, .add-form select {
      width: 100%; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment);
      padding: 5px 8px; border-radius: 4px; font-family: 'Crimson Text', serif; font-size: 0.9rem;
      margin-bottom: 5px;
    }
    .add-form input:focus, .add-form select:focus { outline: none; border-color: var(--brass); }
    .inline-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

    /* ── BUTTONS ── */
    .btn {
      font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.5px;
      border: none; border-radius: 4px; cursor: pointer; padding: 6px 12px;
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-primary { background: var(--brass); color: var(--ink); }
    .btn-primary:hover { background: var(--brass-light); }
    .btn-danger { background: var(--blood); color: white; }
    .btn-danger:hover { background: var(--blood-light); }
    .btn-ghost { background: transparent; border: 1px solid #3d5166; color: var(--text-muted); }
    .btn-ghost:hover { border-color: var(--brass); color: var(--parchment); }
    .btn-success { background: #2e7d32; color: white; }
    .btn-success:hover { background: #388e3c; }
    .btn-full { width: 100%; justify-content: center; }
    .btn-sm { padding: 4px 8px; font-size: 0.7rem; }

    /* ── CENTER — ACTION PANEL ── */
    .center-panel { background: #161f2b; border-right: 1px solid #2C3E50; display: flex; flex-direction: column; overflow: hidden; }
    .action-area { flex: 1; overflow-y: auto; padding: 16px; }
    .action-area::-webkit-scrollbar { width: 4px; }
    .action-area::-webkit-scrollbar-thumb { background: var(--brass); border-radius: 2px; }

    .turn-banner {
      background: linear-gradient(135deg, #1f2f42 0%, #243040 100%);
      border: 1px solid var(--gold); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px;
    }
    .turn-banner .who { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold); }
    .turn-banner .stats-row { display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
    .stat-chip { text-align: center; }
    .stat-chip .val { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--parchment); font-weight: 700; }
    .stat-chip .lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .section-title { font-family: 'Cinzel', serif; font-size: 0.78rem; color: var(--brass); letter-spacing: 1px; text-transform: uppercase; margin: 12px 0 6px; border-bottom: 1px solid #2C3E50; padding-bottom: 4px; }

    /* ── TARGET SELECTOR ── */
    .target-row { display: flex; align-items: center; gap: 8px; background: #1a2535; border: 1px solid #2C3E50; border-radius: 5px; padding: 7px 10px; margin-bottom: 5px; cursor: pointer; transition: all 0.15s; }
    .target-row:hover { border-color: var(--blood-light); }
    .target-row.selected { border-color: var(--blood-light); background: #2a1f1f; }
    .target-row .t-name { font-family: 'Cinzel', serif; font-size: 0.82rem; color: var(--parchment); flex: 1; }
    .target-row .t-ac { background: #0F1923; border: 1px solid #3d5166; border-radius: 3px; padding: 2px 7px; font-size: 0.78rem; color: var(--text-muted); }
    .target-row .t-hp { font-size: 0.75rem; color: var(--text-muted); }

    /* ── ACTION BUTTONS ── */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .action-btn {
      background: #1a2535; border: 1px solid #2C3E50; border-radius: 5px; padding: 8px;
      cursor: pointer; transition: all 0.15s; text-align: left;
    }
    .action-btn:hover { border-color: var(--brass); background: #1f2f42; }
    .action-btn.selected { border-color: var(--gold); background: #1f2f42; }
    .action-btn .a-name { font-family: 'Cinzel', serif; font-size: 0.78rem; color: var(--parchment); }
    .action-btn .a-detail { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .action-btn .a-tag { display: inline-block; font-size: 0.6rem; padding: 1px 5px; border-radius: 3px; margin-top: 3px; }
    .tag-attack { background: #3d1f1f; color: #ff8a80; border: 1px solid var(--blood); }
    .tag-save { background: #1f3a1f; color: #a5d6a7; border: 1px solid #2e7d32; }
    .tag-heal { background: #1a2f3a; color: #80d8ff; border: 1px solid #0288d1; }
    .tag-utility { background: #2a2a1f; color: #fff176; border: 1px solid #f9a825; }

    /* ── THE CHARACTER SHEET: the app's own look by default. Main color, border and text can be changed by the player. ── */
    .paper { --pp-main: #1a2535; --pp-border: #B8860B; --pp-text: #EDE4D3;
      --pp-card: color-mix(in srgb, var(--pp-main) 86%, var(--pp-text)); --pp-line: color-mix(in srgb, var(--pp-border) 40%, transparent);
      --pp-muted: color-mix(in srgb, var(--pp-text) 62%, var(--pp-main)); --pp-pick: color-mix(in srgb, var(--pp-border) 32%, var(--pp-main));
      background: var(--pp-main); color: var(--pp-text); border: 1px solid var(--pp-border); border-radius: 10px; padding: 14px 16px 18px; margin: 10px 0 16px;
      font-family: 'Crimson Text', Georgia, serif; font-size: 15px; }
    .paper strong { font-weight: 700; }
    .pp-muted { color: var(--pp-muted); }
    .pp-banner { display: flex; align-items: center; gap: 12px; border: 2px solid var(--pp-border); border-radius: 10px; padding: 8px 10px 8px 18px; background: var(--pp-card); }
    .pp-title { flex: 1; font-family: 'Cinzel', serif; font-weight: 700; font-size: 26px; line-height: 1.15; text-align: center; letter-spacing: 0.5px; }
    .pp-the { font-size: 17px; font-weight: 400; }
    .pp-level { width: 64px; height: 64px; border: 2px solid var(--pp-border); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Cinzel', serif; background: var(--pp-main); flex-shrink: 0; }
    .pp-level span { font-size: 10px; font-weight: 700; line-height: 1; text-transform: uppercase; letter-spacing: 1px; }
    .pp-level strong { font-size: 26px; line-height: 1.05; }
    .pp-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; border-bottom: 2px solid var(--pp-border); }
    .pp-tab { background: transparent; border: 1px solid var(--pp-line); border-bottom: none; border-radius: 8px 8px 0 0; color: var(--pp-text); font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; padding: 6px 14px; cursor: pointer; }
    .pp-tab.on { background: var(--pp-border); color: var(--pp-main); border-color: var(--pp-border); }
    .pp-colors { margin-left: auto; font-weight: 400; font-size: 12px; }
    .pp-theme { border: 1px solid var(--pp-line); border-radius: 8px; padding: 10px; margin-bottom: 12px; background: var(--pp-card); }
    .pp-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
    .pp-swatch { border: 2px solid; border-radius: 8px; padding: 7px 4px; font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700; cursor: pointer; }
    .pp-swatch.on { box-shadow: 0 0 0 2px var(--pp-text); }
    .pp-pickers { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
    .pp-pickers label { display: inline-flex; align-items: center; gap: 6px; }
    .pp-pickers input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid var(--pp-border); border-radius: 6px; background: transparent; cursor: pointer; }
    .pp-pickers .pp-tab { border: 1px solid var(--pp-border); border-radius: 8px; }
    .pp-top { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; margin-bottom: 14px; }
    .pp-abil { flex: 1 1 70px; min-width: 70px; border: 2px solid var(--pp-border); border-radius: 10px; text-align: center; padding: 6px 4px 6px; background: var(--pp-card); display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .pp-abname { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .pp-score { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700; line-height: 1; }
    .pp-mod, .pp-save { background: var(--pp-main); border: 1px solid var(--pp-border); color: var(--pp-text); border-radius: 12px; cursor: pointer; font-family: 'Cinzel', serif; }
    .pp-mod { font-size: 15px; font-weight: 700; min-width: 48px; padding: 0 8px; }
    .pp-save { font-size: 11.5px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; border-color: var(--pp-line); }
    .pp-save.prof { border-color: var(--pp-border); font-weight: 700; }
    .pp-mod:hover:not(:disabled), .pp-save:hover:not(:disabled), .pp-skill:hover, .pp-stdbtn:hover:not(:disabled) { background: var(--pp-pick); }
    .pp-mod:disabled, .pp-save:disabled { cursor: default; }
    .pp-hp { flex: 1 1 250px; min-width: 230px; border: 2px solid var(--pp-border); border-radius: 10px; padding: 6px 12px; background: var(--pp-card); display: flex; align-items: center; gap: 12px; }
    .pp-heart { position: relative; width: 104px; height: 96px; flex-shrink: 0; }
    .pp-heart svg, .pp-shape svg { width: 100%; height: 100%; }
    .pp-heart path, .pp-shape path, .pp-shape polygon { fill: var(--pp-main); stroke: var(--pp-border); stroke-width: 4; }
    .pp-heartval { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 14px; }
    .pp-heartval strong { font-family: 'Cinzel', serif; font-size: 32px; line-height: 1; }
    .pp-heartval span { font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .pp-hpside { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .pp-hprow { display: flex; align-items: flex-end; justify-content: space-around; gap: 8px; }
    .pp-hprow > div { display: flex; flex-direction: column; align-items: center; }
    .pp-hprow strong { font-family: 'Cinzel', serif; font-size: 24px; line-height: 1.1; }
    .pp-hprow span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--pp-muted); }
    .pp-hit { text-align: center; font-size: 13px; color: var(--pp-muted); border-top: 1px solid var(--pp-line); padding-top: 3px; }
    .pp-shape { position: relative; width: 70px; height: 76px; flex-shrink: 0; }
    .pp-starbox { width: 76px; }
    .pp-shape > div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .pp-shield > div { padding-bottom: 8px; }
    .pp-shape strong { font-family: 'Cinzel', serif; font-size: 23px; line-height: 1; }
    .pp-starbox strong { font-size: 19px; }
    .pp-shape span { font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .pp-passive { flex: 1; min-width: 190px; display: flex; justify-content: space-around; align-items: center; gap: 8px; padding: 4px 8px; }
    .pp-passive > div { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .pp-passive strong { font-family: 'Cinzel', serif; font-size: 20px; line-height: 1.1; }
    .pp-passive span { font-size: 11px; color: var(--pp-muted); line-height: 1.15; max-width: 82px; }
    .pp-active { padding: 8px 12px; margin-top: 10px; }
    .pp-arow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--pp-line) 45%, transparent); font-size: 14.5px; }
    .pp-arow .pp-chip { font-size: 11.5px; padding: 1px 10px; }
    .pp-input { background: var(--pp-main); border: 1px solid var(--pp-line); color: var(--pp-text); border-radius: 8px; padding: 3px 8px; font-family: inherit; font-size: 13.5px; width: 250px; }
    .pp-mast { margin-left: 8px; font-family: 'Cinzel', serif; font-size: 11px; color: #8a8f98; }
    .pp-mast.on { background: var(--pp-border); color: #000; font-weight: 700; border-radius: 10px; padding: 1px 9px; }
    .pp-fold { background: transparent; border: none; color: var(--pp-border); cursor: pointer; font-size: 13px; padding: 0; text-align: left; }
    .pp-details { padding: 2px 0 6px 24px; }
    .pp-full { margin-top: 4px; color: var(--pp-text); white-space: pre-wrap; }
    .pp-body { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
    .pp-card { border: 1px solid var(--pp-line); border-radius: 10px; background: var(--pp-card); }
    .pp-skills { padding: 6px 8px; }
    .pp-skill { display: grid; grid-template-columns: 12px 26px 1fr 30px; align-items: center; gap: 5px; padding: 2px 3px; cursor: pointer; font-size: 13.5px; border-bottom: 1px solid color-mix(in srgb, var(--pp-line) 45%, transparent); border-radius: 4px; }
    .pp-skill:last-child { border-bottom: none; }
    .pp-skill.prof .pp-sn, .pp-skill.prof .pp-sv { font-weight: 700; }
    .pp-o { width: 9px; height: 9px; border: 1.5px solid var(--pp-border); border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .pp-o.full { background: var(--pp-border); }
    .pp-o.ex { background: var(--pp-border); box-shadow: 0 0 0 2px var(--pp-card), 0 0 0 3.5px var(--pp-border); }
    .pp-sv { text-align: center; }
    .pp-sa { text-align: right; font-size: 11px; color: var(--pp-muted); }
    .pp-carry { margin: 10px 2px 4px; font-size: 13.5px; }
    .pp-h3 { font-family: 'Cinzel', serif; font-weight: 700; font-size: 13.5px; text-align: center; margin: 12px 0 4px; letter-spacing: 0.5px; }
    .pp-center { text-align: center; font-size: 14px; line-height: 1.5; }
    .pp-stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .pp-stat { border: 2px solid var(--pp-border); border-radius: 10px; background: var(--pp-card); min-width: 64px; height: 62px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .pp-stat strong { font-family: 'Cinzel', serif; font-size: 24px; line-height: 1.1; }
    .pp-stat span { font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .pp-cond { flex: 1; min-width: 160px; padding: 6px 12px; text-align: center; font-size: 14px; }
    .pp-line { display: flex; gap: 22px; flex-wrap: wrap; margin: 10px 2px 2px; font-size: 14px; }
    .pp-h2 { font-family: 'Cinzel', serif; font-weight: 700; font-size: 17px; letter-spacing: 1px; text-transform: uppercase; margin: 16px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--pp-border); color: var(--pp-border); }
    .paper .action-btn { background: transparent; border: none; border-bottom: 1px solid color-mix(in srgb, var(--pp-line) 55%, transparent); border-radius: 6px; padding: 4px 6px; color: var(--pp-text); }
    .paper .action-btn:hover { background: var(--pp-pick); border-color: transparent; }
    .paper .action-btn.selected { background: var(--pp-pick); outline: 2px solid var(--pp-border); border-color: transparent; }
    .paper .action-btn .a-name { font-family: 'Crimson Text', Georgia, serif; font-size: 16px; font-weight: 700; color: var(--pp-text); }
    .paper .action-btn .a-detail { color: var(--pp-muted); font-size: 13.5px; margin: 0; font-weight: 400; }
    .pp-attack { display: grid; grid-template-columns: 2fr 1.1fr 0.7fr 1.6fr; gap: 6px; align-items: baseline; }
    .pp-head { font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 6px; color: var(--pp-muted); }
    .pp-head span:not(:first-child), .pp-attack span:not(:first-child) { text-align: center; }
    .pp-filter { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
    .pp-chip { background: transparent; border: 1px solid var(--pp-border); color: var(--pp-text); border-radius: 14px; padding: 2px 12px; font-size: 12.5px; cursor: pointer; font-family: 'Cinzel', serif; opacity: 0.55; }
    .pp-chip.on { background: var(--pp-border); color: var(--pp-main); font-weight: 700; opacity: 1; }
    .pp-std { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin-bottom: 8px; }
    .pp-stdbtn { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: var(--pp-card); border: 1px solid var(--pp-line); border-radius: 8px; color: var(--pp-text); padding: 5px 9px; cursor: pointer; font-family: 'Crimson Text', Georgia, serif; font-size: 15px; }
    .pp-stdbtn:disabled { cursor: default; opacity: 0.7; }

    .view-tab { font-family: 'Cinzel', serif; font-size: 0.75rem; background: #1a2535; border: 1px solid #2C3E50; color: var(--text-muted); border-radius: 5px 5px 0 0; padding: 6px 12px; cursor: pointer; }

    .turn-note.yours { color: #a5d6a7; }
    details.block { background: #1a2535; border: 1px solid #2C3E50; border-radius: 5px; padding: 8px 10px; margin-top: 8px; font-size: 0.85rem; line-height: 1.45; }
    details.block summary { font-family: 'Cinzel', serif; font-size: 0.75rem; color: var(--brass); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    details.block p { margin-top: 6px; color: var(--parchment); }
    details.block p strong { color: var(--gold); }
    .buff-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    .buff-row select, .buff-row input, .dice-box input, .roster input.search {
      width: 100%; background: #0F1923; border: 1px solid #3d5166; color: var(--parchment);

    .prompt-bar { background: #2a2210; border-bottom: 2px solid var(--gold); padding: 8px 14px; display: grid; gap: 6px; }
    .prompt-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.95rem; color: var(--parchment); }

    /* ── DICE ROLLER ── */
    .dice-box { padding: 10px; border-bottom: 1px solid var(--brass); flex-shrink: 0; }

    /* ── PHONE LAYOUT: one panel at a time ── */
    .pane-tabs { display: none; }
    @media (max-width: 900px) {
      .header { padding: 10px 12px; gap: 8px; }
      .header h1 { font-size: 1.1rem; letter-spacing: 1px; }
      .room-bar { margin-left: 0; width: 100%; }

      .abil-row { grid-template-columns: repeat(3, 1fr); }

      .buff-row { grid-template-columns: 1fr; }
      .action-area { padding: 12px; }
      .hp-edit input { width: 64px; }

    }

    * { scrollbar-width: thin; scrollbar-color: var(--brass) var(--panel); }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="monsters.js"></script>
<script type="text/babel">

const {useState, useRef, useEffect, useMemo} = React;

// ── LIVE SYNC (Firebase Realtime Database) ──────────────────────────────────
// Config lives in firebase-config.js. Without it the app still works, on one screen only.
const FB_CFG = window.HBA_FIREBASE_CONFIG || {};
let db = null;
if (window.firebase && FB_CFG.apiKey && FB_CFG.databaseURL) {
  try { firebase.initializeApp(FB_CFG); db = firebase.database(); }
  catch (e) { console.error('Firebase setup failed', e); }
}
const SYNC_AVAILABLE = !!db;
const MONSTERS = window.HBA_MONSTERS || [];

let idSeq = 0; // keeps entries made in the same millisecond in the order they were made
function newId() { idSeq = (idSeq + 1) % 1296; return Date.now().toString(36) + idSeq.toString(36).padStart(2, '0') + Math.random().toString(36).slice(2, 6); }
function makeCode(len) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length: len || 6}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}
function cleanCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12); }
function sessionFromHash() { const m = /room=([A-Za-z0-9]+)/.exec(window.location.hash); return m ? cleanCode(m[1]) : ''; }
function stamp(entry) { return {...entry, id: newId()}; }
function plain(v) { return JSON.parse(JSON.stringify(v)); } // drops undefined, which Firebase rejects
function stable(v) { // JSON with sorted keys, so local and synced copies compare equal
  if (Array.isArray(v)) return v.length ? '[' + v.map(stable).join(',') + ']' : 'null';
  if (v && typeof v === 'object') {
    const keys = Object.keys(v).filter(k => v[k] !== undefined && v[k] !== null && stable(v[k]) !== 'null').sort();
    return keys.length ? '{' + keys.map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}' : 'null';
  }
  return JSON.stringify(v);
}
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
// Log entries arrive from other players, so only the markup this app itself writes is allowed through.
function sanitizeLogHtml(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  const allowed = {STRONG:1, SPAN:1, DIV:1, BR:1};
  const walk = node => {
    Array.from(node.childNodes).forEach(ch => {
      if (ch.nodeType === 3) return;
      if (ch.nodeType !== 1 || !allowed[ch.tagName]) { ch.replaceWith(document.createTextNode(ch.textContent || '')); return; }
      Array.from(ch.attributes).forEach(a => {
        const ok = a.name === 'class' ? /^[\w\- ]*$/.test(a.value)
                 : a.name === 'style' ? /^color:\s*(var\(--[\w-]+\)|#[0-9a-fA-F]{3,8})$/.test(a.value.trim())
                 : false;
        if (!ok) ch.removeAttribute(a.name);
      });
      walk(ch);
    });
  };
  walk(tpl.content);
  return tpl.innerHTML;
}

// ── PLAYER CODE ─────────────────────────────────────────────────────────────
// No login. Each person has a player code kept on their own computer, and their sheet is saved under it.
// The code itself never leaves the computer: a session only sees a scrambled ID made from it.
const CODE_KEY = 'hba-player-code';
const charKey = code => 'hba-char-' + code;
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
function currentPlayerCode() {
  let c = cleanCode(lsGet(CODE_KEY));
  if (!c) { c = makeCode(); lsSet(CODE_KEY, c); }
  return c;
}
function readStoredCharacter(code) {
  try { const d = JSON.parse(lsGet(charKey(code)) || 'null'); return d && d.format === 'homebrew-academy-character' ? d : null; }
  catch (e) { return null; }
}
function publicId(code) {
  const h = seed => { let x = seed; const s = 'hba:' + code; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193); } return (x >>> 0).toString(36); };
  return 'p' + h(0x811c9dc5) + h(0x9747b28c);
}

const CLASS_LIST = ['Barbarian','Bard','Cleric','Druid','Fighter','Monk','Paladin','Ranger','Rogue','Sorcerer','Warlock','Wizard'];
const ABILITY_KEYS = [['str','Strength'],['dex','Dexterity'],['con','Constitution'],['int','Intelligence'],['wis','Wisdom'],['cha','Charisma']];
const DMG_RE = /^\d+(d\d+)?([+-]\d+(d\d+)?)*$/i;

// ── DICE UTILITIES ──────────────────────────────────────────────────────────
function rollD(sides) { return Math.floor(Math.random() * sides) + 1; }
function rollDice(count, sides) {
  const rolls = Array.from({length: count}, () => rollD(sides));
  return { total: rolls.reduce((a,b)=>a+b,0), rolls };
}
const REACT_MS = +window.HBA_REACT_MS || 30000; // how long a creature has to decide on a Reaction
const XP_BY_CR = {'0':10,'1/8':25,'1/4':50,'1/2':100,'1':200,'2':450,'3':700,'4':1100,'5':1800,'6':2300,'7':2900,'8':3900,'9':5000,'10':5900,'11':7200,'12':8400,'13':10000,'14':11500,'15':13000,'16':15000,'17':18000,'18':20000,'19':22000,'20':25000,'21':33000,'22':41000,'23':50000,'24':62000,'25':75000,'26':90000,'27':105000,'28':120000,'29':135000,'30':155000};
// When a Reaction can be taken. Read from an explicit trigger, the casting time of a Reaction spell, or the sentence of the feature that mentions the Reaction.
const REACT_BY_NAME = {'shield': ['hit'], 'hellish rebuke': ['damage'], 'absorb elements': ['damage'], 'counterspell': ['cast'], 'uncanny dodge': ['hit'], 'deflect attacks': ['hit'], 'deflect missiles': ['hit'], 'parry': ['hit'], 'retaliation': ['damage'], "stone's endurance": ['damage'], 'feather fall': [], 'slow fall': [], 'opportunity attack': []};
const REACT_EVENTS = ['targeted', 'hit', 'miss', 'damage', 'cast'];
function reactEvents(name, trigger, text) {
  const nm = String(name || '').replace(/ \(Level \d slot\)$/, '').toLowerCase();
  const exp = String(trigger || '').toLowerCase().split(/[,\s]+/).filter(Boolean);
  if (exp.length && exp.every(w => REACT_EVENTS.includes(w))) return exp;
  const named = String(trigger || '').toLowerCase().split(',').map(x => x.trim()).filter(w => REACT_EVENTS.includes(w)); // keywords mixed with a phrase
  if (named.length) return named;
  if (!trigger && REACT_BY_NAME[nm]) return REACT_BY_NAME[nm];
  let t = String(trigger || '');
  if (!t) { const parts = String(text || '').match(/[^.!?]+[.!?]*/g) || [], hits = parts.filter(x => /reaction/i.test(x)); t = (hits.length ? hits : parts.slice(0, 2)).join(' '); }
  t = t.toLowerCase(); const out = [];
  if (/\bhits? (you|it|the \w+)\b|hit by an attack|would hit|(you are|it is|is) hit\b/.test(t)) out.push('hit');
  if (/\bmiss(es)? (you|it)\b/.test(t)) out.push('miss');
  if (/target(s|ed)? (you|it) with an attack|targeted by an attack|attack roll against (you|it)|\battacks (you|it)\b|(you are|it is) attacked|before the attack roll/.test(t)) out.push('targeted');
  if (/tak(e|es|ing) (\w+ )?damage|damaged by|deals damage to (you|it)|damages (you|it)/.test(t)) out.push('damage');
  if (/cast(s|ing) a spell/.test(t)) out.push('cast');
  return out;
}
const SPELL_NAMES = new Set((window.HBA_SPELLS || []).map(x => String(x.n || '').toLowerCase()));
let NEXT_D20 = 0, FUDGE_DONE = null; // the DM can say what the next d20 shows
function roll20(advantage=0) { // 0=normal, 1=advantage, -1=disadvantage
  if (NEXT_D20) { const n = NEXT_D20; NEXT_D20 = 0; if (FUDGE_DONE) FUDGE_DONE(); return {total:n, rolls:[n]}; }
  if (advantage === 0) { const r = rollD(20); return {total:r, rolls:[r]}; }
  const r1 = rollD(20), r2 = rollD(20);
  return advantage === 1
    ? {total:Math.max(r1,r2), rolls:[r1,r2], kept: r1>=r2?r1:r2}
    : {total:Math.min(r1,r2), rolls:[r1,r2], kept: r1<=r2?r1:r2};
}
function parseDamage(expr, allowNegative, lowAs3) { // lowAs3: Great Weapon Fighting, a 1 or 2 on a damage die counts as 3
  // e.g. "2d6+4", "1d8", "3d4+1d6+5"
  let total = 0; const parts = [];
  const groups = expr.match(/(\d+d\d+|\d+)/g) || [];
  let ops = expr.match(/[+-]/g) || [];
  let sign = 1;
  let opIdx = 0;
  for (let g of groups) {
    if (g.includes('d')) {
      const [c,s] = g.split('d').map(Number);
      let {total:t, rolls} = rollDice(Math.min(c, 100), Math.max(1, s));
      if (lowAs3 && s >= 3) { rolls = rolls.map(r => Math.max(3, r)); t = rolls.reduce((a, b) => a + b, 0); }
      parts.push(`${c}d${s}=[${rolls.join(',')}]`);
      total += sign * t;
    } else {
      parts.push(g);
      total += sign * Number(g);
    }
    if (opIdx < ops.length) { sign = ops[opIdx++]==='+' ? 1 : -1; }
  }
  return { total: allowNegative ? total : Math.max(0, total), parts };
}

// ── ABILITY SCORE HELPERS ────────────────────────────────────────────────────
function mod(score) { return Math.floor((score-10)/2); }
function modStr(score) { const m=mod(score); return (m>=0?'+':'')+m; }
function signed(n) { return (n>=0?'+':'')+n; }
function profBonus(level) { return Math.ceil(level/4)+1; }

// ── CONDITIONS ───────────────────────────────────────────────────────────────
const CONDITIONS = ['Blinded','Charmed','Deafened','Frightened','Grappled','Incapacitated','Invisible','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious'];

const CONDITION_ICON = {Blinded:'🙈', Charmed:'💖', Deafened:'🔇', Frightened:'😱', Grappled:'🤼', Incapacitated:'💫', Invisible:'👻',
  Paralyzed:'⚡', Petrified:'🗿', Poisoned:'🤢', Prone:'🛌', Restrained:'⛓️', Stunned:'😵', Unconscious:'💤'};
// A condition can carry details in condInfo[name]: {left (seconds), dc, abil, when ('start' or 'end'), turnOf (creature id), src}.
// With dc and abil set, the creature repeats the save on that turn and the condition ends on a success.
const condInfoOf = (c, cond) => (c && c.condInfo && c.condInfo[cond]) || null;
function dropCondition(c, cond) {
  const info = {...(c.condInfo || {})}; delete info[cond];
  return {...c, conditions: (c.conditions || []).filter(x => x !== cond), condInfo: info};
}
function condSaveText(info, list, self) {
  if (!info || !info.dc || !info.abil) return '';
  const other = info.turnOf && info.turnOf !== self.id ? list.find(x => x.id === info.turnOf) : null;
  return `DC ${info.dc} ${info.abil} save at the ${info.when === 'start' ? 'start' : 'end'} of ${other ? other.name + "'s" : 'its'} turn`;

    const base = kind === 'save' ? ((c.saves || {})[ability] ?? mod(score))
      : (skill && c.sheet && c.sheet.skills && Number.isFinite(+c.sheet.skills[skill])) ? +c.sheet.skills[skill] : mod(score);
    const t = d20Test(c, kind, {ability, skill});
    const label = kind === 'save' ? `${ability} saving throw` : skill ? `${ability} (${skill}) check` : `${ability} check`;
    let body, total = null;
    if (t.autoFail) body = `<strong style="color:var(--danger)">Fails automatically (${esc(t.autoFail)})</strong>`;
    else {
      const roll = roll20(testMode(t)); total = roll.total + base + t.bonus;
      body = `<span class="log-result">🎲 ${roll.total + base + t.bonus}</span><div class="log-dice">${roll.rolls.join('/')} ${signed(base)}${t.bonusText ? ` (${t.bonusText})` : ''}</div>${modeText(t) ? `<div class="log-detail">${modeText(t)}</div>` : ''}`;
    }
    if (dc) body += `<div class="log-detail">${why ? esc(why) + ' · ' : ''}DC ${+dc} · <strong style="color:${total != null && total >= +dc ? 'var(--success)' : 'var(--danger)'}">${total != null && total >= +dc ? 'Success' : 'Failure'}</strong></div>`;
    setLog(prev => [...prev, stamp({type: dc ? (total != null && total >= +dc ? 'save-pass' : 'save-fail') : 'roll', html:`<strong>${esc(c.name)}</strong> · ${esc(label)}<br/>${body}`})]);
    return total;
  };

  const updateHP = (id, delta, isHeal=false) => {
    setCombatants(prev => prev.map(c => {
      if (c.id !== id) return c;
      if (isHeal) return (c.effects || []).some(e => e.noHeal) ? c : {...c, currentHP: Math.min(totalHP(c), c.currentHP + delta)}; // something stops it regaining Hit Points
      const dmg = Math.max(0, -delta), temp = +c.tempHP || 0, soak = Math.min(temp, dmg); // Temporary Hit Points are lost first
      const ward = (c.effects || []).find(e => e.ward0); // Death Ward: the first drop to 0 becomes 1, and the ward is spent
      if (ward && c.currentHP > 0 && c.currentHP - (dmg - soak) <= 0) return {...c, tempHP: temp - soak, currentHP: 1, effects: c.effects.filter(e => e.id !== ward.id)};
      return {...c, tempHP: temp - soak, currentHP: Math.max(0, c.currentHP - (dmg - soak))};
    }));
  };
  const setTempHP = (id, n) => setCombatants(prev => prev.map(c => c.id === id ? {...c, tempHP: Math.max(0, n)} : c));

  const addCondition = (id, cond, info) => {
    const tgt = combatants.find(c => c.id === id);
    const why = tgt ? immuneTo(tgt, cond) : '';
    if (why) { setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(tgt.name)}</strong> is immune to <span class="log-result">${esc(cond)}</span><div class="log-detail">${esc(why)}</div>`})]); return; }
    setCombatants(prev => prev.map(c => {
      if (c.id !== id || c.conditions.includes(cond)) return c;
      const all = {...(c.condInfo || {})}; delete all[cond];
      if (info && Object.keys(info).length) all[cond] = info;
      return {...c, conditions:[...c.conditions, cond], condInfo: all};
    }));
  };

  const removeCondition = (id, cond) => {
    setCombatants(prev => prev.map(c => {
      if (c.id !== id) return c;
      return dropCondition(c, cond);
    }));
  };

  // ── BUFF PASSING ────────────────────────────────────────────────────────────
  const whoAmI = () => (viewed && canControl(viewed)) ? viewed.name : (isDM ? 'DM' : 'A player');
  const reorder = list => combatStarted ? byInit(list) : list;
  const buffPresetNow = BUFFS.find(b => b.name === buffName);
  const defaultOpt = (b) => {
    if (!b || !b.opt) return '';
    if (b.opt.key === 'inspire') { const l = viewed && viewed.charClass === 'Bard' ? viewed.level : 1; return l >= 15 ? 'd12' : l >= 10 ? 'd10' : l >= 5 ? 'd8' : 'd6'; }
    if (b.opt.key === 'tempEachTurn') { const sp = viewed && viewed.sheet && viewed.sheet.spell; return String(Math.max(1, sp ? sp.attack - (viewed.pb || 2) : 3)); }
    return b.opt.choices[0];
  };
  const optValue = buffOpt !== '' ? buffOpt : defaultOpt(buffPresetNow);
  const timeNow = buffTime || defaultTime(buffName);
  const passBuff = () => {
    const to = inPlay.find(c => c.id === (buffTarget || (viewed && viewed.id)));
    if (!to) return;
    const custom = buffName === '__custom';
    const preset = buffPresetNow;
    const name = custom ? buffCustom.name.trim().slice(0, 40) : buffName;
    if (!name) return;
    const eff = {id: newId(), name, by: myId, byName: whoAmI()};
    if (custom) {
      ['ac','speed','init'].forEach(k => { const n = parseInt(buffCustom[k], 10); if (Number.isFinite(n) && n !== 0) eff[k] = Math.max(-200, Math.min(200, n)); });
      ['atk','save'].forEach(k => { const v = String(buffCustom[k] || '').replace(/\s/g, '').replace(/^\+/, ''); if (v && DMG_RE.test(v.replace(/^-/, ''))) eff[k] = v; });
      const sense = buffCustom.sense.trim().slice(0, 60); if (sense) eff.sense = sense;
      const note = buffCustom.note.trim().slice(0, 200); if (note) eff.note = note;
    } else if (preset) {
      EFFECT_KEYS.forEach(k => { if (preset[k] != null) eff[k] = preset[k]; });
      if (preset.fromCaster && viewed) { eff.src = viewed.id; eff.srcName = viewed.name; }
      if (preset.opt) {
        if (preset.opt.number) eff[preset.opt.key] = Math.max(0, Math.min(99, parseInt(optValue, 10) || 0));
        else if (preset.opt.choices.includes(optValue)) eff[preset.opt.key] = optValue;
        if (preset.opt.key === 'lvl') { const l = +eff.lvl || 1; eff.d20 = -2 * l; eff.speed = -5 * l; }
      }
    }
    const secs = Math.round(parseFloat(timeNow.n) * (UNIT_SECONDS[timeNow.unit] || 60));
    if (Number.isFinite(secs) && secs > 0) eff.left = Math.min(MAX_SECONDS, secs);
    if (timeNow.conc) eff.conc = true;
    const blocked = !custom && name === 'Exhaustion' ? immuneTo(to, 'Exhaustion') : '';
    if (blocked) { setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(to.name)}</strong> is immune to <span class="log-result">Exhaustion</span>`})]); return; }
    setCombatants(prev => reorder(prev.map(c => c.id !== to.id ? c : {
      ...c,
      currentHP: +eff.hpMax > 0 ? c.currentHP + Math.max(0, +eff.hpMax - (+(((c.effects || []).find(e => e.name === name) || {}).hpMax) || 0)) : c.currentHP,
      effects: [...(c.effects || []).filter(e => e.name !== name), eff],
      conditions: eff.immune ? (c.conditions || []).filter(x => x !== eff.immune) : c.conditions,
    })));
    const what = [describeEffect(eff), eff.note, eff.left ? `Lasts ${timeText(eff.left)}${eff.conc ? ' (Concentration)' : ''}` : (eff.conc ? 'Concentration' : '')].filter(Boolean).join('. ');
    setLog(prev => [...prev, stamp({type:'heal', html:`<strong>${esc(whoAmI())}</strong> passes <span class="log-result">${esc(name)}${eff.lvl ? ` ${esc(eff.lvl)}` : ''}</span> to <strong>${esc(to.name)}</strong>${what ? `<div class="log-detail">${esc(what)}</div>` : ''}`})]);
    setBuffCustom(emptyCustom);
    setBuffTime(null);
  };
  // Ends effects that carry a flag (ends when it attacks, ends when it takes damage), along with any condition the same spell put there.
  const endByFlag = (c, flag, why) => {
    const gone = ((c && c.effects) || []).filter(e => e[flag]); if (!gone.length) return;
    const names = gone.map(e => e.name);
    setCombatants(prev => reorder(prev.map(x => { if (x.id !== c.id) return x; let out = {...x, effects: (x.effects || []).filter(e => !e[flag])};
      (out.conditions || []).forEach(k => { const src = (condInfoOf(out, k) || {}).src || ''; if (names.some(n => src === n || src.startsWith(n + ' ('))) out = dropCondition(out, k); }); return out; })));
    setLog(prev => [...prev, stamp({type:'roll', forId: c.id, by: '', html:`<strong>${esc(c.name)}</strong>: <span class="log-result">${names.map(esc).join(', ')}</span> ends<div class="log-detail">${esc(why)}</div>`})]);
  };
  // A spell that ends things on its target: one choice is made for it, or the caster picks.
  const removable = (t, rm) => [
    ...(t.conditions || []).filter(k => rm.conds.includes(k)).map(k => ({kind: 'cond', key: k, label: k})),
    ...(rm.effects ? (t.effects || []).filter(e => !(rm.exhaustion && e.name === 'Exhaustion')).filter(e => rm.effects !== 'curse' || /curse|hex|geas/i.test(e.name) || (rm.hpMax && +e.hpMax < 0)).map(e => ({kind: 'eff', key: e.id, label: e.name})) : []),
    ...(rm.hpMax && !rm.effects ? (t.effects || []).filter(e => +e.hpMax < 0).map(e => ({kind: 'eff', key: e.id, label: `${e.name} (Hit Point maximum reduced)`})) : []),
    ...(rm.exhaustion ? (t.effects || []).filter(e => e.name === 'Exhaustion').map(e => ({kind: 'exh', key: e.id, label: `one level of Exhaustion (now ${e.lvl || 1})`})) : [])];
  const doRemove = (tid, opts, spell) => {
    setCombatants(prev => reorder(prev.map(c => { if (c.id !== tid) return c; let out = c;
      opts.forEach(o => { if (o.kind === 'cond') out = dropCondition(out, o.key);
        else if (o.kind === 'eff') out = {...out, effects: (out.effects || []).filter(e => e.id !== o.key)};
        else out = {...out, effects: (out.effects || []).map(e => e.id !== o.key ? e : (+e.lvl || 1) <= 1 ? null : {...e, lvl: String((+e.lvl || 1) - 1), d20: -2 * ((+e.lvl || 1) - 1), speed: -5 * ((+e.lvl || 1) - 1)}).filter(Boolean)}; });
      return out; })));
    const t = combatants.find(c => c.id === tid);
    setLog(prev => [...prev, stamp({type:'heal', forId: tid, by: myId, html:`<strong>${esc(spell)}</strong> ends ${opts.map(o => esc(o.label)).join(', ')} on <strong>${esc(t ? t.name : 'the target')}</strong>`})]);
  };
  const startRemove = (t, action, want) => {
    const rm = action.remove, opts = removable(t, rm), spell = String(action.name).replace(/ \(Level \d slot\)$/, '');
    if (!opts.length) { setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(spell)}</strong>: ${esc(t.name)} has nothing it can end right now.`})]); return; }
    const wanted = want ? opts.filter(o => o.label === want || o.key === want) : [];
    if (rm.effects === 'spells') setRemovePick({targetId: t.id, name: spell, options: opts, many: true}); // which effects are spells is the caster's and DM's call
    else if (rm.count === 'all') doRemove(t.id, opts, spell);
    else if (wanted.length) doRemove(t.id, wanted.slice(0, 1), spell);
    else if (opts.length === 1) doRemove(t.id, opts, spell);
    else setRemovePick({targetId: t.id, name: spell, options: opts});
  };
  const answerDM = (q, c) => { const t = String(dmAnswer[q.id] || '').trim().slice(0, 400); if (!t) return;
    removePrompt(q.id); setDmAnswer(prev => { const {[q.id]: _, ...rest} = prev; return rest; });
    setTimeout(() => setLog(prev => [...prev, stamp({type:'roll', forId: c.id, by: myId, html:`<strong>${esc(q.spell)}</strong> · ${esc(c.name)}<div class="log-detail">The DM answers: ${esc(t)}</div>`})]), 450); };
  const removeEffect = (id, effId) => setCombatants(prev => reorder(prev.map(c => c.id === id ? {...c, effects: (c.effects || []).filter(e => e.id !== effId)} : c)));

  // ── TIME, RESTS AND ENDING AN ENCOUNTER (DM) ────────────────────────────────
  // What a rest gives back to one creature: spell slots, shared pools and each feature's own uses.
  const restoreUses = (c0, longRest) => {
    let c = c0;
    if (c.slotsUsed && (longRest || (c.sheet || {}).pact)) c = {...c, slotsUsed: {}}; // Long Rest, or Pact Magic on a Short Rest
    if (c.poolUsed) { // shared pools: all back on a Long Rest; on a Short Rest the short ones, and one use of some others
      const left = {};
      if (!longRest) Object.keys(c.poolUsed).forEach(k => {
        const q = ((c.sheet || {}).pools || {})[k] || {};
        const n = q.recharge === 'short' ? 0 : Math.max(0, c.poolUsed[k] - (q.shortRegain || 0));
        if (n > 0) left[k] = n;
      });
      c = {...c, poolUsed: left};
    }
    if (c.used) {
      const used = {};
      if (!longRest) buildActions(c).forEach(a => { if (a.recharge !== 'short' && c.used[a.id]) used[a.id] = c.used[a.id]; });
      c = {...c, used};
    }
    return c;
  };
  // A player finishing a rest for their own character: sets what comes back and says what changed.
  const restCharacter = (id, kind) => {
    const c = combatants.find(x => x.id === id);
    if (!c || !canControl(c)) return;
    const longRest = kind === 'long';
    let after = restoreUses(c, longRest);
    if (longRest) after = {...after, currentHP: totalHP(c), tempHP: 0};
    const lines = [];
    if (after.currentHP !== c.currentHP) lines.push(`Hit Points: ${c.currentHP} to ${after.currentHP}`);
    if ((+c.tempHP || 0) !== (+after.tempHP || 0)) lines.push(`Temporary Hit Points: ${c.tempHP} to 0`);
    Object.entries((c.sheet || {}).pools || {}).forEach(([n, q]) => { const b = poolLeft(c, n), a = poolLeft(after, n); if (a !== b) lines.push(`${n}: ${b} to ${a} of ${q.max}`); });
    (((c.sheet || {}).slotMax) || []).forEach((n, i) => { const b = slotsLeft(c, i + 1), a = slotsLeft(after, i + 1); if (n > 0 && a !== b) lines.push(`Level ${i + 1} spell slots: ${b} to ${a} of ${n}`); });
    buildActions(c).forEach(a => { if (a.usesMax && !a.pool) { const b = usesLeft(c, a), x = usesLeft(after, a); if (x !== b) lines.push(`${a.name}: ${b} to ${x} of ${a.usesMax}`); } });
    setCombatants(prev => prev.map(x => x.id === id ? {...restoreUses(x, longRest), ...(longRest ? {currentHP: totalHP(x), tempHP: 0} : {})} : x));
    setLog(prev => [...prev, stamp({type:'heal', html:`<strong>${esc(c.name)}</strong> finishes a <span class="log-result">${longRest ? 'Long Rest' : 'Short Rest'}</span>${lines.length ? `<div class="log-detail">${lines.map(esc).join(' · ')}</div>` : ''}`})]);
    setRestSummary({name: c.name, kind, lines});
  };
  const advanceTime = (seconds, label, rest) => { // rest: 'short' or 'long' when the time passes as a rest
    if (!isDM || !(seconds > 0)) return;
    const longRest = rest === 'long';
    const t = passTime(combatants, seconds, longRest);
    // A rest gives back the uses of features that recharge on it
    const restore = c0 => {
      if (!rest) return c0;
      return restoreUses(c0, longRest);
    };
    setCombatants(prev => reorder(passTime(prev, seconds, longRest).list.map(restore)));
    setLog(prev => [...prev, stamp({type:'round', text: label}), ...endedEntries(t.ended)]);
  };
  const advanceCustom = () => {
    const n = parseFloat(lapse.n);
    const secs = Math.min(MAX_SECONDS, Math.round(n * (UNIT_SECONDS[lapse.unit] || 60)));
    if (!(secs > 0)) return;
    advanceTime(secs, `${timeText(secs)} pass`);
  };
  // Ending combat: the automatic things are done, a summary is kept for everyone, then monsters, the turn order and the log are cleared.
  const endEncounter = () => {
    if (!isDM) return;
    if (!window.confirm('End combat? Monsters, the turn order and the combat log are cleared. Players and their active effects stay. Everyone gets the end of combat panel.')) return;
    const gone = combatants.filter(c => c.type === 'monster');
    const stableNames = [], ammoRows = [];
    const spent = (c) => { // spell slots and limited uses spent during this fight
      const st = c.fightStart || {}, out = [];
      Object.keys(c.slotsUsed || {}).forEach(l => { const n = (+c.slotsUsed[l] || 0) - (+((st.slotsUsed || {})[l]) || 0); if (n > 0) out.push(`${n} Level ${l} slot${n > 1 ? 's' : ''}`); });
      Object.keys(c.poolUsed || {}).forEach(k => { const n = (+c.poolUsed[k] || 0) - (+((st.poolUsed || {})[k]) || 0); if (n > 0) out.push(`${n} ${k}`); });
      Object.keys(c.used || {}).forEach(k => { const n = (+c.used[k] || 0) - (+((st.used || {})[k]) || 0); const a = (c.sheetActions || c.actions || []).find(x => x.id === k); if (n > 0) out.push(`${n} × ${a ? a.name : 'a feature'}`); });
      return out.join(', ');
    };
    const rows = combatants.filter(c => !c.pending).map(c => ({id: c.id, name: c.name, monster: c.type === 'monster', dealt: +((c.fight || {}).dealt) || 0, taken: +((c.fight || {}).taken) || 0, spent: spent(c)}));
    const kept = combatants.filter(c => c.type !== 'monster').map(c => {
      let out = {...c, turn: {}};
      if (c.currentHP <= 0 && !(c.effects || []).some(e => e.name === 'Stable')) { stableNames.push(c.name); out = {...out, effects: [...(out.effects || []), {id: newId(), name: 'Stable', by: myId, byName: 'DM', note: 'At 0 Hit Points and no longer making Death Saving Throws.'}]}; }
      if ((ammoOn || c.ammoOn) && c.ammo) { const rec = {}; const am = {...c.ammo};
        Object.keys(am).forEach(k => { const sp = +am[k].spent || 0; if (sp > 0) { const got = Math.floor(sp / 2); am[k] = {left: (+am[k].left || 0) + got, spent: 0}; rec[k] = {spent: sp, got, half: got}; ammoRows.push({name: c.name, kind: k, spent: sp, got}); } });
        if (Object.keys(rec).length) out = {...out, ammo: am, recovered: rec}; }
      return out;
    });
    const pool = gone.map(c => { const cr = ((/CR ([\d/]+)/.exec(c.sub || '') || [])[1]) || ''; return {name: c.name, cr, xp: XP_BY_CR[cr] || 0, dead: c.currentHP <= 0}; });
    const sum = plain({at: Date.now(), rounds: round, rows, stable: stableNames, ammo: ammoRows, pool});
    setXpPick({off: {}, extra: ''});
    const entries = [];
    if (stableNames.length) entries.push(stamp({type:'heal', html:`<strong>Combat ends.</strong> ${stableNames.map(esc).join(', ')} ${stableNames.length > 1 ? 'are' : 'is'} Stable.`}));
    ammoRows.forEach(r => entries.push(stamp({type:'roll', html:`<strong>${esc(r.name)}</strong> recovers ${r.got} ${esc(r.kind)}<div class="log-detail">Half of the ${r.spent} used, rounded down.</div>`})));
    if (room && db) {
      const updates = {log: null, prompts: null, meta: {...metaOf(), round: 1, combatStarted: false, activeId: '', ended: sum}};
      gone.forEach(c => { updates['combatants/' + c.id] = null; });
      db.ref('rooms/' + room).update(updates);
    }
    setEnded(sum);
    setCombatants(kept);
    setPrompts([]);
    setLog(entries);
    setCombatStarted(false);
    setRound(1);
    setActiveId('');
    setTargetIds([]);
    setSelectedAction(null);
    setAdvantage(0);
    if (!room) { setEndTab('xp'); setShowEnd(true); }
  };
  // After the fight a player can change how much ammunition came back. Anything other than half is written in red.
  const changeRecovered = (c, kind, n) => {
    const r = (c.recovered || {})[kind]; if (!r) return;
    const got = Math.max(0, Math.min(+r.spent || 0, parseInt(n, 10) || 0)); if (got === r.got) return;
    setCombatants(prev => prev.map(x => x.id !== c.id ? x : {...x, ammo: {...(x.ammo || {}), [kind]: {...ammoOf(x, kind), left: Math.max(0, ammoOf(x, kind).left + got - r.got)}}, recovered: {...x.recovered, [kind]: {...r, got}}}));
    setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(c.name)}</strong> changes the ${esc(kind)} recovered from ${r.got} to ${got}<div class="log-detail" style="color:${got === r.half ? 'inherit' : 'var(--danger)'}">${got === r.half ? 'Back to half of what was used.' : `Half of the ${r.spent} used would be ${r.half}.`}</div>`})]);
  };
  // The DM hands out Experience Points: the pool chosen in the panel, shared equally between the player characters.
  const giveXP = (total, names) => {
    const pcs = combatants.filter(c => c.type !== 'monster' && !c.pending && (c.main || c.owner)); if (!isDM || !pcs.length || !(total > 0)) return;
    const each = Math.floor(total / pcs.length);
    setCombatants(prev => prev.map(c => pcs.some(x => x.id === c.id) ? {...c, xp: (+c.xp || 0) + each} : c));
    setLog(prev => [...prev, stamp({type:'heal', forAll: true, html:`<strong>The DM awards ${each} Experience Points each</strong> to ${pcs.map(c => esc(c.name)).join(', ')}<div class="log-detail">${total} in total${names.length ? ` for ${names.map(esc).join(', ')}` : ''}, shared between ${pcs.length} player character${pcs.length === 1 ? '' : 's'}.</div>`})]);
    setEnded(prev => prev ? {...prev, given: {total, each, players: pcs.length, at: Date.now()}} : prev);
  };
  const starText = () => stars.map(x => String(x.html || '').replace(/<br\s*\/?>/gi, ' · ').replace(/<\/div>/gi, ' ').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\s+/g, ' ').trim()).join('\n');
  const saveStarsToNotes = () => {
    if (!stars.length) return;
    const d = new Date(), z = n => String(n).padStart(2, '0'), date = `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
    const note = {id: newId().slice(0, 18), title: `Combat, ${date}`, date, text: starText()};
    const ch = readStoredCharacter(playerCode);
    if (!ch) { const done = () => window.alert('No character sheet is saved on this computer for your player code, so the starred entries were copied instead. Paste them wherever you keep notes.'); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(note.text).then(done, () => window.prompt('Copy your starred entries:', note.text)); else window.prompt('Copy your starred entries:', note.text); return; }
    const j = ch.journal && typeof ch.journal === 'object' ? ch.journal : {};
    lsSet(charKey(playerCode), JSON.stringify({...ch, journal: {...j, sessions: [note, ...(Array.isArray(j.sessions) ? j.sessions : [])]}}));
    lsSet('hba-note', JSON.stringify({code: playerCode, note, at: Date.now()})); // an open Character Builder adds it to its Journal too
    window.alert(`Saved to Session Notes in ${ch.name || 'your character'}'s Journal as "${note.title}".`);
  };
  const deleteSession = () => {
    if (!isDM || !room || !db) return;
    if (!window.confirm(`Delete session ${room}? The shared room is erased for everyone and the code stops working. Character sheets saved on each player's own computer are not touched.`)) return;
    const code = room;
    db.ref('rooms/' + code).remove()
      .then(() => { forgetRoom(code); saveSessions(mySessions().filter(x => x.code !== code)); setSessions(mySessions()); })
      .catch(err => { console.error('Could not delete session', err); alert('Could not delete the session. Check your connection and try again.'); });

              <>
                {tabs.length > 1 && (

                  <div className="who">🎲 {viewed.name}{canAct ? "'s Turn" : ''}</div>

                  <div className="stats-row">

                            <button onClick={()=>rollTest(viewed,'check',ab)} title={`Roll a ${ab} check`}>Check</button>
                            <button onClick={()=>rollTest(viewed,'save',ab)} title={`Roll a ${ab} saving throw`}>Save</button>

                  {combatStarted && !canAct && active && <div className="turn-note">Waiting: it is {active.name}'s turn</div>}
                  {combatStarted && canAct && !isDM && <div className="turn-note yours">It is your turn</div>}

                  {needsTarget && canControl(viewed) && !isArmed && <button className="btn btn-ghost btn-sm" data-testid="retarget" onClick={() => { setTargeting(true); setLeftTab('order'); setPane('order'); }}>{targetIds.length || freeT != null ? 'Change target' : 'Choose a target'}</button>}

                    {cannotWhy && <span className="do-why" data-testid="do-why">{cannotWhy}</span>}
                    {/is not in hand\.$/.test(cannotWhy || '') && viewed && canControl(viewed) && <button className="btn btn-ghost btn-sm" data-testid="hold-it" onClick={() => holdItem(viewed, selAction.name.replace(/ \(two hands\)$/, ''))}>Hold it</button>}

                      <option value="">Choose</option>
                      {ch.options.map(o => <option key={o} value={o}>{o}</option>)}

                {selAction && selAction.gp > 0 && viewed && viewed.sheet && compMode !== 'full' && (
                  <div className="manual-roll" data-testid="gold-box">

                  </div>

                {selAction && selAction.zone && <div className="buff-note" data-testid="zone-line" style={{marginTop:8}}>Area in play: {zoneText(selAction)}. Until there is a map, apply it to a creature by choosing that creature as the target{selAction.again ? ' and using it again from Active' : ''}.</div>}
                {/* Advantage */}
                {selAction && selAction.type==='attack' && (
                  <div className="manual-roll">
                    <span className="label">Roll modifier</span>

                      <div className="adv-btn" onClick={()=>setAdvantage(0)} style={{border:advantage===0?'1px solid var(--brass)':'',color:advantage===0?'var(--parchment)':''}}>Normal</div>
                      <div className={`adv-btn ${advantage===-1?'active-dis':''}`} onClick={()=>setAdvantage(advantage===-1?0:-1)}>Disadvantage</div>
                    </div>
                  </div>
                )}
                {selAction && blockReason(viewed, selAction) && <div className="buff-note" data-testid="block-reason" style={{marginTop:8, color:'#ff8a80', borderColor:'#a04040'}}>{blockReason(viewed, selAction)}</div>}
                {selAction && selAction.spell && compMode && selAction.comp && <div className="buff-note" data-testid="comp-line" style={{marginTop:8}}>Components: {[selAction.comp.includes('V') && 'Verbal', selAction.comp.includes('S') && 'Somatic', selAction.comp.includes('M') && `Material (${selAction.mat || 'see the spell'})`].filter(Boolean).join(', ')}</div>}
                {selAction && selAction.desc && <div className="buff-note" style={{marginTop:8}}>{selAction.desc}</div>}

                </div>

                <div className="section-title">⚡ Actions</div>

                      <div className="a-name">{a.name}{a.pool ? ` (${poolLeft(viewed, a.pool)} ${a.pool} left)` : a.usesMax ? ` (${usesLeft(viewed, a)}/${a.usesMax} left)` : ''}</div>

                      <span className={`a-tag tag-${a.tag}`}>{a.tag}</span>
                    </div>

                    <button className="btn btn-ghost btn-sm" title="Gives back what this character regains on a Short Rest" onClick={()=>restCharacter(viewed.id, 'short')}>{viewed.name}: Short Rest</button>
                    <button className="btn btn-ghost btn-sm" title="Gives back Hit Points, spell slots and every feature use" onClick={()=>restCharacter(viewed.id, 'long')}>{viewed.name}: Long Rest</button>
                  </div>
                )}
                {/* Resources and standing features */}
                {viewed && Object.keys((viewed.sheet || {}).pools || {}).length > 0 && (
                  <div className="slot-row" data-testid="pool-row">
                    <span className="opt-label">Resources</span>
                    {Object.entries(viewed.sheet.pools).map(([n, q]) => <span key={n} className={`slot-chip ${poolLeft(viewed, n) ? '' : 'spent'}`}>{n}: {poolLeft(viewed, n)}/{q.max}
                      {canControl(viewed) && <> <button className="chip-btn" aria-label={`Spend one ${n}`} title="Spend one" onClick={()=>adjustPool(viewed.id, n, -1)}>−</button><button className="chip-btn" aria-label={`Give back one ${n}`} title="Give one back (a use that was not spent)" onClick={()=>adjustPool(viewed.id, n, 1)}>+</button></>}</span>)}
                  </div>
                )}
                {viewed && viewed.passives && (viewed.passives.attacks || viewed.passives.criticalOn || viewed.passives.sneakAttackDice || viewed.passives.initiativeAdvantage) && (
                  <div className="buff-note" style={{margin:'4px 0'}} data-testid="passive-row">
                    {[viewed.passives.attacks && `${viewed.passives.attacks} attacks with the Attack action`, viewed.passives.criticalOn && `Critical Hit on ${viewed.passives.criticalOn}-20`,
                      viewed.passives.sneakAttackDice && `Sneak Attack ${viewed.passives.sneakAttackDice}d6`, viewed.passives.initiativeAdvantage && 'Advantage on Initiative'].filter(Boolean).join(' · ')}
                  </div>
                )}
                {/* the Component Pouch (what is in hand is on the sheet itself) */}

                  <div className="slot-row" data-testid="pouch-row" style={{display:'block'}}>
                    <button className="btn btn-ghost btn-sm" data-testid="pouch-btn" onClick={()=>setShowPouch(v => !v)}>{showPouch ? '▾' : '▸'} Components: {hasPouch(viewed) ? 'Component Pouch' : focusItems(viewed).length ? focusItems(viewed)[0] : 'no pouch or focus'}</button>

                      <div className="buff-note" data-testid="pouch-list" style={{marginTop:6}}>
                        {compMode === 'simple'
                          ? <div>Simplified rule: a Component Pouch or a Spellcasting Focus covers every Material component.</div>
                          : <div>A Component Pouch or Spellcasting Focus covers every Material component that has no cost. A component with a cost has to be among your things: tick the ones you have.</div>}
                        {viewed.sheetActions.filter(a => a.spell && (a.comp || '').includes('M')).map(a => {
                          const need = compMode === 'full' && a.matCost, ok = need ? compOwned(viewed, a) : (hasPouch(viewed) || focusItems(viewed).length > 0);

                            </div>);
                        })}
                      </div>
                    )}
                  </div>

                      {canControl(viewed) && <> <button className="chip-btn" aria-label={`Spend a Level ${i + 1} slot`} title="Spend one" onClick={()=>adjustSlot(viewed.id, i + 1, -1)}>−</button><button className="chip-btn" aria-label={`Give back a Level ${i + 1} slot`} title="Give one back (a slot that was not spent)" onClick={()=>adjustSlot(viewed.id, i + 1, 1)}>+</button></>}</span> : null)}

                {isDM && <>
                <div className="section-title">✨ Pass a Buff or Effect</div>
                <div className="buff-row">
                  <select aria-label="Buff or effect" value={buffName} onChange={e=>{setBuffName(e.target.value); setBuffOpt(''); setBuffTime(null);}}>

                  </select>
                  <select aria-label="Who receives it" value={buffTarget || viewed.id} onChange={e=>setBuffTarget(e.target.value)}>
                    {inPlay.map(c=><option key={c.id} value={c.id}>{c.name}{c.id===viewed.id?' (self)':''}</option>)}
                  </select>
                </div>
                {buffName === '__custom' ? (
                  <div className="custom-effect">

                  </div>
                ) : (<>
                  {buffPreset && buffPreset.opt && (

                      {buffPreset.opt.number

                        : <select aria-label={buffPreset.opt.label} value={optValue} onChange={e=>setBuffOpt(e.target.value)}>{buffPreset.opt.choices.map(x=><option key={x} value={x}>{x}</option>)}</select>}
                    </div>
                  )}
                  <div className="buff-note">{buffPreset && [BUFF_SUMMARY[buffPreset.name] || describeEffect(buffPreset), buffPreset.note && `Left to the table: ${buffPreset.note}`].filter(Boolean).join('. ')}</div>
                </>)}

                <button key={s} className={`die-btn ${n ? 'has' : ''}`} aria-label={`d${s}`} data-count={n} title="Click to add one. Right-click to take one away."

      {renderStd()}
      {dmAsk && (

            </div>
          </div>

      {showEnd && (() => {
        const mine = combatants.filter(c => !c.pending && c.type !== 'monster' && canControl(c));
        const arr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.values(x) : []); // empty lists do not survive the trip through the session
        const e0 = ended || {}, sum = {rounds: +e0.rounds || 0, rows: arr(e0.rows), stable: arr(e0.stable), ammo: arr(e0.ammo), pool: arr(e0.pool), given: e0.given || null};
        const pcs = combatants.filter(c => c.type !== 'monster' && !c.pending && (c.main || c.owner));
        const inPool = sum.pool.filter((m, i) => !xpPick.off[i]), extra = Math.max(0, parseInt(xpPick.extra, 10) || 0), xpTotal = inPool.reduce((t, m) => t + m.xp, 0) + extra, xpEach = Math.floor(xpTotal / Math.max(1, pcs.length));
        const running = combatants.flatMap(c => (c.effects || []).filter(e => +e.left > 0).map(e => `${e.name} on ${c.name}, ${timeText(e.left)} left`));
        return (
        <div className="modal-overlay" onClick={() => setShowEnd(false)}>
          <div className="modal" data-testid="end-panel" onClick={e => e.stopPropagation()} style={{maxWidth: 640}}>

            <div className="modal-body">
              <div className="end-tabs" role="tablist">{[...(isDM ? [['xp', 'Experience']] : []), ['do', 'What you can do'], ['summary', 'Summary'], ['starred', `Starred log (${stars.length})`]].map(([k, l]) => <button key={k} role="tab" data-testid={`end-tab-${k}`} className={endTab === k ? 'on' : ''} onClick={() => setEndTab(k)}>{l}</button>)}</div>
              {endTab === 'xp' && isDM && <div data-testid="end-xp">
                <div className="buff-note">Every creature in the fight is in the pool. Untick any you do not want counted, and add more if you like.</div>
                {sum.pool.length === 0 && <div className="empty-state">No creatures were in this fight.</div>}
                <table className="end-table"><tbody>{sum.pool.map((m, i) => (
                  <tr key={i}><td><label className="rule-label" style={{margin: 0}}><input type="checkbox" data-testid="xp-include" checked={!xpPick.off[i]} onChange={e => setXpPick({...xpPick, off: {...xpPick.off, [i]: !e.target.checked}})}/> {m.name}</label></td>

                <div className="log-ov"><span>Extra Experience Points</span><input type="number" min="0" aria-label="Extra Experience Points" data-testid="xp-extra" value={xpPick.extra} onChange={e => setXpPick({...xpPick, extra: e.target.value})} style={{width: 90}}/></div>

                  <div key={c.id} className="pp-entry" data-testid="end-char" style={{marginBottom: 10}}>
                    <div><strong>{c.name}</strong> · {c.currentHP} of {totalHP(c)} Hit Points{+c.xp > 0 ? ` · ${c.xp} Experience Points earned in this session` : ''}</div>
                    {c.conc && <div className="log-ov"><span>End Concentration on {c.conc.name}?</span><button className="btn btn-ghost btn-sm" data-testid="end-conc" onClick={() => endConcentration(c.id, 'Ended after the fight.')}>End it</button></div>}
                    {(c.conditions || []).length > 0 && <div className="log-ov"><span>Conditions (click to remove):</span>{c.conditions.map(k => <button key={k} className="btn btn-ghost btn-sm" data-testid="end-cond" onClick={() => removeCondition(c.id, k)}>{k} ×</button>)}
                      <button className="btn btn-ghost btn-sm" data-testid="end-cond-all" onClick={() => c.conditions.forEach(k => removeCondition(c.id, k))}>Remove all conditions</button></div>}
                    {Object.keys(c.recovered || {}).map(k => <div key={k} className="log-ov"><span>{k} recovered, of {c.recovered[k].spent} used:</span>
                      <input type="number" min="0" max={c.recovered[k].spent} aria-label={`${k} recovered`} data-testid="end-ammo" defaultValue={c.recovered[k].got} onBlur={e => changeRecovered(c, k, e.target.value)} onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} style={{width: 60}}/>
                      <span className="pp-muted">Half is {c.recovered[k].half}. A different number is noted in the log.</span></div>)}

                  </div>))}

              </div>}
