      let {total:ht, parts} = parseDamage(maxed);
      if (feat.discipleOfLife && castLvl) { ht += 2 + castLvl; parts = [...parts, `Disciple of Life +${2 + castLvl}`]; }
      if (healTarget !== active.id && castLvl) healedOthers = true;
      updateHP(healTarget, ht, true);
      entries.push({
        type:'heal',
        html:`<strong>${actorName}</strong> heals <strong>${healTargetName}</strong><br/>
              <span class="log-result">💚 ${esc(action.name)}</span><br/>
              <span class="log-heal-val">+${ht} HP</span>
              <div class="log-dice">${parts.join(' + ')}</div>${applyOutcome(action.type==='selfheal' ? active : (target || active), action.onUse, action, active)}`
      });
    }

    else if (action.type === 'info') {
      entries.push({
        type:'roll',
        html:`<strong>${actorName}</strong>${target ? ` → <strong>${targetName}</strong>` : ''}<br/>
              <span class="log-result">${esc(action.name)}</span>
              <div class="log-detail">${esc(action.desc || '')}</div>`
      });
    }

    });
    // Blessed Healer: a healing spell cast with a slot on someone else also heals the caster
    if (healedOthers && (active.passives || {}).blessedHealer && castLvl) {
      updateHP(active.id, 2 + castLvl, true);
      entries.push({type:'heal', html:`<strong>${actorName}</strong> regains <span class="log-heal-val">+${2 + castLvl} HP</span><div class="log-detail">Blessed Healer</div>`});
    }
    setLog(prev=>[...prev,...entries.map(stamp)]);
    setSelectedAction(null);
    setAdvantage(0);
  };

  // Ability checks, skill checks and saving throws rolled straight from the sheet.
  const rollTest = (c, kind, ability, skill) => {
    const score = (c.scores || {})[ability] ?? 10;
    const base = kind === 'save' ? ((c.saves || {})[ability] ?? mod(score))
      : (skill && c.sheet && c.sheet.skills && Number.isFinite(+c.sheet.skills[skill])) ? +c.sheet.skills[skill] : mod(score);
    const t = d20Test(c, kind, {ability, skill});
    const label = kind === 'save' ? `${ability} saving throw` : skill ? `${ability} (${skill}) check` : `${ability} check`;
    let body;
    if (t.autoFail) body = `<strong style="color:var(--danger)">Fails automatically (${esc(t.autoFail)})</strong>`;
    else {
      const roll = roll20(testMode(t));
      body = `<span class="log-result">🎲 ${roll.total + base + t.bonus}</span><div class="log-dice">${roll.rolls.join('/')} ${signed(base)}${t.bonusText ? ` (${t.bonusText})` : ''}</div>${modeText(t) ? `<div class="log-detail">${modeText(t)}</div>` : ''}`;
    }
    setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(c.name)}</strong> · ${esc(label)}<br/>${body}`})]);
  };

  const updateHP = (id, delta, isHeal=false) => {
    setCombatants(prev => prev.map(c => {
      if (c.id !== id) return c;
      if (isHeal) return {...c, currentHP: Math.min(totalHP(c), c.currentHP + delta)};
      const dmg = Math.max(0, -delta), temp = +c.tempHP || 0, soak = Math.min(temp, dmg); // Temporary Hit Points are lost first
      return {...c, tempHP: temp - soak, currentHP: Math.max(0, c.currentHP - (dmg - soak))};
    }));
  };
  const setTempHP = (id, n) => setCombatants(prev => prev.map(c => c.id === id ? {...c, tempHP: Math.max(0, n)} : c));

  const addCondition = (id, cond, info) => {
    const tgt = combatants.find(c => c.id === id);
    const why = tgt ? immuneTo(tgt, cond) : '';
    if (why) { setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(tgt.name)}</strong> is immune to <span class="log-result">${esc(cond)}</span><div class="log-detail">${esc(why)}</div>`})]); return; }
    setCombatants(prev => prev.map(c => {
      if (c.id !== id || c.conditions.includes(cond)) return c;
      const all = {...(c.condInfo || {})}; delete all[cond];
      if (info && Object.keys(info).length) all[cond] = info;
      return {...c, conditions:[...c.conditions, cond], condInfo: all};
    }));
  };

  const removeCondition = (id, cond) => {
    setCombatants(prev => prev.map(c => {
      if (c.id !== id) return c;
      return dropCondition(c, cond);
    }));
  };

  // ── BUFF PASSING ────────────────────────────────────────────────────────────
  const whoAmI = () => (viewed && canControl(viewed)) ? viewed.name : (isDM ? 'DM' : 'A player');
  const reorder = list => combatStarted ? byInit(list) : list;
  const buffPresetNow = BUFFS.find(b => b.name === buffName);
  const defaultOpt = (b) => {
    if (!b || !b.opt) return '';
    if (b.opt.key === 'inspire') { const l = viewed && viewed.charClass === 'Bard' ? viewed.level : 1; return l >= 15 ? 'd12' : l >= 10 ? 'd10' : l >= 5 ? 'd8' : 'd6'; }
    if (b.opt.key === 'tempEachTurn') { const sp = viewed && viewed.sheet && viewed.sheet.spell; return String(Math.max(1, sp ? sp.attack - (viewed.pb || 2) : 3)); }
    return b.opt.choices[0];
  };
  const optValue = buffOpt !== '' ? buffOpt : defaultOpt(buffPresetNow);
  const timeNow = buffTime || defaultTime(buffName);
  const passBuff = () => {
    const to = inPlay.find(c => c.id === (buffTarget || (viewed && viewed.id)));
    if (!to) return;
    const custom = buffName === '__custom';
    const preset = buffPresetNow;
    const name = custom ? buffCustom.name.trim().slice(0, 40) : buffName;
    if (!name) return;
    const eff = {id: newId(), name, by: myId, byName: whoAmI()};
    if (custom) {
      ['ac','speed','init'].forEach(k => { const n = parseInt(buffCustom[k], 10); if (Number.isFinite(n) && n !== 0) eff[k] = Math.max(-200, Math.min(200, n)); });
      ['atk','save'].forEach(k => { const v = String(buffCustom[k] || '').replace(/\s/g, '').replace(/^\+/, ''); if (v && DMG_RE.test(v.replace(/^-/, ''))) eff[k] = v; });
      const sense = buffCustom.sense.trim().slice(0, 60); if (sense) eff.sense = sense;
      const note = buffCustom.note.trim().slice(0, 200); if (note) eff.note = note;
    } else if (preset) {
      EFFECT_KEYS.forEach(k => { if (preset[k] != null) eff[k] = preset[k]; });
      if (preset.fromCaster && viewed) { eff.src = viewed.id; eff.srcName = viewed.name; }
      if (preset.opt) {
        if (preset.opt.number) eff[preset.opt.key] = Math.max(0, Math.min(99, parseInt(optValue, 10) || 0));
        else if (preset.opt.choices.includes(optValue)) eff[preset.opt.key] = optValue;
        if (preset.opt.key === 'lvl') { const l = +eff.lvl || 1; eff.d20 = -2 * l; eff.speed = -5 * l; }
      }
    }
    const secs = Math.round(parseFloat(timeNow.n) * (UNIT_SECONDS[timeNow.unit] || 60));
    if (Number.isFinite(secs) && secs > 0) eff.left = Math.min(MAX_SECONDS, secs);
    if (timeNow.conc) eff.conc = true;
    const blocked = !custom && name === 'Exhaustion' ? immuneTo(to, 'Exhaustion') : '';
    if (blocked) { setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(to.name)}</strong> is immune to <span class="log-result">Exhaustion</span>`})]); return; }
    setCombatants(prev => reorder(prev.map(c => c.id !== to.id ? c : {
      ...c,
      currentHP: +eff.hpMax > 0 ? c.currentHP + Math.max(0, +eff.hpMax - (+(((c.effects || []).find(e => e.name === name) || {}).hpMax) || 0)) : c.currentHP,
      effects: [...(c.effects || []).filter(e => e.name !== name), eff],
      conditions: eff.immune ? (c.conditions || []).filter(x => x !== eff.immune) : c.conditions,
    })));
    const what = [describeEffect(eff), eff.note, eff.left ? `Lasts ${timeText(eff.left)}${eff.conc ? ' (Concentration)' : ''}` : (eff.conc ? 'Concentration' : '')].filter(Boolean).join('. ');
    setLog(prev => [...prev, stamp({type:'heal', html:`<strong>${esc(whoAmI())}</strong> passes <span class="log-result">${esc(name)}${eff.lvl ? ` ${esc(eff.lvl)}` : ''}</span> to <strong>${esc(to.name)}</strong>${what ? `<div class="log-detail">${esc(what)}</div>` : ''}`})]);
    setBuffCustom(emptyCustom);
    setBuffTime(null);
  };
  const removeEffect = (id, effId) => setCombatants(prev => reorder(prev.map(c => c.id === id ? {...c, effects: (c.effects || []).filter(e => e.id !== effId)} : c)));

  // ── TIME, RESTS AND ENDING AN ENCOUNTER (DM) ────────────────────────────────
  // What a rest gives back to one creature: spell slots, shared pools and each feature's own uses.
  const restoreUses = (c0, longRest) => {
    let c = c0;
    if (c.slotsUsed && (longRest || (c.sheet || {}).pact)) c = {...c, slotsUsed: {}}; // Long Rest, or Pact Magic on a Short Rest
    if (c.poolUsed) { // shared pools: all back on a Long Rest; on a Short Rest the short ones, and one use of some others
      const left = {};
      if (!longRest) Object.keys(c.poolUsed).forEach(k => {
        const q = ((c.sheet || {}).pools || {})[k] || {};
        const n = q.recharge === 'short' ? 0 : Math.max(0, c.poolUsed[k] - (q.shortRegain || 0));
        if (n > 0) left[k] = n;
      });
      c = {...c, poolUsed: left};
    }
    if (c.used) {
      const used = {};
      if (!longRest) buildActions(c).forEach(a => { if (a.recharge !== 'short' && c.used[a.id]) used[a.id] = c.used[a.id]; });
      c = {...c, used};
    }
    return c;
  };
  // A player finishing a rest for their own character: sets what comes back and says what changed.
  const restCharacter = (id, kind) => {
    const c = combatants.find(x => x.id === id);
    if (!c || !canControl(c)) return;
    const longRest = kind === 'long';
    let after = restoreUses(c, longRest);
    if (longRest) after = {...after, currentHP: totalHP(c), tempHP: 0};
    const lines = [];
    if (after.currentHP !== c.currentHP) lines.push(`Hit Points: ${c.currentHP} to ${after.currentHP}`);
    if ((+c.tempHP || 0) !== (+after.tempHP || 0)) lines.push(`Temporary Hit Points: ${c.tempHP} to 0`);
    Object.entries((c.sheet || {}).pools || {}).forEach(([n, q]) => { const b = poolLeft(c, n), a = poolLeft(after, n); if (a !== b) lines.push(`${n}: ${b} to ${a} of ${q.max}`); });
    (((c.sheet || {}).slotMax) || []).forEach((n, i) => { const b = slotsLeft(c, i + 1), a = slotsLeft(after, i + 1); if (n > 0 && a !== b) lines.push(`Level ${i + 1} spell slots: ${b} to ${a} of ${n}`); });
    buildActions(c).forEach(a => { if (a.usesMax && !a.pool) { const b = usesLeft(c, a), x = usesLeft(after, a); if (x !== b) lines.push(`${a.name}: ${b} to ${x} of ${a.usesMax}`); } });
    setCombatants(prev => prev.map(x => x.id === id ? {...restoreUses(x, longRest), ...(longRest ? {currentHP: totalHP(x), tempHP: 0} : {})} : x));
    setLog(prev => [...prev, stamp({type:'heal', html:`<strong>${esc(c.name)}</strong> finishes a <span class="log-result">${longRest ? 'Long Rest' : 'Short Rest'}</span>${lines.length ? `<div class="log-detail">${lines.map(esc).join(' · ')}</div>` : ''}`})]);
    setRestSummary({name: c.name, kind, lines});
  };
  const advanceTime = (seconds, label, rest) => { // rest: 'short' or 'long' when the time passes as a rest
    if (!isDM || !(seconds > 0)) return;
    const longRest = rest === 'long';
    const t = passTime(combatants, seconds, longRest);
    // A rest gives back the uses of features that recharge on it
    const restore = c0 => {
      if (!rest) return c0;
      return restoreUses(c0, longRest);
    };
    setCombatants(prev => reorder(passTime(prev, seconds, longRest).list.map(restore)));
    setLog(prev => [...prev, stamp({type:'round', text: label}), ...endedEntries(t.ended)]);
  };
  const advanceCustom = () => {
    const n = parseFloat(lapse.n);
    const secs = Math.min(MAX_SECONDS, Math.round(n * (UNIT_SECONDS[lapse.unit] || 60)));
    if (!(secs > 0)) return;
    advanceTime(secs, `${timeText(secs)} pass`);
  };
  // Ending the encounter clears the monsters, the turn order and the log. Players stay, with their effects.
  const endEncounter = () => {
    if (!isDM) return;
    if (!window.confirm('End this encounter? Monsters, the turn order and the combat log are cleared. Players and their active effects stay.')) return;
    const gone = combatants.filter(c => c.type === 'monster');
    if (room && db) {
      const updates = {log: null, prompts: null, meta: {...metaOf(), round: 1, combatStarted: false, activeId: ''}};
      gone.forEach(c => { updates['combatants/' + c.id] = null; });
      db.ref('rooms/' + room).update(updates);
    }
    setCombatants(prev => prev.filter(c => c.type !== 'monster'));
    setPrompts([]);
    setLog([]);
    setCombatStarted(false);
    setRound(1);
    setActiveId('');
    setTargetIds([]);
    setSelectedAction(null);
    setAdvantage(0);
  };
  const deleteSession = () => {
    if (!isDM || !room || !db) return;
    if (!window.confirm(`Delete session ${room}? The shared room is erased for everyone and the code stops working. Character sheets saved on each player's own computer are not touched.`)) return;
    const code = room;
    db.ref('rooms/' + code).remove()
      .then(() => forgetRoom(code))
      .catch(err => { console.error('Could not delete session', err); alert('Could not delete the session. Check your connection and try again.'); });
  };

  // What the DM has set for the next condition: how long it lasts and whether it has a repeat save.
  const condDc = condOpts.dc !== '' ? condOpts.dc : String((viewed && viewed.sheet && viewed.sheet.spell && viewed.sheet.spell.dc) || 13);
  const applyCondition = (tgt, cond) => {
    const info = {};
    const secs = Math.round(parseFloat(condOpts.n) * (UNIT_SECONDS[condOpts.unit] || 60));
    if (Number.isFinite(secs) && secs > 0) info.left = Math.min(MAX_SECONDS, secs);
    if (condOpts.when) {
      const dc = Math.max(1, Math.min(40, parseInt(condDc, 10) || 0));
      if (dc && ABILITIES.includes(condOpts.abil)) {
        info.dc = dc; info.abil = condOpts.abil; info.when = condOpts.when.replace('src-', '');
        if (condOpts.when.startsWith('src-') && viewed && viewed.id !== tgt.id) info.turnOf = viewed.id;
      }
    }
    if (viewed && viewed.id !== tgt.id) info.src = viewed.name;
    addCondition(tgt.id, cond, info);
  };
  const activeConditions = inPlay.flatMap(c => (c.conditions || []).map(cond => ({c, cond, info: condInfoOf(c, cond)})));

  // ── DICE ROLLER ─────────────────────────────────────────────────────────────
  // The pool is one line of text, such as 2d6+1d8+3. Clicking a die adds one to it, right-clicking takes one away, and it can be typed too.
  const normExpr = (raw) => String(raw || '').replace(/\s/g, '').toLowerCase().replace(/^d/, '1d').replace(/([+-])d/g, '$11d');
  const poolOf = (raw) => { // {dice: {6: 2, 8: 1}, mod: 3}
    const dice = {}; let mod = 0;
    (normExpr(raw).match(/[+-]?[^+-]+/g) || []).forEach(t => {
      const sign = t[0] === '-' ? -1 : 1, body = t.replace(/^[+-]/, ''), m = /^(\d+)d(\d+)$/.exec(body);
      if (m) dice[+m[2]] = (dice[+m[2]] || 0) + sign * +m[1]; else if (/^\d+$/.test(body)) mod += sign * +body;
    });
    return {dice, mod};
  };
  const exprOf = ({dice, mod}) => { const d = Object.keys(dice).map(Number).filter(s => dice[s] > 0).sort((a, b) => a - b).map(s => `${dice[s]}d${s}`).join('+'); return d + (mod ? (mod > 0 ? (d ? '+' : '') : '-') + Math.abs(mod) : ''); };
  const bumpDie = (sides, by) => { const pl = poolOf(diceExpr); pl.dice[sides] = Math.max(0, Math.min(99, (pl.dice[sides] || 0) + by)); setDiceExpr(exprOf(pl)); };
  const rollOnce = (expr, reroll) => { // every die shown; a 1 is rerolled once when asked
    let total = 0; const parts = [];
    (expr.match(/[+-]?[^+-]+/g) || []).forEach(t => {
      const sign = t[0] === '-' ? -1 : 1, body = t.replace(/^[+-]/, ''), m = /^(\d+)d(\d+)$/.exec(body);
      if (!m) { total += sign * +body; parts.push((sign < 0 ? '-' : '') + body); return; }
      const shown = [];
      for (let i = 0; i < Math.min(100, +m[1]); i++) { let r = rollD(Math.max(1, +m[2])); if (reroll && r === 1 && +m[2] > 1) { const r2 = rollD(+m[2]); shown.push(`1→${r2}`); r = r2; } else shown.push(String(r)); total += sign * r; }
      parts.push(`${sign < 0 ? '-' : ''}${m[1]}d${m[2]}=[${shown.join(',')}]`);
    });
    return {total, parts};
  };
  const rollExpr = (exprRaw) => {
    const expr = normExpr(exprRaw);
    if (!DMG_RE.test(expr)) return;
    const a = rollOnce(expr, diceOpts.reroll), b = diceOpts.twice ? rollOnce(expr, diceOpts.reroll) : null;
    const keepB = b && (diceOpts.twice === 'high' ? b.total > a.total : b.total < a.total), kept = keepB ? b : a;
    const notes = [diceOpts.reroll ? 'Rerolled each 1 once' : '', b ? `Rolled twice, kept the ${diceOpts.twice === 'high' ? 'higher' : 'lower'}: ${a.total} and ${b.total}` : ''].filter(Boolean);
    setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(whoAmI())}</strong> rolls ${esc(expr)}<br/><span class="log-result">🎲 ${kept.total}</span><div class="log-dice">${kept.parts.join(' + ')}</div>${b ? `<div class="log-dice">Other roll: ${(keepB ? a : b).parts.join(' + ')}</div>` : ''}${notes.length ? `<div class="log-dice">${notes.join('. ')}.</div>` : ''}`})]);
  };

  const hpColor = (cur, max) => {
    const pct = cur/max;
    if (pct > 0.5) return '#4CAF50';
    if (pct > 0.25) return '#FF9800';
    return '#E53935';
  };

  // ── LIVE SYNC ───────────────────────────────────────────────────────────────
  const metaOf = () => ({round, combatStarted, activeId: activeId || '', dm: dmId || '', approval: !!approval, handsOn: !!handsOn, compMode: compMode || ''});
  const setHash = h => { try { (window.parent || window).history.replaceState(null, '', h); } catch (e) {} };
  const enterSession = code => { promptedRef.current = false; setRemoteSigs(null); setSyncMsg(''); setRoom(code); setRoomInput(''); setHash('#room=' + code); };

  const createSession = async () => {
    if (!db) return;
    const code = makeCode();
    setSyncStatus('connecting');
    try {
      const updates = {meta: {...metaOf(), dm: myId, approval: false}, touched: firebase.database.ServerValue.TIMESTAMP};
      combatants.forEach((c, i) => { updates['combatants/' + c.id] = plain({...c, seq: i}); });
      log.forEach(e => { updates['log/' + e.id] = plain(e); });
      await db.ref('rooms/' + code).update(updates);
      rememberRoom(code);
      enterSession(code);
    } catch (e) { console.error('Could not create session', e); setSyncStatus('error'); setSyncMsg('Could not connect'); }
  };

  const joinSession = async (codeRaw) => {
    const code = cleanCode(codeRaw);
    if (!code || !db) return;
    setSyncStatus('connecting');
    try {
      const existing = (await db.ref('rooms/' + code + '/meta').get()).val();
      if (!existing) { setSyncStatus('error'); setSyncMsg('No session with that code'); return; }
      enterSession(code);
    } catch (e) { console.error('Could not join session', e); setSyncStatus('error'); setSyncMsg('Could not connect'); }
  };

  const leaveSession = () => {
    setRoom(null); setRemoteSigs(null); setSyncStatus('offline'); setSyncMsg(''); setDmId(''); setApproval(false);
    setHash('#');
  };

  const inviteLink = () => {
    let base = window.location.href;
    try { base = (window.parent || window).location.href; } catch (e) {}
    return base.split('#')[0] + '#room=' + room;
  };
  const copyInvite = () => {
    const link = inviteLink();
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => window.prompt('Copy this invite link:', link));
    else window.prompt('Copy this invite link:', link);
  };

  const changePlayerCode = () => {
    const v = cleanCode(window.prompt('Enter your player code. Your sheet saved on this computer under that code will be used.', playerCode));
    if (!v || v === playerCode) return;
    lsSet(CODE_KEY, v);
    setPlayerCode(v);
  };

  // Session → this screen
  useEffect(() => {
    if (!room || !db) return;
    const ref = db.ref('rooms/' + room);
    const onValue = snap => {
      const v = snap.val() || {};
      if (!v.meta) { // the DM deleted this session, or it was cleaned up after 90 days unused
        leaveSession(); setSyncStatus('error'); setSyncMsg('That session was deleted');
        return;
      }
      const arr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.values(x) : []);
      const list = Object.values(v.combatants || {})
        .filter(c => c && c.id && c.name != null)
        .map(c => ({...c, name: String(c.name), maxHP: +c.maxHP || 1, currentHP: +c.currentHP || 0, ac: +c.ac || 10,
          sheetActions: arr(c.sheetActions), conditions: arr(c.conditions), effects: arr(c.effects).filter(e => e && e.id && e.name), actions: arr(c.actions), info: arr(c.info),
          senses: arr(c.senses).filter(x => typeof x === 'string'), scores: c.scores || {}, saves: c.saves || {}}))
        .sort((a, b) => ((a.seq || 0) - (b.seq || 0)) || (a.id < b.id ? -1 : 1));
      const logList = Object.values(v.log || {}).filter(e => e && e.id).sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
      const m = v.meta || {};
      const meta = {round: m.round || 1, combatStarted: !!m.combatStarted, activeId: m.activeId || '', dm: m.dm || '', approval: !!m.approval, handsOn: !!m.handsOn, compMode: ['simple','full'].includes(m.compMode) ? m.compMode : ''};
      const promptList = Object.values(v.prompts || {}).filter(q => q && q.id && q.targetId).sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
      const sigs = {combatants: {}, log: {}, prompts: {}, meta: stable(meta)};
      promptList.forEach(q => { sigs.prompts[q.id] = true; });
      list.forEach(c => { sigs.combatants[c.id] = stable(c); });
      logList.forEach(e => { sigs.log[e.id] = true; });
      setCombatants(list.map(({seq, ...c}) => c));
      setLog(logList);
      setPrompts(promptList);
      setRound(meta.round);
      setCombatStarted(meta.combatStarted);
      setActiveId(meta.activeId);
      setDmId(meta.dm);
      setApproval(meta.approval);
      setHandsOn(meta.handsOn); setCompMode(meta.compMode);
      setRemoteSigs(sigs);
      setSyncStatus('live');
    };
    const onError = err => { console.error('Session sync error', err); setSyncStatus('error'); setSyncMsg('Lost connection'); };
    ref.on('value', onValue, onError);
    return () => ref.off('value', onValue);
  }, [room]);

  // This screen → session. Only what changed here since the session last spoke is written.
  useEffect(() => {
    if (!room || !db || !remoteSigs) return;
    const updates = {};
    combatants.forEach((c, i) => {
      const v = {...c, seq: i};
      if (stable(v) !== remoteSigs.combatants[c.id]) updates['combatants/' + c.id] = plain(v);
    });
    log.forEach(e => { if (!remoteSigs.log[e.id]) updates['log/' + e.id] = plain(e); });
    prompts.forEach(q => { if (!remoteSigs.prompts[q.id]) updates['prompts/' + q.id] = plain(q); });
    const meta = metaOf();
    if (stable(meta) !== remoteSigs.meta) updates['meta'] = meta;
    if (Object.keys(updates).length) updates['touched'] = firebase.database.ServerValue.TIMESTAMP; // last activity, for the 90-day cleanup
    if (Object.keys(updates).length) db.ref('rooms/' + room).update(updates).catch(err => { console.error('Session write failed', err); setSyncStatus('error'); setSyncMsg('Could not save'); });
  }, [combatants, log, prompts, round, activeId, combatStarted, approval, handsOn, compMode, room, remoteSigs]);

  // The DM's computer remembers its sessions and marks them as used whenever the DM opens them.
  useEffect(() => {
    if (!room || !db || !dmId || dmId !== myId) return;
    rememberRoom(room);
    db.ref('rooms/' + room + '/touched').set(firebase.database.ServerValue.TIMESTAMP).catch(() => {});
  }, [room, dmId, myId]);

  const clearLog = () => {
    if (room && db) db.ref('rooms/' + room + '/log').remove();
    setLog([]);
  };

  // ── CHARACTERS (from the Character Builder) ─────────────────────────────────
  const loadCharacter = (data, fromSheet) => {
    if (!data || data.format !== 'homebrew-academy-character') { alert('That file is not a Character Builder save.'); return; }
    if (!String(data.name || '').trim()) { alert('That character sheet has no name yet. Fill it in on the Character Builder tab first.'); return; }
    const f = sheetToFields(data);
    setForm({...emptyForm, name: f.name, type: 'player', initiative: '', sheetData: data, fromSheet: !!fromSheet});
    setShowAddModal(true);
  };
  const readCharacterFile = (file) => {
    if (!file) return;
    file.text().then(t => loadCharacter(JSON.parse(t), false)).catch(() => alert('Could not read that character file.'));
  };
  const addMyCharacter = () => {
    const d = readStoredCharacter(playerCode);
    if (!d) { alert(`No character sheet is saved on this computer for player code ${playerCode}. Build one on the Character Builder tab first.`); return; }
    loadCharacter(d, true);
  };

  // A player who has just joined a session is offered their own character straight away.
  useEffect(() => {
    if (!room || !remoteSigs || promptedRef.current) return;
    promptedRef.current = true;
    if (isDM || combatants.some(c => c.owner === myId)) return;
    const d = readStoredCharacter(playerCode);
    if (d && String(d.name || '').trim()) loadCharacter(d, true);
  }, [room, remoteSigs]);

  // HP changes to this player's own character are written back to their sheet on this computer.
  useEffect(() => {
    const me = combatants.find(c => c.main && c.owner === myId);
    if (!me) return;
    const d = readStoredCharacter(playerCode);
    if (!d || d.name !== me.name || d.currentHP === me.currentHP) return;
    d.currentHP = me.currentHP;
    d.builder = {...(d.builder || {}), currentHp: me.currentHP};
    lsSet(charKey(playerCode), JSON.stringify(d));
  }, [combatants, playerCode]);

  useEffect(() => {
    const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    const over = e => { if (hasFiles(e)) { e.preventDefault(); setDragging(true); } };
    const leave = e => { if (!e.relatedTarget) setDragging(false); };
    const drop = e => { if (!hasFiles(e)) return; e.preventDefault(); setDragging(false); readCharacterFile(e.dataTransfer.files[0]); };
    const msg = e => { if (e.origin === window.location.origin && e.data && e.data.type === 'hba-character') loadCharacter(e.data.character, true); };
    const storage = e => {
      if (e.key === CODE_KEY && e.newValue) setPlayerCode(cleanCode(e.newValue) || currentPlayerCode());
      if (e.key === 'hba-rest' && e.newValue && restRef.current) { try { restRef.current(JSON.parse(e.newValue)); } catch (err) {} } // a rest taken on the Character Builder tab
    };
    window.addEventListener('dragover', over);
    window.addEventListener('dragleave', leave);
    window.addEventListener('drop', drop);
    window.addEventListener('message', msg);
    window.addEventListener('storage', storage);
    const code = sessionFromHash();
    if (code && db) joinSession(code);
    sweepOldSessions(publicId(currentPlayerCode()), code);
    return () => {
      window.removeEventListener('dragover', over);
      window.removeEventListener('dragleave', leave);
      window.removeEventListener('drop', drop);
      window.removeEventListener('message', msg);
      window.removeEventListener('storage', storage);
    };

  // ── RENDER HELPERS ──────────────────────────────────────────────────────────
  const typeLine = c => c.type === 'player' ? `${c.charClass || 'Character'} ${c.level}` : c.type === 'companion' ? 'Companion' : (c.sub || 'Monster/NPC');
  const sheetLine = c => {
    const sh = c.sheet || {};
    if (c.type !== 'player' || !sh.species) return typeLine(c);

  };
  // ── THE CHARACTER SHEET, laid out like a printed sheet. Everything on it can be clicked. ──
  const SKILL_SHORT = {'Animal Handling':'A. Handling', Intimidation:'Intimidate', Investigation:'Investigate', Performance:'Perform', Persuasion:'Persuade', 'Sleight of Hand':'Slight Hand'};
  const DMG_SHORT = {Bludgeoning:'Bl', Piercing:'Pc', Slashing:'Sl'};
  const ACT_SHORT = {action:'A', bonus:'BA', reaction:'R', free:'Free'};
  const renderPaper = (c) => {
    const sh = c.sheet || {}, ctl = canControl(c);
    const sel = (a) => setSelectedAction(a.id === selectedAction ? null : a.id);

    const leftText = (a) => a.pool ? ` (${poolLeft(c, a.pool)} ${a.pool} left)` : a.usesMax ? ` (${usesLeft(c, a)}/${a.usesMax} left)` : '';
    const attacks = actions.filter(a => a.weapon || a.unarmed);

      <div className="paper" data-testid="paper">
        <div className="pp-pagebox" data-testid="paper-main">
          {title('')}

              <div className="pp-abil" key={ab} data-testid={`pp-${k}`}>
                <button className="pp-save" disabled={!ctl} title={`Roll a ${ab} saving throw`} onClick={() => rollTest(c, 'save', ab)}>{signed(sv)}</button>
                <span className={`pp-dot ${prof ? 'full' : ''}`} title={prof ? 'Proficient in this saving throw' : ''} />
                <div className="pp-abname">{k.toUpperCase()}</div>
                <div className="pp-score">{score}</div>
                <button className="pp-mod" disabled={!ctl} title={`Roll a ${ab} check`} onClick={() => rollTest(c, 'check', ab)}>{modStr(score)}</button>
              </div>); })}
            <div className="pp-hit" title="Hit Point Dice left"><span>HIT</span><strong>{hitLeft}/{c.level}</strong></div>
            <div className="pp-hp" data-testid="pp-hp">
              <div className="pp-heart"><svg viewBox="0 0 100 92" aria-hidden="true"><path d="M50 88 C20 62 4 46 4 27 C4 13 15 4 27 4 C37 4 45 9 50 18 C55 9 63 4 73 4 C85 4 96 13 96 27 C96 46 80 62 50 88 Z" fill="#fff" stroke="#000" strokeWidth="3"/></svg>
                <div className="pp-heartval"><strong>{totalHP(c)}</strong><span>TOTAL</span></div></div>
              <div className="pp-hpcur"><strong>{c.currentHP}</strong><span>HP</span></div>
              <div className="pp-hpslash">/</div>
              <div className="pp-hpcur"><strong>{+c.tempHP || 0}</strong><span>TEMP</span></div>
            </div>
          </div>
          <div className="pp-body">
            <div className="pp-left">
              <div className="pp-skills">
                <span className={`pp-insp ${c.inspiration ? 'full' : ''}`} title="Heroic Inspiration. Click to mark it." onClick={() => ctl && setCombatants(prev => prev.map(x => x.id === c.id ? {...x, inspiration: !x.inspiration} : x))} />
                {Object.keys(SKILL_ABILITY).sort().map(sk => { const ex = (sh.skillExpertise || []).includes(sk), pr = (sh.skillProfs || []).includes(sk), v = (sh.skills || {})[sk]; return (
                  <div key={sk} className="pp-skill" onClick={() => ctl && rollTest(c, 'check', SKILL_ABILITY[sk], sk)} title={`Roll ${sk}`}>
                    <span className={`pp-o ${ex ? 'ex' : pr ? 'full' : ''}`} /><span className="pp-sv">{signed(Number.isFinite(+v) ? +v : mod((c.scores || {})[SKILL_ABILITY[sk]] ?? 10))}</span>
                    <span className="pp-sn">{SKILL_SHORT[sk] || sk}</span><span className="pp-sa">{SKILL_ABILITY[sk].slice(0, 3).toUpperCase()}</span>
                  </div>); })}
              </div>
              <div className="pp-carry"><strong>Carry</strong>: {str * 15} &nbsp; <strong>Jump</strong>: {str}&gt; &nbsp;{3 + mod(str)}^</div>
              <div className="pp-h3">Important Items</div>
              {(sh.importantItems || []).length ? sh.importantItems.map(n => <div key={n} className="pp-center">{n}</div>) : <div className="pp-center pp-grey">Mark items with the diamond in the builder's Inventory</div>}
              <div className="pp-h3">Languages</div>
              <div className="pp-center">{(sh.languages || []).join('   ') || 'Common'}</div>
              <div className="pp-h3">Tool Proficiencies</div>
              <div className="pp-center">{(sh.tools || []).join(', ') || 'None'}</div>
            </div>
            <div className="pp-right">
              <div className="pp-stats">
                <div className="pp-ac"><svg viewBox="0 0 100 112" aria-hidden="true"><path d="M50 4 C64 12 80 14 94 14 C94 60 84 88 50 108 C16 88 6 60 6 14 C20 14 36 12 50 4 Z" fill="#fff" stroke="#000" strokeWidth="3"/></svg><div><strong>{effectiveAC(c)}</strong><span>AC</span></div></div>
                <div className="pp-stat"><div className="pp-star"><strong>{c.pb || 2}</strong></div><span>PROF</span></div>
                <div className="pp-stat"><div className="pp-box"><strong>{effectiveSpeed(c)}</strong></div><span>Speed</span></div>
                <div className="pp-stat"><div className="pp-box"><strong>{signed(effectiveInitBonus(c))}</strong></div><span>INIT</span></div>
                <div className="pp-cond"><u>Conditions/Resistances</u>
                  <div>{[...(c.conditions || []), ...(c.effects || []).map(e => e.name), ...res].join(' · ') || ' '}</div></div>
              </div>
              <div className="pp-line"><span><strong>Senses:</strong> {effectiveSenses(c).join(', ') || 'None'}{sh.pp != null ? ` · Passive Perception ${sh.pp}` : ''}</span><span><strong>Speeds:</strong> {speedText(c)}</span></div>
              <div className="pp-h2 pp-mid">Attacks</div>
              <div className="pp-attack pp-head"><span>Name</span><span>Range/Reach</span><span>To Hit</span><span>Damage</span></div>
              {attacks.map(a => (
                <div key={a.id} className={rowCls(a, 'pp-attack')} style={dim(a)} onClick={() => ctl && sel(a)}>
                  <span className="a-name">{a.name}{leftText(a)}{a.mastery ? ` · ${a.mastery}` : ''}</span>
                  <span>{a.rng ? `${a.rng} - ${a.reach || 0}` : `0 - ${a.reach || 5}`}</span>
                  <span>{signed(a.atk)}</span>
                  <span>{(a.dmgList || []).map(d => `${d[0]} ${DMG_SHORT[d[1]] || String(d[1] || '').slice(0, 3)}`).join(' + ')}</span>
                </div>))}
              {handsOn && <div className="pp-note">In hand: {handsOf(c).map(x => x || 'free hand').join(' and ')}{c.handsIgnore ? ' (not checked)' : ''}</div>}
              <div className="pp-h2 pp-mid">Actions</div>
              <div className="pp-std">Attack. Dash. Disengage. Dodge. Help. Hide. Influence. Magic. Ready. Search. Study. Utilize.</div>
              {others.map(a => (
                <div key={a.id} className={rowCls(a, 'pp-action')} style={dim(a)} onClick={() => ctl && sel(a)}>
                  <span><strong className="a-name">{a.name}{leftText(a)}</strong>{a.detail ? <span className="a-detail"> {a.detail}</span> : null}</span>
                  <span className="pp-type">{ACT_SHORT[a.activation] || ''}</span>
                </div>))}
              {Object.keys(sh.pools || {}).length > 0 && <div className="pp-note">{Object.entries(sh.pools).map(([n, q]) => `${n} ${poolLeft(c, n)}/${q.max}`).join(' · ')}</div>}
              <div className="pp-h2 pp-mid">Feats</div>
              <div className="pp-center">{(sh.feats || []).join(' · ') || 'None'}</div>
              {cantrips.length > 0 && <>
                <div className="pp-h2 pp-mid">Cantrips</div>
                <div className="pp-spellrow pp-head" style={{gridTemplateColumns: '2.2fr 0.8fr 0.9fr 0.9fr 0.8fr 0.8fr'}}><span>Name</span><span>School</span><span>Comps</span><span>Range</span><span>Save</span><span>Action</span></div>
                {cantrips.map(s => spellRow(s, '2.2fr 0.8fr 0.9fr 0.9fr 0.8fr 0.8fr'))}
              </>}
            </div>
          </div>
        </div>
        {levels.map(l => (
          <div className="pp-pagebox" key={l} data-testid={`paper-spells-${l}`}>
            {title('')}
            {spellHead}
            <div className="pp-lvl">Level {l} {slotCircles(l)}<span className="pp-grey"> {((sh.slotMax || [])[l - 1]) ? `(${slotsLeft(c, l)} of ${sh.slotMax[l - 1]} slots left)` : ''}</span></div>
            <div className="pp-spellrow pp-head" style={{gridTemplateColumns: '2.4fr 0.7fr 0.9fr 1fr 0.7fr 1fr 0.9fr'}}><span>Name</span><span>School</span><span>Comps</span><span>Range</span><span>Save</span><span>Duration</span><span>C Time</span></div>
            {list.filter(s => s.l === l).map(s => spellRow(s, '2.4fr 0.7fr 0.9fr 1fr 0.7fr 1fr 0.9fr'))}
            <div className="pp-key">&lt;*&gt; Concentration &nbsp; (R*) can be cast as a Ritual</div>
          </div>))}
        <div className="pp-pagebox" data-testid="paper-features">
          {title('')}
          <div className="pp-h2">Features &amp; Traits</div>
          {((c.info || []).find(x => x.h === 'Features and Traits') || {items: []}).items.map((it, i) => <p key={i} className="pp-p">{it[1]}</p>)}
          <div className="pp-h2" style={{marginTop: 14}}>Inventory</div>
          <p className="pp-p">{(sh.items || []).join(', ') || 'Nothing carried.'}</p>
        </div>
        {sh.journal && (
          <div className="pp-pagebox" data-testid="paper-journal">
            {title('')}
            <div className="pp-h2">Journal</div>
            {[['Alignment', sh.journal.alignment], ['Faith', sh.journal.deity], ['Personality Traits', sh.journal.traits], ['Ideals', sh.journal.ideals], ['Bonds', sh.journal.bonds], ['Flaws', sh.journal.flaws], ['Appearance', sh.journal.appearance], ['Backstory', sh.journal.backstory],
              ['Allies & Organizations', sh.journal.allies], ['Enemies & Rivals', sh.journal.enemies], ['Quests & Goals', sh.journal.quests]].filter(x => x[1]).map(([h, t]) => <p key={h} className="pp-p" style={{whiteSpace: 'pre-wrap'}}><strong>{h}.</strong> {t}</p>)}
            {(sh.journal.notes || []).map((n, i) => <p key={'n' + i} className="pp-p" style={{whiteSpace: 'pre-wrap'}}><strong>{n[0]}.</strong> {n[1]}</p>)}
            {(sh.journal.sessions || []).map((n, i) => <p key={'s' + i} className="pp-p" style={{whiteSpace: 'pre-wrap'}}><strong>{n[0]}.</strong> {n[1]}</p>)}
          </div>)}
      </div>
    );
  };
  const statChips = c => {
    const sh = c.sheet || {};
    const chip = (lbl, val, src) => ({lbl, val, src});
    const out = [
      chip('AC', effectiveAC(c), srcEff(c, e => +e.ac)),
      chip('Initiative', signed(effectiveInitBonus(c)), srcEff(c, e => +e.init)),
      chip('Speed', speedText(c), [SPEED_ZERO.filter(n => hasCond(c, n)).join(', '), srcEff(c, e => +e.speed || (e.speedMult && +e.speedMult !== 1) || e.move)].filter(Boolean).join(', ')),
      chip('HP', `${c.currentHP} / ${totalHP(c)}${+c.tempHP > 0 ? ` +${c.tempHP} temp` : ''}`, srcEff(c, e => +e.hpMax)),
      chip('Prof', `+${c.pb || 2}`, ''),
    ];
    if (sh.pp != null) out.push(chip('Passive Perception', sh.pp, ''));
    if (sh.spell) { out.push(chip('Spell Save DC', sh.spell.dc, '')); out.push(chip('Spell Attack', signed(sh.spell.attack), '')); }

  };
  const sheetPreview = form.sheetData ? sheetToFields(form.sheetData) : null;
  const selAction = actions.find(a => a.id === selectedAction);

  // A rest taken in the Character Builder resets this player's own character here too.
  restRef.current = (msg) => {

  const selMax = maxTargets(selAction, castOptions(viewed || {}, selAction).includes(castLevel) ? castLevel : (castOptions(viewed || {}, selAction)[0] || 0));
  // Picking targets: one at a time, or several when the chosen action allows it.
  const toggleTarget = id => setTargetIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : selMax > 1 ? [...prev, id].slice(-selMax) : [id]);
  const needsTarget = selAction && !['selfheal','info'].includes(selAction.type) && !selAction.self;
  const openPrompts = prompts.map(q => {
    const c = inPlay.find(x => x.id === q.targetId);

    return q.action ? {q, c, text: `${q.action.saveAbility} save against ${q.action.name}${q.actorName ? ` from ${q.actorName}` : ''}`, dc: q.action.dc} : null;

  const targets = inPlay.filter(c => viewed && c.id !== viewed.id && c.currentHP > 0);
  const rosterMatches = useMemo(() => {

  }, [rosterSearch]);
  const buffPreset = BUFFS.find(b => b.name === buffName);

  return (
    <>
      {/* HEADER */}

                              <span><strong>{a.name}</strong>: {a.mat || 'a material component'}{need ? (a.matConsumed ? ' (has a cost, used up by the spell)' : ' (has a cost)') : ''}</span>
                            </div>);
                        })}
                      </div>
                    )}
                  </div>
                )}
                {/* Spell slots */}
                {viewed && ((viewed.sheet || {}).slotMax || []).some(n => n > 0) && (
                  <div className="slot-row" data-testid="slot-row">
                    <span className="opt-label">Spell slots</span>
                    {viewed.sheet.slotMax.map((n, i) => n > 0 ? <span key={i} className={`slot-chip ${slotsLeft(viewed, i + 1) ? '' : 'spent'}`}>L{i + 1}: {slotsLeft(viewed, i + 1)}/{n}
                      {canControl(viewed) && <> <button className="chip-btn" aria-label={`Spend a Level ${i + 1} slot`} title="Spend one" onClick={()=>adjustSlot(viewed.id, i + 1, -1)}>−</button><button className="chip-btn" aria-label={`Give back a Level ${i + 1} slot`} title="Give one back (a slot that was not spent)" onClick={()=>adjustSlot(viewed.id, i + 1, 1)}>+</button></>}</span> : null)}
                  </div>
                )}

                {/* Buff passing */}
                <div className="section-title">✨ Pass a Buff or Effect</div>
                <div className="buff-row">
                  <select aria-label="Buff or effect" value={buffName} onChange={e=>{setBuffName(e.target.value); setBuffOpt(''); setBuffTime(null);}}>
                    {BUFFS.map(b=><option key={b.name} value={b.name}>{b.name}</option>)}
                    <option value="__custom">Custom...</option>
                  </select>
                  <select aria-label="Who receives it" value={buffTarget || viewed.id} onChange={e=>setBuffTarget(e.target.value)}>
                    {inPlay.map(c=><option key={c.id} value={c.id}>{c.name}{c.id===viewed.id?' (self)':''}</option>)}
                  </select>
                </div>
                {buffName === '__custom' ? (
                  <div className="custom-effect">
                    <input aria-label="Effect name" placeholder="Name of the buff or effect" maxLength={40} value={buffCustom.name} onChange={e=>setBuffCustom({...buffCustom,name:e.target.value})}/>
                    <div className="custom-grid">
                      {[['ac','AC','+1'],['speed','Speed (ft.)','+10'],['init','Initiative','+2'],['atk','Attack rolls','1d4'],['save','Saving throws','1d4']].map(([k,l,ph])=>(
                        <label key={k}>{l}<input aria-label={l} placeholder={ph} value={buffCustom[k]} onChange={e=>setBuffCustom({...buffCustom,[k]:e.target.value})}/></label>
                      ))}
                    </div>
                    <input aria-label="Sense granted" placeholder="Sense granted, for example Darkvision 60 ft." maxLength={60} value={buffCustom.sense} onChange={e=>setBuffCustom({...buffCustom,sense:e.target.value})}/>
                    <input aria-label="Note" placeholder="Anything else it does (shown as a reminder)" maxLength={200} value={buffCustom.note} onChange={e=>setBuffCustom({...buffCustom,note:e.target.value})}/>
                  </div>
                ) : (<>
                  {buffPreset && buffPreset.opt && (
                    <div className="buff-row">
                      <label className="opt-label">{buffPreset.opt.label}</label>
                      {buffPreset.opt.number
                        ? <input type="number" min="0" aria-label={buffPreset.opt.label} value={optValue} onChange={e=>setBuffOpt(e.target.value)}/>
                        : <select aria-label={buffPreset.opt.label} value={optValue} onChange={e=>setBuffOpt(e.target.value)}>{buffPreset.opt.choices.map(x=><option key={x} value={x}>{x}</option>)}</select>}
                    </div>
                  )}
                  <div className="buff-note">{buffPreset && [BUFF_SUMMARY[buffPreset.name] || describeEffect(buffPreset), buffPreset.note && `Left to the table: ${buffPreset.note}`].filter(Boolean).join('. ')}</div>
                </>)}
                <div className="time-row" style={{marginBottom:6}}>
                  <label className="opt-label">Lasts</label>
                  <input type="number" min="0" aria-label="How long it lasts" placeholder="until removed" value={timeNow.n} onChange={e=>setBuffTime({...timeNow, n:e.target.value})}/>
                  <select aria-label="Duration unit" value={timeNow.unit} onChange={e=>setBuffTime({...timeNow, unit:e.target.value})}>
                    {['rounds','minutes','hours','days'].map(u=><option key={u} value={u}>{u}</option>)}
                  </select>
                  <label className="conc-label"><input type="checkbox" checked={!!timeNow.conc} onChange={e=>setBuffTime({...timeNow, conc:e.target.checked})}/> Concentration</label>
                </div>
                <button className="btn btn-success btn-sm" onClick={passBuff} disabled={buffName==='__custom' && !buffCustom.name.trim()}>Pass Buff</button>
                </>}

                {/* Conditions */}
                {target && isDM && (
                  <>
                    <div className="section-title">🔮 Apply Condition to Target</div>
                    <div className="time-row" style={{marginBottom:6}}>
                      <label className="opt-label">Lasts</label>
                      <input type="number" min="0" aria-label="How long the condition lasts" placeholder="until removed" value={condOpts.n} onChange={e=>setCondOpts({...condOpts, n:e.target.value})}/>
                      <select aria-label="Condition duration unit" value={condOpts.unit} onChange={e=>setCondOpts({...condOpts, unit:e.target.value})}>
                        {['rounds','minutes','hours','days'].map(u=><option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                    <div className="time-row" style={{marginBottom:6}}>
                      <label className="opt-label">Repeat save</label>
                      <select aria-label="When the save repeats" value={condOpts.when} onChange={e=>setCondOpts({...condOpts, when:e.target.value})}>
                        <option value="">None</option>
                        <option value="end">End of {target.name}'s turn</option>
                        <option value="start">Start of {target.name}'s turn</option>
                        {viewed && viewed.id !== target.id && <option value="src-end">End of {viewed.name}'s turn</option>}
                        {viewed && viewed.id !== target.id && <option value="src-start">Start of {viewed.name}'s turn</option>}
                      </select>
                      {condOpts.when && <>
                        <select aria-label="Save ability" value={condOpts.abil} onChange={e=>setCondOpts({...condOpts, abil:e.target.value})}>
                          {ABILITIES.map(a=><option key={a} value={a}>{a}</option>)}
                        </select>
                        <label className="opt-label">DC</label>
                        <input type="number" min="1" max="40" aria-label="Save DC" value={condDc} onChange={e=>setCondOpts({...condOpts, dc:e.target.value})}/>
                      </>}
                    </div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                      {CONDITIONS.map(cond=>(
                        <button key={cond} className={`btn btn-sm btn-ghost`}
                          style={target.conditions.includes(cond)?{borderColor:'var(--blood-light)',color:'#ff8a80'}:{}}
                          onClick={()=>target.conditions.includes(cond)?removeCondition(target.id,cond):applyCondition(target,cond)}>
                          {CONDITION_ICON[cond]} {cond}
                        </button>
                      ))}
                    </div>
                  </>
                )}

                {/* Sheet details */}
                {!paper && viewed.sheet && viewed.sheet.skills && Object.keys(viewed.sheet.skills).length > 0 && (
                  <details className="block">
                    <summary>Skills</summary>
                    <div className="skill-grid">
                      {Object.keys(viewed.sheet.skills).sort().map(sk => {
                        const ex = (viewed.sheet.skillExpertise||[]).includes(sk), pr = (viewed.sheet.skillProfs||[]).includes(sk);
                        return <div key={sk} className={pr||ex?'prof':''}>
                          {canControl(viewed) && SKILL_ABILITY[sk] && <button className="skill-roll" title={`Roll ${sk}`} onClick={()=>rollTest(viewed,'check',SKILL_ABILITY[sk],sk)}>Roll</button>}
                          {sk} <strong>{signed(viewed.sheet.skills[sk])}</strong>{ex?' (Expertise)':pr?' (Proficient)':''}</div>;
                      })}
                    </div>
                  </details>
                )}
                {!paper && viewed.sheet && viewed.sheet.spell && (
                  <details className="block">
                    <summary>Spellcasting</summary>
                    <p><strong>Ability.</strong> {viewed.sheet.spell.ability} · <strong>Spell save DC</strong> {viewed.sheet.spell.dc} · <strong>Spell attack</strong> {signed(viewed.sheet.spell.attack)}</p>
                    {viewed.sheet.spell.slots && <p><strong>Spell slots.</strong> {viewed.sheet.spell.slots}</p>}
                  </details>
                )}
                {!paper && (viewed.info||[]).map((sec, i) => (
                  <details className="block" key={i}>
                    <summary>{sec.h}</summary>
                    {(sec.items||[]).map((it, j) => <p key={j}>{it[0] && <strong>{it[0]}. </strong>}{it[1]}</p>)}
                  </details>
                ))}
                {!paper && viewed.sheet && (viewed.sheet.equipment || (viewed.sheet.items||[]).length > 0) && (
                  <details className="block">
                    <summary>Equipment and Items</summary>
                    {(viewed.sheet.items||[]).length > 0 && <p><strong>Items.</strong> {viewed.sheet.items.join(', ')}</p>}
                    {viewed.sheet.equipment && <p style={{whiteSpace:'pre-wrap'}}>{viewed.sheet.equipment}</p>}
                  </details>
                )}
              </>
            )}
          </div>

          {/* Resolve Bar */}
          {combatStarted && (
            <div className="resolve-bar">
              <button className="next-turn-btn" disabled={!canControl(active)} style={!canControl(active)?{opacity:0.4,cursor:'default'}:{}} onClick={nextTurn}>Next Turn →</button>
              <button
                className="resolve-btn"
                title={blockReason(viewed, selAction)}
                disabled={!canAct || !selectedAction || !!blockReason(viewed, selAction) || (needsTarget && !target) || (limited(selAction) && usesLeft(viewed, selAction) <= 0) || (selAction && selAction.slot > 0 && castOptions(viewed, selAction).length === 0)}
                onClick={resolve}>
                {canAct ? '⚔ Resolve Action' : 'Not your turn'}
              </button>
            </div>
          )}
        </div>

        {/* ── RIGHT: DICE ROLLER + COMBAT LOG ── */}
        <div className="log-panel">
          <div className="panel-header">Dice Roller</div>
          <div className="dice-box">
            <div className="dice-grid">
              {[4,6,8,10,12,20,100].map(s => { const n = poolOf(diceExpr).dice[s] || 0; return (
                <button key={s} className={`die-btn ${n ? 'has' : ''}`} aria-label={`d${s}`} data-count={n} title="Click to add one. Right-click to take one away."
                  onClick={()=>bumpDie(s, 1)} onContextMenu={e=>{ e.preventDefault(); bumpDie(s, -1); }}>{n ? `${n}d${s}` : `d${s}`}</button>); })}
            </div>
            <div className="dice-expr">
              <input aria-label="Dice to roll" placeholder="Click dice, or type 2d6+3" value={diceExpr} onChange={e=>setDiceExpr(e.target.value)} onKeyDown={e=>{ if (e.key==='Enter') rollExpr(diceExpr); }}/>
              <button className="btn btn-primary btn-sm" data-testid="dice-roll" disabled={!DMG_RE.test(normExpr(diceExpr))} onClick={()=>rollExpr(diceExpr)}>Roll</button>
            </div>
            <div className="dice-opts">
              <label title="Each die that shows a 1 is rolled again, once"><input type="checkbox" data-testid="dice-reroll" checked={diceOpts.reroll} onChange={e=>setDiceOpts({...diceOpts, reroll: e.target.checked})}/> Reroll 1s</label>
              <select aria-label="Roll twice" value={diceOpts.twice} onChange={e=>setDiceOpts({...diceOpts, twice: e.target.value})}>
                <option value="">Roll once</option>
                <option value="high">Roll twice, keep the higher</option>
                <option value="low">Roll twice, keep the lower</option>
              </select>
              <button className="btn btn-ghost btn-sm" data-testid="dice-clear" onClick={()=>setDiceExpr('')}>Clear</button>
            </div>
          </div>
          <div className="panel-header">Conditions</div>
          <div className="cond-box" data-testid="cond-panel">
            {activeConditions.length === 0 && <div className="cond-empty">No conditions in effect</div>}
            {activeConditions.map(({c, cond, info}) => (
              <div key={c.id + cond} className="cond-item">
                <span className="cond-icon" aria-hidden="true">{CONDITION_ICON[cond] || '❔'}</span>
                <div className="cond-main">
                  <div><strong>{cond}</strong> · {c.name}</div>
                  {(condSaveText(info, inPlay, c) || (info && info.src)) && <div className="cond-sub">{[condSaveText(info, inPlay, c), info && info.src && `from ${info.src}`].filter(Boolean).join(' · ')}</div>}
                </div>
                <span className="cond-time">{info && +info.left > 0 ? timeText(info.left) : 'until removed'}</span>
                {isDM && <button className="link-btn" title="Remove" aria-label={`Remove ${cond} from ${c.name}`} onClick={()=>removeCondition(c.id, cond)}>×</button>}
              </div>
            ))}
          </div>
          <div className="panel-header">Combat Log</div>
          <div className="log-body">
            {log.length===0 && <div className="empty-state">Results will appear here</div>}
            {log.map((entry, i) => (
              entry.type==='round'
                ? <div key={entry.id||i} className="log-round">{entry.text}</div>
                : <div key={entry.id||i} className={`log-entry ${entry.type} dice-result`} dangerouslySetInnerHTML={{__html:sanitizeLogHtml(entry.html)}}/>
            ))}
            <div ref={logEndRef}/>
          </div>
          {log.length > 0 && isDM && (
            <div style={{padding:'8px 10px',borderTop:'1px solid #2C3E50'}}>
              <button className="btn btn-ghost btn-sm btn-full" onClick={clearLog}>Clear Log</button>
            </div>
          )}
        </div>
      </div>

      {/* ── MONSTER ROSTER ── */}
      {showRoster && (
        <div className="modal-overlay" onClick={()=>setShowRoster(false)}>
          <div className="modal roster" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">Monster Roster</div>
            <div className="modal-body" style={{paddingBottom:8}}>
              <input className="search" autoFocus placeholder={`Search ${MONSTERS.length} stat blocks by name or type`} value={rosterSearch} onChange={e=>setRosterSearch(e.target.value)}
                style={{width:'100%',background:'#0F1923',border:'1px solid #3d5166',color:'var(--parchment)',padding:'7px 10px',borderRadius:4,fontFamily:"'Crimson Text', serif",fontSize:'0.95rem'}}/>
            </div>
            <div className="roster-list">
              {MONSTERS.length === 0 && <div className="empty-state">monsters.js did not load.</div>}
              {rosterMatches.slice(0, 80).map(m => (
                <div key={m.n}>
                  <div className="roster-row">
                    <span className="r-name" onClick={()=>setRosterOpen(rosterOpen===m.n?null:m.n)}>{m.n}</span>
                    <span className="r-meta">{m.t} · CR {m.cr} · AC {m.ac} · {m.hp} HP</span>
                    <button className="btn btn-primary btn-sm" onClick={()=>addMonster(m)}>Add</button>
                  </div>
                  {rosterOpen===m.n && (
                    <div className="roster-detail">
                      <div>{ABILITY_KEYS.map(([k],i)=>`${k.toUpperCase()} ${m.s[i]} (${modStr(m.s[i])})`).join(' · ')}</div>
                      {m.sp && <p><strong>Speed.</strong> {m.sp}</p>}
                      {(m.tr||[]).map((t,i)=><p key={'t'+i}><strong>{t[0]}.</strong> {t[1]}</p>)}
                      {(m.a||[]).map((a,i)=><p key={'a'+i}><strong>{a.n}.</strong> {a.d}</p>)}
                      {(m.ba||[]).map((t,i)=><p key={'b'+i}><strong>{t[0]} (Bonus Action).</strong> {t[1]}</p>)}
                      {(m.re||[]).map((t,i)=><p key={'r'+i}><strong>{t[0]} (Reaction).</strong> {t[1]}</p>)}
                      {(m.la||[]).map((t,i)=><p key={'l'+i}><strong>{t[0]} (Legendary Action).</strong> {t[1]}</p>)}
                    </div>
                  )}
                </div>
              ))}
              {rosterMatches.length > 80 && <div className="empty-state">Showing 80 of {rosterMatches.length}. Type to narrow it down.</div>}
            </div>
            <div className="srd-note">
              Stat blocks from the System Reference Document 5.2.1 by Wizards of the Coast LLC, licensed under <a href="https://creativecommons.org/licenses/by/4.0/legalcode" target="_blank" rel="noopener">CC BY 4.0</a>. Adding a monster rolls its Initiative with its Dexterity modifier.
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setShowRoster(false)}>Done</button>
            </div>
          </div>
        </div>
      )}

      {/* ── ADD COMBATANT MODAL ── */}
      {showAddModal && (
        <div className="modal-overlay" onClick={()=>setShowAddModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">{sheetPreview ? 'Add Character Sheet' : 'Add Combatant'}</div>
            <div className="modal-body">
              {sheetPreview ? (
                <>
                  <div className="sheet-card">
                    <div className="who">{sheetPreview.name}</div>
                    <div className="combatant-type">{sheetLine(sheetPreview)}</div>
                    <div className="stats-row">
                      {statChips(sheetPreview).map(ch => (
                        <div className="stat-chip" key={ch.lbl}><div className="val">{ch.val}</div><div className="lbl">{ch.lbl}</div></div>
                      ))}
                    </div>
                    <div className="senses-line"><strong>Senses</strong> {sheetPreview.senses.join(', ') || 'None listed'}</div>
                    <div className="buff-note" style={{marginTop:8,marginBottom:0}}>The whole sheet comes with it: ability scores, saving throws, skills, features, spells and equipment.</div>
                  </div>
                  <div className="form-group" style={{marginTop:12}}>
                    <label>Initiative roll (d20{signed(sheetPreview.initBonus)})</label>
                    <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8}}>
                      <input type="number" aria-label="Initiative roll" value={form.initiative} placeholder="Type your total, or roll" onChange={e=>setForm({...form,initiative:e.target.value})} />
                      <button className="btn btn-ghost" onClick={()=>setForm({...form,initiative:rollD(20)+sheetPreview.initBonus})}>Roll for me</button>
                    </div>
                  </div>
                </>
              ) : (<>
              <div className="two-col">
                <div className="form-group">
                  <label>Name</label>
                  <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Aldric Stoneheart" />
                </div>
                <div className="form-group">
                  <label>Type</label>
                  <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
                    <option value="player">{isDM ? 'Player Character' : 'My Character'}</option>
                    {isDM && <option value="monster">Monster / NPC</option>}
                    <option value="companion">Companion (pet, familiar, summon)</option>
                  </select>
                </div>
              </div>
              {form.type==='player' && (
                <div className="two-col">
                  <div className="form-group">
                    <label>Class</label>
                    <select value={form.charClass} onChange={e=>setForm({...form,charClass:e.target.value})}>
                      {CLASS_LIST.map(c=>(
                        <option key={c}>{c}</option>
                      ))}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Level</label>
                    <input type="number" min="1" max="20" value={form.level} onChange={e=>setForm({...form,level:e.target.value})} />
                  </div>
                </div>
              )}
              <div className="three-col">
                <div className="form-group">
                  <label>Total HP</label>
                  <input type="number" value={form.maxHP} onChange={e=>setForm({...form,maxHP:e.target.value,currentHP:e.target.value})} />
                </div>
                <div className="form-group">
                  <label>AC</label>
                  <input type="number" value={form.ac} onChange={e=>setForm({...form,ac:e.target.value})} />
                </div>
                <div className="form-group">
                  <label>Initiative</label>
                  <input type="number" value={form.initiative} onChange={e=>setForm({...form,initiative:e.target.value})} />
                </div>
              </div>
              <div className="form-group">
                <label>Speed (ft.)</label>
                <input type="number" min="0" step="5" value={form.speed} onChange={e=>setForm({...form,speed:e.target.value})} />
              </div>
              {form.type!=='player' && (
                <>
                  <div className="section-title" style={{margin:'8px 0 8px'}}>Attack (optional)</div>
                  <div className="two-col">
                    <div className="form-group">
                      <label>Attack name</label>
                      <input value={form.atkName} placeholder="Bite" onChange={e=>setForm({...form,atkName:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>To hit bonus</label>
                      <input type="number" value={form.atkBonus} onChange={e=>setForm({...form,atkBonus:e.target.value})} />
                    </div>
                  </div>
                  <div className="two-col">
                    <div className="form-group">
                      <label>Damage dice</label>
                      <input value={form.atkDmg} placeholder="1d6+2" onChange={e=>setForm({...form,atkDmg:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>Damage type</label>
                      <input value={form.atkType} placeholder="Piercing" onChange={e=>setForm({...form,atkType:e.target.value})} />
                    </div>
                  </div>
                </>
              )}
              <div className="section-title" style={{margin:'8px 0 8px'}}>Ability Scores</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:6}}>
                {ABILITY_KEYS.map(([k])=>(
                  <div className="form-group" key={k}>
                    <label>{k.toUpperCase()}</label>
                    <input type="number" min="1" max="30" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} />
                  </div>
                ))}
              </div>
              </>)}
              {!isDM && approval && <div className="buff-note">The DM has to accept this before it joins the fight.</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setShowAddModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={addCombatant}>Add to Combat</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
