                <table className="end-table"><thead><tr><th>Who</th><th>Damage dealt</th><th>Damage taken</th><th>Hit Points now</th><th>Hit Point Dice left</th><th>Spent this fight</th></tr></thead>
                  <tbody>{sum.rows.map(r => { const c = combatants.find(x => x.id === r.id); return (
                    <tr key={r.id}><td>{r.name}{r.monster ? ' (monster)' : ''}{c && +c.xp > 0 ? ` · ${c.xp} XP` : ''}</td><td>{r.dealt}</td><td>{r.taken}</td><td>{c ? `${c.currentHP} of ${totalHP(c)}` : ''}</td><td>{c && c.sheet ? Math.max(0, c.level - (+c.hitDiceUsed || 0)) : ''}</td><td>{r.spent || (r.monster ? '' : 'Nothing')}</td></tr>); })}</tbody></table>
                <div className="buff-note">{running.length ? `Still running: ${running.join('; ')}.` : 'No timed effects are still running.'}</div>
              </div>}
              {endTab === 'starred' && <div data-testid="end-starred">
                {stars.length === 0 && <div className="empty-state">Nothing starred. Press the star on an entry in the Combat Log during a fight to keep it here.</div>}
                {stars.map(x => <div key={x.id} className={`log-entry ${x.type || ''}`}><button className="log-star on" aria-label="Remove the star" onClick={() => toggleStar(x)}>★</button><div dangerouslySetInnerHTML={{__html: sanitizeLogHtml(x.html)}}/></div>)}
                {stars.length > 0 && <div className="do-row"><button className="btn btn-primary" data-testid="end-save-notes" onClick={saveStarsToNotes}>Save to Session Notes</button><button className="btn btn-ghost btn-sm" data-testid="end-clear-stars" onClick={() => { if (window.confirm('Remove every star?')) saveStars([]); }}>Clear stars</button></div>}
              </div>}
              <div className="do-row"><button className="btn btn-ghost btn-sm" data-testid="end-close" onClick={() => setShowEnd(false)}>Close</button></div>
            </div>
          </div>
        </div>); })()}
      {handPick && (() => {
        const c = combatants.find(x => x.id === handPick.cId); if (!c) return null;
        const hd = handsOf(c), close = () => setHandPick(null), nth = i => i ? 'second hand' : 'first hand';
        const put = (i, v, how) => { setHand(c.id, i, v, how); close(); };
        return (
        <div className="modal-overlay" onClick={close}>
          <div className="modal" data-testid="hand-modal" onClick={e => e.stopPropagation()} style={{maxWidth: 420}}>
            <div className="modal-header">{handPick.want ? `Which hand takes ${handPick.want}?` : hd[handPick.i] ? `${hd[handPick.i]} (${nth(handPick.i)})` : `Empty ${nth(handPick.i)}: pick something up`}</div>
            <div className="modal-body">
              {handPick.want ? [0, 1].map(i => <button key={i} className="btn btn-ghost btn-full" style={{marginBottom: 6}} data-testid={`hand-swap-${i}`} onClick={() => put(i, handPick.want)}>Put away {hd[i] || 'nothing'} ({nth(i)})</button>) : <>
                {hd[handPick.i] && <><button className="btn btn-ghost btn-full" style={{marginBottom: 6}} data-testid="hand-away" onClick={() => put(handPick.i, '')}>Put away {hd[handPick.i]}</button>
                  <button className="btn btn-ghost btn-full" style={{marginBottom: 6}} data-testid="hand-drop" onClick={() => put(handPick.i, '', 'drop')}>Drop {hd[handPick.i]}</button></>}
                {handChoices(c).filter(n => n !== hd[handPick.i]).map(n => <button key={n} className="btn btn-ghost btn-full" style={{marginBottom: 6}} data-testid={`hand-opt-${n}`} onClick={() => put(handPick.i, n)}>Hold {n}</button>)}
              </>}
              <div className="do-row"><button className="btn btn-ghost btn-sm" onClick={close}>Cancel</button></div>
            </div>
          </div>
        </div>); })()}
      {removePick && (() => { const t = combatants.find(c => c.id === removePick.targetId); if (!t) return null; return (
        <div className="modal-overlay" onClick={() => setRemovePick(null)}>
          <div className="modal" data-testid="remove-modal" onClick={e => e.stopPropagation()} style={{maxWidth: 460}}>
            <div className="modal-header">{removePick.name}: what does it end on {t.name}?</div>
            <div className="modal-body">
              {removePick.options.map(o => <div key={o.kind + o.key} className="roster-row" data-testid="remove-option" style={{cursor: 'pointer'}} onClick={() => { doRemove(t.id, [o], removePick.name); const rest = removePick.options.filter(x => x !== o); setRemovePick(removePick.many && rest.length ? {...removePick, options: rest} : null); }}><span className="r-name">{o.label}</span><span className="r-meta">{o.kind === 'cond' ? 'Condition' : o.kind === 'exh' ? 'Exhaustion' : 'Effect'}</span></div>)}
              {removePick.many && <div className="buff-note">Pick each ongoing spell it ends. A spell of a higher level than this casting needs the caster's ability check first: the DM calls for that roll.</div>}
              <div className="do-row"><button className="btn btn-ghost btn-sm" data-testid="remove-done" onClick={() => setRemovePick(null)}>{removePick.many ? 'Done' : 'Nothing'}</button></div>
            </div>
          </div>
        </div>); })()}
      {blockPick && (() => { const q = (blockPick.q || '').trim().toLowerCase(), form = blockPick.kind === 'form';
        const list = MONSTERS.filter(m => (!form || blockPick.any || /beast/i.test(m.t)) && (!q || m.n.toLowerCase().includes(q))).slice(0, 40);
        const pick = (name) => { const n = String(name || '').trim().slice(0, 60); if (!n) return;
          const bid = newId(), boss = combatants.find(x => x.id === blockPick.cId), m = MONSTERS.find(x => x.n === n);
          let add = null;
          if (blockPick.kind === 'summon' && boss) { // a summoned creature joins the order, straight after its summoner
            const scores = {}, saves = {}; ABILITY_KEYS.forEach(([k, full], i) => { scores[full] = m ? m.s[i] : 10; saves[full] = m ? ((m.sv && m.sv[full] != null) ? m.sv[full] : mod(m.s[i])) : 0; });
            const hp = m ? m.hp : Math.max(1, parseInt(blockPick.hp, 10) || 10);
            add = plain({id: newId(), name: `${n} (${boss.name})`.slice(0, 60), base: n, type: 'companion', sub: m ? `${m.t}, CR ${m.cr}` : 'Summoned', level: 1, maxHP: hp, currentHP: hp, ac: m ? m.ac : Math.max(1, parseInt(blockPick.ac, 10) || 10),
              initiative: boss.initiative || 0, initBonus: m ? mod(m.s[1]) : 0, initFor: boss.initFor || 0, scores, saves, speed: m ? (parseInt(m.sp, 10) || 0) : 30, senses: m ? (m.se || []) : [], conditions: [], effects: [],
              pb: m ? m.pb : 2, actions: m ? monsterActions(m) : [], info: m ? monsterInfo(m) : [], ...(boss.owner ? {owner: boss.owner} : {}), ...(boss.type === 'monster' ? {type: 'monster', rel: boss.rel || 'hostile'} : {}), summonOf: boss.id, blockId: bid, after: boss.id});
            const sc = blockPick.sctl || null, secs = +blockPick.left || 0;
            add.effects = [plain({id: newId(), name: 'Summoned', note: `Brought here by ${boss.name}${blockPick.source ? ` with ${blockPick.source}` : ''}. ${sc && sc.cmd ? `${boss.name} commands it with ${sc.cmd === 'bonus' ? 'a Bonus Action' : 'an action'}.` : 'It acts on its own turn.'}${blockPick.conc ? ' It lasts while the Concentration holds.' : ''}`, casterId: boss.id, src: boss.id, ...(secs > 0 ? {left: secs} : {}), ...(blockPick.conc ? {concBy: boss.id, conc: true} : {})})];
            if (sc && sc.after === false) { const r = rollD(20); delete add.after; add.initiative = r + add.initBonus; add.ownInit = true; }
          }
          const cmd = add && blockPick.sctl && blockPick.sctl.cmd ? plain({id: newId(), name: `Command ${n}`.slice(0, 60), act: blockPick.sctl.cmd, conc: blockPick.conc || '', usedAt: '', cmd: true, blockId: bid, a: {type: 'info', name: `Command ${n}`.slice(0, 60), desc: `Tell ${n} what to do on its turn. If you give no command, it takes the Dodge action and moves only to avoid danger.`}}) : null;
          const fm = form && m && blockPick.tempHP ? m.hp : 0;
          if (fm) setLog(prev => [...prev, stamp({type:'heal', forId: blockPick.cId, html:`<strong>${esc(boss ? boss.name : 'The target')}</strong> takes the form of <span class="log-result">${esc(n)}</span><div class="log-detail">It gains ${fm} Temporary Hit Points, the Hit Points of the new form. The form ends early if those run out.</div>`})]);
          else if (form) setLog(prev => [...prev, stamp({type:'roll', forId: blockPick.cId, html:`<strong>${esc(boss ? boss.name : 'The target')}</strong> takes the form of <span class="log-result">${esc(n)}</span>`})]);
          if (add && add.ownInit) setLog(prev => [...prev, stamp({type:'roll', html:`<strong>${esc(add.name)}</strong> rolls its own Initiative: <span class="log-result">${add.initiative}</span>`})]);
          setCombatants(prev => { const next = prev.map(x => x.id !== blockPick.cId ? x : {...x, blocks: [...(x.blocks || []), plain({id: bid, name: n, kind: blockPick.kind, source: blockPick.source || '', conc: blockPick.conc || '', left: blockPick.left || 0, ...(blockPick.by && blockPick.by !== blockPick.cId ? {concBy: blockPick.by} : {})})].slice(-8), ...(fm ? {tempHP: Math.max(+x.tempHP || 0, fm)} : {}), ...(cmd ? {running: [...(x.running || []), cmd].slice(-6)} : {})}); return add ? placeByInitiative(next, add) : next; });
          setSheetTab('blocks'); setBlockPick(null); };
        return (
        <div className="modal-overlay" onClick={() => setBlockPick(null)}>
          <div className="modal" data-testid="block-modal" onClick={e => e.stopPropagation()} style={{maxWidth: 520}}>
            <div className="modal-header">{form ? `${blockPick.source || 'Change shape'}: which form?` : `${blockPick.source || 'Stat block'}: which creature?`}</div>
            <div className="modal-body">
              <input aria-label="Creature name" autoFocus placeholder="Type a name" value={blockPick.q || ''} onChange={e => setBlockPick({...blockPick, q: e.target.value})} onKeyDown={e => { if (e.key === 'Enter') pick(blockPick.q); }} style={{width: '100%', marginBottom: 8}}/>
              {form && blockPick.limit && <div className="buff-note" data-testid="form-limit" style={{marginBottom: 8}}>Allowed: {blockPick.limit}</div>}
              {form && <label className="rule-label" style={{marginBottom: 8}}><input type="checkbox" checked={!!blockPick.any} onChange={e => setBlockPick({...blockPick, any: e.target.checked})}/> Show every kind of creature, not only Beasts</label>}
              <div style={{maxHeight: 280, overflowY: 'auto'}}>
                {list.map(m => <div key={m.n} className="roster-row" style={{cursor: 'pointer'}} onClick={() => pick(m.n)}><span className="r-name">{m.n}</span><span className="r-meta">{m.t} · CR {m.cr} · AC {m.ac} · {m.hp} HP</span></div>)}
                {list.length === 0 && <div className="empty-state">Nothing in the roster by that name. You can still use the name you typed.</div>}
              </div>
              {!form && <div className="buff-note">It joins the Initiative order straight after you, folded away. If it has no stat block here, give it: Hit Points <input type="number" min="1" aria-label="Summoned creature Hit Points" value={blockPick.hp || ''} placeholder="10" onChange={e => setBlockPick({...blockPick, hp: e.target.value})} style={{width: 60}}/> AC <input type="number" min="1" aria-label="Summoned creature AC" value={blockPick.ac || ''} placeholder="10" onChange={e => setBlockPick({...blockPick, ac: e.target.value})} style={{width: 54}}/></div>}
              <div className="do-row"><button className="btn btn-primary" data-testid="block-use-name" disabled={!(blockPick.q || '').trim()} onClick={() => pick(blockPick.q)}>Use the name I typed</button><button className="btn btn-ghost btn-sm" onClick={() => setBlockPick(null)}>Skip</button></div>
            </div>
          </div>
        </div>); })()}
      {notices.length > 0 && (
        <div className="modal-overlay" data-testid="notice">
          <div className="modal" style={{maxWidth: 460}}>
            <div className="modal-header">This is what happened{notices[0].name ? ` to ${notices[0].name}` : ''}{notices.length > 1 ? ` (1 of ${notices.length})` : ''}</div>
            <div className="modal-body">
              <div className="log-entry" dangerouslySetInnerHTML={{__html: notices[0].html}} />
              <div className="buff-note">Hit Points, conditions and effects are already updated. Switch these off with Pop-ups above the Combat Log.</div>
              {canEndConc(notices[0]) && <button className="btn btn-danger btn-full" style={{marginBottom: 6}} data-testid="notice-conc-end" onClick={() => { endConcentration(notices[0].concEnd.id, 'After a failed Constitution saving throw to maintain Concentration.'); setNotices(prev => prev.slice(1)); }}>End Concentration on {notices[0].concEnd.name}</button>}
              <button className="btn btn-primary btn-full" data-testid="notice-ok" onClick={() => setNotices(prev => prev.slice(1))}>{canEndConc(notices[0]) ? 'Keep concentrating' : 'OK'}</button>
            </div>
          </div>
        </div>
      )}
      {/* ── MONSTER ROSTER ── */}
      {showRoster && (
        <div className="modal-overlay" onClick={()=>setShowRoster(false)}>
          <div className="modal roster" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">Monster Roster</div>
            <div className="modal-body" style={{paddingBottom:8}}>
              <input className="search" autoFocus placeholder={`Search ${MONSTERS.length} stat blocks by name or type`} value={rosterSearch} onChange={e=>setRosterSearch(e.target.value)}
                style={{width:'100%',background:'#0F1923',border:'1px solid #3d5166',color:'var(--parchment)',padding:'7px 10px',borderRadius:4,fontFamily:"'Crimson Text', serif",fontSize:'0.95rem'}}/>
            </div>
            <div className="roster-list">
              {MONSTERS.length === 0 && <div className="empty-state">monsters.js did not load.</div>}
              {rosterMatches.slice(0, 80).map(m => (
                <div key={m.n}>
                  <div className="roster-row">
                    <span className="r-name" onClick={()=>setRosterOpen(rosterOpen===m.n?null:m.n)}>{m.n}</span>
                    <span className="r-meta">{m.t} · CR {m.cr} · AC {m.ac} · {m.hp} HP</span>
                    <button className="btn btn-primary btn-sm" onClick={()=>addMonster(m)}>Add</button>
                  </div>
                  {rosterOpen===m.n && (
                    <div className="roster-detail">
                      <div>{ABILITY_KEYS.map(([k],i)=>`${k.toUpperCase()} ${m.s[i]} (${modStr(m.s[i])})`).join(' · ')}</div>
                      {m.sp && <p><strong>Speed.</strong> {m.sp}</p>}
                      {(m.tr||[]).map((t,i)=><p key={'t'+i}><strong>{t[0]}.</strong> {t[1]}</p>)}
                      {(m.a||[]).map((a,i)=><p key={'a'+i}><strong>{a.n}.</strong> {a.d}</p>)}
                      {(m.ba||[]).map((t,i)=><p key={'b'+i}><strong>{t[0]} (Bonus Action).</strong> {t[1]}</p>)}
                      {(m.re||[]).map((t,i)=><p key={'r'+i}><strong>{t[0]} (Reaction).</strong> {t[1]}</p>)}
                      {(m.la||[]).map((t,i)=><p key={'l'+i}><strong>{t[0]} (Legendary Action).</strong> {t[1]}</p>)}
                    </div>
                  )}
                </div>
              ))}
              {rosterMatches.length > 80 && <div className="empty-state">Showing 80 of {rosterMatches.length}. Type to narrow it down.</div>}
            </div>
            <div className="srd-note">
              Stat blocks from the System Reference Document 5.2.1 by Wizards of the Coast LLC, licensed under <a href="https://creativecommons.org/licenses/by/4.0/legalcode" target="_blank" rel="noopener">CC BY 4.0</a>. Adding a monster rolls its Initiative with its Dexterity modifier.
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setShowRoster(false)}>Done</button>
            </div>
          </div>
        </div>
      )}

      {/* ── ADD COMBATANT MODAL ── */}
      {showAddModal && (
        <div className="modal-overlay" onClick={()=>setShowAddModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">{sheetPreview ? 'Add Character Sheet' : 'Add Combatant'}</div>
            <div className="modal-body">
              {sheetPreview ? (
                <>
                  <div className="sheet-card">
                    <div className="who">{sheetPreview.name}</div>
                    <div className="combatant-type">{sheetLine(sheetPreview)}</div>
                    <div className="stats-row">
                      {statChips(sheetPreview).map(ch => (
                        <div className="stat-chip" key={ch.lbl}><div className="val">{ch.val}</div><div className="lbl">{ch.lbl}</div></div>
                      ))}
                    </div>
                    <div className="senses-line"><strong>Senses</strong> {sheetPreview.senses.join(', ') || 'None listed'}</div>
                    <div className="buff-note" style={{marginTop:8,marginBottom:0}}>The whole sheet comes with it: ability scores, saving throws, skills, features, spells and equipment.</div>
                  </div>
                  <div className="form-group" style={{marginTop:12}}>
                    <label>Initiative roll (d20{signed(sheetPreview.initBonus)})</label>
                    <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8}}>
                      <input type="number" aria-label="Initiative roll" value={form.initiative} placeholder="Type your total, or roll" onChange={e=>setForm({...form,initiative:e.target.value})} />
                      <button className="btn btn-ghost" onClick={()=>setForm({...form,initiative:rollD(20)+sheetPreview.initBonus})}>Roll for me</button>
                    </div>
                  </div>
                </>
              ) : (<>
              <div className="two-col">
                <div className="form-group">
                  <label>Name</label>
                  <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Aldric Stoneheart" />
                </div>
                <div className="form-group">
                  <label>Type</label>
                  <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
                    <option value="player">{isDM ? 'Player Character' : 'My Character'}</option>
                    {isDM && <option value="monster">Monster (hostile)</option>}
                    {isDM && <option value="npc">NPC (neutral)</option>}
                    <option value="companion">Companion (pet, familiar, summon)</option>
                  </select>
                </div>
                {form.type !== 'player' && <div className="form-group">
                  <label>Size</label>
                  <select aria-label="Size" value={form.size || 'Medium'} onChange={e=>setForm({...form,size:e.target.value})}>{SIZES.map(z => <option key={z} value={z}>{z}</option>)}</select>
                </div>}
              </div>
              {form.type==='player' && (
                <div className="two-col">
                  <div className="form-group">
                    <label>Class</label>
                    <select value={form.charClass} onChange={e=>setForm({...form,charClass:e.target.value})}>
                      {CLASS_LIST.map(c=>(
                        <option key={c}>{c}</option>
                      ))}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Level</label>
                    <input type="number" min="1" max="20" value={form.level} onChange={e=>setForm({...form,level:e.target.value})} />
                  </div>
                </div>
              )}
              <div className="three-col">
                <div className="form-group">
                  <label>Total HP</label>
                  <input type="number" value={form.maxHP} onChange={e=>setForm({...form,maxHP:e.target.value,currentHP:e.target.value})} />
                </div>
                <div className="form-group">
                  <label>AC</label>
                  <input type="number" value={form.ac} onChange={e=>setForm({...form,ac:e.target.value})} />
                </div>
                <div className="form-group">
                  <label>Initiative</label>
                  <input type="number" value={form.initiative} onChange={e=>setForm({...form,initiative:e.target.value})} />
                </div>
              </div>
              <div className="form-group">
                <label>Speed (ft.)</label>
                <input type="number" min="0" step="5" value={form.speed} onChange={e=>setForm({...form,speed:e.target.value})} />
              </div>
              {form.type!=='player' && (
                <>
                  <div className="section-title" style={{margin:'8px 0 8px'}}>Attack (optional)</div>
                  <div className="two-col">
                    <div className="form-group">
                      <label>Attack name</label>
                      <input value={form.atkName} placeholder="Bite" onChange={e=>setForm({...form,atkName:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>To hit bonus</label>
                      <input type="number" value={form.atkBonus} onChange={e=>setForm({...form,atkBonus:e.target.value})} />
                    </div>
                  </div>
                  <div className="two-col">
                    <div className="form-group">
                      <label>Damage dice</label>
                      <input value={form.atkDmg} placeholder="1d6+2" onChange={e=>setForm({...form,atkDmg:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>Damage type</label>
                      <input value={form.atkType} placeholder="Piercing" onChange={e=>setForm({...form,atkType:e.target.value})} />
                    </div>
                  </div>
                </>
              )}
              <div className="section-title" style={{margin:'8px 0 8px'}}>Ability Scores</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:6}}>
                {ABILITY_KEYS.map(([k])=>(
                  <div className="form-group" key={k}>
                    <label>{k.toUpperCase()}</label>
                    <input type="number" min="1" max="30" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} />
                  </div>
                ))}
              </div>
              </>)}
              {!isDM && approval && <div className="buff-note">The DM has to accept this before it joins the fight.</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setShowAddModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={addCombatant}>Add to Combat</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
