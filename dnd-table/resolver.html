              onChange={e=>{ const f = e.target.files && e.target.files[0]; e.target.value=''; readCharacterFile(f); }} />
          </div>
        </div>

        {/* ── CENTER: CHARACTER VIEW + ACTIONS ── */}
        <div className="center-panel">
          <div className="action-area">
            {!showSheet ? (
              <div className="setup-screen">
                <div className="big-icon">⚔️</div>
                <h2>Combat Resolver</h2>
                {isDM
                  ? <p>Add combatants from the left panel or the Monster Roster, then press Start Combat.</p>
                  : <p>Click Add My Character Sheet on the left to bring in the sheet you built. The DM starts combat.</p>}
                <p style={{marginTop:12,fontSize:'0.8rem'}}>Click another combatant to mark them as your target.</p>
              </div>
            ) : (
              <>
                {tabs.length > 1 && (
                  <div className="view-tabs">
                    {tabs.map(c => <button key={c.id} className={`view-tab ${viewed.id===c.id?'on':''}`} onClick={()=>{setViewId(c.id); setSelectedAction(null);}}>{c.name}</button>)}
                  </div>
                )}
                <div className="turn-banner">
                  <div className="who">🎲 {viewed.name}{canAct ? "'s Turn" : ''}</div>
                  <div className="combatant-type">{sheetLine(viewed)}</div>
                  <div className="stats-row">
                    {statChips(viewed).map(ch => (
                      <div className={`stat-chip ${ch.src ? 'changed' : ''}`} key={ch.lbl} title={ch.src ? `Changed by ${ch.src}` : ''}>
                        <div className="val">{ch.val}</div>
                        <div className="lbl">{ch.lbl}{ch.src ? ' ✦' : ''}</div>
                      </div>
                    ))}
                  </div>
                  <div className="abil-row">
                    {ABILITY_KEYS.map(([k,ab])=>{
                      const score = (viewed.scores||{})[ab] ?? 10;
                      return (
                        <div className="abil" key={ab}>
                          <div className="lbl">{k.toUpperCase()}</div>
                          <div className="val">{modStr(score)}</div>
                          <div className="sub">{score} · save {signed((viewed.saves||{})[ab] ?? mod(score))}</div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="senses-line"><strong>Senses</strong> {effectiveSenses(viewed).join(', ') || 'None listed'}</div>
                  {combatStarted && !canAct && active && <div className="turn-note">Waiting: it is {active.name}'s turn</div>}
                  {combatStarted && canAct && !isDM && <div className="turn-note yours">It is your turn</div>}
                  {viewed.main && viewed.owner === myId && <button className="link-btn" style={{marginTop:6,fontSize:'0.8rem'}} onClick={()=>updateFromSheet(viewed.id)}>Update from my sheet</button>}
                </div>

                {/* Target */}
                <div className="section-title">🎯 Target</div>
                {targets.length===0 && (
                  <div className="empty-state">No valid targets</div>
                )}
                {targets.map(c=>(
                  <div key={c.id} className={`target-row ${targetId===c.id?'selected':''}`}
                    onClick={()=>setTargetId(c.id===targetId?null:c.id)}>
                    <span className="t-name">{c.name}</span>
                    <span className="t-ac">AC {effectiveAC(c)}</span>
                    <span className="t-hp">{c.currentHP}/{c.maxHP} HP</span>
                  </div>
                ))}

                {/* Actions */}
                {canControl(viewed) && <>
                <div className="section-title">⚡ Actions</div>
                {actions.length === 0 && <div className="empty-state">No actions set up for this stat block. Use the dice roller.</div>}
                <div className="action-grid">
                  {actions.map(a=>(
                    <div key={a.id} className={`action-btn ${selectedAction===a.id?'selected':''}`}
                      onClick={()=>setSelectedAction(a.id===selectedAction?null:a.id)}>
                      <div className="a-name">{a.name}</div>
                      <div className="a-detail">{a.detail}</div>
                      <span className={`a-tag tag-${a.tag}`}>{a.tag}</span>
                    </div>
                  ))}
                </div>

                {/* Advantage */}
                {selAction && selAction.type==='attack' && (
                  <div className="manual-roll">
                    <span className="label">Roll modifier</span>
                    <div className="advantage-row">
                      <div className={`adv-btn ${advantage===1?'active-adv':''}`} onClick={()=>setAdvantage(advantage===1?0:1)}>Advantage</div>
                      <div className="adv-btn" onClick={()=>setAdvantage(0)} style={{border:advantage===0?'1px solid var(--brass)':'',color:advantage===0?'var(--parchment)':''}}>Normal</div>
                      <div className={`adv-btn ${advantage===-1?'active-dis':''}`} onClick={()=>setAdvantage(advantage===-1?0:-1)}>Disadvantage</div>
                    </div>
                  </div>
                )}
                {selAction && selAction.desc && <div className="buff-note" style={{marginTop:8}}>{selAction.desc}</div>}

                {/* Buff passing */}
                <div className="section-title">✨ Pass a Buff or Effect</div>
                <div className="buff-row">
                  <select aria-label="Buff or effect" value={buffName} onChange={e=>setBuffName(e.target.value)}>
                    {BUFFS.map(b=><option key={b.name} value={b.name}>{b.name}</option>)}
                    <option value="__custom">Custom...</option>
                  </select>
                  <select aria-label="Who receives it" value={buffTarget || viewed.id} onChange={e=>setBuffTarget(e.target.value)}>
                    {inPlay.map(c=><option key={c.id} value={c.id}>{c.name}{c.id===viewed.id?' (self)':''}</option>)}
                  </select>
                </div>
                {buffName === '__custom' ? (
                  <div className="custom-effect">
                    <input aria-label="Effect name" placeholder="Name of the buff or effect" maxLength={40} value={buffCustom.name} onChange={e=>setBuffCustom({...buffCustom,name:e.target.value})}/>
                    <div className="custom-grid">
                      {[['ac','AC','+1'],['speed','Speed (ft.)','+10'],['init','Initiative','+2'],['atk','Attack rolls','1d4'],['save','Saving throws','1d4']].map(([k,l,ph])=>(
                        <label key={k}>{l}<input aria-label={l} placeholder={ph} value={buffCustom[k]} onChange={e=>setBuffCustom({...buffCustom,[k]:e.target.value})}/></label>
                      ))}
                    </div>
                    <input aria-label="Sense granted" placeholder="Sense granted, for example Darkvision 60 ft." maxLength={60} value={buffCustom.sense} onChange={e=>setBuffCustom({...buffCustom,sense:e.target.value})}/>
                    <input aria-label="Note" placeholder="Anything else it does (shown as a reminder)" maxLength={200} value={buffCustom.note} onChange={e=>setBuffCustom({...buffCustom,note:e.target.value})}/>
                  </div>
                ) : <div className="buff-note">{buffPreset && [describeEffect(buffPreset) && `Applied to the sheet: ${describeEffect(buffPreset)}.`, buffPreset.note].filter(Boolean).join(' ')}</div>}
                <button className="btn btn-success btn-sm" onClick={passBuff} disabled={buffName==='__custom' && !buffCustom.name.trim()}>Pass Buff</button>
                </>}

                {/* Conditions */}
                {target && isDM && (
                  <>
                    <div className="section-title">🔮 Apply Condition to Target</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                      {CONDITIONS.map(cond=>(
                        <button key={cond} className={`btn btn-sm btn-ghost`}
                          style={target.conditions.includes(cond)?{borderColor:'var(--blood-light)',color:'#ff8a80'}:{}}
                          onClick={()=>target.conditions.includes(cond)?removeCondition(target.id,cond):addCondition(target.id,cond)}>
                          {cond}
                        </button>
                      ))}
                    </div>
                  </>
                )}

                {/* Sheet details */}
                {viewed.sheet && viewed.sheet.skills && Object.keys(viewed.sheet.skills).length > 0 && (
                  <details className="block">
                    <summary>Skills</summary>
                    <div className="skill-grid">
                      {Object.keys(viewed.sheet.skills).sort().map(sk => {
                        const ex = (viewed.sheet.skillExpertise||[]).includes(sk), pr = (viewed.sheet.skillProfs||[]).includes(sk);
                        return <div key={sk} className={pr||ex?'prof':''}>{sk} <strong>{signed(viewed.sheet.skills[sk])}</strong>{ex?' (Expertise)':pr?' (Proficient)':''}</div>;
                      })}
                    </div>
                  </details>
                )}
                {viewed.sheet && viewed.sheet.spell && (
                  <details className="block">
                    <summary>Spellcasting</summary>
                    <p><strong>Ability.</strong> {viewed.sheet.spell.ability} · <strong>Spell save DC</strong> {viewed.sheet.spell.dc} · <strong>Spell attack</strong> {signed(viewed.sheet.spell.attack)}</p>
                    {viewed.sheet.spell.slots && <p><strong>Spell slots.</strong> {viewed.sheet.spell.slots}</p>}
                  </details>
                )}
                {(viewed.info||[]).map((sec, i) => (
                  <details className="block" key={i}>
                    <summary>{sec.h}</summary>
                    {(sec.items||[]).map((it, j) => <p key={j}>{it[0] && <strong>{it[0]}. </strong>}{it[1]}</p>)}
                  </details>
                ))}
                {viewed.sheet && (viewed.sheet.equipment || (viewed.sheet.items||[]).length > 0) && (
                  <details className="block">
                    <summary>Equipment and Items</summary>
                    {(viewed.sheet.items||[]).length > 0 && <p><strong>Items.</strong> {viewed.sheet.items.join(', ')}</p>}
                    {viewed.sheet.equipment && <p style={{whiteSpace:'pre-wrap'}}>{viewed.sheet.equipment}</p>}
                  </details>
                )}
              </>
            )}
          </div>

          {/* Resolve Bar */}
          {combatStarted && (
            <div className="resolve-bar">
              <button className="next-turn-btn" disabled={!canControl(active)} style={!canControl(active)?{opacity:0.4,cursor:'default'}:{}} onClick={nextTurn}>Next Turn →</button>
              <button
                className="resolve-btn"
                disabled={!canAct || !selectedAction || (needsTarget && !target)}
                onClick={resolve}>
                {canAct ? '⚔ Resolve Action' : 'Not your turn'}
              </button>
            </div>
          )}
        </div>

        {/* ── RIGHT: DICE ROLLER + COMBAT LOG ── */}
        <div className="log-panel">
          <div className="panel-header">Dice Roller</div>
          <div className="dice-box">
            <div className="dice-grid">
              {[4,6,8,10,12,20,100].map(s => <button key={s} className="die-btn" onClick={()=>rollExpr('1d'+s)}>d{s}</button>)}
            </div>
            <div className="dice-expr">
              <input aria-label="Dice to roll" placeholder="2d6+3" value={diceExpr} onChange={e=>setDiceExpr(e.target.value)} onKeyDown={e=>{ if (e.key==='Enter') rollExpr(diceExpr); }}/>
              <button className="btn btn-primary btn-sm" onClick={()=>rollExpr(diceExpr)}>Roll</button>
            </div>
          </div>
          <div className="panel-header">Combat Log</div>
          <div className="log-body">
            {log.length===0 && <div className="empty-state">Results will appear here</div>}
            {log.map((entry, i) => (
              entry.type==='round'
                ? <div key={entry.id||i} className="log-round">{entry.text}</div>
                : <div key={entry.id||i} className={`log-entry ${entry.type} dice-result`} dangerouslySetInnerHTML={{__html:sanitizeLogHtml(entry.html)}}/>
            ))}
            <div ref={logEndRef}/>
          </div>
          {log.length > 0 && isDM && (
            <div style={{padding:'8px 10px',borderTop:'1px solid #2C3E50'}}>
              <button className="btn btn-ghost btn-sm btn-full" onClick={clearLog}>Clear Log</button>
            </div>
          )}
        </div>
      </div>

      {/* ── MONSTER ROSTER ── */}
      {showRoster && (
        <div className="modal-overlay" onClick={()=>setShowRoster(false)}>
          <div className="modal roster" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">Monster Roster</div>
            <div className="modal-body" style={{paddingBottom:8}}>
              <input className="search" autoFocus placeholder={`Search ${MONSTERS.length} stat blocks by name or type`} value={rosterSearch} onChange={e=>setRosterSearch(e.target.value)}
                style={{width:'100%',background:'#0F1923',border:'1px solid #3d5166',color:'var(--parchment)',padding:'7px 10px',borderRadius:4,fontFamily:"'Crimson Text', serif",fontSize:'0.95rem'}}/>
            </div>
            <div className="roster-list">
              {MONSTERS.length === 0 && <div className="empty-state">monsters.js did not load.</div>}
              {rosterMatches.slice(0, 80).map(m => (
                <div key={m.n}>
                  <div className="roster-row">
                    <span className="r-name" onClick={()=>setRosterOpen(rosterOpen===m.n?null:m.n)}>{m.n}</span>
                    <span className="r-meta">{m.t} · CR {m.cr} · AC {m.ac} · {m.hp} HP</span>
                    <button className="btn btn-primary btn-sm" onClick={()=>addMonster(m)}>Add</button>
                  </div>
                  {rosterOpen===m.n && (
                    <div className="roster-detail">
                      <div>{ABILITY_KEYS.map(([k],i)=>`${k.toUpperCase()} ${m.s[i]} (${modStr(m.s[i])})`).join(' · ')}</div>
                      {m.sp && <p><strong>Speed.</strong> {m.sp}</p>}
                      {(m.tr||[]).map((t,i)=><p key={'t'+i}><strong>{t[0]}.</strong> {t[1]}</p>)}
                      {(m.a||[]).map((a,i)=><p key={'a'+i}><strong>{a.n}.</strong> {a.d}</p>)}
                      {(m.ba||[]).map((t,i)=><p key={'b'+i}><strong>{t[0]} (Bonus Action).</strong> {t[1]}</p>)}
                      {(m.re||[]).map((t,i)=><p key={'r'+i}><strong>{t[0]} (Reaction).</strong> {t[1]}</p>)}
                      {(m.la||[]).map((t,i)=><p key={'l'+i}><strong>{t[0]} (Legendary Action).</strong> {t[1]}</p>)}
                    </div>
                  )}
                </div>
              ))}
              {rosterMatches.length > 80 && <div className="empty-state">Showing 80 of {rosterMatches.length}. Type to narrow it down.</div>}
            </div>
            <div className="srd-note">
              Stat blocks from the System Reference Document 5.2.1 by Wizards of the Coast LLC, licensed under <a href="https://creativecommons.org/licenses/by/4.0/legalcode" target="_blank" rel="noopener">CC BY 4.0</a>. Adding a monster rolls its Initiative with its Dexterity modifier.
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setShowRoster(false)}>Done</button>
            </div>
          </div>
        </div>
      )}

      {/* ── ADD COMBATANT MODAL ── */}
      {showAddModal && (
        <div className="modal-overlay" onClick={()=>setShowAddModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">{sheetPreview ? 'Add Character Sheet' : 'Add Combatant'}</div>
            <div className="modal-body">
              {sheetPreview ? (
                <>
                  <div className="sheet-card">
                    <div className="who">{sheetPreview.name}</div>
                    <div className="combatant-type">{sheetLine(sheetPreview)}</div>
                    <div className="stats-row">
                      {statChips(sheetPreview).map(ch => (
                        <div className="stat-chip" key={ch.lbl}><div className="val">{ch.val}</div><div className="lbl">{ch.lbl}</div></div>
                      ))}
                    </div>
                    <div className="senses-line"><strong>Senses</strong> {sheetPreview.senses.join(', ') || 'None listed'}</div>
                    <div className="buff-note" style={{marginTop:8,marginBottom:0}}>The whole sheet comes with it: ability scores, saving throws, skills, features, spells and equipment.</div>
                  </div>
                  <div className="form-group" style={{marginTop:12}}>
                    <label>Initiative roll (d20{signed(sheetPreview.initBonus)})</label>
                    <div style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8}}>
                      <input type="number" aria-label="Initiative roll" value={form.initiative} placeholder="Type your total, or roll" onChange={e=>setForm({...form,initiative:e.target.value})} />
                      <button className="btn btn-ghost" onClick={()=>setForm({...form,initiative:rollD(20)+sheetPreview.initBonus})}>Roll for me</button>
                    </div>
                  </div>
                </>
              ) : (<>
              <div className="two-col">
                <div className="form-group">
                  <label>Name</label>
                  <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Aldric Stoneheart" />
                </div>
                <div className="form-group">
                  <label>Type</label>
                  <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
                    <option value="player">{isDM ? 'Player Character' : 'My Character'}</option>
                    {isDM && <option value="monster">Monster / NPC</option>}
                    <option value="companion">Companion (pet, familiar, summon)</option>
                  </select>
                </div>
              </div>
              {form.type==='player' && (
                <div className="two-col">
                  <div className="form-group">
                    <label>Class</label>
                    <select value={form.charClass} onChange={e=>setForm({...form,charClass:e.target.value})}>
                      {CLASS_LIST.map(c=>(
                        <option key={c}>{c}</option>
                      ))}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Level</label>
                    <input type="number" min="1" max="20" value={form.level} onChange={e=>setForm({...form,level:e.target.value})} />
                  </div>
                </div>
              )}
              <div className="three-col">
                <div className="form-group">
                  <label>Max HP</label>
                  <input type="number" value={form.maxHP} onChange={e=>setForm({...form,maxHP:e.target.value,currentHP:e.target.value})} />
                </div>
                <div className="form-group">
                  <label>AC</label>
                  <input type="number" value={form.ac} onChange={e=>setForm({...form,ac:e.target.value})} />
                </div>
                <div className="form-group">
                  <label>Initiative</label>
                  <input type="number" value={form.initiative} onChange={e=>setForm({...form,initiative:e.target.value})} />
                </div>
              </div>
              <div className="form-group">
                <label>Speed (ft.)</label>
                <input type="number" min="0" step="5" value={form.speed} onChange={e=>setForm({...form,speed:e.target.value})} />
              </div>
              {form.type!=='player' && (
                <>
                  <div className="section-title" style={{margin:'8px 0 8px'}}>Attack (optional)</div>
                  <div className="two-col">
                    <div className="form-group">
                      <label>Attack name</label>
                      <input value={form.atkName} placeholder="Bite" onChange={e=>setForm({...form,atkName:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>To hit bonus</label>
                      <input type="number" value={form.atkBonus} onChange={e=>setForm({...form,atkBonus:e.target.value})} />
                    </div>
                  </div>
                  <div className="two-col">
                    <div className="form-group">
                      <label>Damage dice</label>
                      <input value={form.atkDmg} placeholder="1d6+2" onChange={e=>setForm({...form,atkDmg:e.target.value})} />
                    </div>
                    <div className="form-group">
                      <label>Damage type</label>
                      <input value={form.atkType} placeholder="Piercing" onChange={e=>setForm({...form,atkType:e.target.value})} />
                    </div>
                  </div>
                </>
              )}
              <div className="section-title" style={{margin:'8px 0 8px'}}>Ability Scores</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:6}}>
                {ABILITY_KEYS.map(([k])=>(
                  <div className="form-group" key={k}>
                    <label>{k.toUpperCase()}</label>
                    <input type="number" min="1" max="30" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} />
                  </div>
                ))}
              </div>
              </>)}
              {!isDM && approval && <div className="buff-note">The DM has to accept this before it joins the fight.</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setShowAddModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={addCombatant}>Add to Combat</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
